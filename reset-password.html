<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neues Passwort – Dream And Do It</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">DREAM AND DO IT</div>
    </div>
    <div class="container">
      <div class="card">
        <h1 class="center-text" style="font-size:1.2rem;">Neues Passwort festlegen</h1>
        <div id="msg" class="msg hidden"></div>
        <form id="reset-form">
          <div class="field">
            <label for="new-password">Neues Passwort (mind. 8 Zeichen)</label>
            <input type="password" id="new-password" required minlength="8" autocomplete="new-password" />
          </div>
          <button type="submit" class="btn" id="reset-submit">Passwort speichern</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { updatePassword } from './js/auth.js';

    const msgBox = document.getElementById('msg');
    function showMsg(text, type = 'error') {
      msgBox.textContent = text;
      msgBox.className = 'msg ' + type;
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const submitBtn = document.getElementById('reset-submit');
      submitBtn.disabled = true;
      const { error } = await updatePassword(newPassword);
      submitBtn.disabled = false;
      if (error) {
        showMsg('Das hat leider nicht geklappt: ' + error.message);
        return;
      }
      showMsg('Passwort gespeichert! Du wirst weitergeleitet …', 'success');
      setTimeout(() => (window.location.href = 'dashboard.html'), 1500);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ernährung – Dream And Do It</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#053446" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root { --chart-teal: #1479a3; }
    .result-box {
      background: rgba(200,124,0,0.08); border: 1px solid rgba(200,124,0,0.25);
      border-radius: 10px; padding: 16px; margin-top: 16px;
    }
    .result-box .big { font-family: var(--font-heading); font-size: 1.6rem; color: var(--color-navy); }
    :root[data-theme="dark"] .result-box .big { color: var(--color-gold-light); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .result-box .big { color: var(--color-gold-light); } }
    .result-box .caveat { font-size: 0.78rem; color: var(--color-text-muted); margin-top: 6px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 520px) { .grid-2 { grid-template-columns: 1fr; } }
    table.simple-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    table.simple-table th, table.simple-table td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--color-border); }
    .chart-tooltip {
      position: absolute; background: var(--color-navy); color: #fff; font-size: 0.75rem;
      padding: 4px 8px; border-radius: 6px; pointer-events: none; opacity: 0; transition: opacity 0.1s;
      white-space: nowrap; transform: translate(-50%, -130%);
    }
    .recipe-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--color-border); flex-wrap: wrap; }
    .recipe-row:last-child { border-bottom: none; }
    .recipe-row img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
    .image-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; }
    .ai-image-note { font-size: 0.62rem; color: var(--color-text-muted); text-align: center; max-width: 64px; line-height: 1.15; }
    /* Aktions-Buttons (u.a. "PDF öffnen") IMMER am rechten Rand der Zeile –
       auch wenn die Zeile bei schmalen Bildschirmen umbricht und die Buttons
       allein in einer eigenen Zeile landen (margin-left:auto verhindert,
       dass sie dann nach links rutschen). */
    .row-actions { display: flex; gap: 8px; flex-shrink: 0; margin-left: auto; }

    .stat-tiles { display: flex; gap: 12px; flex-wrap: wrap; margin: 4px 0 20px; }
    .stat-tile { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 10px 16px; min-width: 140px; }
    .stat-tile .value { font-size: 1.25rem; font-weight: 700; color: var(--color-navy); }
    :root[data-theme="dark"] .stat-tile .value { color: var(--color-gold-light); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stat-tile .value { color: var(--color-gold-light); } }
    .stat-tile .label { font-size: 0.74rem; color: var(--color-text-muted); }

    .filter-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .filter-presets button { padding: 5px 12px; font-size: 0.76rem; border-radius: 20px; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-muted); cursor: pointer; }
    .filter-presets button.active { background: var(--color-gold); color: #1a1a1a; border-color: var(--color-gold); }

    .compare-legend { display: flex; gap: 18px; font-size: 0.8rem; margin-bottom: 10px; color: var(--color-text-muted); }
    .compare-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .compare-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .compare-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .compare-bar-row .side-label { width: 150px; font-size: 0.78rem; color: var(--color-text-muted); flex-shrink: 0; }
    .compare-bar-track { flex: 1; background: var(--color-border); border-radius: 5px; height: 16px; overflow: hidden; }
    .compare-bar-fill { height: 100%; border-radius: 5px 0 0 5px; }
    .compare-bar-value { width: 100px; text-align: right; font-size: 0.78rem; flex-shrink: 0; }
    .compare-verdict { font-size: 0.8rem; margin-top: 4px; }
    .compare-verdict.ok { color: var(--color-success); }
    .compare-verdict.warn { color: var(--color-gold); }
    .compare-verdict.alert { color: var(--color-danger); }

    .log-entry { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--color-border); flex-wrap: wrap; }
    .log-entry:last-child { border-bottom: none; }
    .trainer-comment-box { background: rgba(200,124,0,0.08); border: 1px solid rgba(200,124,0,0.25); border-radius: 8px; padding: 8px 10px; margin-top: 6px; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <img src="icons/logo-mark.png" alt="Dream And Do It Logo" onerror="this.style.display='none'" />
        DREAM AND DO IT
      </div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" id="theme-toggle" type="button">Hell/Dunkel</button>
      </div>
    </div>
    <div id="nav-tabs-slot"></div>

    <div class="container wide" id="app-container">
      <p class="center-text">Lade …</p>
    </div>
  </div>

  <script type="module">
    import { supabaseClient } from './js/supabase-client.js';
    import { getCurrentSession, initTheme, toggleTheme } from './js/auth.js';
    import {
      PAL_LEVELS, calculateBmr, calculateTee,
      calculateFatFreeMass, calculateBmrKatchMcArdle,
      calculateNavyBodyFat, calculateWaistToHip,
      insertBodyMeasurement, listMyBodyMeasurements, deleteBodyMeasurement,
      listRecipes, createRecipe, deleteRecipe,
      listFoodItems, createFoodItem,
      createNutritionLog, listNutritionLogs, deleteNutritionLog, setTrainerComment,
      insertEnergyTarget, getLatestEnergyTarget,
    } from './js/nutrition.js';
    import { listClients, listSessions } from './js/training.js';
    import { getUnreadCount } from './js/messages.js';
    import { getNewSignupCount } from './js/betrieb.js';
    import { navTabsHtml } from './js/nav.js';
    import { collapsibleHtml, initCollapsibles } from './js/collapsible.js';
    import { subnavSelectHtml, bindSubnavSelect, setSubnavValue } from './js/subnav.js';
    import { SECTION_INFO } from './js/section-info.js';

    initTheme();
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

    const container = document.getElementById('app-container');
    let currentProfile = null;

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    function todayIso() {
      return new Date().toISOString().slice(0, 10);
    }

    function isoDaysAgo(n) {
      const d = new Date();
      d.setDate(d.getDate() - n);
      return d.toISOString().slice(0, 10);
    }

    function nowLocalDatetimeValue() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    async function init() {
      const session = await getCurrentSession();
      if (!session) { window.location.href = 'index.html'; return; }

      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('id, full_name, role, access_locked, training_enabled, nutrition_enabled, coaching_enabled')
        .eq('id', session.user.id)
        .maybeSingle();

      if (error || !profile) {
        container.innerHTML = `<div class="card lock-screen"><div class="icon">⚠️</div><h2>Profil konnte nicht geladen werden</h2><p style="color:var(--color-text-muted);">${escapeHtml(error ? error.message : 'Unbekannter Fehler')}</p></div>`;
        return;
      }
      if (profile.access_locked) {
        container.innerHTML = `<div class="card lock-screen"><div class="icon">🔒</div><h2>Zugang derzeit gesperrt</h2><p style="color:var(--color-text-muted);">Bitte wende dich an uns, um deinen Zugang zu klären.</p></div>`;
        return;
      }

      currentProfile = profile;
      mountNavTabs(profile);

      if (profile.role !== 'admin' && !profile.nutrition_enabled) {
        renderLockedTeaser();
        return;
      }
      renderShell();
    }

    // Etappe 19: gemeinsame Kopfzeilen-Reiterleiste (siehe js/nav.js) statt
    // der früheren Einzel-Links "Nachrichten"/"Zum Dashboard".
    async function mountNavTabs(profile) {
      const slot = document.getElementById('nav-tabs-slot');
      if (!slot) return;
      const [unreadMessages, signupResult] = await Promise.all([
        getUnreadCount(profile.id),
        profile.role === 'admin' ? getNewSignupCount() : Promise.resolve({ count: 0 }),
      ]);
      slot.innerHTML = navTabsHtml(profile, {
        currentPage: 'nutrition',
        unreadMessages,
        newSignups: signupResult.count || 0,
      });
    }

    function renderLockedTeaser() {
      const info = SECTION_INFO.nutrition;
      container.innerHTML = `
        <div class="locked-teaser">
          <span class="lock-badge">🔒 ${escapeHtml(info.lockedLead)}</span>
          <div class="section-hero">
            <span class="kicker">${escapeHtml(info.title)}</span>
            <h2>${escapeHtml(info.heroLine)}</h2>
            ${collapsibleHtml(`<p class="lead">${info.clientIntro}</p>`)}
          </div>
          <div class="benefit-grid">
            ${info.benefits.map((b) => `<div class="benefit-card"><h4>${escapeHtml(b.h)}</h4><p>${escapeHtml(b.t)}</p></div>`).join('')}
          </div>
          ${plateVisualHtml()}
          <div class="science-box">
            <span class="kicker">Wissenschaftlicher Hintergrund</span>
            ${collapsibleHtml(`<p>${info.scienceText}</p>`, { fadeVar: 'var(--color-bg)' })}
          </div>
          <a class="btn mt-16" style="display:inline-block; width:auto; padding:12px 24px;" href="messages.html">
            Interesse? Jetzt nachfragen
          </a>
        </div>
      `;
      initCollapsibles(container);
    }

    function plateVisualHtml() {
      return `
        <div class="plate-visual">
          <div class="plate-circle" title="Dream-And-Do-It-Teller: 50% Gemüse & Obst, 25% Protein, 25% Kohlenhydrate"></div>
          <div class="plate-legend">
            <span class="row"><i style="background:var(--color-gold-light);"></i><span class="pct">50%</span> Gemüse &amp; Obst</span>
            <span class="row"><i style="background:var(--color-navy);"></i><span class="pct">25%</span> Protein</span>
            <span class="row"><i style="background:var(--color-gold);"></i><span class="pct">25%</span> Vollwertige Kohlenhydrate</span>
          </div>
        </div>
      `;
    }

    function renderShell() {
      const isAdmin = currentProfile.role === 'admin';
      const tabs = [
        { key: 'start', label: 'Start', hidden: true },
        { key: 'pal', label: 'PAL-Rechner' },
        { key: 'bodyfat', label: 'Körperfett-Verlauf' },
        { key: 'protokoll', label: 'Ernährungsprotokoll' },
        { key: 'recipes', label: 'Rezepte' },
        ...(isAdmin ? [{ key: 'recipes-admin', label: 'Rezepte verwalten' }] : []),
        ...(isAdmin ? [{ key: 'foods-admin', label: 'Lebensmittel verwalten' }] : []),
      ];
      container.innerHTML = `
        ${subnavSelectHtml(tabs, 'start')}
        <div id="tab-content"></div>
      `;
      bindSubnavSelect(container, (key) => renderTab(key));
      renderTab('start');
    }

    function goToTab(tabName) {
      setSubnavValue(container, tabName);
      renderTab(tabName);
    }

    function renderStartTab(content) {
      const isAdmin = currentProfile.role === 'admin';
      const info = SECTION_INFO.nutrition;
      content.innerHTML = `
        <div class="section-hero">
          <span class="kicker">${escapeHtml(info.title)}</span>
          <h2>${escapeHtml(info.heroLine)}</h2>
          ${collapsibleHtml(`<p class="lead">${isAdmin ? info.adminIntro : info.clientIntro}</p>`)}
        </div>
        ${isAdmin ? '' : `
        <div class="benefit-grid">
          ${info.benefits.map((b) => `<div class="benefit-card"><h4>${escapeHtml(b.h)}</h4><p>${escapeHtml(b.t)}</p></div>`).join('')}
        </div>
        ${plateVisualHtml()}`}
        <div class="science-box">
          <span class="kicker">Wissenschaftlicher Hintergrund</span>
          ${collapsibleHtml(`<p>${info.scienceText}</p>`, { fadeVar: 'var(--color-bg)' })}
        </div>
      `;
      initCollapsibles(content);
    }

    function renderTab(tab) {
      const content = document.getElementById('tab-content');
      if (tab === 'start') return renderStartTab(content);
      if (tab === 'pal') return renderPalTab(content);
      if (tab === 'bodyfat') return renderBodyfatTab(content);
      if (tab === 'protokoll') return renderNutritionLogTab(content);
      if (tab === 'recipes') return renderRecipesTab(content, false);
      if (tab === 'recipes-admin') return renderRecipesTab(content, true);
      if (tab === 'foods-admin') return renderFoodItemsAdminTab(content);
    }

    // =========================================================================
    // LEBENSMITTEL-DATENBANK VERWALTEN (admin)
    // =========================================================================

    async function renderFoodItemsAdminTab(content) {
      content.innerHTML = '<p class="center-text">Lade …</p>';
      const { data: items, error } = await listFoodItems();
      if (error) { content.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`; return; }

      content.innerHTML = `
        <div class="card">
          <h2 style="font-size:1.05rem;">Neues Lebensmittel hinzufügen</h2>
          <p style="color:var(--color-text-muted); font-size:0.85rem;">
            Werte jeweils pro 100 g/ml, damit Kunden im Ernährungsprotokoll die Menge frei eingeben können.
          </p>
          <form id="food-form">
            <div class="field"><label>Name</label><input type="text" id="food-name" required /></div>
            <div class="grid-2">
              <div class="field"><label>kcal / 100g</label><input type="number" id="food-kcal" min="0" step="1" required /></div>
              <div class="field"><label>Eiweiß / 100g (g)</label><input type="number" id="food-protein" min="0" step="0.1" value="0" /></div>
              <div class="field"><label>Kohlenhydrate / 100g (g)</label><input type="number" id="food-carbs" min="0" step="0.1" value="0" /></div>
              <div class="field"><label>Fett / 100g (g)</label><input type="number" id="food-fat" min="0" step="0.1" value="0" /></div>
            </div>
            <button class="btn" type="submit">Speichern</button>
          </form>
          <div id="food-result"></div>
        </div>
        <div class="card mt-24">
          <h2 style="font-size:1.05rem;">Lebensmittel-Datenbank (${(items || []).length})</h2>
          <table class="simple-table mt-16">
            <thead><tr><th>Name</th><th>kcal</th><th>Eiweiß</th><th>Kohlenhydrate</th><th>Fett</th></tr></thead>
            <tbody>
              ${(items || []).map((f) => `
                <tr>
                  <td>${escapeHtml(f.name)}</td>
                  <td>${f.kcal_per_100g}</td>
                  <td>${f.protein_per_100g} g</td>
                  <td>${f.carbs_per_100g} g</td>
                  <td>${f.fat_per_100g} g</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      document.getElementById('food-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const { error: saveError } = await createFoodItem({
          name: document.getElementById('food-name').value.trim(),
          kcalPer100g: parseFloat(document.getElementById('food-kcal').value),
          proteinPer100g: parseFloat(document.getElementById('food-protein').value) || 0,
          carbsPer100g: parseFloat(document.getElementById('food-carbs').value) || 0,
          fatPer100g: parseFloat(document.getElementById('food-fat').value) || 0,
        });
        if (saveError) { document.getElementById('food-result').innerHTML = `<div class="msg error">${escapeHtml(saveError.message)}</div>`; return; }
        renderFoodItemsAdminTab(content);
      });
    }

    // =========================================================================
    // PAL-RECHNER
    // =========================================================================

    async function renderPalTab(content) {
      content.innerHTML = '<p class="center-text">Lade …</p>';

      const { data: measurements } = await listMyBodyMeasurements(currentProfile.id);
      const usable = (measurements || []).filter((m) => m.weight_kg != null && m.body_fat_percent != null);
      const latestBf = usable.length ? usable[usable.length - 1] : null;
      const { data: savedTarget } = await getLatestEnergyTarget(currentProfile.id);

      content.innerHTML = `
        <div class="card">
          <h2 style="font-size:1.05rem;">Kalorienbedarf berechnen (PAL-Methode)</h2>
          <p style="color:var(--color-text-muted); font-size:0.88rem;">
            Grundumsatz nach Mifflin-St Jeor (1990) × Aktivitätsfaktor (PAL). Referenzwerte orientiert an DGE.
          </p>
          ${savedTarget ? `
          <div class="result-box" style="margin-bottom:14px;">
            <div style="color:var(--color-text-muted); font-size:0.82rem;">Aktuell gespeicherter Bedarf (Grundlage für den Vergleich im Ernährungsprotokoll)</div>
            <div class="big">${Math.round(savedTarget.tee_kcal)} kcal/Tag</div>
            <div class="caveat">Gespeichert am ${new Date(savedTarget.calculated_at).toLocaleDateString('de-DE')} · ${savedTarget.method === 'katch_mcardle' ? 'Präzisions-Schätzung' : 'Standard-Schätzung'}</div>
          </div>` : ''}
          ${latestBf ? `
          <div class="msg info" style="font-size:0.85rem; margin-bottom:14px;">
            Präzisions-Modus aktiv: Da ein Körperfett-Wert vorliegt (${latestBf.body_fat_percent.toFixed(1)} %,
            Messung vom ${new Date(latestBf.measured_at).toLocaleDateString('de-DE')}), berechnen wir zusätzlich
            eine Schätzung über deine fettfreie Masse (Katch-McArdle-Formel) – das berücksichtigt deine
            Körperzusammensetzung statt nur Gewicht/Größe/Alter.
          </div>` : `
          <div class="msg info" style="font-size:0.85rem; margin-bottom:14px;">
            💡 Trage einmal unter „Körperfett-Verlauf" deine Maße ein – dann bezieht der Rechner deinen
            Körperfettanteil mit ein und wird dadurch präziser.
          </div>`}
          <form id="pal-form">
            <div class="grid-2">
              <div class="field">
                <label>Geschlecht</label>
                <select id="pal-sex">
                  <option value="male" ${latestBf && latestBf.sex === 'male' ? 'selected' : ''}>Männlich</option>
                  <option value="female" ${latestBf && latestBf.sex === 'female' ? 'selected' : ''}>Weiblich</option>
                </select>
              </div>
              <div class="field"><label>Alter (Jahre)</label><input type="number" id="pal-age" min="10" max="100" required /></div>
              <div class="field"><label>Größe (cm)</label><input type="number" id="pal-height" min="100" max="230" step="0.1" value="${latestBf ? latestBf.height_cm : ''}" required /></div>
              <div class="field"><label>Gewicht (kg)</label><input type="number" id="pal-weight" min="30" max="300" step="0.1" value="${latestBf ? latestBf.weight_kg : ''}" required /></div>
            </div>
            <div class="field">
              <label>Aktivitätslevel (PAL)</label>
              <select id="pal-level">
                ${PAL_LEVELS.map((p) => `<option value="${p.value}">${escapeHtml(p.label)} (PAL ${p.value})</option>`).join('')}
              </select>
            </div>
            <button class="btn" type="submit">Berechnen</button>
          </form>
          <div id="pal-result"></div>
        </div>
      `;

      let lastComputed = null;

      document.getElementById('pal-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const sex = document.getElementById('pal-sex').value;
        const age = parseFloat(document.getElementById('pal-age').value);
        const heightCm = parseFloat(document.getElementById('pal-height').value);
        const weightKg = parseFloat(document.getElementById('pal-weight').value);
        const pal = parseFloat(document.getElementById('pal-level').value);

        const bmrStandard = calculateBmr({ sex, weightKg, heightCm, age });
        const teeStandard = calculateTee(bmrStandard, pal);

        let precisionBox = '';
        if (latestBf) {
          const ffm = calculateFatFreeMass(weightKg, latestBf.body_fat_percent);
          const bmrPrecise = calculateBmrKatchMcArdle(ffm);
          const teePrecise = calculateTee(bmrPrecise, pal);
          lastComputed = {
            method: 'katch_mcardle', bmr_kcal: bmrPrecise, pal_value: pal, tee_kcal: teePrecise,
            age, sex, height_cm: heightCm, weight_kg: weightKg, body_fat_percent: latestBf.body_fat_percent,
          };
          precisionBox = `
            <div class="result-box">
              <div style="font-size:0.78rem; color:var(--color-gold); font-weight:600; text-transform:uppercase; letter-spacing:0.02em;">Präzisions-Schätzung (Katch-McArdle)</div>
              <div style="margin-top:4px;">Grundumsatz (BMR): <strong>${Math.round(bmrPrecise)} kcal/Tag</strong></div>
              <div class="big">${Math.round(teePrecise)} kcal/Tag</div>
              <div style="color:var(--color-text-muted); font-size:0.85rem;">geschätzter Gesamtenergieumsatz bei PAL ${pal}</div>
              <div class="caveat">
                Berechnet über deine fettfreie Masse, basierend auf dem Körperfettanteil aus deiner Messung vom
                ${new Date(latestBf.measured_at).toLocaleDateString('de-DE')} (${latestBf.body_fat_percent.toFixed(1)} %).
                Referenz: Katch &amp; McArdle (1996). In der Regel genauer als reine Gewichts-/Größenformeln,
                besonders bei über- oder unterdurchschnittlicher Muskelmasse – da hier direkt mit der tatsächlichen
                Körperzusammensetzung statt mit Bevölkerungsdurchschnitten gerechnet wird. Die Fehlerspanne der
                Navy-Methode (ca. ±3-4 Prozentpunkte) wirkt sich anteilig auch auf diesen Wert aus, daher am besten
                bei wiederholten, konsistent gemessenen Werten vertrauen.
              </div>
            </div>
            <div class="result-box" style="margin-top:10px; opacity:0.8;">
              <div style="font-size:0.78rem; color:var(--color-text-muted); font-weight:600; text-transform:uppercase; letter-spacing:0.02em;">Standard-Schätzung (Mifflin-St Jeor)</div>
              <div style="margin-top:4px;">Grundumsatz (BMR): <strong>${Math.round(bmrStandard)} kcal/Tag</strong></div>
              <div class="big" style="font-size:1.3rem;">${Math.round(teeStandard)} kcal/Tag</div>
              <div class="caveat">Nur zum Vergleich – schätzt allein über Gewicht, Größe, Alter und Geschlecht, ohne Körperzusammensetzung.</div>
            </div>

    /**
     * Schlanker, selbst gezeichneter Liniendiagramm (kein externes Chart-Framework
     * nötig für eine einzelne Kennzahl). Folgt den Grundprinzipien: dünne Linie,
     * abgerundete Enden, deutliche Marker, Hover-Tooltip, Markenfarbe.
     */
    function renderTrendChart(el, measurements) {
      const values = measurements.map((m) => m.body_fat_percent).filter((v) => v != null);
      if (values.length < 2) { el.innerHTML = ''; return; }

      const width = 640, height = 200, padding = 32;
      const minV = Math.min(...values), maxV = Math.max(...values);
      const range = maxV - minV || 1;

      const points = measurements
        .filter((m) => m.body_fat_percent != null)
        .map((m, i, arr) => {
          const x = padding + (i / (arr.length - 1 || 1)) * (width - padding * 2);
          const y = height - padding - ((m.body_fat_percent - minV) / range) * (height - padding * 2);
          return { x, y, date: m.measured_at, value: m.body_fat_percent };
        });

      const pathD = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
      const lineColor = 'var(--color-gold)';

      el.innerHTML = `
        <svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; overflow:visible;">
          <line x1="${padding}" y1="${height - padding}" x2="${width - padding}" y2="${height - padding}" stroke="var(--color-border)" stroke-width="1" />
          <path d="${pathD}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          ${points.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${lineColor}" class="chart-point" data-date="${p.date}" data-value="${p.value.toFixed(1)}" style="cursor:pointer;" />`).join('')}
        </svg>
        <div class="chart-tooltip" id="chart-tooltip"></div>
      `;

      const tooltip = el.querySelector('#chart-tooltip');
      el.querySelectorAll('.chart-point').forEach((pt) => {
        pt.addEventListener('mouseenter', (e) => {
          const rect = el.getBoundingClientRect();
          tooltip.textContent = `${new Date(pt.dataset.date).toLocaleDateString('de-DE')}: ${pt.dataset.value} %`;
          tooltip.style.left = (e.clientX - rect.left) + 'px';
          tooltip.style.top = (e.clientY - rect.top) + 'px';
          tooltip.style.opacity = '1';
        });
        pt.addEventListener('mouseleave', () => { tooltip.style.opacity = '0'; });
      });
    }

      function renderComparison(intake, need, burned) {

        if (pct > 1.15) { verdictClass = 'alert'; verdictText = `${Math.round(diff)} kcal über dem Budget.`; }

              <div style="font-size:0.78rem; color:var(--color-text-muted);">${l.meal_label ? escapeHtml(l.meal_label) + ' · ' : ''}${time} · ${Math.round(l.kcal)} kcal${macroParts.length ? ' · ' + macroParts.join(' · ') : ''}</div>
              ${l.trainer_comment ? `<div class="trainer-comment-box"><strong>Kommentar vom Coach:</strong> ${escapeHtml(l.trainer_comment)}</div>` : ''}
              ${isAdmin ? `
                <div style="margin-top:6px; display:flex; gap:6px; flex-wrap:wrap;">
                  <input type="text" class="np-comment-input" data-log-id="${l.id}" placeholder="Kommentar hinzufügen/bearbeiten" value="${escapeHtml(l.trainer_comment || '')}" style="flex:1; min-width:180px; padding:6px 8px; border-radius:6px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text); font-size:0.8rem;" />
                  <button class="btn secondary" data-save-comment="${l.id}" type="button" style="width:auto; padding:6px 10px; font-size:0.78rem;">Speichern</button>
                </div>
              ` : ''}
            </div>
            ${!isAdmin ? `<button class="btn secondary" data-delete-log="${l.id}" type="button" style="width:auto; padding:6px 10px; font-size:0.75rem; flex-shrink:0;">Löschen</button>` : ''}
          </div>
        `;
      }

      function renderSourceFields(source) {
        const el = document.getElementById('np-source-fields');
        if (!el) return;
        if (source === 'food_item') {
          el.innerHTML = `
            <div class="grid-2">
              <div class="field"><label>Lebensmittel</label>
                <select id="np-food-item">${foodItems.map((f) => `<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('') || '<option value="">– keine Lebensmittel –</option>'}</select>
              </div>
              <div class="field"><label>Menge (g)</label><input type="number" id="np-amount" min="1" step="1" value="100" /></div>
            </div>
            <div id="np-preview" style="font-size:0.8rem; color:var(--color-text-muted); margin:-8px 0 12px;"></div>
          `;
          const updatePreview = () => {
            const food = foodItems.find((f) => f.id === document.getElementById('np-food-item').value);
            const grams = parseFloat(document.getElementById('np-amount').value) || 0;
            if (!food) return;
            const kcal = food.kcal_per_100g * grams / 100;
            const p = food.protein_per_100g * grams / 100;
            const c = food.carbs_per_100g * grams / 100;
            const f = food.fat_per_100g * grams / 100;
            document.getElementById('np-preview').textContent = `≈ ${Math.round(kcal)} kcal · E ${p.toFixed(0)} g · KH ${c.toFixed(0)} g · F ${f.toFixed(0)} g`;
          };
          const foodSel = document.getElementById('np-food-item');
          if (foodSel) {
            foodSel.addEventListener('change', updatePreview);
            document.getElementById('np-amount').addEventListener('input', updatePreview);
            if (foodItems.length) updatePreview();
          }
        } else if (source === 'recipe') {
          el.innerHTML = `
            <div class="grid-2">
              <div class="field"><label>Rezept</label>
                <select id="np-recipe">${recipesForLog.map((r) => `<option value="${r.id}">${escapeHtml(r.title)}</option>`).join('') || '<option value="">– keine Rezepte mit Nährwerten –</option>'}</select>
              </div>
              <div class="field"><label>Portionen</label><input type="number" id="np-portions" min="0.25" step="0.25" value="1" /></div>
            </div>
            <div id="np-preview" style="font-size:0.8rem; color:var(--color-text-muted); margin:-8px 0 12px;"></div>
          `;
          const updatePreview = () => {
            const recipe = recipesForLog.find((r) => r.id === document.getElementById('np-recipe').value);
            const portions = parseFloat(document.getElementById('np-portions').value) || 0;
            const previewEl = document.getElementById('np-preview');
            if (!recipe) { previewEl.textContent = ''; return; }
            previewEl.textContent = `≈ ${Math.round((recipe.kcal_per_portion || 0) * portions)} kcal · E ${Math.round((recipe.protein_g || 0) * portions)} g · KH ${Math.round((recipe.carbs_g || 0) * portions)} g · F ${Math.round((recipe.fat_g || 0) * portions)} g`;
          };
          const recipeSel = document.getElementById('np-recipe');
          if (recipeSel) {
            recipeSel.addEventListener('change', updatePreview);
            document.getElementById('np-portions').addEventListener('input', updatePreview);
            if (recipesForLog.length) updatePreview();
          }
        } else {
          el.innerHTML = `
            <div class="field"><label>Bezeichnung</label><input type="text" id="np-custom-name" required /></div>
            <div class="grid-2">
              <div class="field"><label>Kalorien (kcal)</label><input type="number" id="np-custom-kcal" min="0" step="1" required /></div>
              <div class="field"><label>Eiweiß (g, optional)</label><input type="number" id="np-custom-protein" min="0" step="1" /></div>
              <div class="field"><label>Kohlenhydrate (g, optional)</label><input type="number" id="np-custom-carbs" min="0" step="1" /></div>
              <div class="field"><label>Fett (g, optional)</label><input type="number" id="np-custom-fat" min="0" step="1" /></div>
            </div>
          `;
        }
      }

      async function loadBody() {
        const bodyEl = document.getElementById('np-body');
        if (!bodyEl) return;
        if (!selectedClientId) { bodyEl.innerHTML = '<p style="color:var(--color-text-muted);">Kein Kunde ausgewählt.</p>'; return; }
        bodyEl.innerHTML = '<p class="center-text">Lade …</p>';

        const fromIso = new Date(currentFrom + 'T00:00:00').toISOString();
        const toIso = new Date(currentTo + 'T23:59:59').toISOString();

        const [{ data: logs, error: logsError }, { data: target }, { data: sessions }] = await Promise.all([
          listNutritionLogs(selectedClientId, { from: fromIso, to: toIso }),
          getLatestEnergyTarget(selectedClientId),
          listSessions(selectedClientId, { from: fromIso, to: toIso }),
        ]);

        if (logsError) { bodyEl.innerHTML = `<div class="msg error">${escapeHtml(logsError.message)}</div>`; return; }
        renderBody(bodyEl, logs || [], target, sessions || []);
      }

      function renderBody(bodyEl, logs, target, sessions) {
        const totalKcal = logs.reduce((s, l) => s + (l.kcal || 0), 0);
        const totalProtein = logs.reduce((s, l) => s + (l.protein_g || 0), 0);
        const totalCarbs = logs.reduce((s, l) => s + (l.carbs_g || 0), 0);
        const totalFat = logs.reduce((s, l) => s + (l.fat_g || 0), 0);
        const caloriesBurned = sessions.reduce((s, sess) => s + (sess.calories_burned || 0), 0);
        const need = target ? target.tee_kcal : null;

        let html = '';

        if (!isAdmin) {
          html += `
            <div class="card">
              <h2 style="font-size:1.05rem;">Eintrag hinzufügen</h2>
              <form id="np-form">
                <div class="field">
                  <label>Quelle</label>
                  <select id="np-source">
                    <option value="food_item">Lebensmittel aus der Liste</option>
                    <option value="recipe">Rezept</option>
                    <option value="custom">Eigene Eingabe</option>
                  </select>
                </div>
                <div id="np-source-fields"></div>
                <div class="grid-2">
                  <div class="field"><label>Mahlzeit</label>
                    <select id="np-meal">
                      <option value="Frühstück">Frühstück</option>
                      <option value="Mittagessen">Mittagessen</option>
                      <option value="Abendessen">Abendessen</option>
                      <option value="Snack">Snack</option>
                    </select>
                  </div>
                  <div class="field"><label>Zeitpunkt</label><input type="datetime-local" id="np-time" required /></div>
                </div>
                <button class="btn" type="submit">Eintragen</button>
              </form>
              <div id="np-result"></div>
            </div>
          `;
        }

        html += `
          <div class="card mt-24">
            <h2 style="font-size:1.05rem;">${isAdmin ? 'Ernährungsprotokoll des Kunden' : 'Mein Ernährungsprotokoll'}</h2>
            <div class="analytics-filters" style="margin-top:10px;">
              <div class="field"><label>Von</label><input type="date" id="np-from" value="${currentFrom}" /></div>
              <div class="field"><label>Bis</label><input type="date" id="np-to" value="${currentTo}" /></div>
              <button class="btn small-btn" id="np-filter-apply" type="button" style="width:auto; padding:8px 14px;">Filtern</button>
            </div>
            <div class="filter-presets">
              <button type="button" data-preset="today">Heute</button>
              <button type="button" data-preset="7d">Letzte 7 Tage</button>
              <button type="button" data-preset="month">Dieser Monat</button>
            </div>

            <div class="stat-tiles">
              <div class="stat-tile"><div class="value">${Math.round(totalKcal)} kcal</div><div class="label">Erfasste Kalorien im Zeitraum</div></div>
              <div class="stat-tile"><div class="value">${Math.round(totalProtein)} / ${Math.round(totalCarbs)} / ${Math.round(totalFat)} g</div><div class="label">Eiweiß / Kohlenhydrate / Fett</div></div>
              ${need != null ? `<div class="stat-tile"><div class="value">${Math.round(need)} kcal</div><div class="label">Gespeicherter Bedarf/Tag</div></div>` : ''}
              ${caloriesBurned > 0 ? `<div class="stat-tile"><div class="value">${Math.round(caloriesBurned)} kcal</div><div class="label">Leistungsumsatz (getrackte Einheiten)</div></div>` : ''}
            </div>

            ${need != null ? renderComparison(totalKcal, need, caloriesBurned) : `<div class="msg info" style="font-size:0.85rem;">Noch kein Kalorienbedarf gespeichert – unter „PAL-Rechner" berechnen und speichern, um hier einen Vergleich zu sehen.</div>`}

            <h3 style="font-size:0.95rem; margin-top:20px;">Einträge</h3>
            ${logs.length === 0 ? '<p style="color:var(--color-text-muted);">Keine Einträge im gewählten Zeitraum.</p>' : logs.map((l) => renderLogEntry(l)).join('')}
          </div>
        `;

        bodyEl.innerHTML = html;

        if (!isAdmin) {
          renderSourceFields('food_item');
          document.getElementById('np-time').value = nowLocalDatetimeValue();
          document.getElementById('np-source').addEventListener('change', (e) => renderSourceFields(e.target.value));

          document.getElementById('np-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const source = document.getElementById('np-source').value;
            const meal = document.getElementById('np-meal').value;
            const loggedAtRaw = document.getElementById('np-time').value;
            const entry = {
              client_id: selectedClientId,
              logged_at: new Date(loggedAtRaw).toISOString(),
              meal_label: meal,
              source_type: source,
            };

            if (source === 'food_item') {
              const food = foodItems.find((f) => f.id === document.getElementById('np-food-item').value);
              const grams = parseFloat(document.getElementById('np-amount').value) || 0;
              if (!food) { alert('Bitte ein Lebensmittel wählen.'); return; }
              entry.food_item_id = food.id;
              entry.amount_grams = grams;
              entry.kcal = Math.round(food.kcal_per_100g * grams / 100);
              entry.protein_g = Math.round(food.protein_per_100g * grams / 100);
              entry.carbs_g = Math.round(food.carbs_per_100g * grams / 100);
              entry.fat_g = Math.round(food.fat_per_100g * grams / 100);
            } else if (source === 'recipe') {
              const recipe = recipesForLog.find((r) => r.id === document.getElementById('np-recipe').value);
              const portions = parseFloat(document.getElementById('np-portions').value) || 0;
              if (!recipe) { alert('Bitte ein Rezept wählen.'); return; }
              entry.recipe_id = recipe.id;
              entry.kcal = Math.round((recipe.kcal_per_portion || 0) * portions);
              entry.protein_g = Math.round((recipe.protein_g || 0) * portions);
              entry.carbs_g = Math.round((recipe.carbs_g || 0) * portions);
              entry.fat_g = Math.round((recipe.fat_g || 0) * portions);
            } else {
              const name = document.getElementById('np-custom-name').value.trim();
              const kcal = parseFloat(document.getElementById('np-custom-kcal').value);
              if (!name || isNaN(kcal)) { alert('Bitte Bezeichnung und Kalorien angeben.'); return; }
              entry.custom_name = name;
              entry.kcal = kcal;
              entry.protein_g = document.getElementById('np-custom-protein').value ? parseFloat(document.getElementById('np-custom-protein').value) : null;
              entry.carbs_g = document.getElementById('np-custom-carbs').value ? parseFloat(document.getElementById('np-custom-carbs').value) : null;
              entry.fat_g = document.getElementById('np-custom-fat').value ? parseFloat(document.getElementById('np-custom-fat').value) : null;
            }

            const { error } = await createNutritionLog(entry);
            if (error) { document.getElementById('np-result').innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`; return; }
            loadBody();
          });
        }

        document.getElementById('np-filter-apply').addEventListener('click', () => {
          currentFrom = document.getElementById('np-from').value;
          currentTo = document.getElementById('np-to').value;
          loadBody();
        });

        bodyEl.querySelectorAll('.filter-presets button').forEach((btn) => {
          btn.addEventListener('click', () => {
            bodyEl.querySelectorAll('.filter-presets button').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            if (btn.dataset.preset === 'today') { currentFrom = todayIso(); currentTo = todayIso(); }
            else if (btn.dataset.preset === '7d') { currentFrom = isoDaysAgo(6); currentTo = todayIso(); }
            else if (btn.dataset.preset === 'month') {
              const d = new Date();
              currentFrom = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
              currentTo = todayIso();
            }
            loadBody();
          });
        });

        bodyEl.querySelectorAll('[data-delete-log]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            if (!confirm('Diesen Eintrag wirklich löschen?')) return;
            await deleteNutritionLog(btn.dataset.deleteLog);
            loadBody();
          });
        });

        bodyEl.querySelectorAll('[data-save-comment]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const input = bodyEl.querySelector(`.np-comment-input[data-log-id="${btn.dataset.saveComment}"]`);
            btn.disabled = true;
            const { error } = await setTrainerComment(btn.dataset.saveComment, input.value.trim());
            if (error) { alert('Fehler: ' + error.message); btn.disabled = false; return; }
            loadBody();
          });
        });
      }

      await loadBody();
    }

    init();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>

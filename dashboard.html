<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – Dream And Do It</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#053446" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <img src="icons/logo-mark.png" alt="Dream And Do It Logo" onerror="this.style.display='none'" />
        DREAM AND DO IT
      </div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" id="theme-toggle" type="button">Hell/Dunkel</button>
        <button class="icon-btn" id="logout-btn" type="button">Abmelden</button>
      </div>
    </div>
    <div id="nav-tabs-slot"></div>

    <div class="container wide" id="app-container">
      <p class="center-text">Lade dein Profil …</p>
    </div>

    <div class="footer-note">
      Fragen zu deinem Zugang? <a href="mailto:info@dreamanddoit.de">info@dreamanddoit.de</a>
    </div>
  </div>

  <script type="module">
    import { requireAuth, signOut, initTheme, toggleTheme } from './js/auth.js';
    import { getUnreadCount } from './js/messages.js';
    import { getNewSignupCount } from './js/betrieb.js';
    import { navTabsHtml, bindNavSubmenus } from './js/nav.js';
    import { SECTION_INFO, welcomeParagraphs } from './js/section-info.js';
    import { collapsibleHtml, initCollapsibles } from './js/collapsible.js';
    // Nutzer-Feedback Runde 14: Geburtsdatum wird jetzt auf der Startseite
    // erfasst (statt nur im Präventionscheck) und von dort für PAL-Rechner
    // & Präventionscheck wiederverwendet; die Ziele (GROW) bekommen eine
    // kompakte Karte direkt nach der Begrüßung statt nur als Unterseite.
    import { supabaseClient } from './js/supabase-client.js';
    import { calcAge, updateBirthDate, listPreventionResults, isPreventionCheckComplete } from './js/prevention.js';
    import { listMyGoals } from './js/coaching.js';
    // Runde 16: Achievements-/Erfolge-Karte – wertet bereits vorhandene Daten
    // aus Training (Streak/Rekorde, Runde 15), Ernährungsprotokoll und
    // Präventionscheck aus, ohne diese Module hier neu zu implementieren.
    import { listAllTrainingLogsForRecords, computePersonalRecords, computeTrainingStreak } from './js/training.js';
    import { listNutritionLogs } from './js/nutrition.js';
    import { ACHIEVEMENT_DEFINITIONS, evaluateAchievements, listAchievements, syncEarnedAchievements } from './js/achievements.js';

    initTheme();
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await signOut();
      window.location.href = 'index.html';
    });

    const container = document.getElementById('app-container');

    requireAuth().then((profile) => {
      if (!profile) return; // requireAuth leitet bereits zum Login um

      mountNavTabs(profile);

      if (profile.access_locked) {
        renderLocked();
        return;
      }
      renderDashboard(profile);
    });

    // Etappe 19: eine einzige Kopfzeilen-Reiterleiste statt der bisherigen
    // Einzel-Links ("Nachrichten"/"Zum Dashboard") UND der Kacheln im unteren
    // .section-grid — siehe js/nav.js. Ungelesene Nachrichten sowie neue,
    // noch nicht gesichtete Anmeldungen (nur Admin, siehe
    // sql/023_neue_anmeldungen_badge.sql) werden als Badge auf dem
    // jeweiligen Reiter angezeigt.
    async function mountNavTabs(profile) {
      const slot = document.getElementById('nav-tabs-slot');
      if (!slot) return;
      const [unreadMessages, signupResult] = await Promise.all([
        getUnreadCount(profile.id),
        profile.role === 'admin' ? getNewSignupCount() : Promise.resolve({ count: 0 }),
      ]);
      slot.innerHTML = navTabsHtml(profile, {
        currentPage: 'dashboard',
        unreadMessages,
        newSignups: signupResult.count || 0,
      });
      bindNavSubmenus(slot);
    }

    function renderLocked() {
      container.innerHTML = `
        <div class="card lock-screen">
          <div class="icon">🔒</div>
          <h2>Zugang derzeit gesperrt</h2>
          <p style="color:var(--color-text-muted);">
            Dein Zugang zur Plattform ist momentan eingeschränkt. Das kommt z.B. vor,
            wenn eine Zahlung offen ist. Bitte melde dich bei uns, um das zu klären.
          </p>
          <a class="btn mt-16" style="display:inline-block; width:auto; padding:12px 24px;"
             href="mailto:info@dreamanddoit.de">Kontakt aufnehmen</a>
        </div>
      `;
    }

    function renderDashboard(profile) {
      if (profile.role === 'admin') {
        renderTrainerStart(profile);
      } else {
        renderClientStart(profile);
      }
    }

    // -------------------------------------------------------------------------
    // TRAINER-STARTSEITE (Admin) — "wo befinde ich mich, was liegt wo"
    // -------------------------------------------------------------------------
    function renderTrainerStart(profile) {
      container.innerHTML = `
        <div class="section-hero">
          <span class="kicker">Trainer-Ansicht</span>
          <h2>Kundensoftware von Dream And Do It</h2>
          ${collapsibleHtml(`
            <p class="lead">
              Hallo ${escapeHtml(profile.full_name || '')}, du befindest dich in der Admin-/Coach-Ansicht der
              Kundenplattform. Hier verwaltest du Inhalte und Pläne, siehst die Entwicklung deiner Kunden und
              kommunizierst direkt mit ihnen. Kunden sehen eine eigene, vereinfachte Ansicht mit nur den Bereichen,
              die du für sie freigeschaltet hast — deine eigenen Rechte und Zugriffe bleiben davon unberührt.
            </p>
          `)}
        </div>

        <div class="benefit-grid">
          <div class="benefit-card">
            <h4>Training</h4>
            <p>${SECTION_INFO.training.adminIntro}</p>
          </div>
          <div class="benefit-card">
            <h4>Ernährung</h4>
            <p>${SECTION_INFO.nutrition.adminIntro}</p>
          </div>
          <div class="benefit-card">
            <h4>Coaching</h4>
            <p>${SECTION_INFO.coaching.adminIntro}</p>
          </div>
          <div class="benefit-card">
            <h4>Nachrichten</h4>
            <p>Direkter Austausch mit all deinen Kunden zu ihren Leistungen — immer erreichbar, unabhängig von Reiter-Freigaben.</p>
          </div>
          <div class="benefit-card">
            <h4>Trainer-Dashboard (Betrieb)</h4>
            <p>Kundenübersicht mit Aktivitäts-Frühwarnsystem, Wochenreport-Erstellung, Geräteverwaltung und die
              Reiter-Freigabe je Kunde (Training/Ernährung/Coaching einzeln sperr-/freischaltbar).</p>
          </div>
        </div>
      `;
      // Hinweis: Die frühere Kachel-Navigation (.section-grid) direkt hier
      // wurde entfernt — sie duplizierte nur die neue Kopfzeilen-Reiterleiste
      // (siehe #nav-tabs-slot / js/nav.js), die jetzt auf jeder Seite verfügbar ist.
      initCollapsibles(container);
    }

    // -------------------------------------------------------------------------
    // KUNDEN-STARTSEITE — persönliche Begrüßung + Überblick inkl. Vorteilen
    // -------------------------------------------------------------------------
    function renderClientStart(profile) {
      const firstName = (profile.full_name || '').split(' ')[0];
      const welcomeHtml = collapsibleHtml(
        welcomeParagraphs(firstName).map((p) => `<p>${p}</p>`).join(''),
        { fadeVar: 'var(--color-navy)' }
      );

      const modules = [
        { key: 'training', href: 'training.html', enabled: profile.training_enabled },
        { key: 'nutrition', href: 'nutrition.html', enabled: profile.nutrition_enabled },
        { key: 'coaching', href: 'coaching.html', enabled: profile.coaching_enabled },
      ];

      container.innerHTML = `
        <div class="welcome-card">
          <div class="welcome-card-header">
            <img class="welcome-card-photo" src="icons/nicholas-portrait.jpg" alt="Nicholas Chilala" />
            <div class="welcome-card-header-text">
              <h2 style="margin-bottom:2px;">Willkommen bei Dream And Do It</h2>
              <p class="welcome-card-signature">Nicholas Chilala — Gründer &amp; Head Coach</p>
              <p class="welcome-card-credentials">M.A. Prävention &amp; Gesundheitsmanagement (Schwerpunkt Coaching &amp; Sportpsychologie) · IHK-Coach · zertifizierter Trainer für Management &amp; Sales</p>
            </div>
          </div>
          ${welcomeHtml}
        </div>

        <div class="card mt-24" id="grow-summary-card">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <h3 style="font-size:1rem; margin:0;">Deine Ziele (GROW)</h3>
            <a class="icon-btn" style="text-decoration:none;" href="coaching.html?tab=ziele">Alle Ziele öffnen →</a>
          </div>
          <div id="grow-summary-list" class="mt-16"><p class="center-text" style="font-size:0.85rem;">Lade Ziele …</p></div>
        </div>

        <div class="card mt-24" id="achievements-summary-card">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <h3 style="font-size:1rem; margin:0;">Deine Erfolge</h3>
          </div>
          <div id="achievements-summary-list" class="mt-16"><p class="center-text" style="font-size:0.85rem;">Lade Erfolge …</p></div>
        </div>

        <div class="card mt-24" id="birthdate-card">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <div>
              <h3 style="font-size:1rem; margin:0 0 2px;">Geburtsdatum</h3>
              <p style="color:var(--color-text-muted); font-size:0.82rem; margin:0;">Wird für den PAL-Rechner und den Präventionscheck verwendet – hier einmal eintragen, überall automatisch übernommen.</p>
            </div>
          </div>
          <div id="birthdate-display" class="mt-16"><p class="center-text" style="font-size:0.85rem;">Lade …</p></div>
          <form id="birthdate-form" class="hidden mt-16">
            <div class="field"><label>Geburtsdatum</label><input type="date" id="birthdate-input" required /></div>
            <button class="btn secondary small-btn" type="submit">Speichern</button>
          </form>
        </div>

        <div class="benefit-grid mt-24">
          ${modules.map((m) => {
            const info = SECTION_INFO[m.key];
            return `
              <div class="benefit-card">
                <h4>${escapeHtml(info.title)} ${m.enabled ? '' : '<span style="font-size:0.68rem; color:var(--color-danger); font-weight:400;">(auf Anfrage)</span>'}</h4>
                <p>${info.clientIntro}</p>
              </div>
            `;
          }).join('')}
          <div class="benefit-card">
            <h4>Nachrichten</h4>
            <p>Direkter Austausch mit mir zu deinen Leistungen — dieser Bereich ist für dich immer zugänglich, egal welche anderen Bereiche freigeschaltet sind.</p>
          </div>
        </div>
      `;
      // Hinweis: Die frühere Kachel-Navigation (.section-grid) direkt hier
      // wurde entfernt — sie duplizierte nur die neue Kopfzeilen-Reiterleiste
      // (siehe #nav-tabs-slot / js/nav.js), die jetzt auf jeder Seite verfügbar ist.
      initCollapsibles(container);
      renderGrowSummary(profile);
      renderAchievementsCard(profile);
      renderBirthdateCard(profile);
    }

    // Runde 16: berechnet alle Erfolge aus bereits vorhandenen Daten (nur für
    // freigeschaltete Module – ohne Trainings-/Ernährungszugriff werden diese
    // Daten gar nicht erst abgefragt) und schreibt neu erreichte Erfolge in
    // die Datenbank, damit der "neu freigeschaltet"-Hinweis nur einmal
    // erscheint und Trainer denselben Stand sehen.
    async function renderAchievementsCard(profile) {
      const listEl = document.getElementById('achievements-summary-list');
      if (!listEl) return;

      const trainingEnabled = profile.role === 'admin' || !!profile.training_enabled;
      const nutritionEnabled = profile.role === 'admin' || !!profile.nutrition_enabled;

      const [{ data: existing, error: existingError }, { data: trainingLogs }, { data: preventionResults }, { data: nutritionLogs }] = await Promise.all([
        listAchievements(profile.id),
        trainingEnabled ? listAllTrainingLogsForRecords(profile.id) : Promise.resolve({ data: [] }),
        trainingEnabled ? listPreventionResults(profile.id) : Promise.resolve({ data: [] }),
        nutritionEnabled ? listNutritionLogs(profile.id) : Promise.resolve({ data: [] }),
      ]);
      if (existingError) { listEl.innerHTML = `<div class="msg error">${escapeHtml(existingError.message)}</div>`; return; }

      const logs = trainingLogs || [];
      const { prEvents } = computePersonalRecords(logs);
      const { longestStreak } = computeTrainingStreak(logs.map((l) => l.performed_at));
      const nutritionDaysLogged = new Set((nutritionLogs || []).map((n) => (n.logged_at || '').slice(0, 10)).filter(Boolean)).size;
      const preventionComplete = trainingEnabled ? isPreventionCheckComplete(preventionResults || []) : false;
      const cardioTestDone = (preventionResults || []).some((r) => r.test_key === 'cardio_fitness');

      const evaluated = evaluateAchievements({
        longestStreak, prCount: prEvents.length, nutritionDaysLogged, preventionComplete, cardioTestDone,
      });

      const existingKeys = new Set((existing || []).map((a) => a.achievement_key));
      const newlyEarned = evaluated.filter((a) => a.earned && !a.manual && !existingKeys.has(a.key));
      if (newlyEarned.length > 0) {
        const { error: syncError } = await syncEarnedAchievements(profile.id, newlyEarned);
        if (!syncError) newlyEarned.forEach((a) => existingKeys.add(a.key));
      }

      const earnedCount = ACHIEVEMENT_DEFINITIONS.filter((d) => existingKeys.has(d.key)).length;

      listEl.innerHTML = `
        ${newlyEarned.length > 0 ? `
        <div class="msg success" style="margin-bottom:12px;">
          🎉 Neu freigeschaltet: ${newlyEarned.map((a) => escapeHtml(a.title)).join(', ')}
        </div>` : ''}
        <div class="achievements-grid">
          ${evaluated.map((a) => {
            const earned = existingKeys.has(a.key);
            return `
              <div class="achievement-badge ${earned ? 'earned' : 'locked'}" title="${escapeHtml(a.description)}">
                <div class="achievement-icon">${a.icon}</div>
                <div class="achievement-title">${escapeHtml(a.title)}</div>
                ${!earned && a.progress ? `<div class="achievement-progress">${a.progress.current}/${a.progress.target}</div>` : ''}
              </div>
            `;
          }).join('')}
        </div>
        <p style="font-size:0.78rem; color:var(--color-text-muted); margin:12px 0 0;">${earnedCount} von ${ACHIEVEMENT_DEFINITIONS.length} Erfolgen freigeschaltet.</p>
      `;
    }

    // Nutzer-Feedback Runde 14: kompakte Ziele-Karte direkt auf der Startseite
    // (nach der Begrüßung) statt nur als Unterseite in Coaching – der volle
    // GROW-Editor bleibt weiterhin dort, hier nur eine Kurzübersicht + Link.
    async function renderGrowSummary(profile) {
      const listEl = document.getElementById('grow-summary-list');
      if (!listEl) return;
      const { data: goals, error } = await listMyGoals(profile.id);
      if (error) { listEl.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`; return; }

      const active = (goals || []).filter((g) => g.status === 'active');
      const shown = (active.length > 0 ? active : (goals || [])).slice(0, 3);

      if (shown.length === 0) {
        listEl.innerHTML = `<p style="color:var(--color-text-muted); font-size:0.85rem; margin:0;">Noch keine Ziele hinterlegt – leg dein erstes Ziel im Bereich <a href="coaching.html?tab=ziele">Coaching &amp; Ziele (GROW)</a> an.</p>`;
        return;
      }

      listEl.innerHTML = `<ul style="margin:0; padding-left:18px; font-size:0.88rem;">
        ${shown.map((g) => `<li style="margin-bottom:6px;">
          <strong>${escapeHtml(g.title)}</strong>
          ${g.target_date ? ` <span style="color:var(--color-text-muted); font-size:0.78rem;">– Zieltermin: ${new Date(g.target_date).toLocaleDateString('de-DE')}</span>` : ''}
          ${g.status === 'achieved' ? ' <span class="status-pill-inline" style="color:var(--color-success);">erreicht</span>' : ''}
        </li>`).join('')}
      </ul>`;
    }

    // Nutzer-Feedback Runde 14: Geburtsdatum wird hier auf der Startseite
    // erfasst/geändert und von PAL-Rechner (nutrition.html) sowie
    // Präventionscheck (training.html) über profiles.birth_date wiederverwendet.
    async function renderBirthdateCard(profile) {
      const displayEl = document.getElementById('birthdate-display');
      const formEl = document.getElementById('birthdate-form');
      if (!displayEl) return;

      const { data: profileRow, error } = await supabaseClient.from('profiles').select('birth_date').eq('id', profile.id).maybeSingle();
      if (error) { displayEl.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`; return; }

      const birthDate = profileRow ? profileRow.birth_date : null;
      const ageYears = calcAge(birthDate);

      displayEl.innerHTML = birthDate
        ? `<div class="result-box"><div class="big" style="font-size:1.2rem;">${new Date(birthDate).toLocaleDateString('de-DE')}</div><div style="font-size:0.78rem; color:var(--color-text-muted); margin-top:2px;">Alter: ${ageYears} Jahre</div></div>
           <button class="icon-btn mt-16" id="birthdate-edit-btn" type="button">Ändern</button>`
        : `<p style="color:var(--color-gold); font-size:0.85rem; margin:0 0 10px;">Noch kein Geburtsdatum hinterlegt.</p>
           <button class="icon-btn" id="birthdate-edit-btn" type="button">Geburtsdatum eintragen</button>`;

      if (birthDate) {
        document.getElementById('birthdate-input').value = birthDate;
      }

      const editBtn = document.getElementById('birthdate-edit-btn');
      if (editBtn && formEl) {
        editBtn.addEventListener('click', () => formEl.classList.toggle('hidden'));
      }
      // formEl bleibt über mehrere renderBirthdateCard()-Aufrufe hinweg dasselbe
      // DOM-Element (nur displayEl wird neu geschrieben) – der Submit-Listener
      // wird daher per Flag nur EINMAL angehängt, sonst würden sich bei
      // wiederholtem Speichern doppelte Listener aufsummieren.
      if (formEl && !formEl.dataset.wired) {
        formEl.dataset.wired = '1';
        formEl.addEventListener('submit', async (e) => {
          e.preventDefault();
          const submitBtn = formEl.querySelector('button[type="submit"]');
          submitBtn.disabled = true;
          const { error: saveError } = await updateBirthDate(profile.id, document.getElementById('birthdate-input').value);
          if (saveError) { alert('Fehler: ' + saveError.message); submitBtn.disabled = false; return; }
          formEl.classList.add('hidden');
          submitBtn.disabled = false;
          renderBirthdateCard(profile);
        });
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>

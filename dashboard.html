<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="base-uri 'self'; object-src 'none'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – Dream And Do It</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#053446" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script type="module" src="js/icons.js"></script>
  <script src="vendor/supabase-js-2.117.2.min.js"></script>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <img class="brand-mark" src="icons/logo-mark-badge.png" alt="Dream And Do It Logo" onerror="this.style.display='none'" />
        <span class="brand-text">
          <span class="brand-name">DREAM AND DO IT</span>
          <span class="brand-tagline">Training und Coaching für Ihren Erfolg</span>
        </span>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" id="theme-toggle" type="button">Hell/Dunkel</button>
        <button class="icon-btn" id="logout-btn" type="button">Abmelden</button>
      </div>
    </div>
    <div id="nav-tabs-slot"></div>

    <div class="container wide" id="app-container">
      <p class="center-text">Lade dein Profil …</p>
    </div>

    <div class="footer-note">
      Fragen zu deinem Zugang? <a href="mailto:info@dreamanddoit.de">info@dreamanddoit.de</a>
    </div>
  </div>

  <script type="module">
    import { requireAuth, signOut, initTheme, toggleTheme } from './js/auth.js';
    import { getUnreadCount } from './js/messages.js';
    import { getNewSignupCount } from './js/betrieb.js';
    import { navTabsHtml, bindNavSubmenus } from './js/nav.js';
    import { SECTION_INFO, START_TILE_EXTRAS, welcomeParagraphs, hydrateSectionInfo, loadSectionCounts, platformOverview } from './js/section-info.js';
    import { renderInterestsCard, messageLink } from './js/recommendations.js';
    import { computeNextStep, nextStepHtml, maybeShowOnboarding } from './js/onboarding.js';
    import { collapsibleHtml, initCollapsibles } from './js/collapsible.js';
    // Nutzer-Feedback Runde 14: Geburtsdatum wird jetzt auf der Startseite
    // erfasst (statt nur im Präventionscheck) und von dort für PAL-Rechner
    // & Präventionscheck wiederverwendet; die Ziele (GROW) bekommen eine
    // kompakte Karte direkt nach der Begrüßung statt nur als Unterseite.
    import { supabaseClient } from './js/supabase-client.js';
    import { calcAge, listPreventionResults, isPreventionCheckComplete } from './js/prevention.js';
    import { listMyGoals } from './js/coaching.js';
    // Runde 16: Achievements-/Erfolge-Karte – wertet bereits vorhandene Daten
    // aus Training (Streak/Rekorde, Runde 15), Ernährungsprotokoll und
    // Präventionscheck aus, ohne diese Module hier neu zu implementieren.
    import { listAllTrainingLogsForRecords, computePersonalRecords, computeTrainingStreak } from './js/training.js';
    import { listNutritionLogs } from './js/nutrition.js';
    import { ACHIEVEMENT_DEFINITIONS, evaluateAchievements, listAchievements, syncEarnedAchievements } from './js/achievements.js';

    initTheme();
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await signOut();
      window.location.href = 'index.html';
    });

    const container = document.getElementById('app-container');

    requireAuth().then((profile) => {
      if (!profile) return; // requireAuth leitet bereits zum Login um

      mountNavTabs(profile);

      if (profile.access_locked) {
        renderLocked();
        return;
      }
      renderDashboard(profile);
    });

    // Etappe 19: eine einzige Kopfzeilen-Reiterleiste statt der bisherigen
    // Einzel-Links ("Nachrichten"/"Zum Dashboard") UND der Kacheln im unteren
    // .section-grid — siehe js/nav.js. Ungelesene Nachrichten sowie neue,
    // noch nicht gesichtete Anmeldungen (nur Admin, siehe
    // sql/023_neue_anmeldungen_badge.sql) werden als Badge auf dem
    // jeweiligen Reiter angezeigt.
    async function mountNavTabs(profile) {
      const slot = document.getElementById('nav-tabs-slot');
      if (!slot) return;
      const [unreadMessages, signupResult] = await Promise.all([
        getUnreadCount(profile.id),
        profile.role === 'admin' ? getNewSignupCount() : Promise.resolve({ count: 0 }),
      ]);
      slot.innerHTML = navTabsHtml(profile, {
        currentPage: 'dashboard',
        unreadMessages,
        newSignups: signupResult.count || 0,
      });
      bindNavSubmenus(slot);
    }

    function renderLocked() {
      container.innerHTML = `
        <div class="card lock-screen">
          <div class="icon">🔒</div>
          <h2>Zugang derzeit gesperrt</h2>
          <p style="color:var(--color-text-muted);">
            Dein Zugang zur Plattform ist momentan eingeschränkt. Das kommt z.B. vor,
            wenn eine Zahlung offen ist. Bitte melde dich bei uns, um das zu klären.
          </p>
          <a class="btn mt-16" style="display:inline-block; width:auto; padding:12px 24px;"
             href="mailto:info@dreamanddoit.de">Kontakt aufnehmen</a>
        </div>
      `;
    }

    function renderDashboard(profile) {
      if (profile.role === 'admin') {
        renderTrainerStart(profile);
      } else {
        renderClientStart(profile);
      }
    }

    // -------------------------------------------------------------------------
    // TRAINER-STARTSEITE (Admin) — "wo befinde ich mich, was liegt wo"
    // -------------------------------------------------------------------------
    function renderTrainerStart(profile) {
      container.innerHTML = `
        <div class="section-hero">
          <span class="kicker">Trainer-Ansicht</span>
          <h2>Kundensoftware von Dream And Do It</h2>
          ${collapsibleHtml(`
            <p class="lead">
              Hallo ${escapeHtml(profile.full_name || '')}, du befindest dich in der Admin-/Coach-Ansicht der
              Kundenplattform. Hier verwaltest du Inhalte und Pläne, siehst die Entwicklung deiner Kunden und
              kommunizierst direkt mit ihnen. Kunden sehen eine eigene, vereinfachte Ansicht mit nur den Bereichen,
              die du für sie freigeschaltet hast — deine eigenen Rechte und Zugriffe bleiben davon unberührt.
            </p>
          `)}
        </div>

        <div class="tile-grid tile-grid--5">
          ${[
            { key: 'training', icon: '🏋️', title: SECTION_INFO.training.title, href: 'training.html', short: SECTION_INFO.training.adminShort, full: SECTION_INFO.training.adminIntro },
            { key: 'nutrition', icon: '🥗', title: SECTION_INFO.nutrition.title, href: 'nutrition.html', short: SECTION_INFO.nutrition.adminShort, full: SECTION_INFO.nutrition.adminIntro },
            { key: 'coaching', icon: '🧠', title: SECTION_INFO.coaching.title, href: 'coaching.html', short: SECTION_INFO.coaching.adminShort, full: SECTION_INFO.coaching.adminIntro },
            { key: 'messages', icon: '💬', title: START_TILE_EXTRAS.messages.title, href: 'messages.html', short: START_TILE_EXTRAS.messages.adminShort, full: START_TILE_EXTRAS.messages.adminIntro },
            { key: 'betrieb', icon: '🛠️', title: START_TILE_EXTRAS.betrieb.title, href: 'betrieb.html', short: START_TILE_EXTRAS.betrieb.adminShort, full: START_TILE_EXTRAS.betrieb.adminIntro },
          ].map(tileHtml).join('')}
        </div>
      `;
      // Hinweis: Die frühere Kachel-Navigation (.section-grid) direkt hier
      // wurde entfernt — sie duplizierte nur die neue Kopfzeilen-Reiterleiste
      // (siehe #nav-tabs-slot / js/nav.js), die jetzt auf jeder Seite verfügbar ist.
      initCollapsibles(container);
      bindTiles(container);
      hydrateSectionInfo(container);
    }

    // Runde 19 (Q7): gemeinsame Kachel-Komponente für Kunden- und Trainer-
    // Startseite. Die ganze Kachel ist über den Titel-Link (gestreckter Link,
    // siehe .tile-link::after in css/styles.css) anklickbar; „Mehr“ ist ein
    // eigener Button daneben (kein Button IN einem Link) und löst keine
    // Navigation aus. Volltexte kommen unverändert aus js/section-info.js.
    function tileHtml(t) {
      const fullId = `tile-full-${t.key}`;
      return `
        <div class="tile" data-tile="${escapeHtml(t.key)}">
          <a class="tile-link" href="${escapeHtml(t.href)}">
            <span class="t-head"><span class="t-ico" aria-hidden="true">${t.icon}</span><h4 class="t-title">${escapeHtml(t.title)}${t.badge || ''}</h4></span>
            <span class="t-short">${t.short}</span>
            ${['training', 'nutrition', 'coaching'].includes(t.key) ? `<span class="t-facts" data-tile-facts="${escapeHtml(t.key)}"></span>` : ''}
          </a>
          <div class="t-full" id="${fullId}" hidden><p>${t.full}</p></div>
          <button type="button" class="tile-more" aria-expanded="false" aria-controls="${fullId}">Mehr ▾</button>
        </div>
      `;
    }

    function bindTiles(root) {
      root.querySelectorAll('.tile-more').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const tile = btn.closest('.tile');
          const full = document.getElementById(btn.getAttribute('aria-controls'));
          if (!tile || !full) return;
          const open = btn.getAttribute('aria-expanded') !== 'true';
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
          btn.textContent = open ? 'Weniger ▴' : 'Mehr ▾';
          full.hidden = !open;
          tile.classList.toggle('is-open', open);
        });
      });
    }

    // -------------------------------------------------------------------------
    // KUNDEN-STARTSEITE — persönliche Begrüßung + Überblick inkl. Vorteilen
    // -------------------------------------------------------------------------
    function renderClientStart(profile) {
      const firstName = (profile.full_name || '').split(' ')[0];
      const welcomeHtml = collapsibleHtml(
        welcomeParagraphs(firstName).map((p) => `<p>${p}</p>`).join(''),
        { fadeVar: 'var(--color-navy)' }
      );

      const modules = [
        { key: 'training', href: 'training.html', enabled: profile.training_enabled },
        { key: 'nutrition', href: 'nutrition.html', enabled: profile.nutrition_enabled },
        { key: 'coaching', href: 'coaching.html', enabled: profile.coaching_enabled },
      ];

      container.innerHTML = `
        <div id="next-step-slot"></div>
        <div class="welcome-card">
          <div class="welcome-card-header">
            <img class="welcome-card-photo" src="icons/nicholas-portrait.jpg" alt="Nicholas Chilala" />
            <div class="welcome-card-header-text">
              <h2 style="margin-bottom:2px;">Willkommen bei Dream And Do It</h2>
              <p class="welcome-card-signature">Nicholas Chilala — Gründer &amp; Head Coach</p>
              <p class="welcome-card-credentials">M.A. Prävention &amp; Gesundheitsmanagement (Schwerpunkt Coaching &amp; Sportpsychologie) · IHK-Coach · zertifizierter Trainer für Management &amp; Sales</p>
            </div>
          </div>
          ${welcomeHtml}
        </div>

        <!-- Runde 19 (Q6): schlanke Profilleiste statt der großen Karten für
             Geburtsdatum und Körpergröße; enthält neu das Geschlecht (Q2). -->
        <div class="profile-strip mt-24" id="profile-strip">
          <div class="profile-strip-row">
            <div class="profile-chips" id="profile-chips"><span class="chip chip-loading">Lade …</span></div>
            <button type="button" class="profile-edit-btn" id="profile-edit-btn" aria-label="Profilangaben bearbeiten" aria-expanded="false" aria-controls="profile-form" title="Bearbeiten">✎</button>
          </div>
          <form id="profile-form" class="profile-form" hidden>
            <div class="profile-form-grid">
              <div class="field">
                <label for="profile-birth">Geburtsdatum</label>
                <input type="date" id="profile-birth" min="1900-01-01" />
              </div>
              <div class="field">
                <label for="profile-height">Körpergröße (cm)</label>
                <input type="number" id="profile-height" min="100" max="230" step="0.1" inputmode="decimal" />
              </div>
            </div>
            <fieldset class="profile-sex" id="profile-sex-set">
              <legend>Geschlecht</legend>
              <div class="profile-sex-options">
                <label class="sex-opt"><input type="radio" name="profile-sex" value="male" /><span>♂ Männlich</span></label>
                <label class="sex-opt"><input type="radio" name="profile-sex" value="female" /><span>♀ Weiblich</span></label>
              </div>
              <p class="profile-sex-why">
                <strong>Warum gibt es nur diese beiden Auswahlmöglichkeiten?</strong>
                Die Vergleichswerte, mit denen wir deine Ergebnisse im Training und bei der Ernährung einordnen,
                stammen aus Studien, die nach biologischem Geschlecht getrennt ausgewertet wurden. Für weitere
                Kategorien gibt es bislang nicht genug wissenschaftliche Daten für belastbare Normwerte. Es tut uns
                aufrichtig leid, wenn dich diese Auswahl nicht vollständig abbildet – das ist eine rein technische
                Einschränkung der Berechnung und keine Aussage über dich. Bitte wähle, was deinem Körper biologisch am
                ehesten entspricht. Die Angabe wird ausschließlich für Vergleichswerte im Training und in der Ernährung
                verwendet und kann jederzeit geändert werden. Danke für dein Verständnis!
              </p>
            </fieldset>
            <div class="profile-form-actions">
              <button class="profile-btn primary" type="submit" id="profile-save-btn">Speichern</button>
              <button class="profile-btn" type="button" id="profile-cancel-btn">Abbrechen</button>
            </div>
            <div class="msg error" id="profile-msg" role="alert" hidden></div>
          </form>
        </div>
        <p class="profile-hint" id="profile-hint">Wird für PAL-Rechner, Körperfett-Verlauf und Präventionscheck verwendet.</p>

        <div class="card mt-24" id="grow-summary-card">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <h3 style="font-size:1rem; margin:0;">Deine Ziele (GROW)</h3>
            <a class="icon-btn" style="text-decoration:none;" href="coaching.html?tab=ziele">Alle Ziele öffnen →</a>
          </div>
          <div id="grow-summary-list" class="mt-16"><p class="center-text" style="font-size:0.85rem;">Lade Ziele …</p></div>
          <div id="reco-slot"></div>
        </div>

        <div class="card mt-24" id="achievements-summary-card">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <h3 style="font-size:1rem; margin:0;">Deine Erfolge</h3>
            <a class="ach-all-link" href="erfolge.html">Alle Erfolge &amp; Rekorde →</a>
          </div>
          <div id="achievements-summary-list" class="mt-16"><p class="center-text" style="font-size:0.85rem;">Lade Erfolge …</p></div>
        </div>

        <div class="card mt-24 access-card" id="access-overview-card" hidden></div>

        <div class="tile-grid mt-24">
          ${[
            ...modules.map((m) => {
              const info = SECTION_INFO[m.key];
              return {
                key: m.key,
                icon: { training: '🏋️', nutrition: '🥗', coaching: '🧠' }[m.key],
                title: info.title,
                href: m.href,
                short: info.clientShort,
                full: info.clientIntro,
                badge: m.enabled ? '' : ' <span class="tile-badge">(auf Anfrage)</span>',
              };
            }),
            { key: 'messages', icon: '💬', title: START_TILE_EXTRAS.messages.title, href: 'messages.html', short: START_TILE_EXTRAS.messages.clientShort, full: START_TILE_EXTRAS.messages.clientIntro },
          ].map(tileHtml).join('')}
        </div>
      `;
      // Hinweis: Die frühere Kachel-Navigation (.section-grid) direkt hier
      // wurde entfernt — sie duplizierte nur die neue Kopfzeilen-Reiterleiste
      // (siehe #nav-tabs-slot / js/nav.js), die jetzt auf jeder Seite verfügbar ist.
      initCollapsibles(container);
      bindTiles(container);
      renderProfileStrip(profile);
      renderGrowSummary(profile);
      renderAchievementsCard(profile);
      renderAccessOverview(profile);
      hydrateSectionInfo(container);
      renderNextStep(profile);
      maybeShowOnboarding(profile);
    }

    // Runde 22: „Dein nächster Schritt“ – genau ein Vorschlag, der zum Stand
    // des Kunden passt (siehe computeNextStep in js/onboarding.js). Schlägt
    // eine Abfrage fehl, bleibt die Karte einfach weg.
    async function renderNextStep(profile) {
      const slot = document.getElementById('next-step-slot');
      if (!slot) return;
      try {
        let basics = await supabaseClient.from('profiles').select('birth_date, height_cm, sex').eq('id', profile.id).maybeSingle();
        if (basics.error && /sex/i.test(basics.error.message || '')) {
          basics = await supabaseClient.from('profiles').select('birth_date, height_cm').eq('id', profile.id).maybeSingle();
        }
        const row = basics.data || {};
        const hasBasics = !!(row.birth_date && row.height_cm != null);
        const { data: goals } = profile.coaching_enabled ? await listMyGoals(profile.id) : { data: [] };
        let trainingLogs = 1;
        if (profile.training_enabled) {
          const r = await supabaseClient.from('training_logs').select('id', { count: 'exact', head: true }).eq('client_id', profile.id);
          if (!r.error && typeof r.count === 'number') trainingLogs = r.count;
        }
        const step = computeNextStep(profile, { hasBasics, goalsCount: (goals || []).length, trainingLogs });
        slot.innerHTML = nextStepHtml(step);
        const act = slot.querySelector('[data-next-action="profile"]');
        if (act) {
          act.addEventListener('click', (e) => {
            e.preventDefault();
            const btn = document.getElementById('profile-edit-btn');
            const strip = document.getElementById('profile-strip');
            if (strip) strip.scrollIntoView({ behavior: 'smooth', block: 'center' });
            if (btn && btn.getAttribute('aria-expanded') !== 'true') btn.click();
          });
        }
      } catch (e) { slot.innerHTML = ''; }
    }

    // Runde 21 / Q12: „Dein Zugang auf einen Blick“ – was steht dem Kunden zur
    // Verfügung, was käme mit den noch nicht freigeschalteten Rubriken dazu.
    async function renderAccessOverview(profile) {
      const card = document.getElementById('access-overview-card');
      if (!card) return;
      try {
        const counts = await loadSectionCounts();
        const ov = platformOverview(counts, profile);
        const names = { training: 'Training', nutrition: 'Ernährung', coaching: 'Coaching' };
        const list = (pack) => pack.items.map((i) => `${i.value.toLocaleString('de-DE')} ${i.label}`).join(' · ');
        let html = `<h3>Dein Zugang auf einen Blick</h3>`;
        if (ov.have.length > 0) {
          html += `<p class="access-line">Dir stehen aktuell <b>${ov.available.features} Funktionen</b> zur Verfügung${ov.available.items.length ? ': ' + list(ov.available) : ''}.</p>`;
        }
        if (ov.missing.length > 0) {
          const missingNames = ov.missing.map((k) => names[k]).join(' und ');
          const ask = `Hallo Nicholas, ich interessiere mich für ${ov.missing.length > 1 ? 'die Bereiche' : 'den Bereich'} ${missingNames}. Wie kann ich ${ov.missing.length > 1 ? 'sie' : 'ihn'} bekommen?`;
          html += `<div class="access-more">Mit <b>${escapeHtml(missingNames)}</b> kämen noch <b>${ov.potential.features - (counts.features ? counts.features.platform : 0)} weitere Funktionen</b> dazu${ov.potential.items.filter((i) => !/Erfolge/.test(i.label)).length ? ': ' + list({ items: ov.potential.items.filter((i) => !/Erfolge/.test(i.label)) }) : ''}. <a href="${escapeHtml(messageLink('Sonstiges', ask))}">Interesse? Jetzt nachfragen →</a></div>`;
        } else {
          html += `<p class="access-line" style="color:var(--color-text-muted);">Du hast Zugriff auf alle Rubriken – nutze sie voll aus.</p>`;
        }
        card.innerHTML = html;
        card.hidden = false;
      } catch (e) { card.hidden = true; }
    }

    // Runde 16: berechnet alle Erfolge aus bereits vorhandenen Daten (nur für
    // freigeschaltete Module – ohne Trainings-/Ernährungszugriff werden diese
    // Daten gar nicht erst abgefragt) und schreibt neu erreichte Erfolge in
    // die Datenbank, damit der "neu freigeschaltet"-Hinweis nur einmal
    // erscheint und Trainer denselben Stand sehen.
    async function renderAchievementsCard(profile) {
      const listEl = document.getElementById('achievements-summary-list');
      if (!listEl) return;

      const trainingEnabled = profile.role === 'admin' || !!profile.training_enabled;
      const nutritionEnabled = profile.role === 'admin' || !!profile.nutrition_enabled;

      const [{ data: existing, error: existingError }, { data: trainingLogs }, { data: preventionResults }, { data: nutritionLogs }] = await Promise.all([
        listAchievements(profile.id),
        trainingEnabled ? listAllTrainingLogsForRecords(profile.id) : Promise.resolve({ data: [] }),
        trainingEnabled ? listPreventionResults(profile.id) : Promise.resolve({ data: [] }),
        nutritionEnabled ? listNutritionLogs(profile.id) : Promise.resolve({ data: [] }),
      ]);
      if (existingError) { listEl.innerHTML = `<div class="msg error">${escapeHtml(existingError.message)}</div>`; return; }

      const logs = trainingLogs || [];
      const { prEvents } = computePersonalRecords(logs);
      const { longestStreak } = computeTrainingStreak(logs.map((l) => l.performed_at));
      const nutritionDaysLogged = new Set((nutritionLogs || []).map((n) => (n.logged_at || '').slice(0, 10)).filter(Boolean)).size;
      const preventionComplete = trainingEnabled ? isPreventionCheckComplete(preventionResults || []) : false;
      const cardioTestDone = (preventionResults || []).some((r) => r.test_key === 'cardio_fitness');

      const evaluated = evaluateAchievements({
        longestStreak, prCount: prEvents.length, nutritionDaysLogged, preventionComplete, cardioTestDone,
      });

      const existingKeys = new Set((existing || []).map((a) => a.achievement_key));
      const newlyEarned = evaluated.filter((a) => a.earned && !a.manual && !existingKeys.has(a.key));
      if (newlyEarned.length > 0) {
        const { error: syncError } = await syncEarnedAchievements(profile.id, newlyEarned);
        if (!syncError) newlyEarned.forEach((a) => existingKeys.add(a.key));
      }

      const earnedCount = ACHIEVEMENT_DEFINITIONS.filter((d) => existingKeys.has(d.key)).length;

      listEl.innerHTML = `
        ${newlyEarned.length > 0 ? `
        <div class="msg success" style="margin-bottom:12px;">
          🎉 Neu freigeschaltet: ${newlyEarned.map((a) => escapeHtml(a.title)).join(', ')}
        </div>` : ''}
        <div class="achievements-grid">
          ${evaluated.map((a) => {
            const earned = existingKeys.has(a.key);
            return `
              <div class="achievement-badge ${earned ? 'earned' : 'locked'}" title="${escapeHtml(a.description)}">
                <div class="achievement-icon">${a.icon}</div>
                <div class="achievement-title">${escapeHtml(a.title)}</div>
                ${!earned && a.progress ? `<div class="achievement-progress">${a.progress.current}/${a.progress.target}</div>` : ''}
              </div>
            `;
          }).join('')}
        </div>
        <p style="font-size:0.78rem; color:var(--color-text-muted); margin:12px 0 0;">${earnedCount} von ${ACHIEVEMENT_DEFINITIONS.length} Erfolgen freigeschaltet.</p>
      `;
    }

    // Nutzer-Feedback Runde 14: kompakte Ziele-Karte direkt auf der Startseite
    // (nach der Begrüßung) statt nur als Unterseite in Coaching – der volle
    // GROW-Editor bleibt weiterhin dort, hier nur eine Kurzübersicht + Link.
    async function renderGrowSummary(profile) {
      const listEl = document.getElementById('grow-summary-list');
      if (!listEl) return;
      const { data: goals, error } = await listMyGoals(profile.id);
      if (error) { listEl.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`; return; }

      const active = (goals || []).filter((g) => g.status === 'active');
      // Runde 21 / Q13: ist ein Ziel aktiv, erscheint die Interessen-Auswahl samt Empfehlungen.
      renderInterestsCard(document.getElementById('reco-slot'), { profile, viewer: profile, adminView: false, hasActiveGoal: active.length > 0 });
      const shown = (active.length > 0 ? active : (goals || [])).slice(0, 3);

      if (shown.length === 0) {
        listEl.innerHTML = `<p style="color:var(--color-text-muted); font-size:0.85rem; margin:0;">Noch keine Ziele hinterlegt – leg dein erstes Ziel im Bereich <a href="coaching.html?tab=ziele">Coaching &amp; Ziele (GROW)</a> an.</p>`;
        return;
      }

      listEl.innerHTML = `<ul style="margin:0; padding-left:18px; font-size:0.88rem;">
        ${shown.map((g) => `<li style="margin-bottom:6px;">
          <strong>${escapeHtml(g.title)}</strong>
          ${g.target_date ? ` <span style="color:var(--color-text-muted); font-size:0.78rem;">– Zieltermin: ${new Date(g.target_date).toLocaleDateString('de-DE')}</span>` : ''}
          ${g.status === 'achieved' ? ' <span class="status-pill-inline" style="color:var(--color-success);">erreicht</span>' : ''}
        </li>`).join('')}
      </ul>`;
    }

    // Runde 19 (Q6/Q2): schlanke Profilleiste statt der beiden großen Karten
    // (Geburtsdatum Runde 14, Körpergröße Runde 18) – Werte weiterhin in
    // profiles.birth_date / height_cm, neu profiles.sex (sql/052). PAL-Rechner
    // und Körperfett-Verlauf (nutrition.html), Präventionscheck (training.html)
    // lesen die Werte von dort. Gleiche Plausibilitätsgrenzen wie zuvor
    // (Größe 100–230 cm, Schritt 0,1).
    const SEX_LABEL = { male: 'Männlich', female: 'Weiblich' };
    const SEX_ICON = { male: '♂', female: '♀' };

    function formatBirthDate(iso) {
      // "YYYY-MM-DD" -> "TT.MM.JJJJ" ohne Zeitzonen-Umweg über Date
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
      return m ? `${m[3]}.${m[2]}.${m[1]}` : '';
    }

    async function renderProfileStrip(profile) {
      const chipsEl = document.getElementById('profile-chips');
      const formEl = document.getElementById('profile-form');
      const editBtn = document.getElementById('profile-edit-btn');
      const msgEl = document.getElementById('profile-msg');
      const hintEl = document.getElementById('profile-hint');
      if (!chipsEl || !formEl || !editBtn) return;

      // Läuft sql/052 (profiles.sex) noch nicht, soll die Leiste mit
      // Geburtsdatum/Größe trotzdem funktionieren statt komplett zu brechen.
      let sexAvailable = true;
      let { data: row, error } = await supabaseClient.from('profiles').select('birth_date, height_cm, sex').eq('id', profile.id).maybeSingle();
      if (error && /sex/i.test(error.message || '')) {
        sexAvailable = false;
        ({ data: row, error } = await supabaseClient.from('profiles').select('birth_date, height_cm').eq('id', profile.id).maybeSingle());
      }
      if (error) {
        chipsEl.innerHTML = `<span class="msg error" style="margin:0;">${escapeHtml(error.message)}</span>`;
        return;
      }

      const state = {
        birthDate: row ? row.birth_date : null,
        heightCm: row ? row.height_cm : null,
        sex: row && sexAvailable ? row.sex : null,
      };

      const birthInput = document.getElementById('profile-birth');
      const heightInput = document.getElementById('profile-height');
      const sexSet = document.getElementById('profile-sex-set');
      birthInput.max = new Date().toISOString().slice(0, 10);
      if (!sexAvailable) sexSet.hidden = true;

      function drawChips() {
        const age = calcAge(state.birthDate);
        const chips = [];
        chips.push(state.birthDate
          ? `<span class="chip">🎂 ${escapeHtml(formatBirthDate(state.birthDate))}${age != null ? ` <small>${age} J.</small>` : ''}</span>`
          : `<button type="button" class="chip missing" data-focus="profile-birth">🎂 Geburtsdatum ergänzen</button>`);
        chips.push(state.heightCm != null
          ? `<span class="chip">📏 ${escapeHtml(String(state.heightCm).replace('.', ','))} cm</span>`
          : `<button type="button" class="chip missing" data-focus="profile-height">📏 Größe ergänzen</button>`);
        if (sexAvailable) {
          chips.push(state.sex && SEX_LABEL[state.sex]
            ? `<span class="chip">${SEX_ICON[state.sex]} ${SEX_LABEL[state.sex]}</span>`
            : `<button type="button" class="chip missing" data-focus="sex">⚥ Geschlecht ergänzen</button>`);
        }
        chipsEl.innerHTML = chips.join('');
        chipsEl.querySelectorAll('[data-focus]').forEach((b) => b.addEventListener('click', () => openForm(b.dataset.focus)));
        const missing = !state.birthDate || state.heightCm == null || (sexAvailable && !state.sex);
        hintEl.textContent = missing
          ? 'Bitte ergänzen – wird für PAL-Rechner, Körperfett-Verlauf und Präventionscheck verwendet.'
          : 'Wird für PAL-Rechner, Körperfett-Verlauf und Präventionscheck verwendet.';
        hintEl.classList.toggle('is-missing', missing);
      }

      function fillForm() {
        birthInput.value = state.birthDate || '';
        heightInput.value = state.heightCm != null ? state.heightCm : '';
        formEl.querySelectorAll('input[name="profile-sex"]').forEach((r) => { r.checked = r.value === state.sex; });
        msgEl.hidden = true;
      }

      function openForm(focusKey) {
        fillForm();
        formEl.hidden = false;
        editBtn.setAttribute('aria-expanded', 'true');
        const target = focusKey === 'sex'
          ? formEl.querySelector('input[name="profile-sex"]')
          : document.getElementById(focusKey || 'profile-birth');
        if (target) target.focus({ preventScroll: false });
      }

      function closeForm() {
        formEl.hidden = true;
        editBtn.setAttribute('aria-expanded', 'false');
      }

      editBtn.addEventListener('click', () => (formEl.hidden ? openForm() : closeForm()));
      document.getElementById('profile-cancel-btn').addEventListener('click', closeForm);

      formEl.addEventListener('submit', async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById('profile-save-btn');
        const showError = (text) => { msgEl.textContent = text; msgEl.hidden = false; };
        msgEl.hidden = true;

        const birthDate = birthInput.value || null;
        const heightRaw = String(heightInput.value || '').replace(',', '.');
        const heightCm = heightRaw ? parseFloat(heightRaw) : null;
        if (birthDate && birthDate > new Date().toISOString().slice(0, 10)) { showError('Das Geburtsdatum darf nicht in der Zukunft liegen.'); return; }
        if (heightCm != null && !(heightCm >= 100 && heightCm <= 230)) { showError('Bitte eine Körpergröße zwischen 100 und 230 cm angeben.'); return; }
        const checked = formEl.querySelector('input[name="profile-sex"]:checked');
        const sex = checked ? checked.value : null;

        const payload = { birth_date: birthDate, height_cm: heightCm };
        if (sexAvailable) payload.sex = sex;

        saveBtn.disabled = true;
        const { error: saveError } = await supabaseClient.from('profiles').update(payload).eq('id', profile.id);
        saveBtn.disabled = false;
        if (saveError) { showError('Speichern fehlgeschlagen: ' + saveError.message); return; }

        state.birthDate = birthDate;
        state.heightCm = heightCm;
        if (sexAvailable) state.sex = sex;
        drawChips();
        closeForm();
      });

      drawChips();
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
  <script type="module" src="js/legal-links.js"></script>
</body>

<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – Dream And Do It</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#053446" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <img src="icons/logo-mark.png" alt="Dream And Do It Logo" onerror="this.style.display='none'" />
        DREAM AND DO IT
      </div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" id="theme-toggle" type="button">Hell/Dunkel</button>
        <button class="icon-btn" id="logout-btn" type="button">Abmelden</button>
      </div>
    </div>
    <div id="nav-tabs-slot"></div>

    <div class="container wide" id="app-container">
      <p class="center-text">Lade dein Profil …</p>
    </div>

    <div class="footer-note">
      Fragen zu deinem Zugang? <a href="mailto:info@dreamanddoit.de">info@dreamanddoit.de</a>
    </div>
  </div>

  <script type="module">
    import { requireAuth, signOut, initTheme, toggleTheme } from './js/auth.js';
    import { getUnreadCount } from './js/messages.js';
    import { getNewSignupCount } from './js/betrieb.js';
    import { navTabsHtml } from './js/nav.js';
    import { SECTION_INFO, welcomeParagraphs } from './js/section-info.js';
    import { collapsibleHtml, initCollapsibles } from './js/collapsible.js';

    initTheme();
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await signOut();
      window.location.href = 'index.html';
    });

    const container = document.getElementById('app-container');

    requireAuth().then((profile) => {
      if (!profile) return; // requireAuth leitet bereits zum Login um

      mountNavTabs(profile);

      if (profile.access_locked) {
        renderLocked();
        return;
      }
      renderDashboard(profile);
    });

    // Etappe 19: eine einzige Kopfzeilen-Reiterleiste statt der bisherigen
    // Einzel-Links ("Nachrichten"/"Zum Dashboard") UND der Kacheln im unteren
    // .section-grid — siehe js/nav.js. Ungelesene Nachrichten sowie neue,
    // noch nicht gesichtete Anmeldungen (nur Admin, siehe
    // sql/023_neue_anmeldungen_badge.sql) werden als Badge auf dem
    // jeweiligen Reiter angezeigt.
    async function mountNavTabs(profile) {
      const slot = document.getElementById('nav-tabs-slot');
      if (!slot) return;
      const [unreadMessages, signupResult] = await Promise.all([
        getUnreadCount(profile.id),
        profile.role === 'admin' ? getNewSignupCount() : Promise.resolve({ count: 0 }),
      ]);
      slot.innerHTML = navTabsHtml(profile, {
        currentPage: 'dashboard',
        unreadMessages,
        newSignups: signupResult.count || 0,
      });
    }

    function renderLocked() {
      container.innerHTML = `
        <div class="card lock-screen">
          <div class="icon">🔒</div>
          <h2>Zugang derzeit gesperrt</h2>
          <p style="color:var(--color-text-muted);">
            Dein Zugang zur Plattform ist momentan eingeschränkt. Das kommt z.B. vor,
            wenn eine Zahlung offen ist. Bitte melde dich bei uns, um das zu klären.
          </p>
          <a class="btn mt-16" style="display:inline-block; width:auto; padding:12px 24px;"
             href="mailto:info@dreamanddoit.de">Kontakt aufnehmen</a>
        </div>
      `;
    }

    function renderDashboard(profile) {
      if (profile.role === 'admin') {
        renderTrainerStart(profile);
      } else {
        renderClientStart(profile);
      }
    }

    // -------------------------------------------------------------------------
    // TRAINER-STARTSEITE (Admin) — "wo befinde ich mich, was liegt wo"
    // -------------------------------------------------------------------------
    function renderTrainerStart(profile) {
      container.innerHTML = `
        <div class="section-hero">
          <span class="kicker">Trainer-Ansicht</span>
          <h2>Kundensoftware von Dream And Do It</h2>
          ${collapsibleHtml(`
            <p class="lead">
              Hallo ${escapeHtml(profile.full_name || '')}, du befindest dich in der Admin-/Coach-Ansicht der
              Kundenplattform. Hier verwaltest du Inhalte und Pläne, siehst die Entwicklung deiner Kunden und
              kommunizierst direkt mit ihnen. Kunden sehen eine eigene, vereinfachte Ansicht mit nur den Bereichen,
              die du für sie freigeschaltet hast — deine eigenen Rechte und Zugriffe bleiben davon unberührt.
            </p>
          `)}
        </div>

        <div class="benefit-grid">
          <div class="benefit-card">
            <h4>Training</h4>
            <p>${SECTION_INFO.training.adminIntro}</p>
          </div>
          <div class="benefit-card">
            <h4>Ernährung</h4>
            <p>${SECTION_INFO.nutrition.adminIntro}</p>
          </div>
          <div class="benefit-card">
            <h4>Coaching</h4>
            <p>${SECTION_INFO.coaching.adminIntro}</p>
          </div>
          <div class="benefit-card">
            <h4>Nachrichten</h4>
            <p>Direkter Austausch mit all deinen Kunden zu ihren Leistungen — immer erreichbar, unabhängig von Reiter-Freigaben.</p>
          </div>
          <div class="benefit-card">
            <h4>Trainer-Dashboard (Betrieb)</h4>
            <p>Kundenübersicht mit Aktivitäts-Frühwarnsystem, Wochenreport-Erstellung, Geräteverwaltung und die
              Reiter-Freigabe je Kunde (Training/Ernährung/Coaching einzeln sperr-/freischaltbar).</p>
          </div>
        </div>
      `;
      // Hinweis: Die frühere Kachel-Navigation (.section-grid) direkt hier
      // wurde entfernt — sie duplizierte nur die neue Kopfzeilen-Reiterleiste
      // (siehe #nav-tabs-slot / js/nav.js), die jetzt auf jeder Seite verfügbar ist.
      initCollapsibles(container);
    }

    // -------------------------------------------------------------------------
    // KUNDEN-STARTSEITE — persönliche Begrüßung + Überblick inkl. Vorteilen
    // -------------------------------------------------------------------------
    function renderClientStart(profile) {
      const firstName = (profile.full_name || '').split(' ')[0];
      const welcomeHtml = collapsibleHtml(
        welcomeParagraphs(firstName).map((p) => `<p>${p}</p>`).join(''),
        { fadeVar: 'var(--color-navy)' }
      );

      const modules = [
        { key: 'training', href: 'training.html', enabled: profile.training_enabled },
        { key: 'nutrition', href: 'nutrition.html', enabled: profile.nutrition_enabled },
        { key: 'coaching', href: 'coaching.html', enabled: profile.coaching_enabled },
      ];

      container.innerHTML = `
        <div class="welcome-card">
          <div class="welcome-card-header">
            <img class="welcome-card-photo" src="icons/nicholas-portrait.jpg" alt="Nicholas Chilala" />
            <div class="welcome-card-header-text">
              <h2 style="margin-bottom:2px;">Willkommen bei Dream And Do It</h2>
              <p class="welcome-card-signature">Nicholas Chilala — Gründer &amp; Head Coach</p>
              <p class="welcome-card-credentials">M.A. Prävention &amp; Gesundheitsmanagement (Schwerpunkt Coaching &amp; Sportpsychologie) · IHK-Coach · zertifizierter Trainer für Management &amp; Sales</p>
            </div>
          </div>
          ${welcomeHtml}
        </div>

        <div class="benefit-grid">
          ${modules.map((m) => {
            const info = SECTION_INFO[m.key];
            return `
              <div class="benefit-card">
                <h4>${escapeHtml(info.title)} ${m.enabled ? '' : '<span style="font-size:0.68rem; color:var(--color-danger); font-weight:400;">(auf Anfrage)</span>'}</h4>
                <p>${info.clientIntro}</p>
              </div>
            `;
          }).join('')}
          <div class="benefit-card">
            <h4>Nachrichten</h4>
            <p>Direkter Austausch mit mir zu deinen Leistungen — dieser Bereich ist für dich immer zugänglich, egal welche anderen Bereiche freigeschaltet sind.</p>
          </div>
        </div>
      `;
      // Hinweis: Die frühere Kachel-Navigation (.section-grid) direkt hier
      // wurde entfernt — sie duplizierte nur die neue Kopfzeilen-Reiterleiste
      // (siehe #nav-tabs-slot / js/nav.js), die jetzt auf jeder Seite verfügbar ist.
      initCollapsibles(container);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="base-uri 'self'; object-src 'none'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training – Dream And Do It</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#053446" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script type="module" src="js/icons.js"></script>
  <script src="vendor/supabase-js-2.117.2.min.js"></script>
  <!-- Runde 15: für den On-Demand-Monatsbericht (js/monthly-report.js) — analog
       zum bestehenden Wochenreport in betrieb.html, per CDN wie überall sonst
       in dieser Plattform, kein zusätzlicher Build-Schritt nötig. -->
  <script src="vendor/jspdf-2.5.1.umd.min.js"></script>
  <style>
    :root { --chart-teal: #1479a3; }
    .plan-card { margin-bottom: 20px; }
    .day-block { margin-bottom: 18px; }
    .day-block h3 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-gold); margin: 0 0 8px; }
    .exercise-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--color-border); flex-wrap: wrap; }
    .exercise-row:last-child { border-bottom: none; }
    .exercise-row img.thumb, .thumb-img {
      width: 88px; height: 88px; object-fit: contain; background: var(--color-bg);
      border: 1px solid var(--color-border); border-radius: 8px; flex-shrink: 0; cursor: zoom-in;
    }
    .thumb-sm { width: 40px; height: 40px; object-fit: contain; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 6px; flex-shrink: 0; cursor: zoom-in; }
    /* Runde 18 (Nachtrag): sichtbarer Platzhalter statt komplett unsichtbarem
       Bild, wenn eine hinterlegte image_url nicht lädt (siehe onExerciseImgError) –
       zeigt so sofort ein Deployment-Problem an, statt es zu verstecken. */
    .img-missing {
      display: flex; align-items: center; justify-content: center; text-align: center;
      background: var(--color-bg); border: 1px dashed var(--color-border); border-radius: 8px;
      color: var(--color-text-muted); font-size: 0.62rem; line-height: 1.3; cursor: help;
    }
    .thumb.img-missing { width: 88px; height: 88px; flex-shrink: 0; }
    .thumb-sm.img-missing { width: 40px; height: 40px; flex-shrink: 0; }

    /* Runde 19: Trainingszeile (Variante C) – ultradünne Zeile je Übung */
    .xrow { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 5px 7px; margin-bottom: 6px; box-shadow: var(--shadow); }
    .xrow-main { display: flex; align-items: center; gap: 6px; min-height: 46px; }
    .xrow.x3 .xrow-main { flex-wrap: wrap; }
    .xrow .thumb-sm, .xrow .xthumb-ph { width: 32px; height: 32px; }
    .xrow .thumb-sm.img-missing { width: 34px; height: 34px; font-size: 0.5rem; }
    .xthumb-ph { display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; color: var(--color-navy); background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 6px; flex-shrink: 0; cursor: default; }
    .xrow-name { flex: 1; min-width: 0; }
    .xrow.x3 .xrow-name { flex-basis: 40%; }
    .xrow-toggle { display: block; max-width: 100%; text-align: left; background: none; border: none; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; }
    .xrow-title { padding: 3px 0 1px; width: 100%; }
    .xrow-title b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 0.8rem; line-height: 1.15; overflow: hidden; overflow-wrap: anywhere; }
    .xrow-sub { display: flex; align-items: center; gap: 4px; min-width: 0; }
    .xrow-subtext { flex: 0 1 auto; min-width: 0; font-size: 0.64rem; color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .xrow-subtext u { text-decoration: none; color: var(--color-gold); font-weight: 700; }
    .xrow.open { border-color: var(--color-gold); }
    .xrow-info-btn { background: none; border: 1px solid var(--color-border); border-radius: 50%; width: 22px; height: 22px; padding: 0; font-size: 0.78rem; line-height: 1; color: var(--color-gold); cursor: pointer; flex-shrink: 0; }
    .xrow-steppers { display: flex; gap: 5px; flex-shrink: 0; }
    .xrow.x3 .xrow-steppers { flex-basis: 100%; justify-content: flex-end; }
    .stp { display: flex; align-items: stretch; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-bg); overflow: hidden; height: 42px; }
    .stp .stp-val { width: 36px; min-width: 0; border: none; background: transparent; text-align: center; font: inherit; font-size: 0.95rem; font-weight: 700; color: var(--color-text); padding: 0 2px; border-radius: 0; box-shadow: none; }
    .stp .stp-val:focus { outline: 2px solid var(--color-gold); outline-offset: -2px; }
    .stp[data-kind=sec] .stp-val, .stp[data-kind=m] .stp-val { width: 48px; }
    .stp .stp-unit { align-self: center; font-size: 0.6rem; color: var(--color-text-muted); margin-left: -3px; margin-right: 2px; }
    .stp .stp-unit-toggle { cursor: pointer; background: transparent; border: 1px solid var(--color-border); border-radius: 6px; padding: 1px 5px; font: inherit; font-size: 0.62rem; font-weight: 700; color: var(--color-gold); margin-left: 0; }
    .stp .stp-unit-toggle:hover { border-color: var(--color-gold); }
    .dur-field { display: flex; gap: 4px; align-items: stretch; flex: 1; min-width: 150px; }
    .dur-field input, .cardio-fields .dur-field input { flex: 1; min-width: 0; }
    .dur-field select { flex: 0 0 auto; width: auto; }
    .stp .stp-ar { display: flex; flex-direction: column; border-left: 1px solid var(--color-border); }
    .stp .stp-ar button { flex: 1; width: 28px; min-height: 20px; border: none; background: transparent; color: var(--color-navy); font-size: 0.62rem; line-height: 1; padding: 0; cursor: pointer; }
    .stp .stp-ar button + button { border-top: 1px solid var(--color-border); }
    .stp .stp-ar button:active { background: var(--color-gold-soft, rgba(250,194,51,0.35)); }
    .stp .stp-ar button:disabled { opacity: 0.35; }
    .xrow .ok { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-navy); font-size: 1.1rem; font-weight: 700; cursor: pointer; flex-shrink: 0; padding: 0; }
    .xrow .ok:active { background: var(--color-gold); }
    .xrow .ok.done { background: var(--color-success); border-color: var(--color-success); color: #fff; }
    .xrow-sets { padding: 6px 0 2px 8px; }
    .xrow .setrow { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
    .xrow .setrow .sn { width: 44px; font-size: 0.7rem; color: var(--color-text-muted); flex-shrink: 0; }
    .xrow .setrow.done { opacity: 0.65; }
    .xrow .setrow.invalid .stp { border-color: var(--color-danger); }
    .xrow .setrow .stp { height: 38px; }
    .xrow .setrow .ok { width: 36px; height: 36px; }
    .xrow .pr-flag { font-size: 0.9rem; }
    .xrow .add-set { margin-top: 8px; background: none; border: 1px dashed var(--color-border); border-radius: 8px; color: var(--color-gold); font: inherit; font-size: 0.74rem; padding: 6px 10px; cursor: pointer; }
    .xrow-info { padding: 6px 2px 2px; font-size: 0.82rem; }
    .xrow-info p { margin: 4px 0; }
    .xrow-target { color: var(--color-text-muted); }
    .xrow-note { color: var(--color-gold); }
    .xrow-hint { font-size: 0.68rem; color: var(--color-text-muted); margin: 4px 2px 0; }
    .xrow-nosession { font-size: 0.7rem; color: var(--color-gold); margin: 4px 2px 0; }
    .rest-toggle { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--color-text-muted); margin: 0 0 10px; }
    #rest-timer { position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; z-index: 900; display: flex; align-items: center; gap: 10px; background: var(--color-navy); color: #fff; padding: 8px 12px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); font-size: 0.8rem; }
    #rest-timer[hidden] { display: none; }
    #rest-timer .rt-time { font-size: 1.1rem; min-width: 42px; text-align: center; }
    #rest-timer button { white-space: nowrap; background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 999px; padding: 6px 10px; font-size: 0.72rem; cursor: pointer; }
    #rest-timer.rt-over { background: var(--color-success); }
    @media (max-width: 480px) { .plan-card { padding: 14px 10px; } .xrow { padding: 4px 5px; } .xrow-main { gap: 4px; } .xrow-steppers { gap: 4px; } .xrow .ok { width: 36px; } .stp .stp-ar button { width: 24px; } .stp .stp-val { width: 32px; font-size: 0.9rem; } .stp[data-kind=sec] .stp-val, .stp[data-kind=m] .stp-val { width: 46px; } .xrow .setrow .sn { width: 38px; } }
    .exercise-meta { flex: 1; min-width: 220px; }
    .exercise-meta h4 { margin: 0 0 2px 0; font-family: var(--font-body); font-weight: 600; font-size: 0.98rem; }
    /* Nutzer-Feedback Runde 18: "Sätze, Wiederholungen und Gewichte stehen
       nicht sauber genug da" – deutlich größer/fetter statt der bisherigen
       kleinen, grauen Zeile, damit die Trainingsvorgabe auf einen Blick
       erfassbar ist. */
    .exercise-meta .target { font-size: 1.02rem; font-weight: 700; color: var(--color-text); letter-spacing: 0.01em; }
    .exercise-meta .muscle { font-size: 0.76rem; color: var(--color-text-muted); font-style: italic; }
    /* Runde 18: Übungsbeschreibung ist jetzt immer eingeklappt (siehe
       <details> in renderExerciseRow) und wird erst beim Aufklappen
       gerendert/sichtbar – dadurch werden die Zeilen je Übung deutlich
       schmaler, wie gewünscht. */
    .exercise-desc-details { margin-top: 4px; }
    .exercise-desc-details summary { cursor: pointer; font-size: 0.82rem; color: var(--color-gold); font-weight: 600; list-style: none; user-select: none; }
    .exercise-desc-details summary::-webkit-details-marker { display: none; }
    .exercise-desc-details summary::before { content: '▸ '; }
    .exercise-desc-details[open] summary::before { content: '▾ '; }
    .exercise-desc-details p { margin: 6px 0 0; font-size: 0.85rem; color: var(--color-text-muted); }
    .log-form { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    .log-form input { width: 78px; padding: 7px 8px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); }
    /* Runde 18: Eingabefelder sind mit den Trainer-Vorgaben vorausgefüllt
       (siehe renderExerciseRow) – die nativen Zahlenfeld-Pfeile bleiben
       bewusst sichtbar, damit sich der Wert per Klick/Pfeiltasten anpassen
       lässt, ohne dass getippt werden muss. */
    .log-form input.prefilled { border-color: var(--color-gold); background: color-mix(in srgb, var(--color-gold) 8%, var(--color-bg)); }
    .log-form button { padding: 7px 12px; font-size: 0.8rem; }
    table.log-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    table.log-table th, table.log-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--color-border); }
    .exercise-builder-row { display: grid; grid-template-columns: 44px 1.7fr 0.7fr 0.9fr 1fr 0.9fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
    .exercise-builder-row select, .exercise-builder-row input { padding: 8px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); width: 100%; }
    /* Neuer, umfangreicherer Übungs-Baustein (Etappe 31 Builder-Überarbeitung):
       eigene Klasse, damit die einfache Ein-Zeilen-Form (.exercise-builder-row,
       "Übung zu bestehendem Plan hinzufügen") unverändert bleibt. */
    .ex-builder-row { border: 1px solid var(--color-border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: var(--color-surface); }
    .ex-builder-row select, .ex-builder-row input { padding: 7px 8px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); font-size: 0.85rem; }
    .ex-builder-row-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .ex-builder-row-top .row-filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .ex-builder-row-top .row-filters select { min-width: 130px; }
    .ex-builder-row-top .row-exercise { flex: 1; min-width: 200px; }
    .ex-builder-row-top .row-remove-btn { margin-left: auto; }
    .set-mode-toggle { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--color-text-muted); margin: 4px 0 8px; }
    .set-mode-toggle input { width: auto; padding: 0; }
    .same-for-all-fields { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .same-for-all-fields input { flex: 1; min-width: 100px; }
    .set-rows-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .set-row-item { display: flex; gap: 6px; align-items: center; }
    .set-row-item .set-index { font-size: 0.76rem; color: var(--color-text-muted); width: 50px; flex-shrink: 0; }
    .set-row-item input { flex: 1; }
    .cardio-fields { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .cardio-fields input { flex: 1; min-width: 150px; }
    .ex-builder-row .row-notes { width: 100%; }
    .small-btn { padding: 6px 10px; font-size: 0.78rem; width: auto; }
    .status-pill { font-size: 0.72rem; padding: 2px 8px; border-radius: 12px; white-space: nowrap; }
    .status-pill.active { background: rgba(47,111,79,0.15); color: var(--color-success); }
    .status-pill.inactive { background: rgba(0,0,0,0.08); color: var(--color-text-muted); }
    .status-pill.ok { background: rgba(47,111,79,0.15); color: var(--color-success); }
    .status-pill.over { background: rgba(180,120,0,0.15); color: var(--color-gold); }
    .status-pill.under { background: rgba(180,40,40,0.12); color: #b42828; }
    .offline-banner { background: rgba(200,124,0,0.15); color: var(--color-gold); padding: 8px 14px; border-radius: 8px; font-size: 0.82rem; margin-bottom: 14px; display:none; }
    .day-builder { border: 1px solid var(--color-border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    .day-builder-header { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .day-builder-header input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); }
    .template-card { border: 1px solid var(--color-border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    .template-card h3 { margin: 0 0 4px; font-size: 1.02rem; }
    .template-exercise-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 20px; padding: 2px 10px 2px 2px; margin: 3px 4px 3px 0; font-size: 0.78rem; }
    .template-exercise-chip img { width: 22px; height: 22px; object-fit: contain; border-radius: 50%; background: var(--color-surface); }

    .lightbox-overlay { position: fixed; inset: 0; background: rgba(5,10,12,0.88); display: none; align-items: center; justify-content: center; z-index: 1000; cursor: zoom-out; padding: 28px; }
    .lightbox-overlay.open { display: flex; }
    .lightbox-overlay img { max-width: 92vw; max-height: 88vh; object-fit: contain; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .lightbox-close { position: absolute; top: 18px; right: 22px; color: #fff; font-size: 1.6rem; cursor: pointer; line-height: 1; }

    .session-banner { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: rgba(200,124,0,0.08); border: 1px solid rgba(200,124,0,0.3); border-radius: 10px; padding: 12px 16px; margin-bottom: 18px; flex-wrap: wrap; }
    .session-banner.active { background: rgba(47,111,79,0.1); border-color: rgba(47,111,79,0.35); }
    .session-banner select { padding: 7px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); }

    .stat-tiles { display: flex; gap: 12px; flex-wrap: wrap; margin: 4px 0 20px; }
    .stat-tile { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 10px 16px; min-width: 140px; }
    .stat-tile .value { font-size: 1.25rem; font-weight: 700; color: var(--color-navy); }
    :root[data-theme="dark"] .stat-tile .value { color: var(--color-gold-light); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stat-tile .value { color: var(--color-gold-light); } }
    .stat-tile .label { font-size: 0.74rem; color: var(--color-text-muted); }

    .analytics-filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 8px; }
    .analytics-filters .field { margin-bottom: 0; min-width: 160px; }
    .filter-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .filter-presets button { padding: 5px 12px; font-size: 0.76rem; border-radius: 20px; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-muted); cursor: pointer; }
    .filter-presets button.active { background: var(--color-gold); color: #1a1a1a; border-color: var(--color-gold); }

    .chart-tooltip { position: absolute; background: var(--color-navy); color: #fff; font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; pointer-events: none; opacity: 0; transition: opacity 0.1s; white-space: nowrap; transform: translate(-50%, -130%); }

    .dysbalance-legend { display: flex; gap: 18px; font-size: 0.8rem; margin-bottom: 14px; color: var(--color-text-muted); }
    .dysbalance-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dysbalance-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .dysbalance-pair { margin-bottom: 18px; }
    .dysbalance-pair .pair-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .dysbalance-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .dysbalance-bar-row .side-label { width: 130px; font-size: 0.78rem; color: var(--color-text-muted); flex-shrink: 0; }
    .dysbalance-bar-track { flex: 1; background: var(--color-border); border-radius: 5px; height: 16px; overflow: hidden; }
    .dysbalance-bar-fill { height: 100%; border-radius: 5px 0 0 5px; }
    .dysbalance-bar-value { width: 90px; text-align: right; font-size: 0.78rem; flex-shrink: 0; }
    .dysbalance-verdict { font-size: 0.8rem; margin-top: 2px; }
    .dysbalance-verdict.ok { color: var(--color-success); }
    .dysbalance-verdict.warn { color: var(--color-gold); }
    .dysbalance-verdict.alert { color: var(--color-danger); }
    .hidden { display: none; }
    .result-box {
      background: rgba(200,124,0,0.08); border: 1px solid rgba(200,124,0,0.25);
      border-radius: 10px; padding: 16px;
    }
    .result-box .big { font-family: var(--font-heading); font-size: 1.5rem; color: var(--color-navy); }
    :root[data-theme="dark"] .result-box .big { color: var(--color-gold-light); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .result-box .big { color: var(--color-gold-light); } }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 520px) { .grid-2 { grid-template-columns: 1fr; } }
    .qn-details summary {
      cursor: pointer; font-family: var(--font-heading); font-size: 0.8rem;
      color: var(--color-gold); font-weight: 600; letter-spacing: 0.02em;
    }
    .qn-details summary:hover { text-decoration: underline; }
    .qn-details[open] summary { margin-bottom: 4px; }

    /* Nutzer-Feedback Runde 14: Trainingstagebuch zeigt nur noch ganze
       Trainingseinheiten (anklickbar/aufklappbar) statt einer flachen Liste
       aller Einzelsätze. */
    .diary-session { border: 1px solid var(--color-border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
    .diary-session summary { cursor: pointer; padding: 12px 14px; list-style: none; }
    .diary-session summary::-webkit-details-marker { display: none; }
    .diary-session summary::before { content: '▸ '; color: var(--color-gold); }
    .diary-session[open] summary::before { content: '▾ '; }
    .diary-session-summary { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .diary-session-body { padding: 0 14px 14px; border-top: 1px solid var(--color-border); }
    .diary-exercise { margin-top: 12px; }
    .diary-exercise-name { font-weight: 600; font-size: 0.88rem; margin-bottom: 4px; }

    /* Nutzer-Feedback Runde 14: Schnell-Logging per Button. */
    .quick-log-btn { margin-left: 8px; }

    /* Nutzer-Feedback Runde 14: Verlaufsgrafen ("Meine Entwicklung") je
       Gelenk/Muskelgruppe sowie Gesamt-Trends für Beweglichkeit/Kraftausdauer. */
    .trend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 10px; }
    .trend-card { border: 1px solid var(--color-border); border-radius: 10px; padding: 12px 14px; }
    .trend-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <img class="brand-mark" src="icons/logo-mark-badge.png" alt="Dream And Do It Logo" onerror="this.style.display='none'" />
        <span class="brand-text">
          <span class="brand-name">DREAM AND DO IT</span>

    function escapeHtml(str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // Dauer-Eingaben: Sekunden oder Minuten wählbar (gespeichert wird immer in Sekunden).
    function durToSeconds(val, unit) {
      const n = parseFloat(String(val == null ? '' : val).replace(',', '.'));
      if (!Number.isFinite(n) || n < 0) return null;
      return Math.round(n * (unit === 'min' ? 60 : 1));
    }
    function durDisplay(sec) {
      const n = Number(sec);
      if (!Number.isFinite(n) || n <= 0) return { value: '', unit: 's' };
      return n >= 120 && n % 60 === 0 ? { value: String(n / 60), unit: 'min' } : { value: String(n), unit: 's' };
    }
    function durFieldHtml(inputHtml, unit = 's') {
      return `<span class="dur-field">${inputHtml}<select class="dur-unit" data-prev="${unit}" aria-label="Einheit der Dauer"><option value="s" ${unit === 's' ? 'selected' : ''}>Sek.</option><option value="min" ${unit === 'min' ? 'selected' : ''}>Min.</option></select></span>`;
    }
    function durSecondsOf(inputEl) {
      if (!inputEl || inputEl.value === '') return null;
      const sel = inputEl.parentElement && inputEl.parentElement.querySelector('.dur-unit');
      return durToSeconds(inputEl.value, sel ? sel.value : 's');
    }
    function setDurField(inputEl, sec) {
      const d = durDisplay(sec);
      inputEl.value = d.value;
      const sel = inputEl.parentElement && inputEl.parentElement.querySelector('.dur-unit');
      if (sel) { sel.value = d.unit; sel.dataset.prev = d.unit; }
    }
    // Wechselt der Trainer die Einheit, wird die angezeigte Zahl umgerechnet (2 Min. <-> 120 Sek.).
    document.addEventListener('change', (e) => {
      const sel = e.target.closest && e.target.closest('select.dur-unit');
      if (!sel) return;
      const inp = sel.parentElement.querySelector('input');
      const prev = sel.dataset.prev || 's';
      if (inp && inp.value !== '' && prev !== sel.value) {
        const n = parseFloat(String(inp.value).replace(',', '.'));
        if (Number.isFinite(n)) inp.value = String(Math.round((sel.value === 'min' ? n / 60 : n * 60) * 100) / 100);
      }
      sel.dataset.prev = sel.value;
    });

    function formatDuration(sec) {

      const s = sec % 60;
      return m > 0 ? `${m} Min. ${s ? s + ' Sek.' : ''}`.trim() : `${s} Sek.`;

    // =========================================================================

    // Baut aus mehreren Einzeltests einen Gesamt-Trend: bei jedem neuen
    // Testergebnis wird ein Schnappschuss aus dem jeweils aktuellsten
    // bekannten Wert JEDES Tests der Gruppe gebildet (carry-forward), damit
    // der Gesamtverlauf auch dann sinnvoll ist, wenn nicht alle Tests am
    // selben Tag erhoben wurden.
    function buildCompositeTrend(results, testKeys, toScore) {
      const relevant = (results || [])
        .filter((r) => testKeys.includes(r.side ? `${r.test_key}:${r.side}` : r.test_key))
        .slice()
        .sort((a, b) => (a.measured_at < b.measured_at ? -1 : a.measured_at > b.measured_at ? 1 : 0));

      const current = {};
      const points = [];
      for (const r of relevant) {
        const key = r.side ? `${r.test_key}:${r.side}` : r.test_key;
        const score = toScore(key, r.value);
        if (score == null) continue;
        current[key] = score;
        const values = Object.values(current);
        const avg = values.reduce((a, b) => a + b, 0) / values.length;
        points.push({ date: r.measured_at, value: avg });
      }
      return points;
    }

    // Einfache SVG-Trendlinie – bewusst ohne Tooltip-JS-Wiring (nutzt natives
    // <title> je Punkt), da hier ggf. viele kleine Charts gleichzeitig
    // gerendert werden und dafür kein Live-Update nötig ist wie beim
    // Übungsverlauf in der Analyse oben.
    function renderTrendChartHtml(points, { unit = '', minY = null, maxY = null, height = 90, formatValue = null } = {}) {
      if (!points || points.length < 2) {
        return `<p style="color:var(--color-text-muted); font-size:0.78rem; margin:4px 0 0;">Noch nicht genug Datenpunkte für einen Verlauf (mind. 2 nötig).</p>`;
      }
      const width = 300, padding = 10;
      const values = points.map((p) => p.value);
      const minV = minY != null ? minY : Math.min(...values);
      const maxV = maxY != null ? maxY : Math.max(...values);
      const range = (maxV - minV) || 1;
      const coords = points.map((p, i) => ({
        x: padding + (i / (points.length - 1 || 1)) * (width - padding * 2),
        y: height - padding - ((p.value - minV) / range) * (height - padding * 2),
        date: p.date, value: p.value,
      }));
      const pathD = coords.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
      const first = points[0], last = points[points.length - 1];
      const trendLabel = last.value > first.value ? '↑ verbessert' : last.value < first.value ? '↓ verschlechtert' : '→ unverändert';
      const trendCls = last.value > first.value ? 'ok' : last.value < first.value ? 'under' : 'over';
      const fmt = (v) => (formatValue ? formatValue(v) : v.toFixed(1) + unit);
      return `
        <svg viewBox="0 0 ${width} ${height}" style="width:100%; max-width:300px; height:auto; overflow:visible;">
          <line x1="${padding}" y1="${height - padding}" x2="${width - padding}" y2="${height - padding}" stroke="var(--color-border)" stroke-width="1" />
          <path d="${pathD}" fill="none" stroke="var(--color-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          ${coords.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--color-gold)"><title>${escapeHtml(formatDateOnly(p.date))}: ${escapeHtml(fmt(p.value))}</title></circle>`).join('')}
        </svg>
        <div style="font-size:0.72rem; color:var(--color-text-muted); margin-top:2px;">
          ${escapeHtml(formatDateOnly(first.date))} – ${escapeHtml(formatDateOnly(last.date))}
          <span class="status-pill ${trendCls}" style="margin-left:6px;">${trendLabel}</span>
        </div>
      `;
    }

    async function renderTrendsSection(el, clientId) {
      el.innerHTML = '<p class="center-text">Lade Verlaufsdaten …</p>';

      const [{ data: profileRow }, { data: bodyMeasurements }, { data: allResults, error }] = await Promise.all([
        supabaseClient.from('profiles').select('birth_date').eq('id', clientId).maybeSingle(),
        listMyBodyMeasurements(clientId),
        listPreventionResults(clientId),
      ]);
      if (error) { el.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`; return; }

      const birthDate = profileRow ? profileRow.birth_date : null;
      const ageYears = calcAge(birthDate);
      const latestBodyMeasurement = (bodyMeasurements || [])[(bodyMeasurements || []).length - 1] || null;
      const sex = latestBodyMeasurement ? latestBodyMeasurement.sex : null;
      const results = allResults || [];

      const mobilityScoreOf = (value) => ({ '-1': 40, '0': 70, '1': 100 }[String(Math.sign(value))] ?? 70);
      const strengthScoreOf = (testKey, value) => {
        if (ageYears == null) return null;
        const evalRes = evaluateStrengthBenchmark(testKey, ageYears, value, sex);
        if (!evalRes.bandFound || !evalRes.key) return null;
        return { top: 100, mid: 80, low: 60, below: 35 }[evalRes.key] ?? null;
      };

      const mobilityKeys = [];
      MOBILITY_TESTS.forEach((t) => {
        if (t.hasSide) { mobilityKeys.push(`${t.key}:left`, `${t.key}:right`); } else { mobilityKeys.push(t.key); }
      });
      const strengthKeys = STRENGTH_TESTS.map((t) => t.key);

      const mobilityComposite = buildCompositeTrend(results, mobilityKeys, (key, value) => mobilityScoreOf(value));
      const strengthComposite = buildCompositeTrend(results, strengthKeys, (key, value) => strengthScoreOf(key, value));

      function perTestPoints(testKey, side) {
        return results
          .filter((r) => r.test_key === testKey && (side ? r.side === side : true))
          .map((r) => ({ date: r.measured_at, value: r.value }));
      }

      const mobilityChartsArr = [];
      MOBILITY_TESTS.forEach((t) => {
        const sides = t.hasSide ? ['left', 'right'] : [null];
        sides.forEach((side) => {
          const pts = perTestPoints(t.key, side);
          if (pts.length === 0) return;
          mobilityChartsArr.push(`<div class="trend-card">
            <div class="trend-title">${escapeHtml(t.label)}${side ? ` (${SIDE_LABEL[side]})` : ''}</div>
            ${renderTrendChartHtml(pts, { minY: -1, maxY: 1, formatValue: (v) => mobilityRatingLabel(v).text })}
          </div>`);
        });
      });

      const strengthChartsArr = [];
      STRENGTH_TESTS.forEach((t) => {
        const pts = perTestPoints(t.key, null);
        if (pts.length === 0) return;
        strengthChartsArr.push(`<div class="trend-card">
          <div class="trend-title">${escapeHtml(t.label)}</div>
          ${renderTrendChartHtml(pts, { unit: t.key === 'plank' ? ' Sek.' : ' Wdh.' })}
        </div>`);
      });

      el.innerHTML = `
        <div class="trend-group">
          <h3 style="font-size:0.95rem; margin-bottom:2px;">Beweglichkeit insgesamt</h3>
          ${mobilityComposite.length >= 2
            ? renderTrendChartHtml(mobilityComposite, { minY: 0, maxY: 100, unit: ' Pkt.' })
            : '<p style="color:var(--color-text-muted); font-size:0.82rem;">Noch zu wenige Beweglichkeitstests für einen Gesamtverlauf (mind. 2 Zeitpunkte nötig).</p>'}
        </div>
        <div class="trend-group mt-16">
          <h3 style="font-size:0.95rem; margin-bottom:2px;">Kraftausdauer insgesamt</h3>
          ${strengthComposite.length >= 2
            ? renderTrendChartHtml(strengthComposite, { minY: 0, maxY: 100, unit: ' Pkt.' })
            : ageYears == null
              ? '<p style="color:var(--color-text-muted); font-size:0.82rem;">Kein Geburtsdatum hinterlegt – der Kraftausdauer-Verlauf kann ohne Alter nicht ausgewertet werden.</p>'
              : '<p style="color:var(--color-text-muted); font-size:0.82rem;">Noch zu wenige Kraftausdauertests für einen Gesamtverlauf (mind. 2 Zeitpunkte nötig).</p>'}
        </div>
        ${mobilityChartsArr.length > 0 ? `<h3 class="mt-24" style="font-size:0.95rem;">Beweglichkeit je Gelenk</h3><div class="trend-grid">${mobilityChartsArr.join('')}</div>` : ''}
        ${strengthChartsArr.length > 0 ? `<h3 class="mt-24" style="font-size:0.95rem;">Kraftausdauer je Übung</h3><div class="trend-grid">${strengthChartsArr.join('')}</div>` : ''}
        ${mobilityChartsArr.length === 0 && strengthChartsArr.length === 0 ? '<p style="color:var(--color-text-muted); font-size:0.85rem;">Noch keine Testdaten – trage im Reiter „Tests" deine ersten Beweglichkeits- und Kraftausdauertests ein, um hier Verläufe zu sehen.</p>' : ''}
      `;
    }

    // =========================================================================
    // MONATSBERICHT (Runde 15) — On-Demand-PDF-Export: Training, Ernährung
    // und Präventions-Score eines Monats, im bestehenden CI (Navy/Gold, Logo)
    // als eigenständiges, hochwertiges Berichtsformat (js/monthly-report.js).
    // Bewusst KEIN automatischer E-Mail-Versand (siehe Rückfrage-Antwort) —
    // der Kunde bzw. Trainer zieht den Bericht bei Bedarf für einen frei
    // wählbaren Monat. Für Kunden als eigener Tab, für Trainer zusätzlich in
    // der Kundenanalyse (siehe renderClientAnalysisTab) für einen gewählten
    // Kunden nutzbar — daher als eigenständige, wiederverwendbare Funktion.
    // =========================================================================

    function renderMonatsberichtTab(content, profile) {
      renderMonatsberichtCard(content, profile.id, profile.full_name || profile.email, { isAdminView: false });
    }

    function renderMonatsberichtCard(container, clientId, clientLabel, { isAdminView } = {}) {
      const now = new Date();
      const defaultMonthValue = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

      container.innerHTML = `
        <div class="card">
          <h2 style="font-size:1.05rem;">Monatsbericht${isAdminView ? ` – ${escapeHtml(clientLabel)}` : ''}</h2>
          <p style="color:var(--color-text-muted); font-size:0.88rem;">
            Ein hochwertiger PDF-Bericht${isAdminView ? ` für ${escapeHtml(clientLabel)}` : ''} mit Training, Ernährung und
            Präventions-Score des gewählten Monats – zum Ausdrucken oder Archivieren. Der Bericht wird direkt hier im
            Browser erzeugt; es gibt keinen automatischen Versand, du lädst ihn bei Bedarf selbst herunter.
          </p>
          <div class="grid-2 mt-16" style="align-items:flex-end;">
            <div class="field"><label>Monat</label><input type="month" id="mb-month" value="${defaultMonthValue}" max="${defaultMonthValue}" /></div>
            <button class="btn small-btn" id="mb-download-btn" type="button">PDF herunterladen</button>
          </div>
          <div id="mb-status" class="mt-16"></div>
        </div>
      `;

      const statusEl = document.getElementById('mb-status');
      const btn = document.getElementById('mb-download-btn');
      btn.addEventListener('click', async () => {
        const monthValue = document.getElementById('mb-month').value;
        if (!monthValue) { statusEl.innerHTML = `<div class="msg error">Bitte einen Monat auswählen.</div>`; return; }
        btn.disabled = true;
        statusEl.innerHTML = `<p style="font-size:0.85rem; color:var(--color-text-muted);">Erstelle Bericht …</p>`;
        try {
          await generateMonthlyReport(clientId, clientLabel, monthValue);
          statusEl.innerHTML = `<div class="msg success">PDF wurde heruntergeladen.</div>`;
        } catch (err) {
          statusEl.innerHTML = `<div class="msg error">Fehler beim Erstellen des Berichts: ${escapeHtml(err.message)}</div>`;
        } finally {
          btn.disabled = false;
        }
      });
    }

    async function generateMonthlyReport(clientId, clientLabel, monthValue) {
      const [yearStr, monthStr] = monthValue.split('-');
      const year = parseInt(yearStr, 10);
      const monthIdx = parseInt(monthStr, 10) - 1;
      const monthDate = new Date(year, monthIdx, 1);
      const fromISO = new Date(year, monthIdx, 1).toISOString();
      const toISO = new Date(year, monthIdx + 1, 1).toISOString();
      const twelveWeeksAgo = new Date(Date.now() - 84 * 86400000).toISOString();

      const [
        { data: profileRow },
        { data: bodyMeasurements },
        { data: allPreventionResults, error: preventionError },
        { data: balanceLogs },
        { data: trainingLogsMonth, error: trainingError },
        { data: trainingSessionsMonth },
        { data: nutritionLogsMonth, error: nutritionError },
        { data: energyTarget },
        { data: allLogsForRecords },
      ] = await Promise.all([
        supabaseClient.from('profiles').select('birth_date, full_name, email, training_enabled, nutrition_enabled').eq('id', clientId).maybeSingle(),
        listMyBodyMeasurements(clientId),
        listPreventionResults(clientId),
        listLogsForAnalytics(clientId, { from: twelveWeeksAgo }),
        listLogsForAnalytics(clientId, { from: fromISO, to: toISO }),
        listSessions(clientId, { from: fromISO, to: toISO }),
        listNutritionLogs(clientId, { from: fromISO, to: toISO }),
        getLatestEnergyTarget(clientId),
        listAllTrainingLogsForRecords(clientId),
      ]);
      if (preventionError) throw new Error(preventionError.message);
      if (trainingError) throw new Error(trainingError.message);
      if (nutritionError) throw new Error(nutritionError.message);

      // Präventions-Score: identische Berechnung wie in renderPreventionSection
      // (siehe dort) — bewusst dieselbe Logik, damit der Score im Bericht mit
      // dem in der Plattform angezeigten Score übereinstimmt.
      const birthDate = profileRow ? profileRow.birth_date : null;
      const ageYears = calcAge(birthDate);
      const latestBodyMeasurement = (bodyMeasurements || [])[(bodyMeasurements || []).length - 1] || null;
      const sex = latestBodyMeasurement ? latestBodyMeasurement.sex : null;
      const bodyFatPercent = latestBodyMeasurement ? latestBodyMeasurement.body_fat_percent : null;
      const latest = latestByKey(allPreventionResults || []);

      const totals = {};
      for (const log of balanceLogs || []) {
        const m = logMetric(log);
        if (!m || m.type !== 'volume') continue;
        const pattern = log.exercises && log.exercises.movement_pattern;
        if (!pattern || pattern === 'sonstige') continue;
        totals[pattern] = (totals[pattern] || 0) + m.value;
      }
      const balancePairRatios = BALANCE_PAIRS.map((p) => {
        const a = totals[p.aKey] || 0, b = totals[p.bKey] || 0;
        if (a === 0 && b === 0) return { ratio: null };
        if (a === 0 || b === 0) return { ratio: Infinity };
        return { ratio: Math.max(a, b) / Math.min(a, b) };
      });

      const preventionScore = computePreventionScore({ ageYears, sex, latestResults: latest, bodyFatPercent, balancePairRatios });

      const { prEvents } = computePersonalRecords(allLogsForRecords || []);
      const monthPrEvents = prEvents.filter((e) => e.performedAt >= fromISO && e.performedAt < toISO);
      const streak = computeTrainingStreak((allLogsForRecords || []).map((l) => l.performed_at));

      const moduleAccess = {
        training: profileRow ? profileRow.training_enabled !== false : true,
        nutrition: profileRow ? profileRow.nutrition_enabled !== false : true,
      };

      await buildMonthlyReportPdf({
        profile: { full_name: (profileRow && profileRow.full_name) || clientLabel, email: profileRow && profileRow.email },
        monthDate,
        trainingLogs: trainingLogsMonth,
        trainingSessions: trainingSessionsMonth,
        nutritionLogs: nutritionLogsMonth,
        energyTargetKcal: energyTarget ? energyTarget.tee_kcal || null : null,
        preventionScore,
        streak,
        monthPrEvents,
        moduleAccess,
      });

      // Runde 16: "Erster Monatsbericht"-Erfolg wird direkt beim erfolgreichen
      // Download vergeben (nicht aus Daten hergeleitet) – awardAchievement()
      // ist idempotent, ein erneuter Download schaltet nichts doppelt frei.
      awardAchievement(clientId, 'monthly_report_first').catch(() => {});
    }

    // =========================================================================
    // TESTS (eigene Kategorie, Nutzer-Feedback Runde 5 – vorher Teil des
    // Präventionscheck-Tabs). Kraftausdauer- und Beweglichkeitstests inkl.
    // Erklärbildern, +/-/0-Bewertungsvisualisierung und der Erinnerung an
    // fällige/veraltete Tests (erscheint zusätzlich als Banner im Nachrichten-
    // Tab und in der Kundendatei der Traineransicht, siehe js/prevention.js
    // getStaleTestSummary()).
    // =========================================================================

    // Runde 16: Herz-Kreislauf-Fitness-Test (Cooper- oder Rockport-Protokoll,
    // client-seitig zu einem geschätzten VO2max verrechnet). Anders als die
    // übrigen Kraftausdauertests hat dieser Test zwei alternative
    // Eingabeprotokolle mit unterschiedlichen Feldern – deshalb eine eigene
    // Karte mit eigenem Formular statt Wiederverwendung von strengthTestCardHtml.
    function cardioTestCardHtml(latestRow, ageYears, sex, weightKgHint, history) {
      const evalRes = latestRow ? evaluateCardioFitness(ageYears, sex, latestRow.value) : null;
      const points = history.filter((r) => r.test_key === 'cardio_fitness').map((r) => ({ date: r.measured_at, value: r.value }));
      return `
        <div class="card mt-24 pv-test-card" data-test-key="cardio_fitness">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
            <h3 style="margin:0; font-size:1rem;">Herz-Kreislauf-Fitness (geschätzter VO2max)</h3>
            ${latestRow ? `<span class="status-pill ${isStale(latestRow.measured_at) ? 'under' : 'active'}">${isStale(latestRow.measured_at) ? 'älter als 12 Wochen' : 'aktuell'}</span>` : ''}
          </div>
          <details class="qn-details mt-16"><summary>Testprotokoll ansehen (Durchführung, Abbruchkriterium, Kontraindikation)</summary>
            <div style="padding:10px 0 0; font-size:0.85rem;">
              <p><strong>Ausführung:</strong> Zwei Protokolle zur Auswahl. (1) Cooper-Test: 12 Minuten am Stück so weit wie möglich laufen, zurückgelegte Distanz in Metern messen. (2) Rockport-Gehtest: 1 Meile (1.609 m) so schnell wie möglich zügig gehen – nicht laufen –, Zeit und Puls direkt am Ziel messen.</p>
              <p><strong>Typische Fehler:</strong> Beim Cooper-Test zu schnell starten und vorzeitig einbrechen; beim Rockport-Test joggen statt zügig gehen (verfälscht die Schätzformel).</p>
              <p><strong>Abbruchkriterium:</strong> Bei Schwindel, Brustschmerz, starker Atemnot oder deutlichem Unwohlsein sofort abbrechen.</p>
              <p style="color:var(--color-danger);"><strong>Kontraindikation:</strong> Nicht bei unbehandeltem Bluthochdruck, bekannten Herz-Kreislauf-Erkrankungen, akutem Infekt oder unmittelbar nach intensivem Training durchführen – bei bestehenden Vorerkrankungen vorher ärztliche Freigabe einholen.</p>
              <p style="color:var(--color-text-muted); font-size:0.78rem;">Formeln: Cooper, K.H. (1968), JAMA – Cooper-Test; Kline et al. (1987), Medicine &amp; Science in Sports &amp; Exercise – Rockport-Gehtest. Einstufung: Cooper Institute, Physical Fitness Specialist Manual (1997), zit. nach Heyward (1998) – VO2max-Normtabellen unterscheiden sich je nach Quelle, der Wert dient der eigenen Verlaufskontrolle, nicht einer Diagnose. Begründung für die Erfassung: Mandsager et al. (2018), JAMA Network Open – durchgehender Zusammenhang zwischen kardiorespiratorischer Fitness und Gesamtmortalität.</p>
            </div>
          </details>
          ${latestRow ? `
            <div class="result-box mt-16">
              <div class="big" style="font-size:1.3rem;">${latestRow.value} ml/kg/min</div>
              ${evalRes && evalRes.bandFound ? `<div style="font-size:0.85rem; margin-top:4px;">Einstufung: <strong>${escapeHtml(evalRes.label)}</strong></div>` : `<div style="font-size:0.8rem; color:var(--color-text-muted); margin-top:4px;">${escapeHtml(evalRes ? evalRes.label : '')}</div>`}
              ${evalRes && evalRes.genderNote ? `<div style="font-size:0.75rem; color:var(--color-text-muted); margin-top:4px;">${escapeHtml(evalRes.genderNote)}</div>` : ''}
              ${latestRow.notes ? `<div style="font-size:0.75rem; color:var(--color-text-muted); margin-top:4px;">${escapeHtml(latestRow.notes)}</div>` : ''}
              <div style="font-size:0.75rem; color:var(--color-text-muted); margin-top:4px;">Gemessen am ${formatDateOnly(latestRow.measured_at)} von ${latestRow.measured_by === 'trainer' ? 'Trainer/Coach' : 'Kunde selbst'}</div>
            </div>
          ` : '<p style="color:var(--color-text-muted); font-size:0.85rem; margin-top:12px;">Noch kein Test eingetragen.</p>'}
          ${points.length >= 2 ? `<div class="mt-16">${miniSparklineHtml(points, 'ml/kg/min')}</div>` : ''}
          <form class="cardio-entry-form mt-16">
            <div class="field"><label>Protokoll</label>
              <select class="cardio-protocol">
                <option value="cooper">Cooper-Test (12-Minuten-Lauf)</option>
                <option value="rockport">Rockport-Gehtest (1 Meile)</option>
              </select>
            </div>
            <div class="cardio-fields-cooper">
              <div class="field"><label>Zurückgelegte Distanz (Meter)</label><input type="number" step="1" min="0" class="cardio-distance" /></div>
            </div>
            <div class="cardio-fields-rockport grid-2 hidden">
              <div class="field"><label>Gehzeit (Minuten, z.B. 14.5)</label><input type="number" step="0.1" min="0" class="cardio-time" /></div>
              <div class="field"><label>Puls direkt am Ziel (bpm)</label><input type="number" step="1" min="0" class="cardio-hr" /></div>
              <div class="field"><label>Körpergewicht (kg)</label><input type="number" step="0.1" min="0" class="cardio-weight" value="${weightKgHint || ''}" /></div>
            </div>
            <div class="grid-2 mt-16">
              <div class="field"><label>Datum</label><input type="date" class="cardio-date" value="${new Date().toISOString().slice(0, 10)}" required /></div>
              <div class="field"><label>Wer hat gemessen?</label>
                <select class="cardio-measured-by">
                  <option value="client">Ich selbst</option>
                  <option value="trainer">Trainer/Coach</option>
                </select>
              </div>
            </div>
            <button class="btn mt-16" type="submit">Ergebnis berechnen &amp; speichern</button>
          </form>
        </div>
      `;
    }

    function bindCardioTestForm(el, clientId, ageYears, sex, { isAdminView }) {
      const form = el.querySelector('.cardio-entry-form');
      if (!form) return;
      const protoSelect = form.querySelector('.cardio-protocol');
      const cooperFields = form.querySelector('.cardio-fields-cooper');
      const rockportFields = form.querySelector('.cardio-fields-rockport');
      protoSelect.addEventListener('change', () => {
        const isRockport = protoSelect.value === 'rockport';
        cooperFields.classList.toggle('hidden', isRockport);
        rockportFields.classList.toggle('hidden', !isRockport);
      });
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        let vo2max = null;
        let notes = '';
        if (protoSelect.value === 'cooper') {
          const distance = parseFloat(form.querySelector('.cardio-distance').value);
          vo2max = computeCooperVO2max(distance);
          notes = `Cooper-Test: ${distance} m in 12 Minuten`;
        } else {
          const timeMinutes = parseFloat(form.querySelector('.cardio-time').value);
          const heartRateBpm = parseFloat(form.querySelector('.cardio-hr').value);
          const weightKgInput = parseFloat(form.querySelector('.cardio-weight').value);
          vo2max = computeRockportVO2max({ weightKg: weightKgInput, ageYears, sex, timeMinutes, heartRateBpm });
          notes = `Rockport-Gehtest: 1 Meile in ${timeMinutes} Min, Puls ${heartRateBpm}, Gewicht ${weightKgInput} kg`;
        }
        if (!vo2max || vo2max <= 0) {
          alert('Bitte alle Felder korrekt ausfüllen – die Berechnung war nicht möglich (bei Rockport wird zusätzlich ein hinterlegtes Geburtsdatum benötigt).');
          submitBtn.disabled = false;
          return;
        }
        const { error } = await insertPreventionResult({
          clientId, testKey: 'cardio_fitness', value: vo2max,
          measuredBy: form.querySelector('.cardio-measured-by').value,
          measuredAt: form.querySelector('.cardio-date').value,
          notes,
        });
        if (error) { alert('Fehler: ' + error.message); submitBtn.disabled = false; return; }
        renderTestsSection(el, clientId, { isAdminView });
      });
    }

    function renderTestsTab(content, profile, { isAdminView }) {
      renderTestsSection(content, profile.id, { isAdminView });
    }

    async function renderTestsSection(el, clientId, { isAdminView }) {
      el.innerHTML = '<p class="center-text">Lade Tests …</p>';

      const [{ data: profileRow }, { data: bodyMeasurements }, { data: allResults, error: resultsError }] = await Promise.all([
        supabaseClient.from('profiles').select('birth_date').eq('id', clientId).maybeSingle(),
        listMyBodyMeasurements(clientId),
        listPreventionResults(clientId),
      ]);
      if (resultsError) { el.innerHTML = `<div class="msg error">${escapeHtml(resultsError.message)}</div>`; return; }

      const birthDate = profileRow ? profileRow.birth_date : null;
      const ageYears = calcAge(birthDate);
      const latestBodyMeasurement = (bodyMeasurements || [])[(bodyMeasurements || []).length - 1] || null;
      const sex = latestBodyMeasurement ? latestBodyMeasurement.sex : null;

      const results = allResults || [];
      const latest = latestByKey(results);

      // Erinnerung: Daten älter als 12 Wochen bzw. noch nie erfasst – erscheint
      // hier direkt am Test, zusätzlich als Banner im Nachrichten-Tab und in
      // der Kundendatei der Traineransicht (dieselbe Berechnung, siehe
      // js/prevention.js getStaleTestSummary()).
      const staleItems = [];
      [...STRENGTH_TESTS, ...MOBILITY_TESTS, ...CARDIO_TESTS].forEach((t) => {
        const sides = t.hasSide ? ['left', 'right'] : [null];
        sides.forEach((side) => {
          const key = side ? `${t.key}:${side}` : t.key;
          const r = latest[key];
          const sideLabel = side ? ` (${SIDE_LABEL[side]})` : '';
          if (!r) staleItems.push(`${t.label}${sideLabel} – noch kein Test eingetragen`);
          else if (isStale(r.measured_at)) staleItems.push(`${t.label}${sideLabel} – letzter Test vor über 12 Wochen (${formatDateOnly(r.measured_at)})`);
        });
      });

      el.innerHTML = `
        ${staleItems.length > 0 ? `
        <div class="card" style="border-color: rgba(200,124,0,0.4);">
          <h3 style="font-size:0.95rem; margin:0 0 8px; color:var(--color-gold);">Erinnerung: Tests aktualisieren</h3>
          <p style="color:var(--color-text-muted); font-size:0.78rem; margin:0 0 8px;">Diesen Hinweis siehst du auch als Banner im Nachrichten-Tab${isAdminView ? ', dein Trainer sieht ihn ebenfalls in deiner Kundendatei' : ''}.</p>
          <ul style="margin:0; padding-left:18px; font-size:0.85rem; color:var(--color-text-muted);">
            ${staleItems.map((i) => `<li>${escapeHtml(i)}</li>`).join('')}
          </ul>
        </div>` : `
        <div class="card">
          <p style="color:var(--color-success); font-size:0.85rem; margin:0;">✓ Alle Tests sind aktuell (nicht älter als 12 Wochen).</p>
        </div>`}

        <h2 class="mt-24" style="font-size:1.1rem;">Kraftausdauertests</h2>
        ${STRENGTH_TESTS.map((t) => strengthTestCardHtml(t, latest[t.key], ageYears, sex, results)).join('')}

        <h2 class="mt-24" style="font-size:1.1rem;">Herz-Kreislauf-Fitness</h2>
        ${cardioTestCardHtml(latest.cardio_fitness, ageYears, sex, latestBodyMeasurement ? latestBodyMeasurement.weight_kg : null, results)}

        <h2 class="mt-24" style="font-size:1.1rem;">Beweglichkeitstests</h2>
        ${MOBILITY_TESTS.map((t) => mobilityTestCardHtml(t, latest, results)).join('')}
      `;

      bindCardioTestForm(el, clientId, ageYears, sex, { isAdminView });

      el.querySelectorAll('.pv-entry-form').forEach((form) => {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const testKey = form.dataset.testKey;
          const sideSelect = form.querySelector('.pv-side');
          const submitBtn = form.querySelector('button[type="submit"]');
          submitBtn.disabled = true;
          const { error } = await insertPreventionResult({
            clientId,
            testKey,
            side: sideSelect ? sideSelect.value : null,
            value: parseFloat(form.querySelector('.pv-value').value),
            measuredBy: form.querySelector('.pv-measured-by').value,
            measuredAt: form.querySelector('.pv-date').value,
          });
          if (error) { alert('Fehler: ' + error.message); submitBtn.disabled = false; return; }
          renderTestsSection(el, clientId, { isAdminView });
        });
      });
    }

    // Nutzer-Feedback Runde 10: in "Meine Entwicklung" (renderAnalyticsView,
    // auch von der Trainer-Kundenanalyse genutzt) wurde bisher die komplette
    // renderTestsSection() eingebettet – samt Eingabeformularen. Das war eine
    // ungewollte Dopplung, da Tests bereits im eigenen Reiter "Tests"
    // eingetragen werden. Hier bleibt nur der reine Status-/Erinnerungs-
    // Hinweis (dieselbe "älter als 12 Wochen"-Logik wie in renderTestsSection),
    // ohne Testkarten oder Formulare – Eintragen ist an dieser Stelle bewusst
    // nicht mehr möglich.
    async function renderTestsReminder(el, clientId, { isAdminView }) {
      el.innerHTML = '<p class="center-text">Lade …</p>';
      const { data: allResults, error: resultsError } = await listPreventionResults(clientId);
      if (resultsError) { el.innerHTML = `<div class="msg error">${escapeHtml(resultsError.message)}</div>`; return; }

      const latest = latestByKey(allResults || []);
      const staleItems = [];
      [...STRENGTH_TESTS, ...MOBILITY_TESTS, ...CARDIO_TESTS].forEach((t) => {
        const sides = t.hasSide ? ['left', 'right'] : [null];
        sides.forEach((side) => {
          const key = side ? `${t.key}:${side}` : t.key;
          const r = latest[key];
          const sideLabel = side ? ` (${SIDE_LABEL[side]})` : '';
          if (!r) staleItems.push(`${t.label}${sideLabel} – noch kein Test eingetragen`);
          else if (isStale(r.measured_at)) staleItems.push(`${t.label}${sideLabel} – letzter Test vor über 12 Wochen (${formatDateOnly(r.measured_at)})`);
        });
      });

      el.innerHTML = staleItems.length > 0 ? `
        <div class="card" style="border-color: rgba(200,124,0,0.4);">
          <h3 style="font-size:0.95rem; margin:0 0 8px; color:var(--color-gold);">Erinnerung: Tests aktualisieren</h3>
          <p style="color:var(--color-text-muted); font-size:0.78rem; margin:0 0 8px;">Eintragen kannst du die Tests im Reiter „Tests"${isAdminView ? ' – bzw. der Kunde selbst in seiner eigenen Ansicht' : ''}.</p>
          <ul style="margin:0; padding-left:18px; font-size:0.85rem; color:var(--color-text-muted);">
            ${staleItems.map((i) => `<li>${escapeHtml(i)}</li>`).join('')}
          </ul>
        </div>` : `
        <div class="card">
          <p style="color:var(--color-success); font-size:0.85rem; margin:0;">✓ Alle Tests sind aktuell (nicht älter als 12 Wochen).</p>
        </div>`;
    }

      { key: 'start', label: 'Start', hidden: true },
      { key: 'templates', label: 'Vorlagen bauen' },

    async function renderAdminView() {

      // siehe js/nav.js): ?tab=templates o.ä. öffnet direkt den passenden Tab.
      // Analog zum Kunden-Pfad (renderClientRoot) oben.

      if (tab === 'library') return renderLibraryTab(content);

      if (tab === 'templates') return renderTemplatesTab(content);

      content.querySelectorAll('[data-delete-id]').forEach((btn) => {
        btn.addEventListener('click', async () => {

    // --- Wiederverwendbarer Tage-Builder (für Vorlagen & Einzelpläne) -------

    function buildExercisePreview(exercisesById) {
      return function attachPreview(row) {
        const select = row.querySelector('.row-exercise');
        const preview = row.querySelector('.row-preview');
        function update() {
          const ex = exercisesById[select.value];
          if (ex && ex.image_url) {
            preview.src = ex.image_url;
            preview.style.visibility = 'visible';
            preview.onclick = () => window.openLightbox(ex.image_url, ex.name);
          } else {
            preview.style.visibility = 'hidden';
          }
        }
        select.addEventListener('change', update);
        update();
      };
    }

    // --- Übungs-Baustein (Etappe 31): Kategorie-/Muskelgruppen-Filter,
    // Satz-für-Satz-Erfassung (oder "gleiche Werte für alle Sätze"),
    // Notizfeld sowie Cardio-spezifische Felder (Dauer/Distanz/Geschwindigkeit/
    // Watt/Herzfrequenz), je nach Kategorie der gewählten Übung. ------------

    // 'muscle_group' kann bei Kraft/Bodyweight mehrere kommagetrennte Werte
    // enthalten (z.B. 'Brust, Trizeps, Schulter') — hier in eine echte Liste
    // aufgesplittet, damit eine Übung unter JEDER ihrer Muskelgruppen gefunden
    // wird, nicht nur bei exakter String-Übereinstimmung.
    function exerciseMuscleGroups(ex) {
      if (!ex || !ex.muscle_group) return [];
      return ex.muscle_group.split(',').map((s) => s.trim()).filter(Boolean);
    }

    function filteredExerciseOptionsHtml(exercises, categoryFilter, muscleFilter) {
      const filtered = exercises.filter((ex) =>
        (!categoryFilter || (ex.category || 'Sonstige') === categoryFilter) &&
        (!muscleFilter || exerciseMuscleGroups(ex).includes(muscleFilter))
      );
      if (filtered.length === 0) return '<option value="">– keine Übung passt zu diesem Filter –</option>';
      return exerciseOptionsHtml(filtered);
    }

    function createExerciseBuilderRow(rowsContainer, exercises, exercisesById) {
      const categories = [...CATEGORY_ORDER, ...Array.from(new Set(exercises.map((e) => e.category || 'Sonstige'))).filter((c) => !CATEGORY_ORDER.includes(c))];
      // Feste Liste statt aus den Daten abgeleitet (Runde 13) — Muskelgruppen-
      // Filter ist nur für Kraft/Bodyweight sinnvoll, greift bei Cardio/
      // Mobilisation einfach nicht (deren muscle_group-Freitext enthält keinen
      // der 12 Werte).
      const muscleGroups = CANONICAL_MUSCLE_GROUPS;

      const row = document.createElement('div');
      row.className = 'ex-builder-row';
      row.innerHTML = `
        <div class="ex-builder-row-top">
          <img class="row-preview thumb-sm" src="" alt="" style="visibility:hidden;" />
          <div class="row-filters">
            <select class="row-filter-category">
              <option value="">Alle Kategorien</option>
              ${categories.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
            </select>
            <select class="row-filter-muscle">
              <option value="">Alle Muskelgruppen</option>
              ${muscleGroups.map((m) => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('')}
            </select>
          </div>
          <select class="row-exercise">${exerciseOptionsHtml(exercises)}</select>
          <button class="btn secondary small-btn row-remove-btn" type="button">✕ Übung entfernen</button>
        </div>

        <div class="row-strength-fields">
          <label class="set-mode-toggle"><input type="checkbox" class="row-same-for-all" checked /> Gleiche Werte für alle Sätze</label>
          <div class="same-for-all-fields">
            <input class="row-sets-count" type="number" min="1" placeholder="Anzahl Sätze" />
            <input class="row-reps-all" type="text" placeholder="Wdh. (z.B. 8-12)" />
            <input class="row-weight-all" type="text" placeholder="Gewicht (kg)" />
          </div>
          <div class="set-rows-list hidden"></div>
          <button class="btn secondary small-btn add-set-row-btn hidden" type="button">+ Satz hinzufügen</button>
        </div>

        <div class="row-cardio-fields hidden cardio-fields">
          <input class="row-duration" type="number" min="0" placeholder="Dauer (Sek.)" />
          <input class="row-distance" type="number" min="0" step="1" placeholder="Distanz (m)" />
          <input class="row-speed" type="number" min="0" step="0.1" placeholder="Geschwindigkeit (km/h)" />
          <input class="row-watt" type="number" min="0" placeholder="Watt" />
          <input class="row-hr-percent" type="number" min="0" max="100" placeholder="Herzfrequenz (% vom Max)" />
        </div>

        <input class="row-notes" type="text" placeholder="Notiz/Hinweis zu dieser Übung (optional)" />
      `;

      rowsContainer.appendChild(row);

      const exerciseSelect = row.querySelector('.row-exercise');
      const catFilter = row.querySelector('.row-filter-category');
      const muscleFilter = row.querySelector('.row-filter-muscle');
      const preview = row.querySelector('.row-preview');
      const strengthFields = row.querySelector('.row-strength-fields');
      const cardioFields = row.querySelector('.row-cardio-fields');
      const sameForAll = row.querySelector('.row-same-for-all');
      const sameForAllFields = row.querySelector('.same-for-all-fields');
      const setRowsList = row.querySelector('.set-rows-list');
      const addSetBtn = row.querySelector('.add-set-row-btn');

      function updatePreview() {
        const ex = exercisesById[exerciseSelect.value];
        if (ex && ex.image_url) {
          preview.src = ex.image_url;
          preview.style.visibility = 'visible';
          preview.onclick = () => window.openLightbox(ex.image_url, ex.name);
        } else {
          preview.style.visibility = 'hidden';
        }
      }

      function updateModeVisibility() {
        const ex = exercisesById[exerciseSelect.value];
        const cat = ex ? ex.category : null;
        const isCardio = cat === 'Cardio';
        strengthFields.classList.toggle('hidden', isCardio);
        cardioFields.classList.toggle('hidden', !isCardio);
        applyWeightFieldVisibility(cat);
      }

      // Nutzer-Feedback Runde 13: Gewichtsfeld zeigt bei Kraft/Bodyweight
      // automatisch "kg" statt des generischen "Gewicht/Hinweis"; bei
      // Mobilisation (Dehnen/Mobility) ergibt ein Gewicht meist keinen Sinn
      // und wird komplett ausgeblendet, statt nur das Label zu ändern.
      function applyWeightFieldVisibility(cat) {
        const hideWeight = cat === 'Mobilisation';
        const weightAllInput = row.querySelector('.row-weight-all');
        weightAllInput.classList.toggle('hidden', hideWeight);
        row.querySelectorAll('.set-weight').forEach((inp) => {
          inp.classList.toggle('hidden', hideWeight);
        });
      }

      function applyFilters() {
        const selectedBefore = exerciseSelect.value;
        exerciseSelect.innerHTML = filteredExerciseOptionsHtml(exercises, catFilter.value, muscleFilter.value);
        if (Array.from(exerciseSelect.options).some((o) => o.value === selectedBefore)) {
          exerciseSelect.value = selectedBefore;
        }
        updatePreview();
        updateModeVisibility();
      }

      function renumberSetRows() {
        Array.from(setRowsList.children).forEach((el, i) => {
          el.querySelector('.set-index').textContent = `Satz ${i + 1}`;
        });
      }

      function addSetRow() {
        const idx = setRowsList.children.length + 1;
        const setRow = document.createElement('div');
        setRow.className = 'set-row-item';
        setRow.innerHTML = `
          <span class="set-index">Satz ${idx}</span>
          <input class="set-reps" type="text" placeholder="Wdh." />
          <input class="set-weight" type="text" placeholder="Gewicht (kg)" />
          <button class="btn secondary small-btn remove-set-row" type="button">✕</button>
        `;
        setRow.querySelector('.remove-set-row').addEventListener('click', () => {
          setRow.remove();
          renumberSetRows();
        });
        setRowsList.appendChild(setRow);
        const currentEx = exercisesById[exerciseSelect.value];
        applyWeightFieldVisibility(currentEx ? currentEx.category : null);
      }

      sameForAll.addEventListener('change', () => {
        const useSame = sameForAll.checked;
        sameForAllFields.classList.toggle('hidden', !useSame);
        setRowsList.classList.toggle('hidden', useSame);
        addSetBtn.classList.toggle('hidden', useSame);
        if (!useSame && setRowsList.children.length === 0) {
          addSetRow();
          addSetRow();
        }
      });
      addSetBtn.addEventListener('click', addSetRow);
      catFilter.addEventListener('change', applyFilters);
      muscleFilter.addEventListener('change', applyFilters);
      exerciseSelect.addEventListener('change', () => { updatePreview(); updateModeVisibility(); });
      row.querySelector('.row-remove-btn').addEventListener('click', () => row.remove());

      updatePreview();
      updateModeVisibility();

      return row;
    }

    function readExerciseBuilderRow(row) {
      const exerciseId = row.querySelector('.row-exercise').value;
      if (!exerciseId) return null;
      const notes = row.querySelector('.row-notes').value.trim();
      const isCardioMode = !row.querySelector('.row-cardio-fields').classList.contains('hidden');

      if (isCardioMode) {
        const duration = row.querySelector('.row-duration').value;
        const distance = row.querySelector('.row-distance').value;
        const speed = row.querySelector('.row-speed').value;
        const watt = row.querySelector('.row-watt').value;
        const hr = row.querySelector('.row-hr-percent').value;
        return {
          exerciseId, notes,
          targetSets: null, targetReps: null, targetWeightHint: null,
          targetDurationSeconds: duration ? parseInt(duration, 10) : null,
          targetDistanceMeters: distance ? parseFloat(distance) : null,
          targetSpeedKmh: speed ? parseFloat(speed) : null,
          targetWatt: watt ? parseFloat(watt) : null,
          targetHeartRatePercent: hr ? parseInt(hr, 10) : null,
        };
      }

      const sameForAll = row.querySelector('.row-same-for-all').checked;
      if (sameForAll) {
        return {
          exerciseId, notes,
          targetSets: row.querySelector('.row-sets-count').value || null,
          targetReps: row.querySelector('.row-reps-all').value.trim() || null,
          targetWeightHint: row.querySelector('.row-weight-all').value.trim() || null,
          targetDurationSeconds: null, targetDistanceMeters: null, targetSpeedKmh: null, targetWatt: null, targetHeartRatePercent: null,
        };
      }

      const setRows = Array.from(row.querySelectorAll('.set-row-item'));
      const reps = setRows.map((r) => r.querySelector('.set-reps').value.trim() || '–');
      const weights = setRows.map((r) => r.querySelector('.set-weight').value.trim() || '–');
      return {
        exerciseId, notes,
        targetSets: setRows.length || null,
        targetReps: reps.some((r) => r !== '–') ? reps.join(', ') : null,
        targetWeightHint: weights.some((w) => w !== '–') ? weights.join(', ') : null,
        targetDurationSeconds: null, targetDistanceMeters: null, targetSpeedKmh: null, targetWatt: null, targetHeartRatePercent: null,
      };
    }

    // Nutzer-Feedback Runde 13: Vorlagen-Bearbeitung nutzt denselben Builder
    // wie das Neuanlegen, befüllt eine frisch erzeugte Übungszeile aber mit
    // den gespeicherten Soll-Werten der Vorlage. target_reps/target_weight_hint
    // sind einfache Text-Spalten (siehe sql/010) — unabhängig davon, ob beim
    // ursprünglichen Anlegen "Gleiche Werte für alle Sätze" oder Werte je Satz
    // verwendet wurden, steht am Ende immer ein einziger Text dort, der hier
    // unverändert ins "Gleiche Werte"-Feld zurückgeschrieben wird.
    function prefillExerciseBuilderRow(row, tplEx) {
      const exerciseSelect = row.querySelector('.row-exercise');
      exerciseSelect.value = tplEx.exercise_id;
      exerciseSelect.dispatchEvent(new Event('change'));

      row.querySelector('.row-notes').value = tplEx.notes || '';

      const isCardioMode = !row.querySelector('.row-cardio-fields').classList.contains('hidden');
      if (isCardioMode) {
        row.querySelector('.row-duration').value = tplEx.target_duration_seconds ?? '';
        row.querySelector('.row-distance').value = tplEx.target_distance_meters ?? '';
        row.querySelector('.row-speed').value = tplEx.target_speed_kmh ?? '';
        row.querySelector('.row-watt').value = tplEx.target_watt ?? '';
        row.querySelector('.row-hr-percent').value = tplEx.target_heart_rate_percent ?? '';
      } else {
        row.querySelector('.row-sets-count').value = tplEx.target_sets ?? '';
        row.querySelector('.row-reps-all').value = tplEx.target_reps || '';
        row.querySelector('.row-weight-all').value = tplEx.target_weight_hint || '';
      }
    }

    function createDayBuilder(rowsContainer, exercises, dayLabel, exercisesById) {
      const dayEl = document.createElement('div');
      dayEl.className = 'day-builder';
      dayEl.innerHTML = `
        <div class="day-builder-header">
          <input class="day-label" type="text" placeholder="Bezeichnung des Trainingstags (z.B. Tag 1 – Oberkörper)" value="${escapeHtml(dayLabel || '')}" required />
          <button class="btn secondary small-btn remove-day" type="button">Tag entfernen</button>
        </div>
        <div class="day-exercise-rows"></div>
        <button class="btn secondary small-btn add-exercise-to-day" type="button">+ Übung zu diesem Tag hinzufügen</button>
      `;
      dayEl.querySelector('.remove-day').addEventListener('click', () => dayEl.remove());
      const exRows = dayEl.querySelector('.day-exercise-rows');

      dayEl.querySelector('.add-exercise-to-day').addEventListener('click', () => createExerciseBuilderRow(exRows, exercises, exercisesById));
      createExerciseBuilderRow(exRows, exercises, exercisesById);

      rowsContainer.appendChild(dayEl);
      return dayEl;
    }

    function readDayBuilder(dayEl) {
      const label = dayEl.querySelector('.day-label').value.trim();
      const exercises = Array.from(dayEl.querySelectorAll('.ex-builder-row')).map(readExerciseBuilderRow).filter(Boolean);
      return { label, exercises };
    }

          `).join('')}

      createDayBuilder(daysContainer, exercises, 'Tag 1', exercisesById);

      // Nutzer-Feedback Runde 13: Vorlagen konnten bisher nur gelöscht werden.
      // "Bearbeiten" füllt denselben Bauformular mit den gespeicherten Werten
      // der gewählten Vorlage; der Submit-Handler unterscheidet über
      // editingTemplateId zwischen Neuanlage (createTemplate) und
      // Aktualisierung (updateTemplate).
      let editingTemplateId = null;

      function resetFormToCreateMode() {
        editingTemplateId = null;
        document.getElementById('tpl-title').value = '';
        document.getElementById('tpl-desc').value = '';
        daysContainer.innerHTML = '';
        createDayBuilder(daysContainer, exercises, 'Tag 1', exercisesById);
        document.getElementById('template-form-heading').textContent = 'Neue Trainingsplan-Vorlage bauen';
        document.getElementById('template-submit-btn').textContent = 'Vorlage speichern';
        document.getElementById('template-cancel-btn').classList.add('hidden');
      }

      function fillFormForEdit(tpl) {
        editingTemplateId = tpl.id;
        document.getElementById('tpl-title').value = tpl.title;
        document.getElementById('tpl-desc').value = tpl.description || '';
        daysContainer.innerHTML = '';

        const sortedDays = (tpl.plan_template_days || []).slice().sort((a, b) => a.sort_order - b.sort_order);
        (sortedDays.length ? sortedDays : [{ label: 'Tag 1', plan_template_exercises: [] }]).forEach((day) => {
          const dayEl = createDayBuilder(daysContainer, exercises, day.label, exercisesById);
          const exRows = dayEl.querySelector('.day-exercise-rows');
          exRows.innerHTML = ''; // die von createDayBuilder automatisch angelegte leere Zeile entfernen
          const sortedEx = (day.plan_template_exercises || []).slice().sort((a, b) => a.sort_order - b.sort_order);
          if (sortedEx.length === 0) {
            createExerciseBuilderRow(exRows, exercises, exercisesById);
          } else {
            sortedEx.forEach((ex) => {
              const row = createExerciseBuilderRow(exRows, exercises, exercisesById);
              prefillExerciseBuilderRow(row, ex);
            });
          }
        });

        document.getElementById('template-form-heading').textContent = `Vorlage bearbeiten: ${tpl.title}`;
        document.getElementById('template-submit-btn').textContent = 'Änderungen speichern';
        document.getElementById('template-cancel-btn').classList.remove('hidden');
        document.getElementById('template-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      document.getElementById('template-cancel-btn').addEventListener('click', resetFormToCreateMode);

      document.getElementById('template-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const days = Array.from(daysContainer.querySelectorAll('.day-builder')).map(readDayBuilder);

        if (days.some((d) => d.exercises.length === 0)) { alert('Jeder Trainingstag braucht mindestens eine Übung.'); return; }

        const payload = {
          title: document.getElementById('tpl-title').value.trim(),
          description: document.getElementById('tpl-desc').value.trim(),
          days,
        };
        const { error } = editingTemplateId
          ? await updateTemplate(editingTemplateId, payload)
          : await createTemplate(payload);
        if (error) { alert('Fehler: ' + error.message); return; }
        alert(editingTemplateId ? 'Vorlage aktualisiert.' : 'Vorlage gespeichert.');
        renderTemplatesTab(content);

      content.querySelectorAll('[data-edit-template]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const tpl = (templates || []).find((t) => t.id === btn.dataset.editTemplate);
          if (tpl) fillFormForEdit(tpl);

      content.querySelectorAll('[data-delete-template]').forEach((btn) => {

    // =========================================================================
    // AUSWERTUNG / ANALYTICS (gemeinsam für Kunde & Trainer)
    // =========================================================================

    function logMetric(log) {
      if (log.weight_kg != null && log.reps != null) return { type: 'volume', value: log.weight_kg * log.reps, unit: 'kg' };
      if (log.duration_seconds != null) return { type: 'duration', value: log.duration_seconds / 60, unit: 'Min.' };
      if (log.distance_meters != null) return { type: 'distance', value: log.distance_meters, unit: 'm' };
      if (log.reps != null) return { type: 'reps', value: log.reps, unit: 'Wdh.' };
      return null;
    }

    function presetRange(preset) {
      const now = new Date();
      let from = null;
      const to = now.toISOString();
      if (preset === '4w') { from = new Date(now.getTime() - 28 * 86400000).toISOString(); }
      else if (preset === 'year') { from = new Date(now.getFullYear(), 0, 1).toISOString(); }
      else if (preset === 'all') { from = null; }
      return { from, to: null };
    }

    async function renderAnalyticsView(el, clientId, { isAdminView }) {
      el.innerHTML = '<p class="center-text">Lade Auswertung …</p>';
      if (!clientId) { el.innerHTML = ''; return; }

      let currentFrom = null;
      let currentTo = null;
      let currentExerciseId = null;

      async function load() {
        const { data: logs, error } = await listLogsForAnalytics(clientId, { from: currentFrom, to: currentTo });
        if (error) { el.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`; return; }
        renderContent(logs || []);
      }

      function renderContent(logs) {
        const exerciseMap = {};
        for (const log of logs) {
          if (!log.exercises) continue;
          exerciseMap[log.exercise_id] = log.exercises;
        }
        const exerciseChoices = Object.values(exerciseMap).sort((a, b) => a.name.localeCompare(b.name, 'de'));

        if (!currentExerciseId && exerciseChoices.length > 0) currentExerciseId = exerciseChoices[0].id;

        const sessionIds = new Set(logs.map((l) => l.session_id).filter(Boolean));
        const dates = logs.map((l) => l.performed_at).sort();
        const firstDate = dates[0] ? formatDateOnly(dates[0]) : '–';
        const lastDate = dates[dates.length - 1] ? formatDateOnly(dates[dates.length - 1]) : '–';

        const totalVolumeKg = logs.reduce((sum, l) => {
          const m = logMetric(l);
          return sum + (m && m.type === 'volume' ? m.value : 0);
        }, 0);
        const totalVolumeDisplay = totalVolumeKg >= 1000 ? (totalVolumeKg / 1000).toFixed(2) + ' t' : Math.round(totalVolumeKg) + ' kg';

        el.innerHTML = `
          <div class="card">
            <div class="analytics-filters">
              <div class="field">
                <label>Von</label>
                <input type="date" id="af-from" />
              </div>
              <div class="field">
                <label>Bis</label>
                <input type="date" id="af-to" />
              </div>
              <div class="field" style="min-width:220px;">
                <label>Übung für Verlauf</label>
                <select id="af-exercise">${exerciseChoices.map((ex) => `<option value="${ex.id}" ${ex.id === currentExerciseId ? 'selected' : ''}>${escapeHtml(ex.name)}</option>`).join('') || '<option value="">– keine Daten –</option>'}</select>
              </div>
              <button class="btn small-btn" id="af-apply" type="button">Filtern</button>
            </div>
            <div class="filter-presets">
              <button type="button" data-preset="all">Gesamter Zeitraum</button>
              <button type="button" data-preset="4w">Letzte 4 Wochen</button>
              <button type="button" data-preset="year">Dieses Jahr</button>
            </div>

            <div class="stat-tiles">
              <div class="stat-tile"><div class="value">${sessionIds.size}</div><div class="label">Trainingseinheiten</div></div>
              <div class="stat-tile"><div class="value">${firstDate} – ${lastDate}</div><div class="label">Zeitraum der Daten</div></div>
              <div class="stat-tile"><div class="value">${totalVolumeDisplay}</div><div class="label">Insgesamt bewegte Kilos (Zeitraum)</div></div>
            </div>

            <h3 style="font-size:0.95rem; margin-bottom:4px;">Verlauf je Trainingseinheit</h3>
            <div id="progress-chart" style="position:relative;"></div>
            <div id="progress-table" class="mt-16"></div>
          </div>

          <div class="card mt-24">
            <h2 style="font-size:1.05rem;">Belastungsverteilung (Dysbalance-Hinweis)</h2>
            <p style="color:var(--color-text-muted); font-size:0.82rem;">Groborientierung auf Basis der insgesamt bewegten Kilos je Bewegungsmuster im gewählten Zeitraum – ersetzt keine individuelle fachliche Einschätzung. Übungen ohne eindeutiges Bewegungsmuster (z.B. gemischtes Cardio) fließen nicht ein.</p>
            <div id="dysbalance-section"></div>
          </div>

          <h2 class="mt-24" style="font-size:1.15rem;">Präventionscheck</h2>
          <div id="prevention-section"></div>

          <h2 class="mt-24" style="font-size:1.15rem;">Entwicklung im Verlauf</h2>
          <p style="color:var(--color-text-muted); font-size:0.82rem; margin:-4px 0 12px;">Beweglichkeit und Kraftausdauer über die Zeit – insgesamt sowie je Gelenk/Übung, auf Basis deiner Testhistorie im Reiter „Tests".</p>
          <div id="trends-section"></div>

          <h2 class="mt-24" style="font-size:1.15rem;">Tests – Erinnerung</h2>
          <p style="color:var(--color-text-muted); font-size:0.82rem; margin:-4px 0 12px;">Nur ein Status-Hinweis – Tests selbst werden im eigenen Reiter „Tests" eingetragen, nicht hier.</p>
          <div id="tests-section"></div>
        `;

        document.getElementById('af-apply').addEventListener('click', () => {
          const fromVal = document.getElementById('af-from').value;
          const toVal = document.getElementById('af-to').value;
          currentFrom = fromVal ? new Date(fromVal).toISOString() : null;
          currentTo = toVal ? new Date(toVal + 'T23:59:59').toISOString() : null;
          currentExerciseId = document.getElementById('af-exercise').value || null;
          el.querySelectorAll('.filter-presets button').forEach((b) => b.classList.remove('active'));
          load();
        });
        document.getElementById('af-exercise').addEventListener('change', (e) => {
          currentExerciseId = e.target.value || null;
          renderProgressChart(logs);
        });
        el.querySelectorAll('.filter-presets button').forEach((btn) => {
          btn.addEventListener('click', () => {
            el.querySelectorAll('.filter-presets button').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            const { from, to } = presetRange(btn.dataset.preset);
            currentFrom = from; currentTo = to;
            load();
          });
        });

        renderProgressChart(logs);
        renderDysbalanceSection(logs);
        const preventionEl = document.getElementById('prevention-section');
        if (preventionEl) renderPreventionSection(preventionEl, clientId, { isAdminView, hideLifestyleForms: true });
        const trendsEl = document.getElementById('trends-section');
        if (trendsEl) renderTrendsSection(trendsEl, clientId);
        const testsEl = document.getElementById('tests-section');
        if (testsEl) renderTestsReminder(testsEl, clientId, { isAdminView });
      }

      function renderProgressChart(logs) {
        const chartEl = document.getElementById('progress-chart');
        const tableEl = document.getElementById('progress-table');
        if (!chartEl) return;
        if (!currentExerciseId) { chartEl.innerHTML = '<p style="color:var(--color-text-muted); font-size:0.85rem;">Keine Übungsdaten im gewählten Zeitraum.</p>'; tableEl.innerHTML = ''; return; }

        const exLogs = logs.filter((l) => l.exercise_id === currentExerciseId);
        const bySession = {};
        for (const log of exLogs) {
          const key = log.session_id || ('day:' + log.performed_at.slice(0, 10));
          const m = logMetric(log);
          if (!m) continue;
          if (!bySession[key]) bySession[key] = { date: log.performed_at, type: m.type, unit: m.unit, value: 0 };
          bySession[key].value += m.value;
          if (log.performed_at < bySession[key].date) bySession[key].date = log.performed_at;
        }
        const points = Object.values(bySession).sort((a, b) => new Date(a.date) - new Date(b.date));

        if (points.length === 0) {
          chartEl.innerHTML = '<p style="color:var(--color-text-muted); font-size:0.85rem;">Für diese Übung liegen im gewählten Zeitraum noch keine Einträge vor.</p>';
          tableEl.innerHTML = '';
          return;
        }
        if (points.length < 2) {
          chartEl.innerHTML = `<p style="color:var(--color-text-muted); font-size:0.85rem;">Erst ein Datenpunkt (${formatDateOnly(points[0].date)}: ${points[0].value.toFixed(1)} ${points[0].unit}) – für einen Verlauf braucht es mindestens zwei Trainingseinheiten mit dieser Übung.</p>`;
          tableEl.innerHTML = '';
          return;
        }

        const unit = points[0].unit;
        const width = 640, height = 220, padding = 36;
        const values = points.map((p) => p.value);
        const minV = Math.min(0, ...values), maxV = Math.max(...values);
        const range = (maxV - minV) || 1;
        const coords = points.map((p, i) => ({
          x: padding + (i / (points.length - 1 || 1)) * (width - padding * 2),
          y: height - padding - ((p.value - minV) / range) * (height - padding * 2),
          date: p.date, value: p.value,
        }));
        const pathD = coords.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');

        chartEl.innerHTML = `
          <svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; overflow:visible;">
            <line x1="${padding}" y1="${height - padding}" x2="${width - padding}" y2="${height - padding}" stroke="var(--color-border)" stroke-width="1" />
            <path d="${pathD}" fill="none" stroke="var(--color-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            ${coords.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--color-gold)" class="chart-point" data-date="${p.date}" data-value="${p.value.toFixed(1)}" style="cursor:pointer;" />`).join('')}
          </svg>
          <div class="chart-tooltip" id="progress-tooltip"></div>
        `;
        const tooltip = document.getElementById('progress-tooltip');
        chartEl.querySelectorAll('.chart-point').forEach((pt) => {
          pt.addEventListener('mouseenter', (e) => {
            const rect = chartEl.getBoundingClientRect();
            tooltip.textContent = `${formatDateOnly(pt.dataset.date)}: ${pt.dataset.value} ${unit}`;
            tooltip.style.left = (e.clientX - rect.left) + 'px';
            tooltip.style.top = (e.clientY - rect.top) + 'px';
            tooltip.style.opacity = '1';
          });
          pt.addEventListener('mouseleave', () => { tooltip.style.opacity = '0'; });
        });

        tableEl.innerHTML = `<table class="log-table"><thead><tr><th>Datum</th><th>Wert (${escapeHtml(unit)})</th></tr></thead><tbody>
          ${points.map((p) => `<tr><td>${formatDateOnly(p.date)}</td><td>${p.value.toFixed(1)}</td></tr>`).join('')}
        </tbody></table>`;
      }

      function renderDysbalanceSection(logs) {
        const dysEl = document.getElementById('dysbalance-section');
        if (!dysEl) return;

        const totals = {};
        for (const log of logs) {
          const m = logMetric(log);
          if (!m || m.type !== 'volume') continue;
          const pattern = log.exercises && log.exercises.movement_pattern;
          if (!pattern || pattern === 'sonstige') continue;
          totals[pattern] = (totals[pattern] || 0) + m.value;
        }

        const pairs = [
          { title: 'Push / Pull (Oberkörper)', aKey: 'push_oberkoerper', bKey: 'pull_oberkoerper' },
          { title: 'Vordere / Hintere Beinkette', aKey: 'vordere_beinkette', bKey: 'hintere_beinkette' },
          { title: 'Rumpf vorne / hinten', aKey: 'rumpf_vorne', bKey: 'rumpf_hinten' },
        ];

        const hasAnyData = pairs.some((p) => (totals[p.aKey] || 0) > 0 || (totals[p.bKey] || 0) > 0);
        if (!hasAnyData) {
          dysEl.innerHTML = '<p style="color:var(--color-text-muted); font-size:0.85rem;">Noch keine mit Gewicht geloggten Sätze im gewählten Zeitraum, aus denen sich eine Belastungsverteilung berechnen ließe.</p>';
          return;
        }

        dysEl.innerHTML = `
          <div class="dysbalance-legend">
            <span><i style="background:var(--color-gold);"></i> Vorderseite / Push</span>
            <span><i style="background:var(--chart-teal);"></i> Rückseite / Pull</span>
          </div>
          ${pairs.map((p) => {
            const a = totals[p.aKey] || 0;
            const b = totals[p.bKey] || 0;
            if (a === 0 && b === 0) return '';
            const max = Math.max(a, b, 1);
            const ratio = a === 0 || b === 0 ? Infinity : Math.max(a, b) / Math.min(a, b);
            let verdict, cls;
            if (a === 0 || b === 0) { verdict = 'Eine Seite ist im Zeitraum noch komplett unbelastet.'; cls = 'alert'; }
            else if (ratio <= 1.2) { verdict = 'Ausgewogen.'; cls = 'ok'; }
            else if (ratio <= 1.5) { verdict = 'Leichtes Ungleichgewicht.'; cls = 'warn'; }
            else { verdict = 'Deutliches Ungleichgewicht – ggf. gezielt gegensteuern.'; cls = 'alert'; }
            return `<div class="dysbalance-pair">
              <div class="pair-title">${escapeHtml(p.title)}</div>
              <div class="dysbalance-bar-row">
                <div class="side-label">${escapeHtml(MOVEMENT_PATTERN_LABELS[p.aKey])}</div>
                <div class="dysbalance-bar-track"><div class="dysbalance-bar-fill" style="width:${(a / max * 100).toFixed(1)}%; background:var(--color-gold);"></div></div>
                <div class="dysbalance-bar-value">${Math.round(a)} kg</div>
              </div>
              <div class="dysbalance-bar-row">
                <div class="side-label">${escapeHtml(MOVEMENT_PATTERN_LABELS[p.bKey])}</div>
                <div class="dysbalance-bar-track"><div class="dysbalance-bar-fill" style="width:${(b / max * 100).toFixed(1)}%; background:var(--chart-teal);"></div></div>
                <div class="dysbalance-bar-value">${Math.round(b)} kg</div>
              </div>
              <div class="dysbalance-verdict ${cls}">${verdict}</div>
            </div>`;
          }).join('')}
        `;
      }

      await load();
    }

    init();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>

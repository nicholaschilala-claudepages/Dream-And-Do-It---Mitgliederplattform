    // --- Runde 21 / Q11: Plan-Editor für zugewiesene Pläne -----------------------
    // Der Trainer kann einen bereits zugewiesenen Plan vollständig anpassen:
    // Titel/Notizen, Tage (umbenennen, umsortieren, hinzufügen, entfernen),
    // Übungsvorgaben (Sätze, Wdh., Gewicht/Hinweis, Dauer, Distanz, Tempo, Watt,
    // %HFmax, Notiz), Reihenfolge, Tageszuordnung und das Entfernen einzelner
    // Übungen. Änderungen gelten sofort für den Kunden; bereits geloggte Sätze
    // bleiben im Trainingstagebuch erhalten (siehe Migration 054).
    async function togglePlanEditor(listContent, planId) {
      const area = document.getElementById(`edit-${planId}`);
      if (area.style.display !== 'none') { area.style.display = 'none'; area.innerHTML = ''; return; }
      area.style.display = 'block';
      area.innerHTML = '<p class="center-text">Lade …</p>';

      const { data: plan, error } = await getPlanForAdmin(planId);
      if (error || !plan) { area.innerHTML = `<div class="msg error">${escapeHtml(error ? error.message : 'Plan nicht gefunden.')}</div>`; return; }
      const { data: logCounts } = await countLogsPerPlanExercise((plan.plan_exercises || []).map((pe) => pe.id));

      let seq = 0;
      const model = {
        title: plan.title || '',
        notes: plan.notes || '',
        days: (plan.training_plan_days || []).slice().sort((a, b) => a.sort_order - b.sort_order).map((d) => ({ key: `d${++seq}`, id: d.id, label: d.label })),
        exercises: [],
        removedExerciseIds: [],
        removedDayIds: [],
      };
      const keyByDayId = Object.fromEntries(model.days.map((d) => [d.id, d.key]));
      const sortedEx = (plan.plan_exercises || []).slice().sort((a, b) => a.sort_order - b.sort_order);
      // Reihenfolge: nach Tag-Reihenfolge, dann sort_order; Übungen ohne Tag zuletzt.
      const dayOrder = (pe) => (pe.plan_day_id && keyByDayId[pe.plan_day_id] ? model.days.findIndex((d) => d.id === pe.plan_day_id) : 9999);
      sortedEx.sort((a, b) => dayOrder(a) - dayOrder(b) || a.sort_order - b.sort_order);
      model.exercises = sortedEx.map((pe) => ({
        id: pe.id, name: pe.exercises ? pe.exercises.name : 'Übung', imageUrl: pe.exercises ? pe.exercises.image_url : null,
        logs: (logCounts && logCounts[pe.id]) || 0,
        dayKey: pe.plan_day_id ? (keyByDayId[pe.plan_day_id] || null) : null,
        targetSets: pe.target_sets ?? '', targetReps: pe.target_reps ?? '', targetWeightHint: pe.target_weight_hint ?? '',
        targetDurationSeconds: pe.target_duration_seconds ?? '', targetDistanceMeters: pe.target_distance_meters ?? '',
        targetSpeedKmh: pe.target_speed_kmh ?? '', targetWatt: pe.target_watt ?? '', targetHeartRatePercent: pe.target_heart_rate_percent ?? '',
        notes: pe.notes ?? '',
      }));

      const FIELDS = [
        ['targetSets', 'Sätze', 'number', 1], ['targetReps', 'Wdh.', 'text'], ['targetWeightHint', 'Gewicht/Hinweis', 'text'],
        ['targetDurationSeconds', 'Dauer', 'number', 0], ['targetDistanceMeters', 'Distanz (m)', 'number', 0],
        ['targetSpeedKmh', 'km/h', 'number', 0], ['targetWatt', 'Watt', 'number', 0], ['targetHeartRatePercent', '% HFmax', 'number', 0],
      ];

      function syncFromDom() {
        // Eingaben zurück ins Modell übernehmen, bevor neu gezeichnet wird.
        model.title = area.querySelector('.pe-title').value;
        model.notes = area.querySelector('.pe-notes').value;
        area.querySelectorAll('.pe-day-label').forEach((inp) => { const d = model.days.find((x) => x.key === inp.dataset.dayKey); if (d) d.label = inp.value; });
        area.querySelectorAll('.pe-ex').forEach((row) => {
          const ex = model.exercises.find((x) => x.id === row.dataset.exId);
          if (!ex) return;
          FIELDS.forEach(([f]) => {
            const el = row.querySelector(`[data-f="${f}"]`);
            if (!el) return;
            // Dauer: Einheit (Sek./Min.) berücksichtigen, im Modell immer Sekunden
            ex[f] = f === 'targetDurationSeconds' ? (durSecondsOf(el) ?? '') : el.value;
          });
          ex.notes = row.querySelector('[data-f="notes"]').value;
          const sel = row.querySelector('.pe-ex-day');
          ex.dayKey = sel.value || null;
        });
      }

      function exRowHtml(ex, idx, group) {
        const dayOpts = `<option value="">– kein fester Tag –</option>` + model.days.map((d) => `<option value="${d.key}" ${ex.dayKey === d.key ? 'selected' : ''}>${escapeHtml(d.label || 'Tag')}</option>`).join('');
        const pos = group.indexOf(ex);
        return `<div class="pe-ex" data-ex-id="${ex.id}" style="border:1px solid var(--color-border); border-radius:8px; padding:8px; margin:6px 0; background:var(--color-bg);">
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:6px;">
            ${ex.imageUrl ? `<img src="${escapeHtml(ex.imageUrl)}" alt="" style="width:34px; height:34px; border-radius:6px; object-fit:cover;" />` : ''}
            <strong style="flex:1; min-width:140px;">${escapeHtml(ex.name)}</strong>
            <select class="pe-ex-day" style="max-width:190px;">${dayOpts}</select>
            <button type="button" class="btn secondary small-btn pe-ex-up" ${pos === 0 ? 'disabled' : ''} title="Nach oben" aria-label="Nach oben">↑</button>
            <button type="button" class="btn secondary small-btn pe-ex-down" ${pos === group.length - 1 ? 'disabled' : ''} title="Nach unten" aria-label="Nach unten">↓</button>
            <button type="button" class="btn secondary small-btn pe-ex-del" title="Übung aus dem Plan entfernen" aria-label="Übung entfernen">✕</button>
          </div>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); gap:6px;">
            ${FIELDS.map(([f, label, type, min]) => {
              if (f === 'targetDurationSeconds') {
                const d = durDisplay(ex[f]);
                return `<label style="font-size:0.7rem; color:var(--color-text-muted);">${label}${durFieldHtml(`<input data-f="${f}" type="number" min="0" step="any" value="${escapeHtml(d.value)}" style="width:100%;" />`, d.unit)}</label>`;
              }
              return `<label style="font-size:0.7rem; color:var(--color-text-muted);">${label}<input data-f="${f}" type="${type}" ${type === 'number' ? `min="${min}" step="any"` : ''} value="${escapeHtml(String(ex[f] ?? ''))}" style="width:100%;" /></label>`;
            }).join('')}
          </div>
          <label style="display:block; font-size:0.7rem; color:var(--color-text-muted); margin-top:6px;">Notiz / Hinweis für den Kunden<input data-f="notes" type="text" value="${escapeHtml(ex.notes || '')}" style="width:100%;" /></label>
          ${ex.logs > 0 ? `<div style="font-size:0.7rem; color:var(--color-text-muted); margin-top:4px;">${ex.logs} geloggte ${ex.logs === 1 ? 'Satz' : 'Sätze'} des Kunden zu dieser Übung</div>` : ''}
        </div>`;
      }

      function paint() {
        const groups = model.days.map((d) => ({ day: d, items: model.exercises.filter((e) => e.dayKey === d.key) }));
        const loose = model.exercises.filter((e) => !e.dayKey || !model.days.some((d) => d.key === e.dayKey));
        area.innerHTML = `
          <div style="border:1px solid var(--color-gold); border-radius:10px; padding:12px; background:var(--color-surface);">
            <h4 style="margin:0 0 8px;">Plan bearbeiten</h4>
            <p style="font-size:0.78rem; color:var(--color-text-muted); margin:0 0 10px;">Änderungen gelten für den Kunden sofort nach dem Speichern. Bereits geloggte Sätze bleiben in seinem Trainingstagebuch erhalten.</p>
            <div class="field"><label>Titel</label><input class="pe-title" type="text" value="${escapeHtml(model.title)}" /></div>
            <div class="field"><label>Notizen zum Plan</label><textarea class="pe-notes" rows="2" style="width:100%;">${escapeHtml(model.notes)}</textarea></div>
            ${groups.map(({ day, items }, di) => `
              <div class="pe-day" data-day-key="${day.key}" style="margin-top:12px;">
                <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
                  <input class="pe-day-label" data-day-key="${day.key}" type="text" value="${escapeHtml(day.label)}" style="flex:1; min-width:140px; font-weight:700;" aria-label="Name des Trainingstags" />
                  <button type="button" class="btn secondary small-btn pe-day-up" ${di === 0 ? 'disabled' : ''} aria-label="Tag nach oben">↑</button>
                  <button type="button" class="btn secondary small-btn pe-day-down" ${di === groups.length - 1 ? 'disabled' : ''} aria-label="Tag nach unten">↓</button>
                  <button type="button" class="btn secondary small-btn pe-day-del" title="Tag entfernen (Übungen bleiben im Plan, ohne festen Tag)">Tag entfernen</button>
                </div>
                ${items.length ? items.map((ex, i) => exRowHtml(ex, i, items)).join('') : '<p style="font-size:0.8rem; color:var(--color-text-muted); margin:6px 0;">Keine Übungen an diesem Tag.</p>'}
              </div>`).join('')}
            ${loose.length ? `<div class="pe-day" style="margin-top:12px;"><strong>${model.days.length ? 'Weitere Übungen (ohne festen Tag)' : 'Übungen'}</strong>${loose.map((ex, i) => exRowHtml(ex, i, loose)).join('')}</div>` : ''}
            <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;">
              <button type="button" class="btn secondary small-btn pe-day-add">+ Trainingstag hinzufügen</button>
              <span style="flex:1;"></span>
              <button type="button" class="btn secondary small-btn pe-cancel">Schließen</button>
              <button type="button" class="btn small-btn pe-save">Änderungen speichern</button>
            </div>
            <div class="pe-msg" role="status" style="margin-top:8px;"></div>
          </div>`;

        const move = (arr, from, to) => { if (to < 0 || to >= arr.length) return; const [x] = arr.splice(from, 1); arr.splice(to, 0, x); };
        area.querySelectorAll('.pe-day').forEach((dayEl) => {
          const key = dayEl.dataset.dayKey;
          const di = model.days.findIndex((d) => d.key === key);
          const bind = (sel, fn) => { const b = dayEl.querySelector(sel); if (b) b.addEventListener('click', fn); };
          bind('.pe-day-up', () => { syncFromDom(); move(model.days, di, di - 1); paint(); });
          bind('.pe-day-down', () => { syncFromDom(); move(model.days, di, di + 1); paint(); });
          bind('.pe-day-del', () => {
            syncFromDom();
            const day = model.days[di];
            const n = model.exercises.filter((e) => e.dayKey === key).length;
            if (!confirm(`Tag „${day.label}“ entfernen?${n ? ` Die ${n} Übung(en) bleiben im Plan, aber ohne festen Tag.` : ''}`)) return;
            model.exercises.forEach((e) => { if (e.dayKey === key) e.dayKey = null; });
            if (day.id) model.removedDayIds.push(day.id);
            model.days.splice(di, 1);
            paint();
          });
        });
        area.querySelectorAll('.pe-ex').forEach((row) => {
          const ex = model.exercises.find((x) => x.id === row.dataset.exId);
          const bucket = () => model.exercises.filter((e) => (e.dayKey || null) === (ex.dayKey || null));
          const swap = (dir) => {
            syncFromDom();
            const b = bucket();
            const j = b.indexOf(ex) + dir;
            if (j < 0 || j >= b.length) return;
            const a1 = model.exercises.indexOf(ex); const a2 = model.exercises.indexOf(b[j]);
            [model.exercises[a1], model.exercises[a2]] = [model.exercises[a2], model.exercises[a1]];
            paint();
          };
          row.querySelector('.pe-ex-up').addEventListener('click', () => swap(-1));
          row.querySelector('.pe-ex-down').addEventListener('click', () => swap(1));
          row.querySelector('.pe-ex-day').addEventListener('change', () => { syncFromDom(); paint(); });
          row.querySelector('.pe-ex-del').addEventListener('click', () => {
            syncFromDom();
            const warn = ex.logs > 0
              ? `Zu „${ex.name}“ gibt es ${ex.logs} geloggte ${ex.logs === 1 ? 'Satz' : 'Sätze'}. Sie bleiben im Trainingstagebuch des Kunden erhalten, werden aber nicht mehr diesem Plan zugeordnet.\n\nÜbung trotzdem aus dem Plan entfernen?`
              : `„${ex.name}“ aus dem Plan entfernen?`;
            if (!confirm(warn)) return;
            model.removedExerciseIds.push(ex.id);
            model.exercises.splice(model.exercises.indexOf(ex), 1);
            paint();
          });
        });
        area.querySelector('.pe-day-add').addEventListener('click', () => {
          syncFromDom();
          model.days.push({ key: `d${++seq}`, id: null, label: `Tag ${model.days.length + 1}` });
          paint();
        });
        area.querySelector('.pe-cancel').addEventListener('click', () => { area.style.display = 'none'; area.innerHTML = ''; });
        area.querySelector('.pe-save').addEventListener('click', async () => {
          syncFromDom();
          const msg = area.querySelector('.pe-msg');
          const btn = area.querySelector('.pe-save');
          btn.disabled = true; btn.textContent = 'Speichert …';
          const { error: saveError } = await savePlanEdits(planId, model);
          if (saveError) {
            msg.innerHTML = `<div class="msg error">${escapeHtml(saveError.message)}</div>`;
            btn.disabled = false; btn.textContent = 'Änderungen speichern';
            return;
          }
          renderExistingPlansTab(listContent);
        });
      }
      paint();
    }

    async function toggleAddExerciseArea(planId) {
      const area = document.getElementById(`expand-${planId}`);
      const isOpen = area.style.display !== 'none';
      if (isOpen) { area.style.display = 'none'; area.innerHTML = ''; return; }

      area.style.display = 'block';
      area.innerHTML = '<p class="center-text">Lade …</p>';

      const [{ data: plan, error: planError }, { data: exercises, error: exercisesError }] = await Promise.all([
        getPlanForAdmin(planId), listExercises(),
      ]);
      if (planError || exercisesError) {
        area.innerHTML = `<div class="msg error">${escapeHtml((planError || exercisesError).message)}</div>`;
        return;
      }

      const exercisesById = Object.fromEntries((exercises || []).map((ex) => [ex.id, ex]));
      const days = (plan.training_plan_days || []).sort((a, b) => a.sort_order - b.sort_order);
      const dayOptions = `<option value="">– kein fester Tag –</option>` + days.map((d) => `<option value="${d.id}">${escapeHtml(d.label)}</option>`).join('');
      const exerciseOptions = exerciseOptionsHtml(exercises || []);
      const nextSort = (plan.plan_exercises || []).length;

      area.innerHTML = `
        <div class="exercise-builder-row" style="grid-template-columns: 44px 1.1fr 1.5fr 0.7fr 0.9fr 1fr 0.9fr auto;">
          <img class="row-preview thumb-sm" src="" alt="" style="visibility:hidden;" />
          <select class="add-ex-day">${dayOptions}</select>
          <select class="add-ex-exercise row-exercise">${exerciseOptions}</select>
          <input class="add-ex-sets" type="number" min="1" placeholder="Sätze" />
          <input class="add-ex-reps" type="text" placeholder="Wdh." />
          <input class="add-ex-weight" type="text" placeholder="Gewicht/Hinweis" />
          ${durFieldHtml('<input class="add-ex-duration" type="number" min="0" step="any" placeholder="Dauer" />')}
          <button class="btn small-btn add-ex-submit" type="button">Hinzufügen</button>
        </div>
      `;
      buildExercisePreview(exercisesById)(area);

      area.querySelector('.add-ex-submit').addEventListener('click', async () => {
        const { error } = await addExerciseToPlan({
          planId,
          planDayId: area.querySelector('.add-ex-day').value || null,
          exerciseId: area.querySelector('.add-ex-exercise').value,
          targetSets: area.querySelector('.add-ex-sets').value,
          targetReps: area.querySelector('.add-ex-reps').value,
          targetWeightHint: area.querySelector('.add-ex-weight').value,
          targetDurationSeconds: durSecondsOf(area.querySelector('.add-ex-duration')),
          sortOrder: nextSort,
        });
        if (error) { alert('Fehler: ' + error.message); return; }
        alert('Übung hinzugefügt.');
        area.style.display = 'none';
        area.innerHTML = '';
      });
    }

    // --- Kundenanalyse (Admin) -------------------------------------------------------

    async function renderClientAnalysisTab(content) {
      const { data: clients, error } = await listClients();
      if (error) {
        content.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`;
        return;
      }
      if (!clients || clients.length === 0) {
        content.innerHTML = `<div class="card"><p>Noch keine Kunden-Accounts vorhanden.</p></div>`;
        return;
      }

      content.innerHTML = `
        <div class="card">
          <div class="field" style="max-width:360px;">
            <label>Kunde auswählen</label>
            <select id="analysis-client">${clients.map((c) => `<option value="${c.id}">${escapeHtml(c.full_name || c.email)}</option>`).join('')}</select>
          </div>
        </div>
        <div id="analysis-access" class="mt-24"></div>
        <div id="analysis-body" class="mt-24"></div>
        <div id="analysis-report" class="mt-24"></div>
      `;

      const select = document.getElementById('analysis-client');
      const accessEl = document.getElementById('analysis-access');
      const body = document.getElementById('analysis-body');
      const reportEl = document.getElementById('analysis-report');
      const selectedClientLabel = () => {
        const c = clients.find((cl) => cl.id === select.value);
        return c ? (c.full_name || c.email) : '';
      };
      select.addEventListener('change', () => {
        renderSubtabAccessCard(accessEl, select.value);
        renderAnalyticsView(body, select.value, { isAdminView: true });
        renderMonatsberichtCard(reportEl, select.value, selectedClientLabel(), { isAdminView: true });
      });
      renderSubtabAccessCard(accessEl, select.value);
      renderAnalyticsView(body, select.value, { isAdminView: true });
      renderMonatsberichtCard(reportEl, select.value, selectedClientLabel(), { isAdminView: true });
    }

    // Runde 18: granulare Zugriffssteuerung je Unterpunkt (Training/Ernährung/
    // Coaching) für den in der Kundenanalyse gewählten Kunden. Sperrt NUR den
    // Zugriff auf den Inhalt (der Unterpunkt bleibt für den Kunden in der
    // Navigation sichtbar, siehe js/subtab-access.js), nicht die Sichtbarkeit.
    const SUBTAB_SECTION_LABEL = { training: 'Training', nutrition: 'Ernährung', coaching: 'Coaching' };

    async function renderSubtabAccessCard(el, clientId) {
      if (!clientId) { el.innerHTML = ''; return; }
      el.innerHTML = `<div class="card"><p class="center-text">Lade Zugriffsrechte …</p></div>`;
      const { locks, error } = await loadClientSubtabLocks(clientId);
      if (error) { el.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`; return; }

      const sectionsHtml = Object.entries(CLIENT_SUBTABS).map(([section, items]) => `
        <div class="subtab-access-group">
          <h4>${SUBTAB_SECTION_LABEL[section] || section}</h4>
          ${items.map((item) => {
            const locked = locks.has(`${section}:${item.key}`);
            return `
              <label class="subtab-access-row">
                <input type="checkbox" data-section="${section}" data-key="${item.key}" ${locked ? '' : 'checked'} />
                <span>${escapeHtml(item.label)}</span>
              </label>`;
          }).join('')}
        </div>`).join('');

      el.innerHTML = `
        <div class="card">
          <h2 style="font-size:1.05rem;">Zugriff je Unterpunkt</h2>
          <p style="color:var(--color-text-muted); font-size:0.85rem;">
            Ein abgewählter Unterpunkt bleibt für den Kunden sichtbar (weckt Neugier), zeigt beim Öffnen
            aber nur eine Teaser-Ansicht statt des echten Inhalts. Änderungen wirken sofort.
          </p>
          <div class="subtab-access-grid">${sectionsHtml}</div>
          <div id="subtab-access-msg"></div>
        </div>
      `;

      el.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
        cb.addEventListener('change', async () => {
          const section = cb.dataset.section;
          const key = cb.dataset.key;
          const msgEl = document.getElementById('subtab-access-msg');
          cb.disabled = true;
          const { error: saveError } = await setSubtabAccess(clientId, section, key, cb.checked, currentProfile.id);
          cb.disabled = false;
          if (saveError) {
            msgEl.innerHTML = `<div class="msg error">${escapeHtml(saveError.message)}</div>`;
            cb.checked = !cb.checked;
            return;
          }
          msgEl.innerHTML = `<div class="msg success">Gespeichert.</div>`;
          setTimeout(() => { if (msgEl) msgEl.innerHTML = ''; }, 2000);
        });
      });
    }

    // =========================================================================
    // AUSWERTUNG / ANALYTICS (gemeinsam für Kunde & Trainer)
    // =========================================================================

    function logMetric(log) {
      if (log.weight_kg != null && log.reps != null) return { type: 'volume', value: log.weight_kg * log.reps, unit: 'kg' };
      if (log.duration_seconds != null) return { type: 'duration', value: log.duration_seconds / 60, unit: 'Min.' };
      if (log.distance_meters != null) return { type: 'distance', value: log.distance_meters, unit: 'm' };
      if (log.reps != null) return { type: 'reps', value: log.reps, unit: 'Wdh.' };
      return null;
    }

    function presetRange(preset) {
      const now = new Date();
      let from = null;
      const to = now.toISOString();
      if (preset === '4w') { from = new Date(now.getTime() - 28 * 86400000).toISOString(); }
      else if (preset === 'year') { from = new Date(now.getFullYear(), 0, 1).toISOString(); }
      else if (preset === 'all') { from = null; }
      return { from, to: null };
    }

    async function renderAnalyticsView(el, clientId, { isAdminView }) {
      el.innerHTML = '<p class="center-text">Lade Auswertung …</p>';
      if (!clientId) { el.innerHTML = ''; return; }

      let currentFrom = null;
      let currentTo = null;
      let currentExerciseId = null;

      async function load() {
        const { data: logs, error } = await listLogsForAnalytics(clientId, { from: currentFrom, to: currentTo });
        if (error) { el.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`; return; }
        renderContent(logs || []);
      }

      function renderContent(logs) {
        const exerciseMap = {};
        for (const log of logs) {
          if (!log.exercises) continue;
          exerciseMap[log.exercise_id] = log.exercises;
        }
        const exerciseChoices = Object.values(exerciseMap).sort((a, b) => a.name.localeCompare(b.name, 'de'));

        if (!currentExerciseId && exerciseChoices.length > 0) currentExerciseId = exerciseChoices[0].id;

        const sessionIds = new Set(logs.map((l) => l.session_id).filter(Boolean));
        const dates = logs.map((l) => l.performed_at).sort();
        const firstDate = dates[0] ? formatDateOnly(dates[0]) : '–';
        const lastDate = dates[dates.length - 1] ? formatDateOnly(dates[dates.length - 1]) : '–';

        const totalVolumeKg = logs.reduce((sum, l) => {
          const m = logMetric(l);
          return sum + (m && m.type === 'volume' ? m.value : 0);
        }, 0);
        const totalVolumeDisplay = totalVolumeKg >= 1000 ? (totalVolumeKg / 1000).toFixed(2) + ' t' : Math.round(totalVolumeKg) + ' kg';

        el.innerHTML = `
          <div class="card">
            <div class="analytics-filters">
              <div class="field">
                <label>Von</label>
                <input type="date" id="af-from" />
              </div>
              <div class="field">
                <label>Bis</label>
                <input type="date" id="af-to" />
              </div>
              <div class="field" style="min-width:220px;">
                <label>Übung für Verlauf</label>
                <select id="af-exercise">${exerciseChoices.map((ex) => `<option value="${ex.id}" ${ex.id === currentExerciseId ? 'selected' : ''}>${escapeHtml(ex.name)}</option>`).join('') || '<option value="">– keine Daten –</option>'}</select>
              </div>
              <button class="btn small-btn" id="af-apply" type="button">Filtern</button>
            </div>
            <div class="filter-presets">
              <button type="button" data-preset="all">Gesamter Zeitraum</button>
              <button type="button" data-preset="4w">Letzte 4 Wochen</button>
              <button type="button" data-preset="year">Dieses Jahr</button>
            </div>

            <div class="stat-tiles">
              <div class="stat-tile"><div class="value">${sessionIds.size}</div><div class="label">Trainingseinheiten</div></div>
              <div class="stat-tile"><div class="value">${firstDate} – ${lastDate}</div><div class="label">Zeitraum der Daten</div></div>
              <div class="stat-tile"><div class="value">${totalVolumeDisplay}</div><div class="label">Insgesamt bewegte Kilos (Zeitraum)</div></div>
            </div>

            <h3 style="font-size:0.95rem; margin-bottom:4px;">Verlauf je Trainingseinheit</h3>
            <div id="progress-chart" style="position:relative;"></div>
            <div id="progress-table" class="mt-16"></div>
          </div>

          <div class="card mt-24">
            <h2 style="font-size:1.05rem;">Belastungsverteilung (Dysbalance-Hinweis)</h2>
            <p style="color:var(--color-text-muted); font-size:0.82rem;">Groborientierung auf Basis der insgesamt bewegten Kilos je Bewegungsmuster im gewählten Zeitraum – ersetzt keine individuelle fachliche Einschätzung. Übungen ohne eindeutiges Bewegungsmuster (z.B. gemischtes Cardio) fließen nicht ein.</p>
            <div id="dysbalance-section"></div>
          </div>

          <h2 class="mt-24" style="font-size:1.15rem;">Präventionscheck</h2>
          <div id="prevention-section"></div>

          <h2 class="mt-24" style="font-size:1.15rem;">Entwicklung im Verlauf</h2>
          <p style="color:var(--color-text-muted); font-size:0.82rem; margin:-4px 0 12px;">Beweglichkeit und Kraftausdauer über die Zeit – insgesamt sowie je Gelenk/Übung, auf Basis deiner Testhistorie im Reiter „Tests".</p>
          <div id="trends-section"></div>

          ${isAdminView ? `
          <h2 class="mt-24" style="font-size:1.15rem;">Tests &amp; Messungen für diesen Kunden</h2>
          <p style="color:var(--color-text-muted); font-size:0.82rem; margin:-4px 0 12px;">Hier trägst du als Trainer/Coach Tests und Messungen ausschließlich für den oben ausgewählten Kunden ein – sie werden dessen Profil zugewiesen und als „vom Trainer gemessen" gekennzeichnet.</p>` : `
          <h2 class="mt-24" style="font-size:1.15rem;">Tests – Erinnerung</h2>
          <p style="color:var(--color-text-muted); font-size:0.82rem; margin:-4px 0 12px;">Nur ein Status-Hinweis – Tests selbst werden im eigenen Reiter „Tests" eingetragen, nicht hier.</p>`}
          <div id="tests-section"></div>
        `;

        document.getElementById('af-apply').addEventListener('click', () => {
          const fromVal = document.getElementById('af-from').value;
          const toVal = document.getElementById('af-to').value;
          currentFrom = fromVal ? new Date(fromVal).toISOString() : null;
          currentTo = toVal ? new Date(toVal + 'T23:59:59').toISOString() : null;
          currentExerciseId = document.getElementById('af-exercise').value || null;
          el.querySelectorAll('.filter-presets button').forEach((b) => b.classList.remove('active'));
          load();
        });
        document.getElementById('af-exercise').addEventListener('change', (e) => {
          currentExerciseId = e.target.value || null;
          renderProgressChart(logs);
        });
        el.querySelectorAll('.filter-presets button').forEach((btn) => {
          btn.addEventListener('click', () => {
            el.querySelectorAll('.filter-presets button').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            const { from, to } = presetRange(btn.dataset.preset);
            currentFrom = from; currentTo = to;
            load();
          });
        });

        renderProgressChart(logs);
        renderDysbalanceSection(logs);
        const preventionEl = document.getElementById('prevention-section');
        if (preventionEl) renderPreventionSection(preventionEl, clientId, { isAdminView });
        const trendsEl = document.getElementById('trends-section');
        if (trendsEl) renderTrendsSection(trendsEl, clientId);
        const testsEl = document.getElementById('tests-section');
        if (testsEl) {
          if (isAdminView) renderTestsSection(testsEl, clientId, { isAdminView: true });
          else renderTestsReminder(testsEl, clientId, { isAdminView });
        }
      }

      function renderProgressChart(logs) {
        const chartEl = document.getElementById('progress-chart');
        const tableEl = document.getElementById('progress-table');
        if (!chartEl) return;
        if (!currentExerciseId) { chartEl.innerHTML = '<p style="color:var(--color-text-muted); font-size:0.85rem;">Keine Übungsdaten im gewählten Zeitraum.</p>'; tableEl.innerHTML = ''; return; }

        const exLogs = logs.filter((l) => l.exercise_id === currentExerciseId);
        const bySession = {};
        for (const log of exLogs) {
          const key = log.session_id || ('day:' + log.performed_at.slice(0, 10));
          const m = logMetric(log);
          if (!m) continue;
          if (!bySession[key]) bySession[key] = { date: log.performed_at, type: m.type, unit: m.unit, value: 0 };
          bySession[key].value += m.value;
          if (log.performed_at < bySession[key].date) bySession[key].date = log.performed_at;
        }
        const points = Object.values(bySession).sort((a, b) => new Date(a.date) - new Date(b.date));

        if (points.length === 0) {
          chartEl.innerHTML = '<p style="color:var(--color-text-muted); font-size:0.85rem;">Für diese Übung liegen im gewählten Zeitraum noch keine Einträge vor.</p>';
          tableEl.innerHTML = '';
          return;
        }
        if (points.length < 2) {
          chartEl.innerHTML = `<p style="color:var(--color-text-muted); font-size:0.85rem;">Erst ein Datenpunkt (${formatDateOnly(points[0].date)}: ${points[0].value.toFixed(1)} ${points[0].unit}) – für einen Verlauf braucht es mindestens zwei Trainingseinheiten mit dieser Übung.</p>`;
          tableEl.innerHTML = '';
          return;
        }

        const unit = points[0].unit;
        const width = 640, height = 220, padding = 36;
        const values = points.map((p) => p.value);
        const minV = Math.min(0, ...values), maxV = Math.max(...values);
        const range = (maxV - minV) || 1;
        const coords = points.map((p, i) => ({
          x: padding + (i / (points.length - 1 || 1)) * (width - padding * 2),
          y: height - padding - ((p.value - minV) / range) * (height - padding * 2),
          date: p.date, value: p.value,
        }));
        const pathD = coords.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');

        chartEl.innerHTML = `
          <svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; overflow:visible;">
            <line x1="${padding}" y1="${height - padding}" x2="${width - padding}" y2="${height - padding}" stroke="var(--color-border)" stroke-width="1" />
            <path d="${pathD}" fill="none" stroke="var(--color-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            ${coords.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--color-gold)" class="chart-point" data-date="${p.date}" data-value="${p.value.toFixed(1)}" style="cursor:pointer;" />`).join('')}
          </svg>
          <div class="chart-tooltip" id="progress-tooltip"></div>
        `;
        const tooltip = document.getElementById('progress-tooltip');
        chartEl.querySelectorAll('.chart-point').forEach((pt) => {
          pt.addEventListener('mouseenter', (e) => {
            const rect = chartEl.getBoundingClientRect();
            tooltip.textContent = `${formatDateOnly(pt.dataset.date)}: ${pt.dataset.value} ${unit}`;
            tooltip.style.left = (e.clientX - rect.left) + 'px';
            tooltip.style.top = (e.clientY - rect.top) + 'px';
            tooltip.style.opacity = '1';
          });
          pt.addEventListener('mouseleave', () => { tooltip.style.opacity = '0'; });
        });

        tableEl.innerHTML = `<table class="log-table"><thead><tr><th>Datum</th><th>Wert (${escapeHtml(unit)})</th></tr></thead><tbody>
          ${points.map((p) => `<tr><td>${formatDateOnly(p.date)}</td><td>${p.value.toFixed(1)}</td></tr>`).join('')}
        </tbody></table>`;
      }

      function renderDysbalanceSection(logs) {
        const dysEl = document.getElementById('dysbalance-section');
        if (!dysEl) return;

        const totals = {};
        for (const log of logs) {
          const m = logMetric(log);
          if (!m || m.type !== 'volume') continue;
          const pattern = log.exercises && log.exercises.movement_pattern;
          if (!pattern || pattern === 'sonstige') continue;
          totals[pattern] = (totals[pattern] || 0) + m.value;
        }

        const pairs = [
          { title: 'Push / Pull (Oberkörper)', aKey: 'push_oberkoerper', bKey: 'pull_oberkoerper' },
          { title: 'Vordere / Hintere Beinkette', aKey: 'vordere_beinkette', bKey: 'hintere_beinkette' },
          { title: 'Rumpf vorne / hinten', aKey: 'rumpf_vorne', bKey: 'rumpf_hinten' },
        ];

        const hasAnyData = pairs.some((p) => (totals[p.aKey] || 0) > 0 || (totals[p.bKey] || 0) > 0);
        if (!hasAnyData) {
          dysEl.innerHTML = '<p style="color:var(--color-text-muted); font-size:0.85rem;">Noch keine mit Gewicht geloggten Sätze im gewählten Zeitraum, aus denen sich eine Belastungsverteilung berechnen ließe.</p>';
          return;
        }

        dysEl.innerHTML = `
          <div class="dysbalance-legend">
            <span><i style="background:var(--color-gold);"></i> Vorderseite / Push</span>
            <span><i style="background:var(--chart-teal);"></i> Rückseite / Pull</span>
          </div>
          ${pairs.map((p) => {
            const a = totals[p.aKey] || 0;
            const b = totals[p.bKey] || 0;
            if (a === 0 && b === 0) return '';
            const max = Math.max(a, b, 1);
            const ratio = a === 0 || b === 0 ? Infinity : Math.max(a, b) / Math.min(a, b);
            let verdict, cls;
            if (a === 0 || b === 0) { verdict = 'Eine Seite ist im Zeitraum noch komplett unbelastet.'; cls = 'alert'; }
            else if (ratio <= 1.2) { verdict = 'Ausgewogen.'; cls = 'ok'; }
            else if (ratio <= 1.5) { verdict = 'Leichtes Ungleichgewicht.'; cls = 'warn'; }
            else { verdict = 'Deutliches Ungleichgewicht – ggf. gezielt gegensteuern.'; cls = 'alert'; }
            return `<div class="dysbalance-pair">
              <div class="pair-title">${escapeHtml(p.title)}</div>
              <div class="dysbalance-bar-row">
                <div class="side-label">${escapeHtml(MOVEMENT_PATTERN_LABELS[p.aKey])}</div>
                <div class="dysbalance-bar-track"><div class="dysbalance-bar-fill" style="width:${(a / max * 100).toFixed(1)}%; background:var(--color-gold);"></div></div>
                <div class="dysbalance-bar-value">${Math.round(a)} kg</div>
              </div>
              <div class="dysbalance-bar-row">
                <div class="side-label">${escapeHtml(MOVEMENT_PATTERN_LABELS[p.bKey])}</div>
                <div class="dysbalance-bar-track"><div class="dysbalance-bar-fill" style="width:${(b / max * 100).toFixed(1)}%; background:var(--chart-teal);"></div></div>
                <div class="dysbalance-bar-value">${Math.round(b)} kg</div>
              </div>
              <div class="dysbalance-verdict ${cls}">${verdict}</div>
            </div>`;
          }).join('')}
        `;
      }

      await load();
    }

    init();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
  <script type="module" src="js/legal-links.js"></script>
</body>
</html>

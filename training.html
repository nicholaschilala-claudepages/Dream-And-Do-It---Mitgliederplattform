<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training – Dream And Do It</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#053446" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Runde 15: für den On-Demand-Monatsbericht (js/monthly-report.js) — analog
       zum bestehenden Wochenreport in betrieb.html, per CDN wie überall sonst
       in dieser Plattform, kein zusätzlicher Build-Schritt nötig. -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    :root { --chart-teal: #1479a3; }
    .plan-card { margin-bottom: 20px; }
    .day-block { margin-bottom: 18px; }
    .day-block h3 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-gold); margin: 0 0 8px; }
    .exercise-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--color-border); flex-wrap: wrap; }
    .exercise-row:last-child { border-bottom: none; }
    .exercise-row img.thumb, .thumb-img {
      width: 88px; height: 88px; object-fit: contain; background: var(--color-bg);
      border: 1px solid var(--color-border); border-radius: 8px; flex-shrink: 0; cursor: zoom-in;
    }
    .thumb-sm { width: 40px; height: 40px; object-fit: contain; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 6px; flex-shrink: 0; cursor: zoom-in; }
    /* Runde 18 (Nachtrag): sichtbarer Platzhalter statt komplett unsichtbarem
       Bild, wenn eine hinterlegte image_url nicht lädt (siehe onExerciseImgError) –
       zeigt so sofort ein Deployment-Problem an, statt es zu verstecken. */
    .img-missing {
      display: flex; align-items: center; justify-content: center; text-align: center;
      background: var(--color-bg); border: 1px dashed var(--color-border); border-radius: 8px;
      color: var(--color-text-muted); font-size: 0.62rem; line-height: 1.3; cursor: help;
    }
    .thumb.img-missing { width: 88px; height: 88px; flex-shrink: 0; }
    .thumb-sm.img-missing { width: 40px; height: 40px; flex-shrink: 0; }
    .exercise-meta { flex: 1; min-width: 220px; }
    .exercise-meta h4 { margin: 0 0 2px 0; font-family: var(--font-body); font-weight: 600; font-size: 0.98rem; }
    /* Nutzer-Feedback Runde 18: "Sätze, Wiederholungen und Gewichte stehen
       nicht sauber genug da" – deutlich größer/fetter statt der bisherigen
       kleinen, grauen Zeile, damit die Trainingsvorgabe auf einen Blick
       erfassbar ist. */
    .exercise-meta .target { font-size: 1.02rem; font-weight: 700; color: var(--color-text); letter-spacing: 0.01em; }
    .exercise-meta .muscle { font-size: 0.76rem; color: var(--color-text-muted); font-style: italic; }
    /* Runde 18: Übungsbeschreibung ist jetzt immer eingeklappt (siehe
       <details> in renderExerciseRow) und wird erst beim Aufklappen
       gerendert/sichtbar – dadurch werden die Zeilen je Übung deutlich
       schmaler, wie gewünscht. */
    .exercise-desc-details { margin-top: 4px; }
    .exercise-desc-details summary { cursor: pointer; font-size: 0.82rem; color: var(--color-gold); font-weight: 600; list-style: none; user-select: none; }
    .exercise-desc-details summary::-webkit-details-marker { display: none; }
    .exercise-desc-details summary::before { content: '▸ '; }
    .exercise-desc-details[open] summary::before { content: '▾ '; }
    .exercise-desc-details p { margin: 6px 0 0; font-size: 0.85rem; color: var(--color-text-muted); }
    .log-form { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    .log-form input { width: 78px; padding: 7px 8px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); }
    /* Runde 18: Eingabefelder sind mit den Trainer-Vorgaben vorausgefüllt
       (siehe renderExerciseRow) – die nativen Zahlenfeld-Pfeile bleiben
       bewusst sichtbar, damit sich der Wert per Klick/Pfeiltasten anpassen
       lässt, ohne dass getippt werden muss. */
    .log-form input.prefilled { border-color: var(--color-gold); background: color-mix(in srgb, var(--color-gold) 8%, var(--color-bg)); }
    .log-form button { padding: 7px 12px; font-size: 0.8rem; }
    table.log-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    table.log-table th, table.log-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--color-border); }
    .exercise-builder-row { display: grid; grid-template-columns: 44px 1.7fr 0.7fr 0.9fr 1fr 0.9fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
    .exercise-builder-row select, .exercise-builder-row input { padding: 8px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); width: 100%; }
    /* Neuer, umfangreicherer Übungs-Baustein (Etappe 31 Builder-Überarbeitung):
       eigene Klasse, damit die einfache Ein-Zeilen-Form (.exercise-builder-row,
       "Übung zu bestehendem Plan hinzufügen") unverändert bleibt. */
    .ex-builder-row { border: 1px solid var(--color-border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: var(--color-surface); }
    .ex-builder-row select, .ex-builder-row input { padding: 7px 8px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); font-size: 0.85rem; }
    .ex-builder-row-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .ex-builder-row-top .row-filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .ex-builder-row-top .row-filters select { min-width: 130px; }
    .ex-builder-row-top .row-exercise { flex: 1; min-width: 200px; }
    .ex-builder-row-top .row-remove-btn { margin-left: auto; }
    .set-mode-toggle { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--color-text-muted); margin: 4px 0 8px; }
    .set-mode-toggle input { width: auto; padding: 0; }
    .same-for-all-fields { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .same-for-all-fields input { flex: 1; min-width: 100px; }
    .set-rows-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .set-row-item { display: flex; gap: 6px; align-items: center; }
    .set-row-item .set-index { font-size: 0.76rem; color: var(--color-text-muted); width: 50px; flex-shrink: 0; }
    .set-row-item input { flex: 1; }
    .cardio-fields { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .cardio-fields input { flex: 1; min-width: 150px; }
    .ex-builder-row .row-notes { width: 100%; }
    .small-btn { padding: 6px 10px; font-size: 0.78rem; width: auto; }
    .status-pill { font-size: 0.72rem; padding: 2px 8px; border-radius: 12px; white-space: nowrap; }
    .status-pill.active { background: rgba(47,111,79,0.15); color: var(--color-success); }
    .status-pill.inactive { background: rgba(0,0,0,0.08); color: var(--color-text-muted); }
    .status-pill.ok { background: rgba(47,111,79,0.15); color: var(--color-success); }
    .status-pill.over { background: rgba(180,120,0,0.15); color: var(--color-gold); }
    .status-pill.under { background: rgba(180,40,40,0.12); color: #b42828; }
    .offline-banner { background: rgba(200,124,0,0.15); color: var(--color-gold); padding: 8px 14px; border-radius: 8px; font-size: 0.82rem; margin-bottom: 14px; display:none; }
    .day-builder { border: 1px solid var(--color-border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    .day-builder-header { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .day-builder-header input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); }
    .template-card { border: 1px solid var(--color-border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    .template-card h3 { margin: 0 0 4px; font-size: 1.02rem; }
    .template-exercise-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 20px; padding: 2px 10px 2px 2px; margin: 3px 4px 3px 0; font-size: 0.78rem; }
    .template-exercise-chip img { width: 22px; height: 22px; object-fit: contain; border-radius: 50%; background: var(--color-surface); }

    .lightbox-overlay { position: fixed; inset: 0; background: rgba(5,10,12,0.88); display: none; align-items: center; justify-content: center; z-index: 1000; cursor: zoom-out; padding: 28px; }
    .lightbox-overlay.open { display: flex; }
    .lightbox-overlay img { max-width: 92vw; max-height: 88vh; object-fit: contain; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .lightbox-close { position: absolute; top: 18px; right: 22px; color: #fff; font-size: 1.6rem; cursor: pointer; line-height: 1; }

    .session-banner { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: rgba(200,124,0,0.08); border: 1px solid rgba(200,124,0,0.3); border-radius: 10px; padding: 12px 16px; margin-bottom: 18px; flex-wrap: wrap; }
    .session-banner.active { background: rgba(47,111,79,0.1); border-color: rgba(47,111,79,0.35); }
    .session-banner select { padding: 7px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); }

    .stat-tiles { display: flex; gap: 12px; flex-wrap: wrap; margin: 4px 0 20px; }
    .stat-tile { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 10px 16px; min-width: 140px; }
    .stat-tile .value { font-size: 1.25rem; font-weight: 700; color: var(--color-navy); }
    :root[data-theme="dark"] .stat-tile .value { color: var(--color-gold-light); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stat-tile .value { color: var(--color-gold-light); } }
    .stat-tile .label { font-size: 0.74rem; color: var(--color-text-muted); }

    .analytics-filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 8px; }
    .analytics-filters .field { margin-bottom: 0; min-width: 160px; }
    .filter-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .filter-presets button { padding: 5px 12px; font-size: 0.76rem; border-radius: 20px; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-muted); cursor: pointer; }
    .filter-presets button.active { background: var(--color-gold); color: #1a1a1a; border-color: var(--color-gold); }

    .chart-tooltip { position: absolute; background: var(--color-navy); color: #fff; font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; pointer-events: none; opacity: 0; transition: opacity 0.1s; white-space: nowrap; transform: translate(-50%, -130%); }

    .dysbalance-legend { display: flex; gap: 18px; font-size: 0.8rem; margin-bottom: 14px; color: var(--color-text-muted); }
    .dysbalance-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dysbalance-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .dysbalance-pair { margin-bottom: 18px; }
    .dysbalance-pair .pair-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .dysbalance-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .dysbalance-bar-row .side-label { width: 130px; font-size: 0.78rem; color: var(--color-text-muted); flex-shrink: 0; }
    .dysbalance-bar-track { flex: 1; background: var(--color-border); border-radius: 5px; height: 16px; overflow: hidden; }
    .dysbalance-bar-fill { height: 100%; border-radius: 5px 0 0 5px; }
    .dysbalance-bar-value { width: 90px; text-align: right; font-size: 0.78rem; flex-shrink: 0; }
    .dysbalance-verdict { font-size: 0.8rem; margin-top: 2px; }
    .dysbalance-verdict.ok { color: var(--color-success); }
    .dysbalance-verdict.warn { color: var(--color-gold); }
    .dysbalance-verdict.alert { color: var(--color-danger); }
    .hidden { display: none; }
    .result-box {
      background: rgba(200,124,0,0.08); border: 1px solid rgba(200,124,0,0.25);
      border-radius: 10px; padding: 16px;
    }
    .result-box .big { font-family: var(--font-heading); font-size: 1.5rem; color: var(--color-navy); }
    :root[data-theme="dark"] .result-box .big { color: var(--color-gold-light); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .result-box .big { color: var(--color-gold-light); } }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 520px) { .grid-2 { grid-template-columns: 1fr; } }
    .qn-details summary {
      cursor: pointer; font-family: var(--font-heading); font-size: 0.8rem;
      color: var(--color-gold); font-weight: 600; letter-spacing: 0.02em;
    }
    .qn-details summary:hover { text-decoration: underline; }
    .qn-details[open] summary { margin-bottom: 4px; }

    /* Nutzer-Feedback Runde 14: Trainingstagebuch zeigt nur noch ganze
       Trainingseinheiten (anklickbar/aufklappbar) statt einer flachen Liste
       aller Einzelsätze. */
    .diary-session { border: 1px solid var(--color-border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
    .diary-session summary { cursor: pointer; padding: 12px 14px; list-style: none; }
    .diary-session summary::-webkit-details-marker { display: none; }
    .diary-session summary::before { content: '▸ '; color: var(--color-gold); }
    .diary-session[open] summary::before { content: '▾ '; }
    .diary-session-summary { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .diary-session-body { padding: 0 14px 14px; border-top: 1px solid var(--color-border); }
    .diary-exercise { margin-top: 12px; }
    .diary-exercise-name { font-weight: 600; font-size: 0.88rem; margin-bottom: 4px; }

    /* Nutzer-Feedback Runde 14: Schnell-Logging per Button. */
    .quick-log-btn { margin-left: 8px; }

    /* Nutzer-Feedback Runde 14: Verlaufsgrafen ("Meine Entwicklung") je
       Gelenk/Muskelgruppe sowie Gesamt-Trends für Beweglichkeit/Kraftausdauer. */
    .trend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 10px; }
    .trend-card { border: 1px solid var(--color-border); border-radius: 10px; padding: 12px 14px; }
    .trend-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <img src="icons/logo-mark.png" alt="Dream And Do It Logo" onerror="this.style.display='none'" />
        <span class="brand-text">
          <span class="brand-name">DREAM AND DO IT</span>
          <span class="brand-tagline">Training und Coaching für Ihren Erfolg</span>
        </span>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" id="theme-toggle" type="button">Hell/Dunkel</button>
        <button class="icon-btn" id="logout-btn" type="button">Abmelden</button>
      </div>
    </div>
    <div id="nav-tabs-slot"></div>

    <div class="container wide" id="app-container">
      <p class="center-text">Lade …</p>
    </div>
  </div>

  <div class="lightbox-overlay" id="lightbox-overlay">
    <span class="lightbox-close">✕</span>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <script type="module">
    import { supabaseClient } from './js/supabase-client.js';
    import { getCurrentSession, initTheme, toggleTheme, signOut } from './js/auth.js';
    import {
      listExercises, createExercise, deleteExercise,
      listClients,
      listTemplates, getTemplate, createTemplate, updateTemplate, deleteTemplate,
      listMyActivePlans, listPlansForAdmin, getPlanForAdmin, createPlan, assignTemplateToClient,
      addExerciseToPlan, removePlanExercise, setPlanActive,
      insertTrainingLog, insertTrainingLogs, listMyTrainingLogs, listMyRecentSessions, listLogsForPlanExercises,
      getActiveSession, startSession, endSession, listLogsForAnalytics, listSessions,
      listAllTrainingLogsForRecords, computePersonalRecords, prLogIdSet, computeTrainingStreak,
    } from './js/training.js';
    import { queueTrainingLog, syncQueuedLogs } from './js/offline-queue.js';
    import { getUnreadCount } from './js/messages.js';
    import { getNewSignupCount } from './js/betrieb.js';
    import { navTabsHtml, bindNavSubmenus } from './js/nav.js';
    import { SECTION_INFO } from './js/section-info.js';
    import { listMyBodyMeasurements, listNutritionLogs, getLatestEnergyTarget } from './js/nutrition.js';
    import { buildMonthlyReportPdf } from './js/monthly-report.js';
    import { awardAchievement } from './js/achievements.js';
    import {
      calcAge, updateBirthDate, STRENGTH_TESTS, MOBILITY_TESTS, CARDIO_TESTS, mobilityRatingLabel,
      MOBILITY_RATING_VISUALS, getStaleTestSummary,
      evaluateStrengthBenchmark, evaluateBodyFatCategory, evaluateSittingScore,
      insertPreventionResult, listPreventionResults, deletePreventionResult,
      latestByKey, isStale, computePreventionScore,
      computeCooperVO2max, computeRockportVO2max, evaluateCardioFitness,
      NUTRITION_QUIZ, NUTRITION_QUIZ_SOURCE, computeNutritionQuizScore, evaluateNutritionQuality,
      SMOKING_OPTIONS, SMOKING_SOURCE, evaluateSmokingStatus,
      ALCOHOL_SOURCE, evaluateAlcoholRisk,
    } from './js/prevention.js';
    import {
      CLIENT_SUBTABS, loadClientSubtabLocks, shouldGateSubtab, lockedSubtabHtml, setSubtabAccess,
    } from './js/subtab-access.js';

    initTheme();
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await signOut();
      window.location.href = 'index.html';
    });

    const container = document.getElementById('app-container');
    let currentProfile = null;
    // Runde 18: pro Kunde geladene Sperren einzelner Unterpunkte (siehe
    // js/subtab-access.js / sql/046) – einmal beim Laden der Seite abgefragt,
    // dann in activateClientTab() vor jedem Render geprüft.
    let subtabLocks = new Set();

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('de-DE') + ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    }

    function formatDateOnly(iso) {
      return new Date(iso).toLocaleDateString('de-DE');
    }

    function formatDuration(sec) {
      if (sec == null) return '–';
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return m > 0 ? `${m} Min. ${s ? s + ' Sek.' : ''}`.trim() : `${s} Sek.`;
    }

    // --- Bilder: Lightbox zum Maximieren -------------------------------------

    const lightboxOverlay = document.getElementById('lightbox-overlay');
    const lightboxImg = document.getElementById('lightbox-img');
    window.openLightbox = function (src, alt) {
      if (!src) return;
      lightboxImg.src = src;
      lightboxImg.alt = alt || '';
      lightboxOverlay.classList.add('open');
    };
    lightboxOverlay.addEventListener('click', () => lightboxOverlay.classList.remove('open'));

    // Runde 18 (Nachtrag): Übungsbilder, die trotz korrekt hinterlegter
    // image_url nicht laden (z.B. weil die Bilddatei im Repo/GitHub Pages
    // fehlt), wurden bisher per onerror komplett unsichtbar gemacht
    // (display:none) — dadurch war für niemanden erkennbar, OB und WARUM
    // ein Bild fehlt. Jetzt wird stattdessen ein kleiner, dezenter Platzhalter
    // mit dem genauen Dateipfad angezeigt (auch als Tooltip abrufbar), damit
    // ein Deployment-Problem (Bilddatei nicht hochgeladen) sofort auffällt,
    // statt sich hinter einer leeren Fläche zu verstecken.
    window.onExerciseImgError = function (imgEl) {
      const path = imgEl.getAttribute('data-src') || imgEl.src;
      const placeholder = document.createElement('div');
      placeholder.className = imgEl.className + ' img-missing';
      placeholder.title = 'Bilddatei nicht gefunden: ' + path;
      placeholder.innerHTML = '<span>🖼️<br />Bild fehlt</span>';
      imgEl.replaceWith(placeholder);
    };

    const CATEGORY_ORDER = ['Mobilisation', 'Kraft', 'Bodyweight', 'Cardio'];
    // Nutzer-Feedback Runde 13: einzige zulässige Muskelgruppen (vorher 76
    // verschiedene Freitext-Varianten je nach Insert-Charge) — nur für
    // Kraft/Bodyweight relevant, siehe sql/033_muskelgruppen_konsolidierung.sql.
    // 'muscle_group' bei diesen Übungen ist jetzt eine kommagetrennte Liste
    // aus dieser festen Liste (mehrere Einträge möglich, z.B. Bankdrücken →
    // 'Brust, Trizeps, Schulter').
    const CANONICAL_MUSCLE_GROUPS = [
      'Ganzkörper', 'Schulter', 'Trizeps', 'Bizeps', 'Brust', 'Trapez',
      'Latissimus', 'Rückenstrecker', 'Bauchmuskeln', 'Gesäß', 'Oberschenkel', 'Waden',
    ];
    const MOVEMENT_PATTERN_LABELS = {
      push_oberkoerper: 'Push (Oberkörper)',
      pull_oberkoerper: 'Pull (Oberkörper)',
      vordere_beinkette: 'Vordere Beinkette',
      hintere_beinkette: 'Hintere Beinkette',
      rumpf_vorne: 'Rumpf vorne',
      rumpf_hinten: 'Rumpf hinten',
      sonstige: 'Sonstige',
    };

    function groupExercisesByCategory(exercises) {
      const groups = {};
      for (const ex of exercises) {
        const cat = ex.category || 'Sonstige';
        (groups[cat] = groups[cat] || []).push(ex);
      }
      return groups;
    }

    function exerciseOptionsHtml(exercises) {
      const groups = groupExercisesByCategory(exercises);
      const order = [...CATEGORY_ORDER, ...Object.keys(groups).filter((c) => !CATEGORY_ORDER.includes(c))];
      return order
        .filter((cat) => groups[cat] && groups[cat].length)
        .map((cat) => `<optgroup label="${escapeHtml(cat)}">${groups[cat].map((ex) => `<option value="${ex.id}">${escapeHtml(ex.name)}</option>`).join('')}</optgroup>`)
        .join('');
    }

    async function init() {
      const session = await getCurrentSession();
      if (!session) { window.location.href = 'index.html'; return; }

      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('id, full_name, role, access_locked, training_enabled, nutrition_enabled, coaching_enabled, birth_date')
        .eq('id', session.user.id)
        .maybeSingle();

      if (error || !profile) {
        container.innerHTML = `<div class="card lock-screen"><div class="icon">⚠️</div><h2>Profil konnte nicht geladen werden</h2><p style="color:var(--color-text-muted);">${escapeHtml(error ? error.message : 'Unbekannter Fehler')}</p></div>`;
        return;
      }
      if (profile.access_locked) {
        container.innerHTML = `<div class="card lock-screen"><div class="icon">🔒</div><h2>Zugang derzeit gesperrt</h2><p style="color:var(--color-text-muted);">Bitte wende dich an uns, um deinen Zugang zu klären.</p></div>`;
        return;
      }

      currentProfile = profile;
      mountNavTabs(profile);

      if (profile.role !== 'admin' && !profile.training_enabled) {
        renderLockedTeaser();
        return;
      }

      if (profile.role === 'admin') {
        await renderAdminView();
      } else {
        const { locks } = await loadClientSubtabLocks(profile.id);
        subtabLocks = locks;
        await renderClientRoot(profile);
      }

      trySyncOfflineLogs();
      window.addEventListener('online', trySyncOfflineLogs);
    }

    // Etappe 19: gemeinsame Kopfzeilen-Reiterleiste (siehe js/nav.js) statt

    // =========================================================================

    const CLIENT_TRAINING_TABS = [
      { key: 'start', label: 'Start', hidden: true },

    function computeStatus(pe, logsForThis) {
      if (!logsForThis || logsForThis.length === 0) return null;
      if (pe.target_duration_seconds) {
        const withDuration = logsForThis.filter((l) => l.duration_seconds != null);
        if (withDuration.length === 0) return null;
        const last = withDuration[0];
        const diff = last.duration_seconds - pe.target_duration_seconds;
        if (diff === 0) return { label: 'genau nach Plan', cls: 'ok' };
        if (diff > 0) return { label: `+${formatDuration(diff)} über Vorgabe`, cls: 'over' };
        return { label: `${formatDuration(-diff)} unter Vorgabe`, cls: 'under' };
      }
      if (pe.target_sets) {
        const done = logsForThis.length;
        if (done === pe.target_sets) return { label: `${done}/${pe.target_sets} Sätze – nach Plan`, cls: 'ok' };
        if (done > pe.target_sets) return { label: `${done}/${pe.target_sets} Sätze – mehr als Vorgabe`, cls: 'over' };
        return { label: `${done}/${pe.target_sets} Sätze – weniger als Vorgabe`, cls: 'under' };
      }
      return null;
    }

    // Nutzer-Feedback Runde 14: Hilfsfunktionen fürs Schnell-Logging – Plan-
    // Vorgaben (die als Freitext wie "60 kg", "8-12" oder "12,10,8" hinterlegt
    // sind) werden automatisch in konkrete Satz-für-Satz-Werte übersetzt
    // (Nutzerwunsch: "Plan-Werte automatisch übernehmen"). Die Werte bleiben
    // danach ganz normal über das Formular bzw. Trainingstagebuch editierbar.
    function extractLeadingNumber(str) {
      if (str == null || str === '') return null;
      const m = String(str).match(/(\d+(?:[.,]\d+)?)/);
      if (!m) return null;
      return parseFloat(m[1].replace(',', '.'));
    }

    function parsePerSetValues(str, setCount) {
      if (str == null || str === '' || !setCount) return [];
      const raw = String(str).trim();
      // Kommagetrennte Werte je Satz, z.B. "12,10,8"
      if (raw.includes(',')) {
        const parts = raw.split(',').map((p) => extractLeadingNumber(p)).filter((n) => n != null);
        if (parts.length > 0) {
          const out = [];
          for (let i = 0; i < setCount; i++) out.push(parts[i] != null ? parts[i] : parts[parts.length - 1]);
          return out;
        }
      }
      // Bereich, z.B. "8-12" – für alle Sätze den unteren (konservativeren) Wert ansetzen
      const rangeMatch = raw.match(/(\d+(?:[.,]\d+)?)\s*-\s*(\d+(?:[.,]\d+)?)/);
      if (rangeMatch) {
        const lower = parseFloat(rangeMatch[1].replace(',', '.'));
        return Array(setCount).fill(lower);
      }
      // Einzelner Wert, der für alle Sätze gilt
      const single = extractLeadingNumber(raw);
      if (single != null) return Array(setCount).fill(single);
      return [];
    }

    // Baut aus den Plan-Vorgaben einer Übung direkt fertige Satz-Einträge –
    // ein Klick loggt die ganze Übung mit den Plan-Werten als Ist-Werten.
    function buildQuickLogEntries(pe, clientId, activeSession) {
      const ex = pe.exercises;
      const isDurationBased = !!pe.target_duration_seconds;
      const isDistanceBased = !!pe.target_distance_meters || (ex && ex.category === 'Cardio');
      const now = new Date().toISOString();
      const sessionId = activeSession ? activeSession.id : null;
      const distance = pe.target_distance_meters != null ? extractLeadingNumber(pe.target_distance_meters) : null;

      if (isDurationBased) {
        return [{
          client_id: clientId,
          exercise_id: ex.id,
          plan_exercise_id: pe.id,
          session_id: sessionId,
          performed_at: now,
          set_number: 1,
          reps: null,
          weight_kg: null,
          duration_seconds: pe.target_duration_seconds || null,
          distance_meters: distance,
        }];
      }

      const setCount = pe.target_sets || 1;
      const repsPerSet = parsePerSetValues(pe.target_reps, setCount);
      const weightPerSet = parsePerSetValues(pe.target_weight_hint, setCount);

      const entries = [];
      for (let i = 0; i < setCount; i++) {
        entries.push({
          client_id: clientId,
          exercise_id: ex.id,
          plan_exercise_id: pe.id,
          session_id: sessionId,
          performed_at: now,
          set_number: i + 1,
          reps: repsPerSet[i] != null ? Math.round(repsPerSet[i]) : null,
          weight_kg: weightPerSet[i] != null ? weightPerSet[i] : null,
          duration_seconds: null,
          distance_meters: isDistanceBased ? distance : null,
        });
      }
      return entries;
    }

    // Nutzer-Feedback Runde 14: nach Trainingseinheiten gruppiertes
    // Trainingstagebuch statt einer flachen Liste aller Einzel-Sätze – jede
    // Einheit ist per Klick auf/zuklappbar, darunter die Übungen mit ihren
    // Sätzen. Logs ohne session_id (z.B. vor Einführung dieser Zuordnung
    // erfasst) werden nach Kalendertag gruppiert, damit auch ältere Einträge
    // sinnvoll dargestellt bleiben.
    function renderTrainingDiaryHtml(logs, sessions, prLogIds) {
      if (!logs || logs.length === 0) {
        return '<p style="color:var(--color-text-muted);">Noch keine Einträge vorhanden.</p>';
      }

      const sessionsById = {};
      for (const s of sessions || []) sessionsById[s.id] = s;

      const groups = new Map();
      for (const log of logs) {
        const key = log.session_id ? `s:${log.session_id}` : `d:${formatDateOnly(log.performed_at)}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(log);
      }

      const groupEntries = Array.from(groups.entries()).map(([key, groupLogs]) => {
        const latestTime = groupLogs.reduce((max, l) => (l.performed_at > max ? l.performed_at : max), groupLogs[0].performed_at);
        return { key, groupLogs, latestTime };
      }).sort((a, b) => (a.latestTime < b.latestTime ? 1 : -1));

      return groupEntries.map(({ key, groupLogs }) => {
        const sessionId = key.startsWith('s:') ? key.slice(2) : null;
        const session = sessionId ? sessionsById[sessionId] : null;

        const dateLabel = formatDate(groupLogs[0].performed_at);
        const titleParts = [];
        if (session && session.training_plans && session.training_plans.title) titleParts.push(session.training_plans.title);
        if (session && session.training_plan_days && session.training_plan_days.label) titleParts.push(session.training_plan_days.label);
        const title = titleParts.length > 0 ? titleParts.join(' · ') : (sessionId ? 'Trainingseinheit' : 'Einträge ohne Einheit');

        const byExercise = new Map();
        for (const log of groupLogs) {
          const exId = log.exercise_id || 'unbekannt';
          if (!byExercise.has(exId)) byExercise.set(exId, { name: log.exercises ? log.exercises.name : 'Unbekannte Übung', logs: [] });
          byExercise.get(exId).logs.push(log);
        }

        const exerciseCount = byExercise.size;
        const setCount = groupLogs.length;
        const calories = session && session.calories_burned ? ` · ${session.calories_burned} kcal` : '';

        const exercisesHtml = Array.from(byExercise.values()).map((exGroup) => {
          const sortedLogs = exGroup.logs.slice().sort((a, b) => (a.set_number || 0) - (b.set_number || 0));
          return `<div class="diary-exercise">
            <div class="diary-exercise-name">${escapeHtml(exGroup.name)}</div>
            <table class="log-table"><thead><tr><th>Satz</th><th>Wdh.</th><th>Gewicht</th><th>Dauer</th><th>Distanz</th></tr></thead><tbody>
              ${sortedLogs.map((l) => {
                const isPr = prLogIds && prLogIds.has(l.id);
                return `<tr${isPr ? ' class="pr-row"' : ''}>
                <td>${l.set_number ?? '–'}</td>
                <td>${l.reps ?? '–'}${isPr ? ' <span class="pr-badge" title="Neuer persönlicher Rekord">🏆 PR</span>' : ''}</td>
                <td>${l.weight_kg != null ? l.weight_kg + ' kg' : '–'}</td>
                <td>${l.duration_seconds != null ? formatDuration(l.duration_seconds) : '–'}</td>
                <td>${l.distance_meters != null ? l.distance_meters + ' m' : '–'}</td>
              </tr>`;
              }).join('')}
            </tbody></table>
          </div>`;
        }).join('');

        return `<details class="diary-session">
          <summary>
            <div class="diary-session-summary">
              <strong>${escapeHtml(dateLabel)}</strong> · ${escapeHtml(title)}
              <span style="color:var(--color-text-muted); font-size:0.82rem;"> — ${exerciseCount} Übung${exerciseCount === 1 ? '' : 'en'}, ${setCount} Satz/Sätze${calories}</span>
            </div>
          </summary>
          <div class="diary-session-body">
            ${exercisesHtml}
          </div>
        </details>`;
      }).join('');
    }

    // Kraft-Rekord-Tracker & Streak-Zähler (Runde 15): baut die Karte "Deine
    // Rekorde & deine Serie" — Streak-Kacheln oben, darunter ein Feed der
    // zuletzt aufgestellten persönlichen Rekorde. Reine Darstellungsfunktion,
    // die Berechnung übernehmen computePersonalRecords()/computeTrainingStreak()
    // aus js/training.js auf Basis der ohnehin geloggten Trainingsdaten — für
    // den Kunden entsteht kein zusätzlicher Erfassungsaufwand.
    function prFeedIcon(type) {
      if (type === 'weight') return '🏋️';
      if (type === 'e1rm') return '📈';
      return '🔁';
    }

    function prFeedLabel(event) {
      if (event.type === 'weight') {
        return `Neues Bestgewicht: <strong>${event.weightKg} kg</strong> bei ${event.reps} Wdh. — ${escapeHtml(event.exerciseName)}`;
      }
      if (event.type === 'e1rm') {
        return `Neue geschätzte Maximalkraft (1RM): <strong>${event.value.toFixed(1)} kg</strong> — ${escapeHtml(event.exerciseName)}`;
      }
      return `Neue Bestleistung: <strong>${event.reps} Wdh.</strong> — ${escapeHtml(event.exerciseName)}`;
    }

    function renderRecordsCardHtml(streak, prEvents, prRecords) {
      const recentPrs = (prEvents || []).slice(0, 6);
      const exerciseCountWithRecords = (prRecords || []).length;
      const prFeedHtml = recentPrs.length > 0
        ? `<div class="pr-feed">${recentPrs.map((e) => `
            <div class="pr-feed-item">
              <span class="pr-feed-icon">${prFeedIcon(e.type)}</span>
              <span>${prFeedLabel(e)}</span>
              <span class="pr-feed-date">${formatDate(e.performedAt)}</span>
            </div>`).join('')}</div>`
        : `<p style="color:var(--color-text-muted); font-size:0.88rem;">Noch keine Rekorde erkannt — sobald du Gewicht oder Wiederholungen steigerst, taucht dein erster Rekord automatisch hier auf.</p>`;

      const streakNote = streak.currentStreak > 0
        ? (streak.currentWeekActive ? 'Diese Woche schon aktiv — weiter so!' : 'Diese Woche noch keine Einheit geloggt.')
        : 'Starte diese Woche mit einer Einheit, um eine neue Serie zu beginnen.';

      return `<div class="card mt-24">
        <h2 style="font-size:1.05rem;">Deine Rekorde &amp; deine Serie</h2>
        <div class="records-summary-row">
          <div class="streak-tile">
            <span class="streak-number">${streak.currentStreak}</span>
            <span class="streak-label">Woche${streak.currentStreak === 1 ? '' : 'n'} am Stück trainiert</span>
          </div>
          <div class="streak-tile">
            <span class="streak-number">${streak.longestStreak}</span>
            <span class="streak-label">Beste Serie bisher</span>
          </div>
        </div>
        <p style="color:var(--color-text-muted); font-size:0.8rem; margin-top:-10px; margin-bottom:16px;">${escapeHtml(streakNote)} Zählt: mind. 1 Trainingseinheit pro Kalenderwoche.</p>
        <h3 style="font-size:0.92rem; margin-bottom:10px;">Zuletzt aufgestellte Rekorde${exerciseCountWithRecords > 0 ? ` <span style="color:var(--color-text-muted); font-weight:400; font-size:0.78rem;">(Bestleistungen in ${exerciseCountWithRecords} Übung${exerciseCountWithRecords === 1 ? '' : 'en'})</span>` : ''}</h3>
        ${prFeedHtml}
      </div>`;
    }

    // Nutzer-Feedback Runde 14: Wurde direkt nacheinander ein zweiter Satz
    // geloggt bevor der erste renderClientView()-Aufruf fertig neu geladen
    // hatte, liefen zwei überlappende renderClientView()-Aufrufe parallel.
    // Da beide unabhängig voneinander die Logs neu abfragen und derjenige,
    // der zuletzt fertig wird, den DOM-Inhalt überschreibt, konnte der
    // LANGSAMERE (ältere) Aufruf den neueren Stand überschreiben — sichtbar
    // z.B. als "1/2 Sätze", obwohl beide Sätze bereits gespeichert waren.
    // Fix: ein Generationszähler sorgt dafür, dass nur der zuletzt gestartete
    // Aufruf seinen Ladezustand tatsächlich ins DOM schreibt; ein durch einen
    // neueren Aufruf überholter Lauf bricht vor dem finalen Schreiben ab.
    let clientViewRenderGeneration = 0;

    async function renderClientView(content, profile) {
      const myGeneration = ++clientViewRenderGeneration;
      content.innerHTML = `<p class="center-text">Lade deinen Trainingsplan …</p>`;

      const [{ data: plans, error: plansError }, { data: activeSession }] = await Promise.all([
        listMyActivePlans(profile.id),
        getActiveSession(profile.id),
      ]);
      if (plansError) {
        if (myGeneration === clientViewRenderGeneration) {
          content.innerHTML = `<div class="msg error">Trainingsplan konnte nicht geladen werden: ${escapeHtml(plansError.message)}</div>`;
        }
        return;
      }

      const allPlanExerciseIds = (plans || []).flatMap((p) => (p.plan_exercises || []).map((pe) => pe.id));
      // Nutzer-Feedback Runde 14: flache Liste aller Plan-Übungen (mit Plan-Id)
      // fürs Schnell-Logging einer ganzen Einheit auf einen Klick.
      const allPlanExercisesFlat = (plans || []).flatMap((p) => (p.plan_exercises || []).map((pe) => ({ ...pe, __planId: p.id })));
      const [{ data: logsForStatus }, { data: recentLogs }, { data: recentSessions }, queuedCount, { data: allLogsForRecords }] = await Promise.all([
        listLogsForPlanExercises(profile.id, allPlanExerciseIds),
        listMyTrainingLogs(profile.id),
        listMyRecentSessions(profile.id),
        (async () => (await (await import('./js/offline-queue.js')).getQueuedLogs()).length)(),
        listAllTrainingLogsForRecords(profile.id),
      ]);

      const logsByPlanExercise = {};
      for (const log of logsForStatus || []) {
        (logsByPlanExercise[log.plan_exercise_id] = logsByPlanExercise[log.plan_exercise_id] || []).push(log);
      }

      // Kraft-Rekord-Tracker & Streak-Zähler (Runde 15): aus der kompletten
      // Trainingshistorie (nicht nur den letzten Einträgen) berechnet, damit
      // auch ältere Bestleistungen erkannt werden. Reine Berechnung ohne
      // zusätzliche Erfassung — nutzt ausschließlich bereits geloggte Sätze.
      const { records: prRecords, prEvents } = computePersonalRecords(allLogsForRecords || []);
      const prLogIds = prLogIdSet(prEvents);
      const trainingStreak = computeTrainingStreak((allLogsForRecords || []).map((l) => l.performed_at));

      let html = '';

      if (!navigator.onLine || queuedCount > 0) {
        html += `<div class="offline-banner" style="display:block;">
          ${!navigator.onLine ? 'Du bist offline – neue Einträge werden lokal gespeichert und synchronisiert, sobald wieder Internet da ist.' : ''}
          ${queuedCount > 0 ? ` ${queuedCount} Eintrag/Einträge warten noch auf Synchronisierung.` : ''}
        </div>`;
      }

      // Trainingseinheit-Banner (Start/Ende)
      const allDays = (plans || []).flatMap((p) => (p.training_plan_days || []).map((d) => ({ ...d, planId: p.id, planTitle: p.title })));
      if (activeSession) {
        const startedLabel = formatDate(activeSession.started_at);
        html += `<div class="session-banner active">
          <div><strong>Trainingseinheit läuft</strong> · gestartet ${startedLabel}</div>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <button class="btn secondary small-btn quick-log-btn" id="quick-log-session-btn" type="button">Ganze Einheit schnell loggen</button>
            <input type="number" id="end-session-calories" min="0" step="1" placeholder="kcal verbrannt (optional)" style="width:180px; padding:6px 8px; border-radius:6px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text); font-size:0.82rem;" />
            <button class="btn secondary small-btn" id="end-session-btn" type="button">Einheit beenden</button>
          </div>
        </div>`;
      } else {
        html += `<div class="session-banner">
          <div>
            <strong>Keine Trainingseinheit aktiv</strong>
            <div style="font-size:0.78rem; color:var(--color-text-muted);">Starte eine Einheit, damit deine Sätze als eine Einheit gezählt und ausgewertet werden können.</div>
          </div>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            ${allDays.length > 0 ? `<select id="start-session-day"><option value="">– ohne festen Tag –</option>${allDays.map((d) => `<option value="${d.planId}|${d.id}">${escapeHtml(d.planTitle)} · ${escapeHtml(d.label)}</option>`).join('')}</select>` : ''}
            <button class="btn small-btn" id="start-session-btn" type="button">Trainingseinheit starten</button>
          </div>
        </div>`;
      }

      if (!plans || plans.length === 0) {
        html += `<div class="card"><h2 style="font-size:1.1rem;">Noch kein Trainingsplan zugewiesen</h2><p style="color:var(--color-text-muted);">Dein Coach hat dir noch keinen aktiven Trainingsplan zugewiesen. Melde dich gerne, falls du Fragen dazu hast.</p></div>`;
      }

      for (const plan of plans || []) {
        const days = (plan.training_plan_days || []).sort((a, b) => a.sort_order - b.sort_order);
        const allExercises = (plan.plan_exercises || []).sort((a, b) => a.sort_order - b.sort_order);
        const looseExercises = allExercises.filter((pe) => !pe.plan_day_id);

        html += `<div class="card plan-card">
          <h2 style="font-size:1.1rem;">${escapeHtml(plan.title)}</h2>
          ${plan.notes ? `<p style="color:var(--color-text-muted); margin-top:-8px;">${escapeHtml(plan.notes)}</p>` : ''}
          ${days.map((day) => {
            const dayExercises = allExercises.filter((pe) => pe.plan_day_id === day.id);
            if (dayExercises.length === 0) return '';
            return `<div class="day-block">
              <h3>${escapeHtml(day.label)}</h3>
              ${dayExercises.map((pe) => renderExerciseRow(pe, logsByPlanExercise[pe.id], activeSession)).join('')}
            </div>`;
          }).join('')}
          ${looseExercises.length > 0 ? `<div class="day-block">
            ${days.length > 0 ? '<h3>Weitere Übungen</h3>' : ''}
            ${looseExercises.map((pe) => renderExerciseRow(pe, logsByPlanExercise[pe.id], activeSession)).join('')}
          </div>` : ''}
        </div>`;
      }

      html += `<div class="card mt-24">
        <h2 style="font-size:1.05rem;">Mein Trainingstagebuch</h2>
        ${renderTrainingDiaryHtml(recentLogs, recentSessions, prLogIds)}
      </div>`;

      html += renderRecordsCardHtml(trainingStreak, prEvents, prRecords);

      // Ein inzwischen neuer gestarteter Render (z.B. durch einen zweiten,
      // schneller abgeschlossenen Satz-Log) hat Vorrang — dieser hier ist
      // überholt und darf den aktuelleren Stand nicht mehr überschreiben.
      if (myGeneration !== clientViewRenderGeneration) return;

      content.innerHTML = html;

      const startBtn = document.getElementById('start-session-btn');
      if (startBtn) {
        startBtn.addEventListener('click', async () => {
          const sel = document.getElementById('start-session-day');
          let planId = null, planDayId = null;
          if (sel && sel.value) { [planId, planDayId] = sel.value.split('|'); }
          startBtn.disabled = true;
          const { error } = await startSession({ clientId: profile.id, planId, planDayId });
          if (error) { alert('Fehler: ' + error.message); startBtn.disabled = false; return; }
          renderClientView(content, profile);
        });
      }
      const endBtn = document.getElementById('end-session-btn');
      if (endBtn) {
        endBtn.addEventListener('click', async () => {
          endBtn.disabled = true;
          const caloriesInput = document.getElementById('end-session-calories');
          const caloriesBurned = caloriesInput && caloriesInput.value ? parseFloat(caloriesInput.value) : null;
          const { error } = await endSession(activeSession.id, { caloriesBurned });
          if (error) { alert('Fehler: ' + error.message); endBtn.disabled = false; return; }
          renderClientView(content, profile);
        });
      }

      content.querySelectorAll('.log-form').forEach((form) => {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const exerciseId = form.dataset.exerciseId;
          const planExerciseId = form.dataset.planExerciseId;
          const setNumber = form.querySelector('.f-set') ? (parseInt(form.querySelector('.f-set').value, 10) || null) : null;
          const reps = form.querySelector('.f-reps') ? (parseInt(form.querySelector('.f-reps').value, 10) || null) : null;
          const weight = form.querySelector('.f-weight') && form.querySelector('.f-weight').value ? parseFloat(form.querySelector('.f-weight').value) : null;
          const distance = form.querySelector('.f-distance') && form.querySelector('.f-distance').value ? parseFloat(form.querySelector('.f-distance').value) : null;
          const durationMin = form.querySelector('.f-duration-min') ? (parseFloat(form.querySelector('.f-duration-min').value) || 0) : 0;
          const durationSec = form.querySelector('.f-duration-sec') ? (parseFloat(form.querySelector('.f-duration-sec').value) || 0) : 0;
          const duration = (durationMin || durationSec) ? Math.round(durationMin * 60 + durationSec) : null;

          const entry = {
            client_id: profile.id,
            exercise_id: exerciseId,
            plan_exercise_id: planExerciseId || null,
            session_id: activeSession ? activeSession.id : null,
            performed_at: new Date().toISOString(),
            set_number: setNumber,
            reps,
            weight_kg: weight,
            duration_seconds: duration,
            distance_meters: distance,
          };

          const submitBtn = form.querySelector('button');
          submitBtn.disabled = true;
          submitBtn.textContent = 'Speichert …';

          let ok = false;
          if (navigator.onLine) {
            const { error } = await insertTrainingLog(entry);
            ok = !error;
            if (error) await queueTrainingLog(entry);
          } else {
            ok = await queueTrainingLog(entry);
          }

          submitBtn.disabled = false;
          submitBtn.textContent = 'Eintragen';

          if (ok) {
            renderClientView(content, profile);
          } else {
            alert('Der Eintrag konnte weder gespeichert noch in die Offline-Warteschlange gelegt werden.');
          }
        });
      });

      // Nutzer-Feedback Runde 14: Schnell-Logging je Übung – übernimmt die
      // Plan-Vorgaben (Sätze/Wdh./Gewicht bzw. Dauer/Distanz) automatisch als
      // Ist-Werte, damit nicht jeder Satz einzeln eingetippt werden muss.
      content.querySelectorAll('.quick-log-btn[data-plan-exercise-id]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const peId = btn.dataset.planExerciseId;
          const pe = allPlanExercisesFlat.find((p) => p.id === peId);
          if (!pe) return;
          const originalText = btn.textContent;
          btn.disabled = true;
          btn.textContent = 'Speichert …';
          const entries = buildQuickLogEntries(pe, profile.id, activeSession);
          const { error } = await insertTrainingLogs(entries);
          if (error) {
            alert('Fehler beim Schnell-Loggen: ' + error.message);
            btn.disabled = false;
            btn.textContent = originalText;
            return;
          }
          renderClientView(content, profile);
        });
      });

      // Nutzer-Feedback Runde 14: Schnell-Logging der ganzen Einheit – loggt
      // alle Übungen des zur laufenden Einheit gehörenden Trainingstages (bzw.
      // aller zugewiesenen Übungen, falls kein fester Tag gewählt wurde) auf
      // einmal mit den Plan-Vorgaben.
      const quickLogSessionBtn = document.getElementById('quick-log-session-btn');
      if (quickLogSessionBtn) {
        quickLogSessionBtn.addEventListener('click', async () => {
          let targets = allPlanExercisesFlat;
          if (activeSession && activeSession.plan_day_id) {
            targets = targets.filter((pe) => pe.plan_day_id === activeSession.plan_day_id);
          } else if (activeSession && activeSession.plan_id) {
            targets = targets.filter((pe) => pe.__planId === activeSession.plan_id);
          }
          if (targets.length === 0) {
            alert('Für diese Einheit konnten keine Übungen gefunden werden.');
            return;
          }
          const originalText = quickLogSessionBtn.textContent;
          quickLogSessionBtn.disabled = true;
          quickLogSessionBtn.textContent = 'Speichert …';
          const allEntries = targets.flatMap((pe) => buildQuickLogEntries(pe, profile.id, activeSession));
          const { error } = await insertTrainingLogs(allEntries);
          if (error) {
            alert('Fehler beim Schnell-Loggen der Einheit: ' + error.message);
            quickLogSessionBtn.disabled = false;
            quickLogSessionBtn.textContent = originalText;
            return;
          }
          renderClientView(content, profile);
        });
      }
    }

    function renderExerciseRow(pe, logsForThis, activeSession) {
      const ex = pe.exercises;
      const isDurationBased = !!pe.target_duration_seconds;
      const isDistanceBased = !!pe.target_distance_meters || ex.category === 'Cardio';
      const target = [
        pe.target_sets ? `${pe.target_sets} Sätze` : null,
        pe.target_reps ? `${pe.target_reps} Wdh.` : null,
        pe.target_weight_hint ? pe.target_weight_hint : null,
        pe.target_duration_seconds ? `Ziel: ${formatDuration(pe.target_duration_seconds)}` : null,
        pe.target_distance_meters ? `Ziel: ${pe.target_distance_meters} m` : null,
        pe.target_speed_kmh ? `Ziel: ${pe.target_speed_kmh} km/h` : null,
        pe.target_watt ? `Ziel: ${pe.target_watt} Watt` : null,
        pe.target_heart_rate_percent ? `Ziel: ${pe.target_heart_rate_percent}% HFmax` : null,
      ].filter(Boolean).join(' · ');

      const status = computeStatus(pe, logsForThis);

      // Runde 18: editierbare Felder werden mit den Trainer-Vorgaben
      // vorausgefüllt, damit per Pfeiltasten (native Zahlenfeld-Spinner)
      // angepasst statt komplett neu eingetippt werden muss. Die Satz-Nr.
      // wird auf den nächsten noch nicht geloggten Satz hochgezählt, Wdh.
      // kommt direkt aus der Plan-Vorgabe, Gewicht wird – soweit als Zahl
      // erkennbar – aus dem freien "Gewicht-Hinweis"-Text des Trainers
      // extrahiert (z.B. "ca. 20 kg" -> 20).
      const nextSetNumber = (logsForThis ? logsForThis.length : 0) + 1;
      const defaultReps = pe.target_reps || null;
      const weightHintMatch = pe.target_weight_hint ? String(pe.target_weight_hint).match(/(\d+(?:[.,]\d+)?)/) : null;
      const defaultWeight = weightHintMatch ? weightHintMatch[1].replace(',', '.') : null;

      return `<div class="exercise-row">
        ${ex.image_url ? `<img class="thumb" data-src="${escapeHtml(ex.image_url)}" src="${escapeHtml(ex.image_url)}" alt="${escapeHtml(ex.name)}" onerror="onExerciseImgError(this)" onclick="openLightbox('${escapeHtml(ex.image_url)}', '${escapeHtml(ex.name)}')" />` : ''}
        <div class="exercise-meta">
          <h4>${escapeHtml(ex.name)}</h4>
          ${ex.muscle_group ? `<div class="muscle">Beanspruchte Muskulatur: ${escapeHtml(ex.muscle_group)}</div>` : ''}
          ${target ? `<div class="target">${escapeHtml(target)}</div>` : ''}
          ${ex.description ? `<details class="exercise-desc-details"><summary>Übungsbeschreibung</summary><p>${escapeHtml(ex.description)}</p></details>` : ''}
          ${pe.notes ? `<p style="margin:4px 0 0; font-size:0.82rem; color:var(--color-gold);">Hinweis vom Coach: ${escapeHtml(pe.notes)}</p>` : ''}
          ${status ? `<div style="margin-top:6px;"><span class="status-pill ${status.cls}">${escapeHtml(status.label)}</span></div>` : ''}
          ${!activeSession ? `<p style="margin:6px 0 0; font-size:0.76rem; color:var(--color-gold);">Starte oben eine Trainingseinheit, damit dieser Satz einer Einheit zugeordnet wird.</p>` : ''}
          <form class="log-form" data-exercise-id="${ex.id}" data-plan-exercise-id="${pe.id}">
            ${isDurationBased ? `<input class="f-duration-min" type="number" min="0" placeholder="Min." style="width:64px;" />
                 <input class="f-duration-sec" type="number" min="0" max="59" placeholder="Sek." style="width:64px;" />` : ''}
            ${!isDurationBased ? `<input class="f-set" type="number" min="1" placeholder="Satz Nr." value="${nextSetNumber}" class="prefilled" required />
                 <input class="f-reps" type="number" min="0" placeholder="Wdh." ${defaultReps ? `value="${defaultReps}" class="prefilled"` : ''} required />
                 <input class="f-weight" type="number" min="0" step="0.5" placeholder="kg" ${defaultWeight ? `value="${defaultWeight}" class="prefilled"` : ''} />` : ''}
            ${isDistanceBased ? `<input class="f-distance" type="number" min="0" step="1" placeholder="Distanz (m)" />` : ''}
            <button class="btn secondary small-btn" type="submit">Eintragen</button>
            ${(pe.target_sets || pe.target_duration_seconds) ? `<button class="btn secondary small-btn quick-log-btn" type="button" data-plan-exercise-id="${pe.id}" title="Übernimmt die Plan-Vorgaben als Ist-Werte – danach editierbar">Übung schnell loggen</button>` : ''}
          </form>
        </div>
      </div>`;
    }

    // =========================================================================
    // PRÄVENTIONSCHECK (gemeinsam für Kunde & Trainer)
    // =========================================================================

    const BALANCE_PAIRS = [
      { aKey: 'push_oberkoerper', bKey: 'pull_oberkoerper' },
      { aKey: 'vordere_beinkette', bKey: 'hintere_beinkette' },
      { aKey: 'rumpf_vorne', bKey: 'rumpf_hinten' },
    ];

    const SIDE_LABEL = { left: 'links', right: 'rechts', both: 'beidseitig' };

    function renderPreventionTab(content, profile, { isAdminView }) {
      renderPreventionSection(content, profile.id, { isAdminView });
    }

    function severityColor(sev) {
      // Nutzer-Feedback Runde 10: "keine Daten" hellblau statt grau, damit sich
      // der Marker sichtbar vom (ebenfalls grauen) Körper abhebt, aber klar vom
      // Ampelsystem (grün/gold/rot) der echten Bewertungen unterscheidet.
      return { ok: 'var(--color-success)', warn: 'var(--color-gold)', alert: 'var(--color-danger)', unknown: 'var(--color-info)' }[sev] || 'var(--color-info)';
    }

    // Anatomische Körper-Illustration, Nutzer-Feedback Runde 5: "wie ein
    // echter Mensch, mit weichen Linien" statt einfacher Strichmännchen.
    // Runde 9: statt EINER gemischten Vorder-/Rückansicht jetzt VIER Ansichten
    // – Gelenke (Vorder-/Rückansicht) und Muskeln (Vorder-/Rückansicht)
    // sauber getrennt, mit anatomisch präzisen Bezeichnungen je Ansicht statt
    // eines Mischmaschs, damit z.B. "Schulter" eindeutig als Gelenk- ODER
    // Muskel-Bezug erkennbar ist.
    // Runde 10: ALLE Beschriftungen (nicht nur mittige) liegen jetzt konsequent
    // auf zwei festen "Schienen" links/rechts AUSSERHALB der Silhouette
    // (LEFT_RAIL_X/RIGHT_RAIL_X), verbunden per gestrichelter Linie mit dem
    // jeweiligen Punkt – vorher wanderte eine seitlich versetzte Beschriftung
    // (z.B. "Hüfte li.") nur 11 Einheiten vom Punkt weg und konnte so mit dem
    // an der Seite herabhängenden Arm kollidieren. viewBox ist entsprechend
    // breiter (-50..250 statt -30..230), damit auch längere Bezeichnungen
    // (z.B. "Muskeln Arm li.") auf der Schiene noch Platz haben.
    // Runde 18: die zuvor per SVG-Pfaden handgezeichnete Silhouette
    // (frontBodyShape/backBodyShape) wurde durch die vom Nutzer bereit-
    // gestellten anatomischen Fotos ersetzt (Skelett vorne/hinten für die
    // Gelenke-Ansichten, Muskulatur vorne/hinten für die Muskeln-Ansichten).
    // Die 4 Bilder wurden aus der Vorlage ausgeschnitten, freigestellt
    // (schwarzer Hintergrund -> transparent) und einheitlich zugeschnitten,
    // sodass sich der Körper in allen 4 Bildern an derselben Position/
    // Skalierung befindet (siehe BODY_IMG_*). Die Marker-Koordinaten unten
    // wurden anhand der auf dem Skelett-Foto bereits vorhandenen blauen
    // Gelenkkugeln neu vermessen (Schulter/Ellbogen/Handgelenk/Hüfte/Knie/
    // Fußgelenk); die Muskel-Marker (Brust, Bauch, Arm, Oberschenkel,
    // oberer/unterer Rücken, Beinrückseite, Wade) sind davon anatomisch
    // plausibel abgeleitet, da das Muskelfoto selbst keine Markierungen
    // trägt. Alle Marker/Farben/Legenden/Beschriftungen sind unverändert
    // gegenüber Runde 10-17 erhalten geblieben, nur als Overlay auf dem
    // Foto statt auf der gezeichneten Silhouette.

    const LEFT_RAIL_X = 26;
    const RIGHT_RAIL_X = 174;

    // Einheitliche Bild-Platzierung für alle vier Foto-Hintergründe: exakt
    // gleiche x/y/Breite/Höhe, damit die fest einprogrammierten Marker-
    // Koordinaten unten für alle vier Ansichten zueinander passen.
    const BODY_IMG_X = 24, BODY_IMG_Y = 0, BODY_IMG_W = 152, BODY_IMG_H = 400;
    function bodyImage(src) {
      return `<image href="${src}" x="${BODY_IMG_X}" y="${BODY_IMG_Y}" width="${BODY_IMG_W}" height="${BODY_IMG_H}" preserveAspectRatio="xMidYMid meet" />`;
    }

    // Einheitlicher Marker: Punkt + gestrichelte Verbindungslinie + Beschriftung
    // auf der linken/rechten Schiene. `side` ist 'left' oder 'right' – mittige
    // Marker (z.B. Brust, Bauch, oberer/unterer Rücken) nutzen 'right', damit
    // auch sie der einheitlichen Regel "immer außerhalb, immer per Linie
    // verbunden" folgen statt einer Sonderbehandlung.
    function markerDot(cx, cy, sev, title, label, side) {
      const rail = side === 'left' ? LEFT_RAIL_X : RIGHT_RAIL_X;
      const anchor = side === 'left' ? 'end' : 'start';
      const lineStartX = side === 'left' ? cx - 7 : cx + 7;
      return `
        <g>
          <line x1="${lineStartX}" y1="${cy}" x2="${rail}" y2="${cy}" stroke="var(--color-text-muted)" stroke-width="1" stroke-dasharray="1.5 2" opacity="0.6" />
          <circle cx="${cx}" cy="${cy}" r="7.5" fill="${severityColor(sev)}" stroke="var(--color-bg)" stroke-width="1.5"><title>${escapeHtml(title)}</title></circle>
          <text x="${rail}" y="${cy + 3}" font-size="7.5" fill="var(--color-text-muted)" text-anchor="${anchor}">${escapeHtml(label)}</text>
        </g>`;
    }

    function viewTitle(text) {
      // Runde 18/Nachtrag 4 (Nutzer-Feedback): Ansichts-Beschriftung (z.B.
      // "GELENKE – VORDERANSICHT") saß bisher bei y="393" quasi AUF dem Foto
      // (Bildhöhe endet bei 400) und war mit font-size 12 in der stark
      // herunterskalierten Anzeige (190px Darstellungsbreite bei 300
      // viewBox-Einheiten) kaum lesbar. Jetzt: eigener Bereich unterhalb des
      // Fotos (viewBox um 36 Einheiten höher, Bild bleibt unverändert bei
      // 0-400), deutlich größere Schrift, klarer Abstand zur Visualisierung.
      return `<text x="100" y="422" font-size="16" font-weight="700" letter-spacing="0.4" fill="var(--color-text)" text-anchor="middle">${escapeHtml(text)}</text>`;
    }

          ${markerDot(67, 77, markers.shoulderLeft.sev, markers.shoulderLeft.title, 'Schulter li.', 'left')}
          ${markerDot(136, 76, markers.shoulderRight.sev, markers.shoulderRight.title, 'Schulter re.', 'right')}
          ${markerDot(54, 146, markers.elbowLeft.sev, markers.elbowLeft.title, 'Ellbogen li.', 'left')}
          ${markerDot(147, 145, markers.elbowRight.sev, markers.elbowRight.title, 'Ellbogen re.', 'right')}
          ${markerDot(42, 192, markers.wristLeft.sev, markers.wristLeft.title, 'Handgelenk li.', 'left')}

    function backMusclesSvg(markers) {

        <svg viewBox="-50 0 300 436" style="width:190px; height:auto; flex-shrink:0;">
          ${bodyImage('content/koerper-balance/koerper-muskeln-hinten.png')}
          ${markerDot(100, 102, markers.upperBack.sev, markers.upperBack.title, 'Oberer Rücken', 'right')}
          ${markerDot(100, 162, markers.lowerBack.sev, markers.lowerBack.title, 'Unterer Rücken', 'right')}
          ${markerDot(70, 237, markers.hamstringLeft.sev, markers.hamstringLeft.title, 'Beinrückseite li.', 'left')}
          ${markerDot(116, 237, markers.hamstringRight.sev, markers.hamstringRight.title, 'Beinrückseite re.', 'right')}
          ${markerDot(70, 315, markers.calfLeft.sev, markers.calfLeft.title, 'Wade li.', 'left')}

    function bodyVisualHtml(markers, notices) {
      // Vier Ansichten (Runde 9): Gelenke vorne/hinten, Muskeln vorne/hinten –
      // jeweils nicht gespiegelt, Bildseiten entsprechen den Körperseiten.
      return `
        <div>
          <h3 style="font-size:1.08rem; margin:0 0 18px; color:var(--color-text-muted); text-transform:uppercase; letter-spacing:0.04em; font-weight:700;">Gelenke</h3>
          <div style="display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start;">
            ${frontJointsSvg(markers)}
            ${backJointsSvg(markers)}
          </div>

    function miniSparklineHtml(points, unit) {
      if (!points || points.length < 2) return '<p style="color:var(--color-text-muted); font-size:0.8rem;">Für einen Verlauf braucht es mindestens zwei Messungen.</p>';
      const width = 280, height = 64, padding = 10;
      const values = points.map((p) => p.value);
      const minV = Math.min(...values), maxV = Math.max(...values);
      const range = (maxV - minV) || 1;
      const coords = points.map((p, i) => ({
        x: padding + (i / (points.length - 1)) * (width - padding * 2),
        y: height - padding - ((p.value - minV) / range) * (height - padding * 2),
      }));
      const pathD = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ' ' + c.y.toFixed(1)).join(' ');
      return `
        <svg viewBox="0 0 ${width} ${height}" style="width:100%; max-width:280px; height:${height}px;">
          <path d="${pathD}" fill="none" stroke="var(--color-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          ${coords.map((c) => `<circle cx="${c.x}" cy="${c.y}" r="3" fill="var(--color-gold)" />`).join('')}
        </svg>
        <div style="font-size:0.72rem; color:var(--color-text-muted);">${points[0].value}${unit ? ' ' + unit : ''} → ${points[points.length - 1].value}${unit ? ' ' + unit : ''}</div>
      `;
    }

    // Nutzer-Feedback Runde 14: `hideLifestyleForms` blendet die Selbstauskunft-
    // Formulare zu Sitzverhalten/Schlafseite/Ernährung/Rauchen/Alkohol aus –
    // diese Fragen sollen NUR noch im Präventionscheck-Tab erscheinen, nicht
    // mehr zusätzlich im Bereich "Meine Entwicklung" (renderAnalyticsView).
    // Die zugrundeliegenden Werte fließen unabhängig davon weiterhin in Score
    // und Körper-Visualisierung ein, nur die Eingabe-Karten werden versteckt.
    async function renderPreventionSection(el, clientId, { isAdminView, hideLifestyleForms } = {}) {
      el.innerHTML = '<p class="center-text">Lade Präventionscheck …</p>';

      const twelveWeeksAgo = new Date(Date.now() - 84 * 86400000).toISOString();
      const [{ data: profileRow }, { data: bodyMeasurements }, { data: allResults, error: resultsError }, { data: balanceLogs }] = await Promise.all([
        supabaseClient.from('profiles').select('birth_date').eq('id', clientId).maybeSingle(),
        listMyBodyMeasurements(clientId),
        listPreventionResults(clientId),
        listLogsForAnalytics(clientId, { from: twelveWeeksAgo }),
      ]);
      if (resultsError) { el.innerHTML = `<div class="msg error">${escapeHtml(resultsError.message)}</div>`; return; }

      const birthDate = profileRow ? profileRow.birth_date : null;
      const ageYears = calcAge(birthDate);
      const latestBodyMeasurement = (bodyMeasurements || [])[(bodyMeasurements || []).length - 1] || null;
      const sex = latestBodyMeasurement ? latestBodyMeasurement.sex : null;
      const bodyFatPercent = latestBodyMeasurement ? latestBodyMeasurement.body_fat_percent : null;

      const results = allResults || [];
      const latest = latestByKey(results);

      const totals = {};
      for (const log of balanceLogs || []) {
        const m = logMetric(log);
        if (!m || m.type !== 'volume') continue;
        const pattern = log.exercises && log.exercises.movement_pattern;
        if (!pattern || pattern === 'sonstige') continue;
        totals[pattern] = (totals[pattern] || 0) + m.value;
      }
      const balancePairRatios = BALANCE_PAIRS.map((p) => {
        const a = totals[p.aKey] || 0, b = totals[p.bKey] || 0;
        if (a === 0 && b === 0) return { ratio: null };
        if (a === 0 || b === 0) return { ratio: Infinity };
        return { ratio: Math.max(a, b) / Math.min(a, b) };
      });

      const { total, breakdown } = computePreventionScore({ ageYears, sex, latestResults: latest, bodyFatPercent, balancePairRatios });
      // Nutzer-Feedback Runde 8: Kraftausdauertests sollen nicht im
      // Präventionsbereich AUFGELISTET werden (die eigentliche Eingabe/Anzeige
      // der Tests erfolgt im Tab "Tests"), fließen aber weiterhin in den
      // Präventions-Score mit ein – daher wird hier nur die Anzeige gefiltert,
      // `total` bleibt unverändert aus der vollständigen `breakdown` berechnet.
      const displayBreakdown = breakdown.filter((b) => b.key !== 'strength');

      // Körper-Visual: Marker-Schweregrade berechnen
      const asymmetrySeverity = (leftCm, rightCm) => {
        if (leftCm == null || rightCm == null) return { sev: 'unknown', title: 'Keine Umfangsmessung vorhanden' };
        const diffPct = Math.abs(leftCm - rightCm) / Math.max(leftCm, rightCm) * 100;
        if (diffPct >= 8) return { sev: 'alert', title: `Deutliche Seitendifferenz (${diffPct.toFixed(1)}%): links ${leftCm}cm / rechts ${rightCm}cm` };
        if (diffPct >= 4) return { sev: 'warn', title: `Leichte Seitendifferenz (${diffPct.toFixed(1)}%): links ${leftCm}cm / rechts ${rightCm}cm` };
        return { sev: 'ok', title: `Ausgeglichen: links ${leftCm}cm / rechts ${rightCm}cm` };
      };
      const mobilitySeverity = (row, label) => {
        if (!row) return { sev: 'unknown', title: `${label}: keine Daten` };
        const v = Math.sign(row.value);
        if (v < 0) return { sev: 'alert', title: `${label}: eingeschränkt` };
        if (v === 0) return { sev: 'warn', title: `${label}: normal` };
        return { sev: 'ok', title: `${label}: gut` };
      };
      // Runde 9: Brustmuskulatur/Bauchmuskeln auf der Muskeln-Vorderansicht
      // bekommen keinen eigenen neuen Test, sondern nutzen die ohnehin
      // erfassten Kraftausdauertests als Näherung (Liegestütz beansprucht
      // primär die Brustmuskulatur, Plank primär die Bauchmuskeln/den Rumpf).
      const strengthSeverity = (testKey, label) => {
        const row = latest[testKey];
        if (!row) return { sev: 'unknown', title: `${label}: keine Daten` };
        if (ageYears == null) return { sev: 'unknown', title: `${label}: kein Geburtsdatum hinterlegt` };
        const evalRes = evaluateStrengthBenchmark(testKey, ageYears, row.value, sex);
        if (!evalRes.bandFound || !evalRes.key) return { sev: 'unknown', title: `${label}: keine Referenzwerte für dieses Alter` };
        if (evalRes.key === 'below') return { sev: 'alert', title: `${label}: ${evalRes.label}` };
        if (evalRes.key === 'low') return { sev: 'warn', title: `${label}: ${evalRes.label}` };
        return { sev: 'ok', title: `${label}: ${evalRes.label}` };
      };
      // Für Knie, Fußgelenke und oberen Rücken gibt es aktuell keinen Test –
      // ehrlich als "keine Daten" ausweisen statt zu schätzen.
      const noData = (label) => ({ sev: 'unknown', title: `${label}: aktuell kein Test hinterlegt` });
      // Nutzer-Feedback Runde 14: neue Mess-/Visualisierungspunkte (Handgelenke,
      // Ellbogen, zweiter Punkt Beinrückseite) – nach Absegnung durch den Nutzer
      // ("Beide anpassen (empfohlen)") jetzt mit echten, evidenzbasierten Tests
      // hinterlegt (wrist_extension, elbow_extension, ake_hamstring in
      // js/prevention.js), inkl. wandgestützter AKE-Variante und Spiegel-/
      // Handyfoto-Hinweis beim Thomas-Test, damit alle Tests ohne Hilfsperson
      // durchführbar sind.

      const armSev = latestBodyMeasurement ? asymmetrySeverity(latestBodyMeasurement.arm_left_cm, latestBodyMeasurement.arm_right_cm) : { sev: 'unknown', title: 'Keine Umfangsmessung vorhanden' };
      const thighSev = latestBodyMeasurement ? asymmetrySeverity(latestBodyMeasurement.thigh_left_cm, latestBodyMeasurement.thigh_right_cm) : { sev: 'unknown', title: 'Keine Umfangsmessung vorhanden' };
      const calfSev = latestBodyMeasurement ? asymmetrySeverity(latestBodyMeasurement.calf_left_cm, latestBodyMeasurement.calf_right_cm) : { sev: 'unknown', title: 'Keine Umfangsmessung vorhanden' };

      const sittingRow = latest.sitting_hours;
      const sittingEval = sittingRow ? evaluateSittingScore(sittingRow.value) : null;
      const sittingSev = !sittingRow ? { sev: 'unknown', title: 'Keine Angabe zur Sitzzeit' }
        : sittingEval.score >= 85 ? { sev: 'ok', title: `${sittingRow.value} Std./Tag Sitzzeit – ${sittingEval.label}` }
        : sittingEval.score >= 65 ? { sev: 'warn', title: `${sittingRow.value} Std./Tag Sitzzeit – ${sittingEval.label}` }
        : { sev: 'alert', title: `${sittingRow.value} Std./Tag Sitzzeit – ${sittingEval.label}. Hohe Sitzzeit ist mit Rückenbeschwerden und kardiometabolischen Risiken assoziiert.` };

      const sleepRow = latest.sleep_side;
      const sleepSev = !sleepRow ? { sev: 'unknown', title: 'Keine Angabe zur Schlafseite' }
        : Number(sleepRow.value) === 0 ? { sev: 'ok', title: 'Rücken/wechselnde Schlafseite' }
        : { sev: 'warn', title: `Überwiegend auf ${Number(sleepRow.value) > 0 ? 'der rechten' : 'der linken'} Seite schlafend – kann zu einseitigen Verspannungen beitragen` };

      const nutritionRow = latest.nutrition_quality;
      const nutritionEval = nutritionRow ? evaluateNutritionQuality(nutritionRow.value) : null;
      const smokingRow = latest.smoking_status;
      const smokingEval = smokingRow ? evaluateSmokingStatus(smokingRow.value) : null;
      const alcoholRow = latest.alcohol_weekly_drinks;
      const alcoholEval = alcoholRow ? evaluateAlcoholRisk(alcoholRow.value, sex) : null;

      // Runde 9: vier Ansichten statt einer gemischten – Gelenke (Vorder-/
      // Rückansicht) und Muskeln (Vorder-/Rückansicht) getrennt. Halswirbel-
      // säule/Nacken sowie linker/rechter Schulter-Marker nutzen bewusst
      // dieselbe zugrundeliegende Auswertung (dieselbe Körperregion, nur aus
      // zwei Perspektiven gezeigt) – daher tauchen sie in `notices` nur EINMAL
      // auf, um keine doppelten Hinweise zu erzeugen.
      const shoulderLeftSev = mobilitySeverity(latest['shoulder_mobility:left'], 'Schulter links');
      const shoulderRightSev = mobilitySeverity(latest['shoulder_mobility:right'], 'Schulter rechts');
      const hipLeftSev = mobilitySeverity(latest['thomas_mobility:left'], 'Hüfte links');

    // dieser Abschnitt, wie sich Beweglichkeit und Kraftausdauer über die Zeit

    // VOLLSTÄNDIGE Testhistorie aus prevention_test_results (nicht nur den

    function computeStatus(pe, logsForThis) {
      if (!logsForThis || logsForThis.length === 0) return null;
      if (pe.target_duration_seconds) {
        const withDuration = logsForThis.filter((l) => l.duration_seconds != null);
        if (withDuration.length === 0) return null;
        const last = withDuration[0];
        const diff = last.duration_seconds - pe.target_duration_seconds;
        if (diff === 0) return { label: 'genau nach Plan', cls: 'ok' };
        if (diff > 0) return { label: `+${formatDuration(diff)} über Vorgabe`, cls: 'over' };
        return { label: `${formatDuration(-diff)} unter Vorgabe`, cls: 'under' };
      }
      if (pe.target_sets) {
        const done = logsForThis.length;
        if (done === pe.target_sets) return { label: `${done}/${pe.target_sets} Sätze – nach Plan`, cls: 'ok' };
        if (done > pe.target_sets) return { label: `${done}/${pe.target_sets} Sätze – mehr als Vorgabe`, cls: 'over' };
        return { label: `${done}/${pe.target_sets} Sätze – weniger als Vorgabe`, cls: 'under' };
      }
      return null;
    }

    // Nutzer-Feedback Runde 14: Hilfsfunktionen fürs Schnell-Logging – Plan-
    // Vorgaben (die als Freitext wie "60 kg", "8-12" oder "12,10,8" hinterlegt
    // sind) werden automatisch in konkrete Satz-für-Satz-Werte übersetzt
    // (Nutzerwunsch: "Plan-Werte automatisch übernehmen"). Die Werte bleiben
    // danach ganz normal über das Formular bzw. Trainingstagebuch editierbar.
    function extractLeadingNumber(str) {
      if (str == null || str === '') return null;
      const m = String(str).match(/(\d+(?:[.,]\d+)?)/);
      if (!m) return null;
      return parseFloat(m[1].replace(',', '.'));
    }

    function parsePerSetValues(str, setCount) {
      if (str == null || str === '' || !setCount) return [];
      const raw = String(str).trim();
      // Kommagetrennte Werte je Satz, z.B. "12,10,8"
      if (raw.includes(',')) {
        const parts = raw.split(',').map((p) => extractLeadingNumber(p)).filter((n) => n != null);
        if (parts.length > 0) {
          const out = [];
          for (let i = 0; i < setCount; i++) out.push(parts[i] != null ? parts[i] : parts[parts.length - 1]);
          return out;
        }
      }
      // Bereich, z.B. "8-12" – für alle Sätze den unteren (konservativeren) Wert ansetzen
      const rangeMatch = raw.match(/(\d+(?:[.,]\d+)?)\s*-\s*(\d+(?:[.,]\d+)?)/);
      if (rangeMatch) {
        const lower = parseFloat(rangeMatch[1].replace(',', '.'));
        return Array(setCount).fill(lower);
      }
      // Einzelner Wert, der für alle Sätze gilt
      const single = extractLeadingNumber(raw);
      if (single != null) return Array(setCount).fill(single);
      return [];
    }

    // Baut aus den Plan-Vorgaben einer Übung direkt fertige Satz-Einträge –
    // ein Klick loggt die ganze Übung mit den Plan-Werten als Ist-Werten.
    function buildQuickLogEntries(pe, clientId, activeSession) {
      const ex = pe.exercises;
      const isCourse = isCourseExercise(ex);
      const isDurationBased = !!pe.target_duration_seconds || isCourse;
      const isDistanceBased = !isCourse && (!!pe.target_distance_meters || (ex && ex.category === 'Cardio'));
      const now = new Date().toISOString();
      const sessionId = activeSession ? activeSession.id : null;
      const distance = pe.target_distance_meters != null ? extractLeadingNumber(pe.target_distance_meters) : null;

      if (isDurationBased) {
        return [{
          client_id: clientId,
          exercise_id: ex.id,
          plan_exercise_id: pe.id,
          session_id: sessionId,
          performed_at: now,
          set_number: 1,
          reps: null,
          weight_kg: null,
          duration_seconds: pe.target_duration_seconds || null,
          distance_meters: distance,
        }];
      }

      const setCount = pe.target_sets || 1;
      const repsPerSet = parsePerSetValues(pe.target_reps, setCount);
      const weightPerSet = parsePerSetValues(pe.target_weight_hint, setCount);

      const entries = [];
      for (let i = 0; i < setCount; i++) {
        entries.push({
          client_id: clientId,
          exercise_id: ex.id,
          plan_exercise_id: pe.id,
          session_id: sessionId,
          performed_at: now,
          set_number: i + 1,
          reps: repsPerSet[i] != null ? Math.round(repsPerSet[i]) : null,
          weight_kg: weightPerSet[i] != null ? weightPerSet[i] : null,
          duration_seconds: null,
          distance_meters: isDistanceBased ? distance : null,
        });
      }
      return entries;
    }

    // Nutzer-Feedback Runde 14: nach Trainingseinheiten gruppiertes
    // Trainingstagebuch statt einer flachen Liste aller Einzel-Sätze – jede
    // Einheit ist per Klick auf/zuklappbar, darunter die Übungen mit ihren
    // Sätzen. Logs ohne session_id (z.B. vor Einführung dieser Zuordnung
    // erfasst) werden nach Kalendertag gruppiert, damit auch ältere Einträge
    // sinnvoll dargestellt bleiben.
    function renderTrainingDiaryHtml(logs, sessions, prLogIds) {
      if (!logs || logs.length === 0) {
        return '<p style="color:var(--color-text-muted);">Noch keine Einträge vorhanden.</p>';
      }

      const sessionsById = {};
      for (const s of sessions || []) sessionsById[s.id] = s;

      const groups = new Map();
      for (const log of logs) {
        const key = log.session_id ? `s:${log.session_id}` : `d:${formatDateOnly(log.performed_at)}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(log);
      }

      const groupEntries = Array.from(groups.entries()).map(([key, groupLogs]) => {
        const latestTime = groupLogs.reduce((max, l) => (l.performed_at > max ? l.performed_at : max), groupLogs[0].performed_at);
        return { key, groupLogs, latestTime };
      }).sort((a, b) => (a.latestTime < b.latestTime ? 1 : -1));

      return groupEntries.map(({ key, groupLogs }) => {
        const sessionId = key.startsWith('s:') ? key.slice(2) : null;
        const session = sessionId ? sessionsById[sessionId] : null;

        const dateLabel = formatDate(groupLogs[0].performed_at);
        const titleParts = [];
        if (session && session.training_plans && session.training_plans.title) titleParts.push(session.training_plans.title);
        if (session && session.training_plan_days && session.training_plan_days.label) titleParts.push(session.training_plan_days.label);
        const title = titleParts.length > 0 ? titleParts.join(' · ') : (sessionId ? 'Trainingseinheit' : 'Einträge ohne Einheit');

        const byExercise = new Map();
        for (const log of groupLogs) {
          const exId = log.exercise_id || 'unbekannt';
          if (!byExercise.has(exId)) byExercise.set(exId, { name: log.exercises ? log.exercises.name : 'Unbekannte Übung', logs: [] });
          byExercise.get(exId).logs.push(log);
        }

        const exerciseCount = byExercise.size;
        const setCount = groupLogs.length;
        const calories = session && session.calories_burned ? ` · ${session.calories_burned} kcal` : '';

        const exercisesHtml = Array.from(byExercise.values()).map((exGroup) => {
          const sortedLogs = exGroup.logs.slice().sort((a, b) => (a.set_number || 0) - (b.set_number || 0));
          return `<div class="diary-exercise">
            <div class="diary-exercise-name">${escapeHtml(exGroup.name)}</div>
            <table class="log-table"><thead><tr><th>Satz</th><th>Wdh.</th><th>Gewicht</th><th>Dauer</th><th>Distanz</th></tr></thead><tbody>
              ${sortedLogs.map((l) => {
                const isPr = prLogIds && prLogIds.has(l.id);
                return `<tr${isPr ? ' class="pr-row"' : ''}>
                <td>${l.set_number ?? '–'}</td>
                <td>${l.reps ?? '–'}${isPr ? ' <span class="pr-badge" title="Neuer persönlicher Rekord">🏆 PR</span>' : ''}</td>
                <td>${l.weight_kg != null ? l.weight_kg + ' kg' : '–'}</td>
                <td>${l.duration_seconds != null ? formatDuration(l.duration_seconds) : '–'}</td>
                <td>${l.distance_meters != null ? l.distance_meters + ' m' : '–'}</td>
              </tr>`;
              }).join('')}
            </tbody></table>
          </div>`;
        }).join('');

        return `<details class="diary-session">
          <summary>
            <div class="diary-session-summary">
              <strong>${escapeHtml(dateLabel)}</strong> · ${escapeHtml(title)}
              <span style="color:var(--color-text-muted); font-size:0.82rem;"> — ${exerciseCount} Übung${exerciseCount === 1 ? '' : 'en'}, ${setCount} Satz/Sätze${calories}</span>
            </div>
          </summary>
          <div class="diary-session-body">
            ${exercisesHtml}
          </div>
        </details>`;
      }).join('');
    }

    // Kraft-Rekord-Tracker & Streak-Zähler (Runde 15): baut die Karte "Deine
    // Rekorde & deine Serie" — Streak-Kacheln oben, darunter ein Feed der
    // zuletzt aufgestellten persönlichen Rekorde. Reine Darstellungsfunktion,
    // die Berechnung übernehmen computePersonalRecords()/computeTrainingStreak()
    // aus js/training.js auf Basis der ohnehin geloggten Trainingsdaten — für
    // den Kunden entsteht kein zusätzlicher Erfassungsaufwand.
    function prFeedIcon(type) {
      if (type === 'weight') return '🏋️';
      if (type === 'e1rm') return '📈';
      return '🔁';
    }

    function prFeedLabel(event) {
      if (event.type === 'weight') {
        return `Neues Bestgewicht: <strong>${event.weightKg} kg</strong> bei ${event.reps} Wdh. — ${escapeHtml(event.exerciseName)}`;
      }
      if (event.type === 'e1rm') {
        return `Neue geschätzte Maximalkraft (1RM): <strong>${event.value.toFixed(1)} kg</strong> — ${escapeHtml(event.exerciseName)}`;
      }
      return `Neue Bestleistung: <strong>${event.reps} Wdh.</strong> — ${escapeHtml(event.exerciseName)}`;
    }

    function renderRecordsCardHtml(streak, prEvents, prRecords) {
      const recentPrs = (prEvents || []).slice(0, 6);
      const exerciseCountWithRecords = (prRecords || []).length;
      const prFeedHtml = recentPrs.length > 0
        ? `<div class="pr-feed">${recentPrs.map((e) => `
            <div class="pr-feed-item">
              <span class="pr-feed-icon">${prFeedIcon(e.type)}</span>
              <span>${prFeedLabel(e)}</span>
              <span class="pr-feed-date">${formatDate(e.performedAt)}</span>
            </div>`).join('')}</div>`
        : `<p style="color:var(--color-text-muted); font-size:0.88rem;">Noch keine Rekorde erkannt — sobald du Gewicht oder Wiederholungen steigerst, taucht dein erster Rekord automatisch hier auf.</p>`;

      const streakNote = streak.currentStreak > 0
        ? (streak.currentWeekActive ? 'Diese Woche schon aktiv — weiter so!' : 'Diese Woche noch keine Einheit geloggt.')
        : 'Starte diese Woche mit einer Einheit, um eine neue Serie zu beginnen.';

      return `<div class="card mt-24">
        <h2 style="font-size:1.05rem;">Deine Rekorde &amp; deine Serie</h2>
        <div class="records-summary-row">
          <div class="streak-tile">
            <span class="streak-number">${streak.currentStreak}</span>
            <span class="streak-label">Woche${streak.currentStreak === 1 ? '' : 'n'} am Stück trainiert</span>
          </div>
          <div class="streak-tile">
            <span class="streak-number">${streak.longestStreak}</span>
            <span class="streak-label">Beste Serie bisher</span>
          </div>
        </div>
        <p style="color:var(--color-text-muted); font-size:0.8rem; margin-top:-10px; margin-bottom:16px;">${escapeHtml(streakNote)} Zählt: mind. 1 Trainingseinheit pro Kalenderwoche.</p>
        <h3 style="font-size:0.92rem; margin-bottom:10px;">Zuletzt aufgestellte Rekorde${exerciseCountWithRecords > 0 ? ` <span style="color:var(--color-text-muted); font-weight:400; font-size:0.78rem;">(Bestleistungen in ${exerciseCountWithRecords} Übung${exerciseCountWithRecords === 1 ? '' : 'en'})</span>` : ''}</h3>
        ${prFeedHtml}
      </div>`;
    }

    // Nutzer-Feedback Runde 14: Wurde direkt nacheinander ein zweiter Satz
    // geloggt bevor der erste renderClientView()-Aufruf fertig neu geladen
    // hatte, liefen zwei überlappende renderClientView()-Aufrufe parallel.
    // Da beide unabhängig voneinander die Logs neu abfragen und derjenige,
    // der zuletzt fertig wird, den DOM-Inhalt überschreibt, konnte der
    // LANGSAMERE (ältere) Aufruf den neueren Stand überschreiben — sichtbar
    // z.B. als "1/2 Sätze", obwohl beide Sätze bereits gespeichert waren.
    // Fix: ein Generationszähler sorgt dafür, dass nur der zuletzt gestartete
    // Aufruf seinen Ladezustand tatsächlich ins DOM schreibt; ein durch einen
    // neueren Aufruf überholter Lauf bricht vor dem finalen Schreiben ab.
    let clientViewRenderGeneration = 0;

    // Runde 21 / Q10: Kennzahlen, Rekorde, Serie und neue Erfolge der gerade
    // beendeten Einheit für das Belohnungs-Overlay. Liefert null, wenn in der
    // Einheit nichts geloggt wurde (dann gibt es keinen Effekt).
    async function buildSessionCelebration(profile, session, endedAt) {
      const [{ data: allLogs }] = await Promise.all([listAllTrainingLogsForRecords(profile.id)]);
      const logs = allLogs || [];
      const { data: recent } = await listMyTrainingLogs(profile.id);
      const sessionLogs = (recent || []).filter((l) => l.session_id === session.id);
      if (sessionLogs.length === 0) return null;
      const stats = computeSessionStats(sessionLogs, session.started_at, endedAt);
      const sessionLogIds = new Set(sessionLogs.map((l) => l.id));
      const { prEvents } = computePersonalRecords(logs);
      const prsHere = prEvents.filter((e) => sessionLogIds.has(e.logId));
      const streak = computeTrainingStreak(logs.map((l) => l.performed_at));
      let newAchievements = [];
      try {
        const raw = await loadAchievementRaw(profile.id, { trainingEnabled: true, nutritionEnabled: false, coachingEnabled: false });
        const analysis = analyzeAchievements(raw, { now: new Date() });
        const existing = new Set((raw.achievementRows || []).map((a) => a.achievement_key));
        const fresh = analysis.evaluated.filter((a) => a.earned && !a.manual && !existing.has(a.key));
        if (fresh.length) {
          const { error: syncErr } = await syncEarnedAchievements(profile.id, fresh);
          if (!syncErr) newAchievements = fresh.map((a) => ({ icon: a.icon, title: a.title }));
        }
      } catch (e) { console.warn('Erfolge nicht ausgewertet', e); }
      return { stats, highlights: buildHighlights({ prEvents: prsHere, streak, newAchievements }) };
    }

    async function renderClientView(content, profile) {
      const myGeneration = ++clientViewRenderGeneration;
      content.innerHTML = `<p class="center-text">Lade deinen Trainingsplan …</p>`;

      const [{ data: plans, error: plansError }, { data: activeSession }] = await Promise.all([
        listMyActivePlans(profile.id),
        getActiveSession(profile.id),
      ]);
      if (plansError) {
        if (myGeneration === clientViewRenderGeneration) {
          content.innerHTML = `<div class="msg error">Trainingsplan konnte nicht geladen werden: ${escapeHtml(plansError.message)}</div>`;
        }
        return;
      }

      const allPlanExerciseIds = (plans || []).flatMap((p) => (p.plan_exercises || []).map((pe) => pe.id));
      // Nutzer-Feedback Runde 14: flache Liste aller Plan-Übungen (mit Plan-Id)
      // fürs Schnell-Logging einer ganzen Einheit auf einen Klick.
      const allPlanExercisesFlat = (plans || []).flatMap((p) => (p.plan_exercises || []).map((pe) => ({ ...pe, __planId: p.id })));
      const [{ data: logsForStatus }, { data: recentLogs }, { data: recentSessions }, queuedCount, { data: allLogsForRecords }] = await Promise.all([
        listLogsForPlanExercises(profile.id, allPlanExerciseIds),
        listMyTrainingLogs(profile.id),
        listMyRecentSessions(profile.id),
        (async () => (await (await import('./js/offline-queue.js')).getQueuedLogs()).length)(),
        listAllTrainingLogsForRecords(profile.id),
      ]);

      const logsByPlanExercise = {};
      for (const log of logsForStatus || []) {
        (logsByPlanExercise[log.plan_exercise_id] = logsByPlanExercise[log.plan_exercise_id] || []).push(log);
      }

      // Kraft-Rekord-Tracker & Streak-Zähler (Runde 15): aus der kompletten
      // Trainingshistorie (nicht nur den letzten Einträgen) berechnet, damit
      // auch ältere Bestleistungen erkannt werden. Reine Berechnung ohne
      // zusätzliche Erfassung — nutzt ausschließlich bereits geloggte Sätze.
      const { records: prRecords, prEvents } = computePersonalRecords(allLogsForRecords || []);
      const prLogIds = prLogIdSet(prEvents);
      const trainingStreak = computeTrainingStreak((allLogsForRecords || []).map((l) => l.performed_at));

      const exHistory = buildExerciseHistory(allLogsForRecords || []);

      let html = '';

      if (!navigator.onLine || queuedCount > 0) {
        html += `<div class="offline-banner" style="display:block;">
          ${!navigator.onLine ? 'Du bist offline – neue Einträge werden lokal gespeichert und synchronisiert, sobald wieder Internet da ist.' : ''}
          ${queuedCount > 0 ? ` ${queuedCount} Eintrag/Einträge warten noch auf Synchronisierung.` : ''}
        </div>`;
      }

      // Trainingseinheit-Banner (Start/Ende)
      const allDays = (plans || []).flatMap((p) => (p.training_plan_days || []).map((d) => ({ ...d, planId: p.id, planTitle: p.title })));
      if (activeSession) {
        const startedLabel = formatDate(activeSession.started_at);
        html += `<div class="session-banner active">
          <div><strong>Trainingseinheit läuft</strong> · gestartet ${startedLabel}</div>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <button class="btn secondary small-btn quick-log-btn" id="quick-log-session-btn" type="button">Ganze Einheit schnell loggen</button>
            <input type="number" id="end-session-calories" min="0" step="1" placeholder="kcal verbrannt (optional)" style="width:180px; padding:6px 8px; border-radius:6px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text); font-size:0.82rem;" />
            <button class="btn secondary small-btn" id="end-session-btn" type="button">Einheit beenden</button>
          </div>
        </div>`;
      } else {
        html += `<div class="session-banner">
          <div>
            <strong>Keine Trainingseinheit aktiv</strong>
            <div style="font-size:0.78rem; color:var(--color-text-muted);">Starte eine Einheit, damit deine Sätze als eine Einheit gezählt und ausgewertet werden können.</div>
          </div>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            ${allDays.length > 0 ? `<select id="start-session-day"><option value="">– ohne festen Tag –</option>${allDays.map((d) => `<option value="${d.planId}|${d.id}">${escapeHtml(d.planTitle)} · ${escapeHtml(d.label)}</option>`).join('')}</select>` : ''}
            <button class="btn small-btn" id="start-session-btn" type="button">Trainingseinheit starten</button>
          </div>
        </div>`;
      }

      if (!plans || plans.length === 0) {
        html += `<div class="card"><h2 style="font-size:1.1rem;">Noch kein Trainingsplan zugewiesen</h2><p style="color:var(--color-text-muted);">Dein Coach hat dir noch keinen aktiven Trainingsplan zugewiesen. Melde dich gerne, falls du Fragen dazu hast.</p></div>`;
      }

      if (plans && plans.length > 0) {
        html += `<label class="rest-toggle"><input type="checkbox" id="rest-timer-toggle" checked /> Satzpausen-Timer nach jedem Satz (90 s)</label>`;
      }

      for (const plan of plans || []) {
        const days = (plan.training_plan_days || []).sort((a, b) => a.sort_order - b.sort_order);
        const allExercises = (plan.plan_exercises || []).sort((a, b) => a.sort_order - b.sort_order);
        const looseExercises = allExercises.filter((pe) => !pe.plan_day_id);

        html += `<div class="card plan-card">
          <h2 style="font-size:1.1rem;">${escapeHtml(plan.title)}</h2>
          ${plan.notes ? `<p style="color:var(--color-text-muted); margin-top:-8px;">${escapeHtml(plan.notes)}</p>` : ''}
          ${days.map((day) => {
            const dayExercises = allExercises.filter((pe) => pe.plan_day_id === day.id);
            if (dayExercises.length === 0) return '';
            return `<div class="day-block">
              <h3>${escapeHtml(day.label)}</h3>
              ${dayExercises.map((pe) => renderExerciseRow(pe, logsByPlanExercise[pe.id], activeSession, exHistory)).join('')}
            </div>`;
          }).join('')}
          ${looseExercises.length > 0 ? `<div class="day-block">
            ${days.length > 0 ? '<h3>Weitere Übungen</h3>' : ''}
            ${looseExercises.map((pe) => renderExerciseRow(pe, logsByPlanExercise[pe.id], activeSession, exHistory)).join('')}
          </div>` : ''}
        </div>`;
      }

      html += `<div class="card mt-24">
        <h2 style="font-size:1.05rem;">Mein Trainingstagebuch</h2>
        ${renderTrainingDiaryHtml(recentLogs, recentSessions, prLogIds)}
      </div>`;

      html += renderRecordsCardHtml(trainingStreak, prEvents, prRecords);

      // Ein inzwischen neuer gestarteter Render (z.B. durch einen zweiten,
      // schneller abgeschlossenen Satz-Log) hat Vorrang — dieser hier ist
      // überholt und darf den aktuelleren Stand nicht mehr überschreiben.
      if (myGeneration !== clientViewRenderGeneration) return;

      content.innerHTML = html;
      bindExerciseRows(content, { profile, activeSession, history: exHistory });

      const startBtn = document.getElementById('start-session-btn');
      if (startBtn) {
        startBtn.addEventListener('click', async () => {
          const sel = document.getElementById('start-session-day');
          let planId = null, planDayId = null;
          if (sel && sel.value) { [planId, planDayId] = sel.value.split('|'); }
          startBtn.disabled = true;
          const { error } = await startSession({ clientId: profile.id, planId, planDayId });
          if (error) { alert('Fehler: ' + error.message); startBtn.disabled = false; return; }
          renderClientView(content, profile);
        });
      }
      const endBtn = document.getElementById('end-session-btn');
      if (endBtn) {
        endBtn.addEventListener('click', async () => {
          endBtn.disabled = true;
          const caloriesInput = document.getElementById('end-session-calories');
          const caloriesBurned = caloriesInput && caloriesInput.value ? parseFloat(caloriesInput.value) : null;
          const endedAt = new Date();
          const { error } = await endSession(activeSession.id, { caloriesBurned });
          if (error) { alert('Fehler: ' + error.message); endBtn.disabled = false; return; }
          // Runde 21 / Q10: Belohnungs-Effekt. Die Berechnung darf den Ablauf nie
          // blockieren (try/catch, Zeitlimit für das Laden der Kennzahlen).
          // Runde 22 (Nachtrag 5): Die Meldung selbst verschwindet nicht mehr von
          // allein – sie bleibt, bis der Kunde sie über „Weiter" (oder Esc) schließt.
          try {
            const celebration = await Promise.race([
              buildSessionCelebration(profile, activeSession, endedAt),
              new Promise((resolve) => setTimeout(() => resolve(null), 3500)),
            ]);
            if (celebration) await celebrateSessionComplete(celebration);
          } catch (e) { console.warn('Belohnungs-Effekt übersprungen', e); }
          renderClientView(content, profile);
        });
      }

      content.querySelectorAll('.log-form').forEach((form) => {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const exerciseId = form.dataset.exerciseId;
          const planExerciseId = form.dataset.planExerciseId;
          const setNumber = form.querySelector('.f-set') ? (parseInt(form.querySelector('.f-set').value, 10) || null) : null;
          const reps = form.querySelector('.f-reps') ? (parseInt(form.querySelector('.f-reps').value, 10) || null) : null;
          const weight = form.querySelector('.f-weight') && form.querySelector('.f-weight').value ? parseFloat(form.querySelector('.f-weight').value) : null;
          const distance = form.querySelector('.f-distance') && form.querySelector('.f-distance').value ? parseFloat(form.querySelector('.f-distance').value) : null;
          const durationMin = form.querySelector('.f-duration-min') ? (parseFloat(form.querySelector('.f-duration-min').value) || 0) : 0;
          const durationSec = form.querySelector('.f-duration-sec') ? (parseFloat(form.querySelector('.f-duration-sec').value) || 0) : 0;
          const duration = (durationMin || durationSec) ? Math.round(durationMin * 60 + durationSec) : null;

          const entry = {
            client_id: profile.id,
            exercise_id: exerciseId,
            plan_exercise_id: planExerciseId || null,
            session_id: activeSession ? activeSession.id : null,
            performed_at: new Date().toISOString(),
            set_number: setNumber,
            reps,
            weight_kg: weight,
            duration_seconds: duration,
            distance_meters: distance,
          };

          const submitBtn = form.querySelector('button');
          submitBtn.disabled = true;
          submitBtn.textContent = 'Speichert …';

          let ok = false;
          if (navigator.onLine) {
            const { error } = await insertTrainingLog(entry);
            ok = !error;
            if (error) await queueTrainingLog(entry);
          } else {
            ok = await queueTrainingLog(entry);
          }

          submitBtn.disabled = false;
          submitBtn.textContent = 'Eintragen';

          if (ok) {
            renderClientView(content, profile);
          } else {
            alert('Der Eintrag konnte weder gespeichert noch in die Offline-Warteschlange gelegt werden.');
          }
        });
      });

      // Nutzer-Feedback Runde 14: Schnell-Logging je Übung – übernimmt die
      // Plan-Vorgaben (Sätze/Wdh./Gewicht bzw. Dauer/Distanz) automatisch als
      // Ist-Werte, damit nicht jeder Satz einzeln eingetippt werden muss.
      content.querySelectorAll('.quick-log-btn[data-plan-exercise-id]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const peId = btn.dataset.planExerciseId;
          const pe = allPlanExercisesFlat.find((p) => p.id === peId);
          if (!pe) return;
          const originalText = btn.textContent;
          btn.disabled = true;
          btn.textContent = 'Speichert …';
          const entries = buildQuickLogEntries(pe, profile.id, activeSession);
          const { error } = await insertTrainingLogs(entries);
          if (error) {
            alert('Fehler beim Schnell-Loggen: ' + error.message);
            btn.disabled = false;
            btn.textContent = originalText;
            return;
          }
          renderClientView(content, profile);
        });
      });

      // Nutzer-Feedback Runde 14: Schnell-Logging der ganzen Einheit – loggt
      // alle Übungen des zur laufenden Einheit gehörenden Trainingstages (bzw.
      // aller zugewiesenen Übungen, falls kein fester Tag gewählt wurde) auf
      // einmal mit den Plan-Vorgaben.
      const quickLogSessionBtn = document.getElementById('quick-log-session-btn');
      if (quickLogSessionBtn) {
        quickLogSessionBtn.addEventListener('click', async () => {
          let targets = allPlanExercisesFlat;
          if (activeSession && activeSession.plan_day_id) {
            targets = targets.filter((pe) => pe.plan_day_id === activeSession.plan_day_id);
          } else if (activeSession && activeSession.plan_id) {
            targets = targets.filter((pe) => pe.__planId === activeSession.plan_id);
          }
          if (targets.length === 0) {
            alert('Für diese Einheit konnten keine Übungen gefunden werden.');
            return;
          }
          const originalText = quickLogSessionBtn.textContent;
          quickLogSessionBtn.disabled = true;
          quickLogSessionBtn.textContent = 'Speichert …';
          const allEntries = targets.flatMap((pe) => buildQuickLogEntries(pe, profile.id, activeSession));
          const { error } = await insertTrainingLogs(allEntries);
          if (error) {
            alert('Fehler beim Schnell-Loggen der Einheit: ' + error.message);
            quickLogSessionBtn.disabled = false;
            quickLogSessionBtn.textContent = originalText;
            return;
          }
          renderClientView(content, profile);
        });
      }
    }

    // =========================================================================
    // TRAININGSZEILE (Runde 19, Variante C): pro Übung eine ca. 46 px hohe
    // Zeile mit Vorschaubild, Name, Sätze/Muskel, Wdh.- und kg-Stepper (▲▼ plus
    // Antippen des Werts für Direkteingabe) und ✓. Antippen des Namens klappt
    // die Sätze auf (je Satz eigene Stepper + ✓), ⓘ zeigt die Beschreibung.
    // Die Logik zum Speichern (Offline-Warteschlange, Sessions) ist unverändert.
    // =========================================================================

    function fmtStp(n) {
      if (n == null || Number.isNaN(n)) return '';
      return String(Math.round(n * 100) / 100).replace('.', ',');
    }
    function parseStp(str) {
      if (str == null) return null;
      const n = parseFloat(String(str).replace(',', '.'));
      return Number.isFinite(n) ? n : null;
    }
    function isSameLocalDay(iso, ref = new Date()) {
      const d = new Date(iso);
      return d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth() && d.getDate() === ref.getDate();
    }

    function stepperHtml(kind, value, label) {
      const unit = { sec: 's', m: 'm', kg: 'kg', reps: '' }[kind] || '';
      return `<div class="stp" data-kind="${kind}">
        <input class="stp-val" type="text" inputmode="decimal" autocomplete="off" aria-label="${escapeHtml(label)}" placeholder="–" value="${fmtStp(value)}" />
        ${kind === 'sec' ? `<button type="button" class="stp-unit stp-unit-toggle" title="Einheit wechseln: Sekunden / Minuten" aria-label="Einheit wechseln: Sekunden oder Minuten">${unit}</button>` : (unit ? `<span class="stp-unit">${unit}</span>` : '')}
        <span class="stp-ar"><button type="button" class="stp-up" aria-label="${escapeHtml(label)} erhöhen">▲</button><button type="button" class="stp-dn" aria-label="${escapeHtml(label)} verringern">▼</button></span>
      </div>`;
    }

    // Verlauf je Übung aus allen geloggten Sätzen: "Letztes Mal" (letzter
    // Trainingstag VOR heute) und Bestwert (schwerster Satz, bei Gleichstand mehr Wdh.).
    function buildExerciseHistory(allLogs) {
      const byEx = new Map();
      for (const l of allLogs || []) {
        if (!l.exercise_id) continue;
        if (!byEx.has(l.exercise_id)) byEx.set(l.exercise_id, []);
        byEx.get(l.exercise_id).push(l);
      }
      const history = new Map();
      const today = new Date();
      byEx.forEach((logs, exId) => {
        const sorted = logs.slice().sort((a, b) => new Date(a.performed_at) - new Date(b.performed_at));
        const past = sorted.filter((l) => !isSameLocalDay(l.performed_at, today));
        let lastSets = [];
        if (past.length) {
          const lastDay = new Date(past[past.length - 1].performed_at);
          lastSets = past.filter((l) => isSameLocalDay(l.performed_at, lastDay))
            .sort((a, b) => (a.set_number || 0) - (b.set_number || 0))
            .map((l) => ({ reps: l.reps, weight: l.weight_kg }));
        }
        const bestByReps = new Map();
        let best = null;
        for (const l of sorted) {
          const reps = Number(l.reps) || 0, w = Number(l.weight_kg) || 0;
          if (!reps) continue;
          if (w > 0 && w > (bestByReps.get(reps) || 0)) bestByReps.set(reps, w);
          if (!best || w > best.weight || (w === best.weight && reps > best.reps)) best = { weight: w, reps };
        }
        history.set(exId, { lastSets, best, bestByReps });
      });
      return history;
    }

    function historyHintHtml(hist) {
      if (!hist) return '';
      const parts = [];
      if (hist.lastSets.length) {
        const s = hist.lastSets;
        const same = s.every((x) => x.reps === s[0].reps && x.weight === s[0].weight);
        const fmtSet = (x) => `${x.reps ?? '–'}${x.weight ? ' × ' + fmtStp(x.weight) + ' kg' : ' Wdh.'}`;
        parts.push(`Letztes Mal: ${same ? `${s.length} × ${fmtSet(s[0])}` : s.map(fmtSet).join(' · ')}`);
      }
      if (hist.best) parts.push(`Bestwert: ${hist.best.weight ? `${fmtStp(hist.best.weight)} kg × ${hist.best.reps}` : `${hist.best.reps} Wdh.`}`);
      return parts.length ? `<p class="xrow-hint">${escapeHtml(parts.join(' · '))}</p>` : '';
    }

    function setRowHtml(i, vals, kinds, opts = {}) {
      const label = (k) => ({ reps: 'Wiederholungen', kg: 'Gewicht in kg', sec: 'Sekunden', m: 'Meter' }[k]);
      return `<div class="setrow${opts.done ? ' done' : ''}" data-set="${i}">
        <span class="sn">Satz ${i}</span>
        ${kinds.map((k) => stepperHtml(k, vals[k], `Satz ${i} ${label(k)}`)).join('')}
        <button type="button" class="ok set-ok${opts.done ? ' done' : ''}" aria-label="Satz ${i} loggen" ${opts.done ? 'disabled' : ''}>✓</button>
        <span class="pr-flag" hidden>🏆</span>
      </div>`;
    }

    function renderExerciseRow(pe, logsForThis, activeSession, history) {
      const ex = pe.exercises;
      const isCourse = isCourseExercise(ex);
      const isDur = !!pe.target_duration_seconds || isCourse;
      const isDist = !isCourse && (!!pe.target_distance_meters || ex.category === 'Cardio');
      const kinds = isDur ? (isDist ? ['sec', 'm'] : ['sec']) : (isDist ? ['reps', 'kg', 'm'] : ['reps', 'kg']);
      const N = Math.max(1, pe.target_sets || 1);
      const hist = history ? history.get(ex.id) : null;
      const todayLogs = (logsForThis || []).filter((l) => isSameLocalDay(l.performed_at))
        .sort((a, b) => (a.set_number || 0) - (b.set_number || 0) || new Date(a.performed_at) - new Date(b.performed_at));
      const planReps = parsePerSetValues(pe.target_reps, N);
      const planKg = parsePerSetValues(pe.target_weight_hint, N);
      const distTarget = pe.target_distance_meters != null ? extractLeadingNumber(pe.target_distance_meters) : null;
      const lastSets = hist ? hist.lastSets : [];
      const lastOf = (i, key) => {
        if (!lastSets.length) return null;
        const s = lastSets[Math.min(i, lastSets.length - 1)];
        return s ? s[key] : null;
      };

      const total = Math.max(N, todayLogs.length);
      const doneCount = Math.min(todayLogs.length, total);
      const sets = [];
      for (let i = 0; i < total; i++) {
        const log = todayLogs[i];
        const vals = log ? {
          reps: log.reps, kg: log.weight_kg, sec: log.duration_seconds, m: log.distance_meters,
        } : {
          reps: planReps[i] != null ? Math.round(planReps[i]) : lastOf(i, 'reps'),
          kg: planKg[i] != null ? planKg[i] : lastOf(i, 'weight'),
          sec: pe.target_duration_seconds || null,
          m: distTarget,
        };
        sets.push({ vals, done: !!log });
      }
      const masterVals = (sets.find((s) => !s.done) || sets[sets.length - 1]).vals;
      const allDone = doneCount >= N;

      const repsText = pe.target_reps ? ` ${String(pe.target_reps).replace('-', '–')}` : '';
      const initials = ex.name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
      const thumb = ex.image_url
        ? `<img class="thumb-sm" data-src="${escapeHtml(ex.image_url)}" src="${escapeHtml(ex.image_url)}" alt="${escapeHtml(ex.name)}" onerror="onExerciseImgError(this)" data-lightbox-src="${escapeHtml(ex.image_url)}" data-lightbox-alt="${escapeHtml(ex.name)}" />`
        : `<div class="thumb-sm xthumb-ph">${escapeHtml(initials)}</div>`;
      const target = [
        pe.target_speed_kmh ? `${pe.target_speed_kmh} km/h` : null,
        pe.target_watt ? `${pe.target_watt} Watt` : null,
        pe.target_heart_rate_percent ? `${pe.target_heart_rate_percent}% HFmax` : null,
      ].filter(Boolean).join(' · ');
      const hasInfo = !!(ex.description || pe.notes || target);

      return `<div class="xrow${allDone ? ' xrow-done' : ''}${kinds.length > 2 ? ' x3' : ''}" data-pe-id="${pe.id}" data-ex-id="${ex.id}" data-sets="${total}" data-target-sets="${N}" data-kind="${isDur ? 'dur' : 'str'}" data-dur-unit="${isDur ? defaultDurUnit(pe, ex) : 's'}" data-rest="${pe.rest_seconds || ''}">
        <div class="xrow-main">
          ${thumb}
          <div class="xrow-name">
            <button type="button" class="xrow-toggle xrow-title" aria-expanded="false" title="Sätze auf-/zuklappen"><b>${escapeHtml(ex.name)}</b></button>
            <div class="xrow-sub">
              <button type="button" class="xrow-toggle xrow-subtext" tabindex="-1"><u>${N}×</u>${escapeHtml(repsText)}${ex.muscle_group ? ' · ' + escapeHtml(ex.muscle_group) : ''} · <span class="xrow-count">${doneCount}/${N}</span></button>
              ${hasInfo ? `<button type="button" class="xrow-info-btn" aria-label="Übungsbeschreibung" aria-expanded="false">ⓘ</button>` : ''}
            </div>
          </div>
          <div class="xrow-steppers">${kinds.map((k) => stepperHtml(k, masterVals[k], { reps: 'Wiederholungen', kg: 'Gewicht in kg', sec: 'Sekunden', m: 'Meter' }[k])).join('')}</div>
          <button type="button" class="ok row-ok${allDone ? ' done' : ''}" aria-label="Alle Sätze loggen" ${allDone ? 'disabled' : ''}>✓</button>
        </div>
        <div class="xrow-sets" hidden>
          ${sets.map((s, i) => setRowHtml(i + 1, s.vals, kinds, { done: s.done })).join('')}
          <button type="button" class="add-set">+ Satz hinzufügen</button>
        </div>
        <div class="xrow-info" hidden>
          ${ex.description ? `<p>${escapeHtml(ex.description)}</p>` : ''}
          ${target ? `<p class="xrow-target">Vorgabe: ${escapeHtml(target)}</p>` : ''}
          ${pe.notes ? `<p class="xrow-note">Hinweis vom Coach: ${escapeHtml(pe.notes)}</p>` : ''}
        </div>
        ${historyHintHtml(hist)}
      </div>`;
    }

    // ---- Satzpausen-Timer: fester Balken unten, unabhängig vom Neu-Rendern ----
    const REST_DEFAULT_SECONDS = 90;
    let restTimerHandle = null;
    function restTimerEnabled() {
      try { return localStorage.getItem('dadi_rest_timer') !== 'off'; } catch (e) { return true; }
    }
    function setRestTimerEnabled(on) {
      try { localStorage.setItem('dadi_rest_timer', on ? 'on' : 'off'); } catch (e) { /* optional */ }
    }
    function stopRestTimer() {
      if (restTimerHandle) clearInterval(restTimerHandle);
      restTimerHandle = null;
      const bar = document.getElementById('rest-timer');
      if (bar) bar.hidden = true;
    }
    function startRestTimer(seconds) {
      if (!restTimerEnabled() || !seconds) return;
      let bar = document.getElementById('rest-timer');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'rest-timer';
        bar.setAttribute('role', 'timer');
        bar.innerHTML = '<span class="rt-label">Satzpause</span><b class="rt-time">0:00</b><button type="button" class="rt-plus">+15 s</button><button type="button" class="rt-skip">Überspringen</button>';
        document.body.appendChild(bar);
        bar.querySelector('.rt-skip').addEventListener('click', stopRestTimer);
        bar.querySelector('.rt-plus').addEventListener('click', () => { bar.dataset.end = String(Number(bar.dataset.end) + 15000); });
      }
      bar.hidden = false;
      bar.classList.remove('rt-over');
      bar.querySelector('.rt-label').textContent = 'Satzpause';
      bar.dataset.end = String(Date.now() + seconds * 1000);
      if (restTimerHandle) clearInterval(restTimerHandle);
      const tick = () => {
        const left = Math.round((Number(bar.dataset.end) - Date.now()) / 1000);
        if (left <= 0) {
          bar.classList.add('rt-over');
          bar.querySelector('.rt-label').textContent = 'Weiter geht’s';
          bar.querySelector('.rt-time').textContent = '0:00';
          try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* optional */ }
          clearInterval(restTimerHandle); restTimerHandle = null;
          setTimeout(() => { if (!restTimerHandle) bar.hidden = true; }, 6000);
          return;
        }
        bar.querySelector('.rt-time').textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
      };
      tick();
      restTimerHandle = setInterval(tick, 500);
    }

    function durUnitPref(exId) { try { const v = localStorage.getItem('dadi-dur-unit-' + exId); return v === 'min' || v === 's' ? v : null; } catch (e) { return null; } }
    function setDurUnitPref(exId, u) { try { localStorage.setItem('dadi-dur-unit-' + exId, u); } catch (e) { /* optional */ } }
    // Standard: Cardio-Ziele ab 2 Minuten (glatte Minuten) in Minuten, sonst Sekunden; eigene Wahl wird je Übung gemerkt.
    function defaultDurUnit(pe, ex) {
      const pref = durUnitPref(ex.id);
      if (pref) return pref;
      if (isCourseExercise(ex)) return 'min'; // Kurse: Dauer in Minuten
      const t = Number(pe.target_duration_seconds) || 0;
      return t >= 120 && t % 60 === 0 ? 'min' : 's';
    }

    function stepperStepFor(kind, current) {
      if (kind === 'reps') return 1;
      if (kind === 'kg') return current != null && current > 0 && current <= 10 ? 1.25 : 2.5;
      if (kind === 'sec') return 5;
      return 50; // Meter
    }

    function bindExerciseRows(root, ctx) {
      const { profile, activeSession, history, onAfterLog } = ctx;

      const valueOf = (el, kind) => {
        const inp = el.querySelector(`.stp[data-kind="${kind}"] .stp-val`);
        return inp ? parseStp(inp.value) : null;
      };
      const setValue = (el, kind, v) => {
        const inp = el.querySelector(`.stp[data-kind="${kind}"] .stp-val`);
        if (inp) inp.value = fmtStp(v);
      };
      const kindsOf = (row) => Array.from(row.querySelectorAll('.xrow-steppers .stp')).map((s) => s.dataset.kind);
      const pendingSets = (row) => Array.from(row.querySelectorAll('.setrow:not(.done)'));

      function refreshCounter(row) {
        const total = row.querySelectorAll('.setrow').length;
        const done = row.querySelectorAll('.setrow.done').length;
        const target = Number(row.dataset.targetSets) || total;
        row.querySelector('.xrow-count').textContent = `${done}/${Math.max(target, 1)}`;
        const all = done >= target && done > 0;
        row.classList.toggle('xrow-done', all);
        const rowOk = row.querySelector('.row-ok');
        const wasDone = rowOk.classList.contains('done');
        rowOk.classList.toggle('done', all);
        if (all && !wasDone) miniRowDone(row);
        rowOk.disabled = all && pendingSets(row).length === 0;
      }

      function entryFor(row, setEl) {
        const kind = row.dataset.kind;
        const kinds = kindsOf(row);
        return {
          client_id: profile.id,
          exercise_id: row.dataset.exId,
          plan_exercise_id: row.dataset.peId || null,
          session_id: activeSession ? activeSession.id : null,
          performed_at: new Date().toISOString(),
          set_number: Number(setEl.dataset.set),
          reps: kind === 'str' ? (valueOf(setEl, 'reps') != null ? Math.round(valueOf(setEl, 'reps')) : null) : null,
          weight_kg: kind === 'str' && kinds.includes('kg') ? valueOf(setEl, 'kg') : null,
          duration_seconds: kind === 'dur' ? (valueOf(setEl, 'sec') != null ? Math.round(valueOf(setEl, 'sec') * (row.dataset.durUnit === 'min' ? 60 : 1)) : null) : null,
          distance_meters: kinds.includes('m') ? valueOf(setEl, 'm') : null,
        };
      }

      function flashInvalid(setEl) {
        const inp = setEl.querySelector('.stp-val');
        if (inp) { inp.focus(); setEl.classList.add('invalid'); setTimeout(() => setEl.classList.remove('invalid'), 1200); }
      }

      async function persist(entries) {
        if (navigator.onLine) {
          const { error } = entries.length === 1 ? await insertTrainingLog(entries[0]) : await insertTrainingLogs(entries);
          if (!error) return true;
        }
        let ok = true;
        for (const e of entries) ok = (await queueTrainingLog(e)) && ok;
        return ok;
      }

      function markDone(row, setEls, entries) {
        const hist = history.get(row.dataset.exId);
        setEls.forEach((setEl, idx) => {
          setEl.classList.add('done');
          const ok = setEl.querySelector('.set-ok');
          ok.classList.add('done'); ok.disabled = true;
          miniSetDone(ok);
          setEl.querySelectorAll('.stp-val').forEach((i) => { i.readOnly = true; });
          setEl.querySelectorAll('.stp button').forEach((b) => { b.disabled = true; });
          const e = entries[idx];
          if (hist && e.weight_kg > 0 && e.reps) {
            if (e.weight_kg > (hist.bestByReps.get(e.reps) || 0)) {
              hist.bestByReps.set(e.reps, e.weight_kg);
              const flag = setEl.querySelector('.pr-flag');
              if (flag) { flag.hidden = false; flag.title = 'Neuer persönlicher Rekord'; miniPr(flag); }
            }
          }
        });
        refreshCounter(row);
      }

      async function logSets(row, setEls, { rest }) {
        const entries = setEls.map((s) => entryFor(row, s));
        if (row.dataset.kind === 'str') {
          const bad = setEls.find((s, i) => entries[i].reps == null);
          if (bad) { flashInvalid(bad); return; }
        } else {
          const bad = setEls.find((s, i) => entries[i].duration_seconds == null);
          if (bad) { flashInvalid(bad); return; }
        }
        const btns = setEls.map((s) => s.querySelector('.set-ok')).concat(row.querySelector('.row-ok'));
        btns.forEach((b) => { b.disabled = true; });
        const ok = await persist(entries);
        if (!ok) {
          btns.forEach((b) => { b.disabled = false; });
          alert('Der Eintrag konnte weder gespeichert noch in die Offline-Warteschlange gelegt werden.');
          return;
        }
        markDone(row, setEls, entries);
        const next = pendingSets(row)[0];
        if (rest && next) startRestTimer(Number(row.dataset.rest) || REST_DEFAULT_SECONDS);
        if (onAfterLog) onAfterLog();
      }

      // Dauer-Einheit je Übung (Sekunden/Minuten): Anzeige umrechnen, geloggt wird immer in Sekunden.
      function convertDurRow(row, from, to) {
        if (from === to) return;
        row.querySelectorAll('.stp[data-kind="sec"] .stp-val').forEach((inp) => {
          const v = parseStp(inp.value);
          if (v == null) return;
          inp.value = fmtStp(to === 'min' ? v / 60 : v * 60);
        });
      }
      function syncDurLabels(row) {
        const u = row.dataset.durUnit === 'min' ? 'min' : 's';
        row.querySelectorAll('.stp[data-kind="sec"] .stp-unit-toggle').forEach((b) => { b.textContent = u; });
      }

      root.querySelectorAll('.xrow').forEach((row) => {
        const setsEl = row.querySelector('.xrow-sets');
        const infoEl = row.querySelector('.xrow-info');

        if (row.querySelector('.stp[data-kind="sec"]')) {
          // Werte wurden in Sekunden gerendert; auf die gewählte Einheit umstellen.
          if (row.dataset.durUnit === 'min') convertDurRow(row, 's', 'min');
          syncDurLabels(row);
          row.addEventListener('click', (e) => {
            const t = e.target.closest('.stp-unit-toggle');
            if (!t) return;
            const from = row.dataset.durUnit === 'min' ? 'min' : 's';
            const to = from === 'min' ? 's' : 'min';
            convertDurRow(row, from, to);
            row.dataset.durUnit = to;
            setDurUnitPref(row.dataset.exId, to);
            syncDurLabels(row);
          });
        }

        row.querySelectorAll('.xrow-toggle').forEach((tg) => tg.addEventListener('click', () => {
          const open = setsEl.hidden;
          setsEl.hidden = !open;
          row.querySelector('.xrow-title').setAttribute('aria-expanded', String(open));
          row.classList.toggle('open', open);
        }));
        const infoBtn = row.querySelector('.xrow-info-btn');
        if (infoBtn) infoBtn.addEventListener('click', () => {
          const open = infoEl.hidden;
          infoEl.hidden = !open;
          infoBtn.setAttribute('aria-expanded', String(open));
        });

        // Stepper (▲▼ und Direkteingabe) – Änderungen am Zeilenwert wandern in alle noch offenen Sätze.
        row.addEventListener('click', (e) => {
          const btn = e.target.closest('.stp-up, .stp-dn');
          if (!btn || btn.disabled) return;
          const stp = btn.closest('.stp');
          const kind = stp.dataset.kind;
          const inp = stp.querySelector('.stp-val');
          const cur = parseStp(inp.value);
          const step = kind === 'sec' && row.dataset.durUnit === 'min' ? 1 : stepperStepFor(kind, cur);
          let next = (cur == null ? 0 : cur) + (btn.classList.contains('stp-up') ? step : -step);
          next = Math.max(0, Math.round(next * 100) / 100);
          inp.value = fmtStp(next);
          if (stp.closest('.xrow-steppers')) pendingSets(row).forEach((s) => setValue(s, kind, next));
        });
        row.addEventListener('change', (e) => {
          const inp = e.target.closest('.stp-val');
          if (!inp) return;
          const v = parseStp(inp.value);
          inp.value = v == null ? '' : fmtStp(Math.max(0, v));
          if (inp.closest('.xrow-steppers')) pendingSets(row).forEach((s) => setValue(s, inp.closest('.stp').dataset.kind, v == null ? null : Math.max(0, v)));
        });
        row.addEventListener('focusin', (e) => { if (e.target.classList && e.target.classList.contains('stp-val') && !e.target.readOnly) e.target.select(); });

        // ✓ je Satz: loggt den Satz, der nächste offene Satz übernimmt dessen Werte, danach Satzpause.
        row.addEventListener('click', async (e) => {
          const ok = e.target.closest('.set-ok');
          if (!ok || ok.disabled) return;
          const setEl = ok.closest('.setrow');
          const kinds = kindsOf(row);
          await logSets(row, [setEl], { rest: true });
          if (setEl.classList.contains('done')) {
            const next = pendingSets(row)[0];
            if (next) kinds.forEach((k) => { const v = valueOf(setEl, k); setValue(next, k, v); });
            const first = pendingSets(row)[0];
            if (first) kinds.forEach((k) => { const v = valueOf(first, k); const m = row.querySelector(`.xrow-steppers .stp[data-kind="${k}"] .stp-val`); if (m) m.value = fmtStp(v); });
          }
        });
        // ✓ in der Zeile: alle noch offenen Sätze mit den aktuellen Werten loggen.
        row.querySelector('.row-ok').addEventListener('click', async () => {
          const pending = pendingSets(row);
          if (pending.length === 0) return;
          await logSets(row, pending, { rest: false });
        });
        // Weiterer Satz
        row.querySelector('.add-set').addEventListener('click', () => {
          const all = row.querySelectorAll('.setrow');
          const last = all[all.length - 1];
          const kinds = kindsOf(row);
          const vals = {};
          kinds.forEach((k) => { vals[k] = valueOf(last, k); });
          const n = all.length + 1;
          last.insertAdjacentHTML('afterend', setRowHtml(n, vals, kinds));
          syncDurLabels(row);
          row.dataset.sets = String(n);
          row.querySelector('.row-ok').disabled = false;
          row.classList.remove('xrow-done');
          row.querySelector('.row-ok').classList.remove('done');
          row.dataset.targetSets = String(Math.max(Number(row.dataset.targetSets) || 1, n));
          refreshCounter(row);
        });
      });

      const toggle = root.querySelector('#rest-timer-toggle');
      if (toggle) {
        toggle.checked = restTimerEnabled();
        toggle.addEventListener('change', () => { setRestTimerEnabled(toggle.checked); if (!toggle.checked) stopRestTimer(); });
      }
    }

    // =========================================================================
    // PRÄVENTIONSCHECK (gemeinsam für Kunde & Trainer)
    // =========================================================================

    const BALANCE_PAIRS = [
      { aKey: 'push_oberkoerper', bKey: 'pull_oberkoerper' },
      { aKey: 'vordere_beinkette', bKey: 'hintere_beinkette' },
      { aKey: 'rumpf_vorne', bKey: 'rumpf_hinten' },
    ];

    const SIDE_LABEL = { left: 'links', right: 'rechts', both: 'beidseitig' };

    function renderPreventionTab(content, profile, { isAdminView }) {
      renderPreventionSection(content, profile.id, { isAdminView });
    }

    function severityColor(sev) {
      // Nutzer-Feedback Runde 10: "keine Daten" hellblau statt grau, damit sich
      // der Marker sichtbar vom (ebenfalls grauen) Körper abhebt, aber klar vom
      // Ampelsystem (grün/gold/rot) der echten Bewertungen unterscheidet.
      return { ok: 'var(--color-success)', warn: 'var(--color-gold)', alert: 'var(--color-danger)', unknown: 'var(--color-info)' }[sev] || 'var(--color-info)';
    }

    // Anatomische Körper-Illustration, Nutzer-Feedback Runde 5: "wie ein
    // echter Mensch, mit weichen Linien" statt einfacher Strichmännchen.
    // Runde 9: statt EINER gemischten Vorder-/Rückansicht jetzt VIER Ansichten
    // – Gelenke (Vorder-/Rückansicht) und Muskeln (Vorder-/Rückansicht)
    // sauber getrennt, mit anatomisch präzisen Bezeichnungen je Ansicht statt
    // eines Mischmaschs, damit z.B. "Schulter" eindeutig als Gelenk- ODER
    // Muskel-Bezug erkennbar ist.
    // Runde 10: ALLE Beschriftungen (nicht nur mittige) liegen jetzt konsequent
    // auf zwei festen "Schienen" links/rechts AUSSERHALB der Silhouette
    // (LEFT_RAIL_X/RIGHT_RAIL_X), verbunden per gestrichelter Linie mit dem
    // jeweiligen Punkt – vorher wanderte eine seitlich versetzte Beschriftung
    // (z.B. "Hüfte li.") nur 11 Einheiten vom Punkt weg und konnte so mit dem
    // an der Seite herabhängenden Arm kollidieren. viewBox ist entsprechend
    // breiter (-50..250 statt -30..230), damit auch längere Bezeichnungen
    // (z.B. "Muskeln Arm li.") auf der Schiene noch Platz haben.
    // Runde 18: die zuvor per SVG-Pfaden handgezeichnete Silhouette
    // (frontBodyShape/backBodyShape) wurde durch die vom Nutzer bereit-
    // gestellten anatomischen Fotos ersetzt (Skelett vorne/hinten für die
    // Gelenke-Ansichten, Muskulatur vorne/hinten für die Muskeln-Ansichten).
    // Die 4 Bilder wurden aus der Vorlage ausgeschnitten, freigestellt
    // (schwarzer Hintergrund -> transparent) und einheitlich zugeschnitten,
    // sodass sich der Körper in allen 4 Bildern an derselben Position/
    // Skalierung befindet (siehe BODY_IMG_*). Die Marker-Koordinaten unten
    // wurden anhand der auf dem Skelett-Foto bereits vorhandenen blauen
    // Gelenkkugeln neu vermessen (Schulter/Ellbogen/Handgelenk/Hüfte/Knie/
    // Fußgelenk); die Muskel-Marker (Brust, Bauch, Arm, Oberschenkel,
    // oberer/unterer Rücken, Beinrückseite, Wade) sind davon anatomisch
    // plausibel abgeleitet, da das Muskelfoto selbst keine Markierungen
    // trägt. Alle Marker/Farben/Legenden/Beschriftungen sind unverändert
    // gegenüber Runde 10-17 erhalten geblieben, nur als Overlay auf dem
    // Foto statt auf der gezeichneten Silhouette.

    // Runde 22 (Nachtrag 5, Nutzer-Feedback): Die Beschriftungen waren in der
    // SVG-Darstellung (viewBox 300 Einheiten, Anzeige ~190 px) nur ca. 5 px
    // groß und kaum lesbar. Jetzt: Körperfoto + Marker in einem px-genauen
    // Overlay, Beschriftungen als normaler HTML-Text in Textgröße links/rechts
    // vom Bild. layoutBodyViews() setzt die Beschriftungen auf die Höhe ihres
    // Markers, vermeidet Überlappungen (Beschriftungen werden bei Bedarf
    // nach unten geschoben) und zeichnet die Verbindungslinien neu, sobald
    // sich die Breite ändert (ResizeObserver).
    // Marker-Koordinaten (cx, cy) bleiben die in Runde 18 vermessenen Werte
    // im alten Bildraster (Bild bei x 24..176, y 0..400).
    const BODY_IMG_X = 24, BODY_IMG_W = 152, BODY_IMG_H = 398, BODY_IMG_Y = 1;

    function bvItem(m, label, cx, cy, side) {
      return { m, label, side, nx: (cx - BODY_IMG_X) / BODY_IMG_W, ny: (cy - BODY_IMG_Y) / BODY_IMG_H };
    }

    const SVG_NS = 'http://www.w3.org/2000/svg';
    const bvObservers = new WeakMap();

    function layoutBodyViews(root) {
      (root || document).querySelectorAll('[data-bv]').forEach((stage) => {
        const doLayout = () => layoutOneBodyView(stage);
        doLayout();
        const img = stage.querySelector('.bv-img');
        if (img && !img.complete) img.addEventListener('load', doLayout, { once: true });
        if (typeof ResizeObserver !== 'undefined' && !bvObservers.has(stage)) {
          const ro = new ResizeObserver(() => doLayout());
          ro.observe(stage);
          bvObservers.set(stage, ro);
        }
      });
    }

    function layoutOneBodyView(stage) {
      const img = stage.querySelector('.bv-img');
      const svg = stage.querySelector('.bv-overlay');
      if (!img || !svg || !stage.isConnected) return;
      const sr = stage.getBoundingClientRect();
      const ir = img.getBoundingClientRect();
      if (!ir.width || !sr.width) return;
      svg.setAttribute('width', sr.width);
      svg.setAttribute('height', sr.height);
      svg.setAttribute('viewBox', `0 0 ${sr.width} ${sr.height}`);
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      const mk = (name, attrs) => {
        const n = document.createElementNS(SVG_NS, name);
        Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));
        return n;
      };
      const r = Math.max(7, Math.min(11, ir.width * 0.05));
      const dots = [];
      ['left', 'right'].forEach((side) => {
        const col = stage.querySelector('.bv-' + side);
        const cr = col.getBoundingClientRect();
        const rows = Array.from(col.querySelectorAll('.bv-label')).map((el) => ({
          el,
          dx: ir.left - sr.left + parseFloat(el.dataset.nx) * ir.width,
          dy: ir.top - sr.top + parseFloat(el.dataset.ny) * ir.height,
          h: el.offsetHeight,
        })).sort((a, b) => a.dy - b.dy);
        // Beschriftungen auf Markerhöhe, bei Überlappung nach unten schieben
        let prevBottom = -Infinity;
        rows.forEach((row) => { row.top = Math.max(row.dy - row.h / 2, prevBottom + 3); prevBottom = row.top + row.h; });
        const overflow = prevBottom - sr.height;
        if (overflow > 0) {
          let nextTop = Infinity;
          for (let i = rows.length - 1; i >= 0; i -= 1) {
            const maxTop = Math.min(rows[i].top, nextTop - rows[i].h - 3);
            rows[i].top = Math.max(0, Math.min(rows[i].top, maxTop));
            nextTop = rows[i].top;
          }
        }
        const edgeX = side === 'left' ? cr.right - sr.left : cr.left - sr.left;
        rows.forEach((row) => {
          row.el.style.top = `${row.top - (cr.top - sr.top)}px`;
          const ly = row.top + row.h / 2;
          svg.appendChild(mk('line', { x1: row.dx, y1: row.dy, x2: edgeX, y2: ly, stroke: 'currentColor', 'stroke-width': 1, 'stroke-dasharray': '2 3', opacity: 0.55 }));
          dots.push({ x: row.dx, y: row.dy, color: row.el.dataset.color, title: row.el.dataset.title });
        });
      });
      dots.forEach((d) => {
        const c = mk('circle', { cx: d.x, cy: d.y, r, fill: d.color, stroke: 'var(--color-surface)', 'stroke-width': 2 });
        const t = document.createElementNS(SVG_NS, 'title'); t.textContent = d.title; c.appendChild(t);
        c.style.pointerEvents = 'auto';
        svg.appendChild(c);
      });
    }

    function miniSparklineHtml(points, unit) {
      if (!points || points.length < 2) return '<p style="color:var(--color-text-muted); font-size:0.8rem;">Für einen Verlauf braucht es mindestens zwei Messungen.</p>';
      const width = 280, height = 64, padding = 10;
      const values = points.map((p) => p.value);
      const minV = Math.min(...values), maxV = Math.max(...values);
      const range = (maxV - minV) || 1;
      const coords = points.map((p, i) => ({
        x: padding + (i / (points.length - 1)) * (width - padding * 2),
        y: height - padding - ((p.value - minV) / range) * (height - padding * 2),
      }));
      const pathD = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ' ' + c.y.toFixed(1)).join(' ');
      return `
        <svg viewBox="0 0 ${width} ${height}" style="width:100%; max-width:280px; height:${height}px;">
          <path d="${pathD}" fill="none" stroke="var(--color-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          ${coords.map((c) => `<circle cx="${c.x}" cy="${c.y}" r="3" fill="var(--color-gold)" />`).join('')}
        </svg>
        <div style="font-size:0.72rem; color:var(--color-text-muted);">${points[0].value}${unit ? ' ' + unit : ''} → ${points[points.length - 1].value}${unit ? ' ' + unit : ''}</div>
      `;
    }

    // Runde 22 (Nachtrag 5): Testkarten sind beim Öffnen der Seite immer
    // eingeklappt – sichtbar bleiben nur Testname (inkl. Status) und das
    // Testprotokoll. Ergebnis, Verlauf und Eingabe liegen im einklappbaren
    // Bereich. Der Auf-/Zu-Zustand bleibt beim Neurendern nach dem Speichern
    // innerhalb derselben Sitzung erhalten (nicht beim Neuladen der Seite).
    const openTestCards = new Set();
    let openTestCardsOwner = null;
    function initTestCardCollapse(root, ownerId) {
      if (openTestCardsOwner !== ownerId) { openTestCards.clear(); openTestCardsOwner = ownerId; }
      root.querySelectorAll('.pv-test-card').forEach((card) => {
        if (card.dataset.collapsible === '1') return;
        const key = card.dataset.testKey;
        const kids = Array.from(card.children);
        const header = kids[0];
        const protocol = kids.find((k, i) => i > 0 && k.matches('details.qn-details'));
        if (!header) return;
        const bodyKids = kids.filter((k) => k !== header && k !== protocol);
        if (bodyKids.length === 0) return;
        const body = document.createElement('div');
        body.className = 'pv-card-body';
        bodyKids.forEach((k) => body.appendChild(k));
        card.appendChild(body);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pv-collapse-btn';
        btn.setAttribute('aria-expanded', 'false');
        btn.innerHTML = '<span class="pv-collapse-label">Ergebnisse &amp; Eingabe</span><span class="pv-collapse-chev" aria-hidden="true">▾</span>';
        // Button direkt unter das Testprotokoll setzen
        if (protocol) protocol.after(btn); else header.after(btn);
        const set = (open) => {
          card.classList.toggle('pv-open', open);
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
          body.hidden = !open;
          if (open) openTestCards.add(key); else openTestCards.delete(key);
        };
        btn.addEventListener('click', () => set(body.hidden));
        set(openTestCards.has(key));
        card.dataset.collapsible = '1';
      });
    }

    async function renderPreventionSection(el, clientId, { isAdminView } = {}) {
      el.innerHTML = '<p class="center-text">Lade Präventionscheck …</p>';

      const twelveWeeksAgo = new Date(Date.now() - 84 * 86400000).toISOString();
      const [{ data: profileRow }, { data: bodyMeasurements }, { data: allResults, error: resultsError }, { data: balanceLogs }] = await Promise.all([
        supabaseClient.from('profiles').select('birth_date').eq('id', clientId).maybeSingle(),
        listMyBodyMeasurements(clientId),
        listPreventionResults(clientId),
        listLogsForAnalytics(clientId, { from: twelveWeeksAgo }),
      ]);
      if (resultsError) { el.innerHTML = `<div class="msg error">${escapeHtml(resultsError.message)}</div>`; return; }

      const birthDate = profileRow ? profileRow.birth_date : null;
      const ageYears = calcAge(birthDate);
      const latestBodyMeasurement = (bodyMeasurements || [])[(bodyMeasurements || []).length - 1] || null;
      const sex = (await loadProfileBasics(clientId)).sex;
      const bodyFatPercent = latestBodyMeasurement ? latestBodyMeasurement.body_fat_percent : null;

      const results = allResults || [];
      const latest = latestByKey(results);

      const totals = {};
      for (const log of balanceLogs || []) {
        const m = logMetric(log);
        if (!m || m.type !== 'volume') continue;
        const pattern = log.exercises && log.exercises.movement_pattern;
        if (!pattern || pattern === 'sonstige') continue;
        totals[pattern] = (totals[pattern] || 0) + m.value;
      }
      const balancePairRatios = BALANCE_PAIRS.map((p) => {
        const a = totals[p.aKey] || 0, b = totals[p.bKey] || 0;
        if (a === 0 && b === 0) return { ratio: null };
        if (a === 0 || b === 0) return { ratio: Infinity };
        return { ratio: Math.max(a, b) / Math.min(a, b) };
      });

      const { total, breakdown } = computePreventionScore({ ageYears, sex, latestResults: latest, bodyFatPercent, balancePairRatios });
      // Nutzer-Feedback Runde 8: Kraftausdauertests sollen nicht im
      // Präventionsbereich AUFGELISTET werden (die eigentliche Eingabe/Anzeige
      // der Tests erfolgt im Tab "Tests"), fließen aber weiterhin in den
      // Präventions-Score mit ein – daher wird hier nur die Anzeige gefiltert,
      // `total` bleibt unverändert aus der vollständigen `breakdown` berechnet.
      const displayBreakdown = breakdown.filter((b) => b.key !== 'strength');

      // Körper-Visual: Marker-Schweregrade berechnen
      const mobilitySeverity = (row, label, testKey) => {
        if (!row) return { sev: 'unknown', title: `${label}: keine Daten` };
        const v = mobilityRatingValue(testKey || row.test_key, row.value);
        const def = MOBILITY_TESTS.find((t) => t.key === (testKey || row.test_key));
        const pts = (testKey || row.test_key) === 'wall_angel' ? ` (${row.value} von 3 Punkten)` : '';
        if (v < 0) return { sev: 'alert', title: `${label}${pts}: ${def && def.alertNotice ? def.alertNotice : 'eingeschränkt'}` };
        if (v === 0) return { sev: 'warn', title: `${label}${pts}: normal` };
        return { sev: 'ok', title: `${label}${pts}: gut` };
      };
      // Runde 9: Brustmuskulatur/Bauchmuskeln auf der Muskeln-Vorderansicht
      // bekommen keinen eigenen neuen Test, sondern nutzen die ohnehin
      // erfassten Kraftausdauertests als Näherung (Liegestütz beansprucht
      // primär die Brustmuskulatur, Plank primär die Bauchmuskeln/den Rumpf).
      const strengthSeverity = (testKey, side, label) => {
        const row = latest[side ? `${testKey}:${side}` : testKey];
        if (!row) return { sev: 'unknown', title: `${label}: keine Daten` };
        if (ageYears == null) return { sev: 'unknown', title: `${label}: kein Geburtsdatum hinterlegt` };
        const evalRes = evaluateStrengthBenchmark(testKey, ageYears, row.value, sex);
        if (evalRes.needsSex) return { sev: 'unknown', title: `${label}: Geschlecht nicht hinterlegt – Einstufung ausgeblendet` };
        if (!evalRes.bandFound || !evalRes.key) return { sev: 'unknown', title: `${label}: keine Referenzwerte für dieses Alter` };
        if (evalRes.key === 'below') return { sev: 'alert', title: `${label}: ${evalRes.label}` };
        if (evalRes.key === 'low') return { sev: 'warn', title: `${label}: ${evalRes.label}` };
        return { sev: 'ok', title: `${label}: ${evalRes.label}` };
      };
      // Runde 19: Sitzzeit fließt nur noch in den Score ein (kein Marker mehr);
      // Umfangsmessungen speisen keine Marker mehr.

      const sittingRow = latest.sitting_hours;
      const sittingEval = sittingRow ? evaluateSittingScore(sittingRow.value) : null;
      const sittingSev = !sittingRow ? { sev: 'unknown', title: 'Keine Angabe zur Sitzzeit' }
        : sittingEval.score >= 85 ? { sev: 'ok', title: `${sittingRow.value} Std./Tag Sitzzeit – ${sittingEval.label}` }
        : sittingEval.score >= 65 ? { sev: 'warn', title: `${sittingRow.value} Std./Tag Sitzzeit – ${sittingEval.label}` }
        : { sev: 'alert', title: `${sittingRow.value} Std./Tag Sitzzeit – ${sittingEval.label}. Hohe Sitzzeit ist mit Rückenbeschwerden und kardiometabolischen Risiken assoziiert.` };

      const sleepRow = latest.sleep_side;
      const sleepSev = !sleepRow ? { sev: 'unknown', title: 'Keine Angabe zur Schlafseite' }
        : Number(sleepRow.value) === 0 ? { sev: 'ok', title: 'Rücken/wechselnde Schlafseite' }
        : { sev: 'warn', title: `Überwiegend auf ${Number(sleepRow.value) > 0 ? 'der rechten' : 'der linken'} Seite schlafend – kann zu einseitigen Verspannungen beitragen` };

      const nutritionRow = latest.nutrition_quality;
      const nutritionEval = nutritionRow ? evaluateNutritionQuality(nutritionRow.value) : null;
      const smokingRow = latest.smoking_status;
      const smokingEval = smokingRow ? evaluateSmokingStatus(smokingRow.value) : null;
      const alcoholRow = latest.alcohol_weekly_drinks;
      const alcoholEval = alcoholRow ? evaluateAlcoholRisk(alcoholRow.value, sex) : null;

      // Runde 9: vier Ansichten statt einer gemischten – Gelenke (Vorder-/
      // Rückansicht) und Muskeln (Vorder-/Rückansicht) getrennt. Halswirbel-
      // säule/Nacken sowie linker/rechter Schulter-Marker nutzen bewusst
      // dieselbe zugrundeliegende Auswertung (dieselbe Körperregion, nur aus
      // zwei Perspektiven gezeigt) – daher tauchen sie in `notices` nur EINMAL
      // auf, um keine doppelten Hinweise zu erzeugen.
      // Runde 19 (Testüberarbeitung): jeder Marker wird von GENAU einem Test
      // gespeist (Zuordnung siehe Fußnote unter der Visualisierung).
      const shoulderLeftSev = mobilitySeverity(latest['shoulder_mobility:left'], 'Schulter links', 'shoulder_mobility');
      const shoulderRightSev = mobilitySeverity(latest['shoulder_mobility:right'], 'Schulter rechts', 'shoulder_mobility');

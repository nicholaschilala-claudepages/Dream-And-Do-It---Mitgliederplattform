<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training – Dream And Do It</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#053446" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    :root { --chart-teal: #1479a3; }
    .plan-card { margin-bottom: 20px; }
    .day-block { margin-bottom: 18px; }
    .day-block h3 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-gold); margin: 0 0 8px; }
    .exercise-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--color-border); flex-wrap: wrap; }
    .exercise-row:last-child { border-bottom: none; }
    .exercise-row img.thumb, .thumb-img {
      width: 88px; height: 88px; object-fit: contain; background: var(--color-bg);
      border: 1px solid var(--color-border); border-radius: 8px; flex-shrink: 0; cursor: zoom-in;
    }
    .thumb-sm { width: 40px; height: 40px; object-fit: contain; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 6px; flex-shrink: 0; cursor: zoom-in; }
    .exercise-meta { flex: 1; min-width: 220px; }
    .exercise-meta h4 { margin: 0 0 2px 0; font-family: var(--font-body); font-weight: 600; font-size: 0.98rem; }
    .exercise-meta .target { font-size: 0.82rem; color: var(--color-text-muted); }
    .exercise-meta .muscle { font-size: 0.76rem; color: var(--color-text-muted); font-style: italic; }
    .log-form { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    .log-form input { width: 78px; padding: 7px 8px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); }
    .log-form button { padding: 7px 12px; font-size: 0.8rem; }
    table.log-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    table.log-table th, table.log-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--color-border); }
    .exercise-builder-row { display: grid; grid-template-columns: 44px 1.7fr 0.7fr 0.9fr 1fr 0.9fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
    .exercise-builder-row select, .exercise-builder-row input { padding: 8px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); width: 100%; }
    .small-btn { padding: 6px 10px; font-size: 0.78rem; width: auto; }
    .status-pill { font-size: 0.72rem; padding: 2px 8px; border-radius: 12px; white-space: nowrap; }
    .status-pill.active { background: rgba(47,111,79,0.15); color: var(--color-success); }
    .status-pill.inactive { background: rgba(0,0,0,0.08); color: var(--color-text-muted); }
    .status-pill.ok { background: rgba(47,111,79,0.15); color: var(--color-success); }
    .status-pill.over { background: rgba(180,120,0,0.15); color: var(--color-gold); }
    .status-pill.under { background: rgba(180,40,40,0.12); color: #b42828; }
    .offline-banner { background: rgba(200,124,0,0.15); color: var(--color-gold); padding: 8px 14px; border-radius: 8px; font-size: 0.82rem; margin-bottom: 14px; display:none; }
    .day-builder { border: 1px solid var(--color-border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    .day-builder-header { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .day-builder-header input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); }
    .template-card { border: 1px solid var(--color-border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    .template-card h3 { margin: 0 0 4px; font-size: 1.02rem; }
    .template-exercise-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 20px; padding: 2px 10px 2px 2px; margin: 3px 4px 3px 0; font-size: 0.78rem; }
    .template-exercise-chip img { width: 22px; height: 22px; object-fit: contain; border-radius: 50%; background: var(--color-surface); }

    .lightbox-overlay { position: fixed; inset: 0; background: rgba(5,10,12,0.88); display: none; align-items: center; justify-content: center; z-index: 1000; cursor: zoom-out; padding: 28px; }
    .lightbox-overlay.open { display: flex; }
    .lightbox-overlay img { max-width: 92vw; max-height: 88vh; object-fit: contain; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .lightbox-close { position: absolute; top: 18px; right: 22px; color: #fff; font-size: 1.6rem; cursor: pointer; line-height: 1; }

    .session-banner { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: rgba(200,124,0,0.08); border: 1px solid rgba(200,124,0,0.3); border-radius: 10px; padding: 12px 16px; margin-bottom: 18px; flex-wrap: wrap; }
    .session-banner.active { background: rgba(47,111,79,0.1); border-color: rgba(47,111,79,0.35); }
    .session-banner select { padding: 7px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); }

    .stat-tiles { display: flex; gap: 12px; flex-wrap: wrap; margin: 4px 0 20px; }
    .stat-tile { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; padding: 10px 16px; min-width: 140px; }
    .stat-tile .value { font-size: 1.25rem; font-weight: 700; color: var(--color-navy); }
    :root[data-theme="dark"] .stat-tile .value { color: var(--color-gold-light); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stat-tile .value { color: var(--color-gold-light); } }
    .stat-tile .label { font-size: 0.74rem; color: var(--color-text-muted); }

    .analytics-filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 8px; }
    .analytics-filters .field { margin-bottom: 0; min-width: 160px; }
    .filter-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .filter-presets button { padding: 5px 12px; font-size: 0.76rem; border-radius: 20px; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-muted); cursor: pointer; }
    .filter-presets button.active { background: var(--color-gold); color: #1a1a1a; border-color: var(--color-gold); }

    .chart-tooltip { position: absolute; background: var(--color-navy); color: #fff; font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; pointer-events: none; opacity: 0; transition: opacity 0.1s; white-space: nowrap; transform: translate(-50%, -130%); }

    .dysbalance-legend { display: flex; gap: 18px; font-size: 0.8rem; margin-bottom: 14px; color: var(--color-text-muted); }
    .dysbalance-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dysbalance-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .dysbalance-pair { margin-bottom: 18px; }
    .dysbalance-pair .pair-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .dysbalance-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .dysbalance-bar-row .side-label { width: 130px; font-size: 0.78rem; color: var(--color-text-muted); flex-shrink: 0; }
    .dysbalance-bar-track { flex: 1; background: var(--color-border); border-radius: 5px; height: 16px; overflow: hidden; }
    .dysbalance-bar-fill { height: 100%; border-radius: 5px 0 0 5px; }
    .dysbalance-bar-value { width: 90px; text-align: right; font-size: 0.78rem; flex-shrink: 0; }
    .dysbalance-verdict { font-size: 0.8rem; margin-top: 2px; }
    .dysbalance-verdict.ok { color: var(--color-success); }
    .dysbalance-verdict.warn { color: var(--color-gold); }
    .dysbalance-verdict.alert { color: var(--color-danger); }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <img src="icons/logo-mark.png" alt="Dream And Do It Logo" onerror="this.style.display='none'" />
        DREAM AND DO IT
      </div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" id="theme-toggle" type="button">Hell/Dunkel</button>
      </div>
    </div>
    <div id="nav-tabs-slot"></div>

    <div class="container wide" id="app-container">
      <p class="center-text">Lade …</p>
    </div>
  </div>

  <div class="lightbox-overlay" id="lightbox-overlay">
    <span class="lightbox-close">✕</span>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <script type="module">
    import { supabaseClient } from './js/supabase-client.js';
    import { getCurrentSession, initTheme, toggleTheme } from './js/auth.js';
    import {
      listExercises, createExercise, deleteExercise,
      listClients,
      listTemplates, getTemplate, createTemplate, deleteTemplate,
      listMyActivePlans, listPlansForAdmin, getPlanForAdmin, createPlan, assignTemplateToClient,
      addExerciseToPlan, removePlanExercise, setPlanActive,
      insertTrainingLog, listMyTrainingLogs, listLogsForPlanExercises,
      getActiveSession, startSession, endSession, listLogsForAnalytics,
    } from './js/training.js';
    import { queueTrainingLog, syncQueuedLogs } from './js/offline-queue.js';
    import { getUnreadCount } from './js/messages.js';
    import { getNewSignupCount } from './js/betrieb.js';
    import { navTabsHtml } from './js/nav.js';
    import { collapsibleHtml, initCollapsibles } from './js/collapsible.js';
    import { subnavSelectHtml, bindSubnavSelect, setSubnavValue } from './js/subnav.js';
    import { SECTION_INFO } from './js/section-info.js';

    initTheme();
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

    const container = document.getElementById('app-container');
    let currentProfile = null;

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('de-DE') + ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    }

    function formatDateOnly(iso) {
      return new Date(iso).toLocaleDateString('de-DE');
    }

    function formatDuration(sec) {
      if (sec == null) return '–';
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return m > 0 ? `${m} Min. ${s ? s + ' Sek.' : ''}`.trim() : `${s} Sek.`;
    }

    // --- Bilder: Lightbox zum Maximieren -------------------------------------

    const lightboxOverlay = document.getElementById('lightbox-overlay');
    const lightboxImg = document.getElementById('lightbox-img');
    window.openLightbox = function (src, alt) {
      if (!src) return;
      lightboxImg.src = src;
      lightboxImg.alt = alt || '';
      lightboxOverlay.classList.add('open');
    };
    lightboxOverlay.addEventListener('click', () => lightboxOverlay.classList.remove('open'));

    const CATEGORY_ORDER = ['Mobilisation', 'Kraft', 'Bodyweight', 'Cardio'];
    const MOVEMENT_PATTERN_LABELS = {
      push_oberkoerper: 'Push (Oberkörper)',
      pull_oberkoerper: 'Pull (Oberkörper)',
      vordere_beinkette: 'Vordere Beinkette',
      hintere_beinkette: 'Hintere Beinkette',
      rumpf_vorne: 'Rumpf vorne',
      rumpf_hinten: 'Rumpf hinten',
      sonstige: 'Sonstige',
    };

    function groupExercisesByCategory(exercises) {
      const groups = {};
      for (const ex of exercises) {
        const cat = ex.category || 'Sonstige';
        (groups[cat] = groups[cat] || []).push(ex);
      }
      return groups;
    }

    function exerciseOptionsHtml(exercises) {
      const groups = groupExercisesByCategory(exercises);
      const order = [...CATEGORY_ORDER, ...Object.keys(groups).filter((c) => !CATEGORY_ORDER.includes(c))];
      return order
        .filter((cat) => groups[cat] && groups[cat].length)
        .map((cat) => `<optgroup label="${escapeHtml(cat)}">${groups[cat].map((ex) => `<option value="${ex.id}">${escapeHtml(ex.name)}</option>`).join('')}</optgroup>`)
        .join('');
    }

    async function init() {
      const session = await getCurrentSession();
      if (!session) { window.location.href = 'index.html'; return; }

      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('id, full_name, role, access_locked, training_enabled, nutrition_enabled, coaching_enabled')
        .eq('id', session.user.id)
        .maybeSingle();

      if (error || !profile) {
        container.innerHTML = `<div class="card lock-screen"><div class="icon">⚠️</div><h2>Profil konnte nicht geladen werden</h2><p style="color:var(--color-text-muted);">${escapeHtml(error ? error.message : 'Unbekannter Fehler')}</p></div>`;
        return;
      }
      if (profile.access_locked) {
        container.innerHTML = `<div class="card lock-screen"><div class="icon">🔒</div><h2>Zugang derzeit gesperrt</h2><p style="color:var(--color-text-muted);">Bitte wende dich an uns, um deinen Zugang zu klären.</p></div>`;
        return;
      }

      currentProfile = profile;
      mountNavTabs(profile);

      if (profile.role !== 'admin' && !profile.training_enabled) {
        renderLockedTeaser();
        return;
      }

      if (profile.role === 'admin') {
        await renderAdminView();
      } else {
        await renderClientRoot(profile);
      }

      trySyncOfflineLogs();
      window.addEventListener('online', trySyncOfflineLogs);
    }

    // Etappe 19: gemeinsame Kopfzeilen-Reiterleiste (siehe js/nav.js) statt
    // der früheren Einzel-Links "Nachrichten"/"Zum Dashboard".
    async function mountNavTabs(profile) {
      const slot = document.getElementById('nav-tabs-slot');
      if (!slot) return;
      const [unreadMessages, signupResult] = await Promise.all([
        getUnreadCount(profile.id),
        profile.role === 'admin' ? getNewSignupCount() : Promise.resolve({ count: 0 }),
      ]);
      slot.innerHTML = navTabsHtml(profile, {
        currentPage: 'training',
        unreadMessages,
        newSignups: signupResult.count || 0,
      });
    }

    function renderLockedTeaser() {
      const info = SECTION_INFO.training;
      container.innerHTML = `
        <div class="locked-teaser">
          <span class="lock-badge">🔒 ${escapeHtml(info.lockedLead)}</span>
          <div class="section-hero">
            <span class="kicker">${escapeHtml(info.title)}</span>
            <h2>${escapeHtml(info.heroLine)}</h2>
            ${collapsibleHtml(`<p class="lead">${info.clientIntro}</p>`)}
          </div>
          <div class="benefit-grid">
            ${info.benefits.map((b) => `<div class="benefit-card"><h4>${escapeHtml(b.h)}</h4><p>${escapeHtml(b.t)}</p></div>`).join('')}
          </div>
          <div class="science-box">
            <span class="kicker">Wissenschaftlicher Hintergrund</span>
            ${collapsibleHtml(`<p>${info.scienceText}</p>`, { fadeVar: 'var(--color-bg)' })}
          </div>
          <a class="btn mt-16" style="display:inline-block; width:auto; padding:12px 24px;" href="messages.html">
            Interesse? Jetzt nachfragen
          </a>
        </div>
      `;
      initCollapsibles(container);
    }

    async function trySyncOfflineLogs() {
      const synced = await syncQueuedLogs((entry) => insertTrainingLog(entry));
      if (synced > 0 && currentProfile && currentProfile.role !== 'admin') {
        renderClientRoot(currentProfile);
      }
    }

    // =========================================================================
    // KUNDEN-ANSICHT
    // =========================================================================

    const CLIENT_TRAINING_TABS = [
      { key: 'start', label: 'Start' },
      { key: 'plan', label: 'Mein Plan' },
      { key: 'progress', label: 'Meine Entwicklung' },
    ];

    async function renderClientRoot(profile) {
      container.innerHTML = `
        ${subnavSelectHtml(CLIENT_TRAINING_TABS, 'start')}
        <div id="client-content"><p class="center-text">Lade …</p></div>
      `;
      bindSubnavSelect(container, (key) => activateClientTab(key, profile));
      renderStartTab(document.getElementById('client-content'), false);
    }

    function activateClientTab(tabName, profile) {
      const content = document.getElementById('client-content');
      if (tabName === 'progress') renderAnalyticsView(content, profile.id, { isAdminView: false });
      else if (tabName === 'start') renderStartTab(content, false);
      else renderClientView(content, profile);
    }

    function goToTab(scope, tabName) {
      setSubnavValue(container, tabName);
      if (scope === 'admin-tab') renderAdminTab(tabName);
      else activateClientTab(tabName, currentProfile);
    }

    function renderStartTab(content, isAdmin) {
      const info = SECTION_INFO.training;
      content.innerHTML = `
        <div class="section-hero">
          <span class="kicker">${escapeHtml(info.title)}</span>
          <h2>${escapeHtml(info.heroLine)}</h2>
          ${collapsibleHtml(`<p class="lead">${isAdmin ? info.adminIntro : info.clientIntro}</p>`)}
        </div>
        ${isAdmin ? '' : `
        <div class="benefit-grid">
          ${info.benefits.map((b) => `<div class="benefit-card"><h4>${escapeHtml(b.h)}</h4><p>${escapeHtml(b.t)}</p></div>`).join('')}
        </div>`}
        <div class="science-box">
          <span class="kicker">Wissenschaftlicher Hintergrund</span>
          ${collapsibleHtml(`<p>${info.scienceText}</p>`, { fadeVar: 'var(--color-bg)' })}
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;">
          ${isAdmin ? `
            <button class="btn secondary" style="width:auto; padding:10px 18px;" data-goto="templates">Zu den Vorlagen</button>
            <button class="btn secondary" style="width:auto; padding:10px 18px;" data-goto="library">Zur Übungsbibliothek</button>
            <button class="btn secondary" style="width:auto; padding:10px 18px;" data-goto="analysis">Zur Kundenanalyse</button>
          ` : `
            <button class="btn secondary" style="width:auto; padding:10px 18px;" data-goto="plan">Zu meinem Plan</button>
            <button class="btn secondary" style="width:auto; padding:10px 18px;" data-goto="progress">Zu meiner Entwicklung</button>
          `}
        </div>
      `;
      content.querySelectorAll('[data-goto]').forEach((btn) => {
        btn.addEventListener('click', () => goToTab(isAdmin ? 'admin-tab' : 'client-tab', btn.dataset.goto));
      });
      initCollapsibles(content);
    }

    function computeStatus(pe, logsForThis) {
      if (!logsForThis || logsForThis.length === 0) return null;
      if (pe.target_duration_seconds) {
        const withDuration = logsForThis.filter((l) => l.duration_seconds != null);
        if (withDuration.length === 0) return null;
        const last = withDuration[0];
        const diff = last.duration_seconds - pe.target_duration_seconds;
        if (diff === 0) return { label: 'genau nach Plan', cls: 'ok' };
        if (diff > 0) return { label: `+${formatDuration(diff)} über Vorgabe`, cls: 'over' };
        return { label: `${formatDuration(-diff)} unter Vorgabe`, cls: 'under' };
      }
      if (pe.target_sets) {
        const done = logsForThis.length;
        if (done === pe.target_sets) return { label: `${done}/${pe.target_sets} Sätze – nach Plan`, cls: 'ok' };
        if (done > pe.target_sets) return { label: `${done}/${pe.target_sets} Sätze – mehr als Vorgabe`, cls: 'over' };
        return { label: `${done}/${pe.target_sets} Sätze – weniger als Vorgabe`, cls: 'under' };
      }
      return null;
    }

    async function renderClientView(content, profile) {
      content.innerHTML = `<p class="center-text">Lade deinen Trainingsplan …</p>`;

      const [{ data: plans, error: plansError }, { data: activeSession }] = await Promise.all([
        listMyActivePlans(profile.id),
        getActiveSession(profile.id),
      ]);
      if (plansError) {
        content.innerHTML = `<div class="msg error">Trainingsplan konnte nicht geladen werden: ${escapeHtml(plansError.message)}</div>`;
        return;
      }

      const allPlanExerciseIds = (plans || []).flatMap((p) => (p.plan_exercises || []).map((pe) => pe.id));
      const [{ data: logsForStatus }, { data: recentLogs }, queuedCount] = await Promise.all([
        listLogsForPlanExercises(profile.id, allPlanExerciseIds),
        listMyTrainingLogs(profile.id),
        (async () => (await (await import('./js/offline-queue.js')).getQueuedLogs()).length)(),
      ]);

      const logsByPlanExercise = {};
      for (const log of logsForStatus || []) {
        (logsByPlanExercise[log.plan_exercise_id] = logsByPlanExercise[log.plan_exercise_id] || []).push(log);
      }

      let html = '';

      if (!navigator.onLine || queuedCount > 0) {
        html += `<div class="offline-banner" style="display:block;">
          ${!navigator.onLine ? 'Du bist offline – neue Einträge werden lokal gespeichert und synchronisiert, sobald wieder Internet da ist.' : ''}
          ${queuedCount > 0 ? ` ${queuedCount} Eintrag/Einträge warten noch auf Synchronisierung.` : ''}
        </div>`;
      }

      // Trainingseinheit-Banner (Start/Ende)
      const allDays = (plans || []).flatMap((p) => (p.training_plan_days || []).map((d) => ({ ...d, planId: p.id, planTitle: p.title })));
      if (activeSession) {
        const startedLabel = formatDate(activeSession.started_at);
        html += `<div class="session-banner active">
          <div><strong>Trainingseinheit läuft</strong> · gestartet ${startedLabel}</div>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <input type="number" id="end-session-calories" min="0" step="1" placeholder="kcal verbrannt (optional)" style="width:180px; padding:6px 8px; border-radius:6px; border:1px solid var(--color-border); background:var(--color-bg); color:var(--color-text); font-size:0.82rem;" />
            <button class="btn secondary small-btn" id="end-session-btn" type="button">Einheit beenden</button>
          </div>
        </div>`;
      } else {
        html += `<div class="session-banner">
          <div>
            <strong>Keine Trainingseinheit aktiv</strong>
            <div style="font-size:0.78rem; color:var(--color-text-muted);">Starte eine Einheit, damit deine Sätze als eine Einheit gezählt und ausgewertet werden können.</div>
          </div>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            ${allDays.length > 0 ? `<select id="start-session-day"><option value="">– ohne festen Tag –</option>${allDays.map((d) => `<option value="${d.planId}|${d.id}">${escapeHtml(d.planTitle)} · ${escapeHtml(d.label)}</option>`).join('')}</select>` : ''}
            <button class="btn small-btn" id="start-session-btn" type="button">Trainingseinheit starten</button>
          </div>
        </div>`;
      }

      if (!plans || plans.length === 0) {
        html += `<div class="card"><h2 style="font-size:1.1rem;">Noch kein Trainingsplan zugewiesen</h2><p style="color:var(--color-text-muted);">Dein Coach hat dir noch keinen aktiven Trainingsplan zugewiesen. Melde dich gerne, falls du Fragen dazu hast.</p></div>`;
      }

      for (const plan of plans || []) {
        const days = (plan.training_plan_days || []).sort((a, b) => a.sort_order - b.sort_order);
        const allExercises = (plan.plan_exercises || []).sort((a, b) => a.sort_order - b.sort_order);
        const looseExercises = allExercises.filter((pe) => !pe.plan_day_id);

        html += `<div class="card plan-card">
          <h2 style="font-size:1.1rem;">${escapeHtml(plan.title)}</h2>
          ${plan.notes ? `<p style="color:var(--color-text-muted); margin-top:-8px;">${escapeHtml(plan.notes)}</p>` : ''}
          ${days.map((day) => {
            const dayExercises = allExercises.filter((pe) => pe.plan_day_id === day.id);
            if (dayExercises.length === 0) return '';
            return `<div class="day-block">
              <h3>${escapeHtml(day.label)}</h3>
              ${dayExercises.map((pe) => renderExerciseRow(pe, logsByPlanExercise[pe.id], activeSession)).join('')}
            </div>`;
          }).join('')}
          ${looseExercises.length > 0 ? `<div class="day-block">
            ${days.length > 0 ? '<h3>Weitere Übungen</h3>' : ''}
            ${looseExercises.map((pe) => renderExerciseRow(pe, logsByPlanExercise[pe.id], activeSession)).join('')}
          </div>` : ''}
        </div>`;
      }

      html += `<div class="card mt-24">
        <h2 style="font-size:1.05rem;">Mein Trainingstagebuch</h2>
        ${!recentLogs || recentLogs.length === 0
          ? '<p style="color:var(--color-text-muted);">Noch keine Einträge vorhanden.</p>'
          : `<table class="log-table"><thead><tr><th>Datum</th><th>Übung</th><th>Satz</th><th>Wdh.</th><th>Gewicht</th><th>Dauer</th><th>Distanz</th></tr></thead><tbody>
              ${recentLogs.map((l) => `<tr>
                <td>${formatDate(l.performed_at)}</td>
                <td>${escapeHtml(l.exercises ? l.exercises.name : '–')}</td>
                <td>${l.set_number ?? '–'}</td>
                <td>${l.reps ?? '–'}</td>
                <td>${l.weight_kg != null ? l.weight_kg + ' kg' : '–'}</td>
                <td>${l.duration_seconds != null ? formatDuration(l.duration_seconds) : '–'}</td>
                <td>${l.distance_meters != null ? l.distance_meters + ' m' : '–'}</td>
              </tr>`).join('')}
            </tbody></table>`
        }
      </div>`;

      content.innerHTML = html;

      const startBtn = document.getElementById('start-session-btn');
      if (startBtn) {
        startBtn.addEventListener('click', async () => {
          const sel = document.getElementById('start-session-day');
          let planId = null, planDayId = null;
          if (sel && sel.value) { [planId, planDayId] = sel.value.split('|'); }
          startBtn.disabled = true;
          const { error } = await startSession({ clientId: profile.id, planId, planDayId });
          if (error) { alert('Fehler: ' + error.message); startBtn.disabled = false; return; }
          renderClientView(content, profile);
        });
      }
      const endBtn = document.getElementById('end-session-btn');
      if (endBtn) {
        endBtn.addEventListener('click', async () => {
          endBtn.disabled = true;
          const caloriesInput = document.getElementById('end-session-calories');
          const caloriesBurned = caloriesInput && caloriesInput.value ? parseFloat(caloriesInput.value) : null;
          const { error } = await endSession(activeSession.id, { caloriesBurned });
          if (error) { alert('Fehler: ' + error.message); endBtn.disabled = false; return; }
          renderClientView(content, profile);
        });
      }

      content.querySelectorAll('.log-form').forEach((form) => {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const exerciseId = form.dataset.exerciseId;
          const planExerciseId = form.dataset.planExerciseId;
          const setNumber = form.querySelector('.f-set') ? (parseInt(form.querySelector('.f-set').value, 10) || null) : null;
          const reps = form.querySelector('.f-reps') ? (parseInt(form.querySelector('.f-reps').value, 10) || null) : null;
          const weight = form.querySelector('.f-weight') && form.querySelector('.f-weight').value ? parseFloat(form.querySelector('.f-weight').value) : null;
          const distance = form.querySelector('.f-distance') && form.querySelector('.f-distance').value ? parseFloat(form.querySelector('.f-distance').value) : null;
          const durationMin = form.querySelector('.f-duration-min') ? (parseFloat(form.querySelector('.f-duration-min').value) || 0) : 0;
          const durationSec = form.querySelector('.f-duration-sec') ? (parseFloat(form.querySelector('.f-duration-sec').value) || 0) : 0;
          const duration = (durationMin || durationSec) ? Math.round(durationMin * 60 + durationSec) : null;

          const entry = {
            client_id: profile.id,
            exercise_id: exerciseId,
            plan_exercise_id: planExerciseId || null,
            session_id: activeSession ? activeSession.id : null,
            performed_at: new Date().toISOString(),
            set_number: setNumber,
            reps,
            weight_kg: weight,
            duration_seconds: duration,
            distance_meters: distance,
          };

          const submitBtn = form.querySelector('button');
          submitBtn.disabled = true;
          submitBtn.textContent = 'Speichert …';

          let ok = false;
          if (navigator.onLine) {
            const { error } = await insertTrainingLog(entry);
            ok = !error;
            if (error) await queueTrainingLog(entry);
          } else {
            ok = await queueTrainingLog(entry);
          }

          submitBtn.disabled = false;
          submitBtn.textContent = 'Eintragen';

          if (ok) {
            renderClientView(content, profile);
          } else {
            alert('Der Eintrag konnte weder gespeichert noch in die Offline-Warteschlange gelegt werden.');
          }
        });
      });
    }

    function renderExerciseRow(pe, logsForThis, activeSession) {
      const ex = pe.exercises;
      const isDurationBased = !!pe.target_duration_seconds;
      const isDistanceBased = !!pe.target_distance_meters || ex.category === 'Cardio';
      const target = [
        pe.target_sets ? `${pe.target_sets} Sätze` : null,
        pe.target_reps ? `${pe.target_reps} Wdh.` : null,
        pe.target_weight_hint ? pe.target_weight_hint : null,
        pe.target_duration_seconds ? `Ziel: ${formatDuration(pe.target_duration_seconds)}` : null,
        pe.target_distance_meters ? `Ziel: ${pe.target_distance_meters} m` : null,
      ].filter(Boolean).join(' · ');

      const status = computeStatus(pe, logsForThis);

      return `<div class="exercise-row">
        ${ex.image_url ? `<img class="thumb" src="${escapeHtml(ex.image_url)}" alt="${escapeHtml(ex.name)}" onerror="this.style.display='none'" onclick="openLightbox('${escapeHtml(ex.image_url)}', '${escapeHtml(ex.name)}')" />` : ''}
        <div class="exercise-meta">
          <h4>${escapeHtml(ex.name)}</h4>
          ${ex.muscle_group ? `<div class="muscle">Beanspruchte Muskulatur: ${escapeHtml(ex.muscle_group)}</div>` : ''}
          ${target ? `<div class="target">${escapeHtml(target)}</div>` : ''}
          ${ex.description ? `<p style="margin:4px 0 0; font-size:0.85rem; color:var(--color-text-muted);">${escapeHtml(ex.description)}</p>` : ''}
          ${pe.notes ? `<p style="margin:4px 0 0; font-size:0.82rem; color:var(--color-gold);">Hinweis vom Coach: ${escapeHtml(pe.notes)}</p>` : ''}
          ${status ? `<div style="margin-top:6px;"><span class="status-pill ${status.cls}">${escapeHtml(status.label)}</span></div>` : ''}
          ${!activeSession ? `<p style="margin:6px 0 0; font-size:0.76rem; color:var(--color-gold);">Starte oben eine Trainingseinheit, damit dieser Satz einer Einheit zugeordnet wird.</p>` : ''}
          <form class="log-form" data-exercise-id="${ex.id}" data-plan-exercise-id="${pe.id}">
            ${isDurationBased ? `<input class="f-duration-min" type="number" min="0" placeholder="Min." style="width:64px;" />
                 <input class="f-duration-sec" type="number" min="0" max="59" placeholder="Sek." style="width:64px;" />` : ''}
            ${!isDurationBased ? `<input class="f-set" type="number" min="1" placeholder="Satz Nr." required />
                 <input class="f-reps" type="number" min="0" placeholder="Wdh." required />
                 <input class="f-weight" type="number" min="0" step="0.5" placeholder="kg" />` : ''}
            ${isDistanceBased ? `<input class="f-distance" type="number" min="0" step="1" placeholder="Distanz (m)" />` : ''}
            <button class="btn secondary small-btn" type="submit">Eintragen</button>
          </form>
        </div>
      </div>`;
    }

    // =========================================================================
    // ADMIN-ANSICHT
    // =========================================================================

    const ADMIN_TRAINING_TABS = [
      { key: 'start', label: 'Start' },
      { key: 'templates', label: 'Vorlagen bauen' },
      { key: 'assign', label: 'Vorlage zuweisen' },
      { key: 'plans', label: 'Einzelplan erstellen' },
      { key: 'library', label: 'Übungsbibliothek' },
      { key: 'existing', label: 'Bestehende Pläne' },
      { key: 'analysis', label: 'Kundenanalyse' },
    ];

    async function renderAdminView() {
      container.innerHTML = `
        ${subnavSelectHtml(ADMIN_TRAINING_TABS, 'start')}
        <div id="admin-content"><p class="center-text">Lade …</p></div>
      `;
      bindSubnavSelect(container, (key) => renderAdminTab(key));
      renderAdminTab('start');
    }

    async function renderAdminTab(tab) {
      const content = document.getElementById('admin-content');
      content.innerHTML = '<p class="center-text">Lade …</p>';

      if (tab === 'start') return renderStartTab(content, true);
      if (tab === 'library') return renderLibraryTab(content);
      if (tab === 'existing') return renderExistingPlansTab(content);
      if (tab === 'templates') return renderTemplatesTab(content);
      if (tab === 'assign') return renderAssignTab(content);
      if (tab === 'analysis') return renderClientAnalysisTab(content);
      return renderPlanBuilderTab(content);
    }

    // --- Übungsbibliothek ---------------------------------------------------

    async function renderLibraryTab(content) {
      const { data: exercises, error } = await listExercises();
      if (error) {
        content.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`;
        return;
      }

      const groups = groupExercisesByCategory(exercises || []);
      const order = [...CATEGORY_ORDER, ...Object.keys(groups).filter((c) => !CATEGORY_ORDER.includes(c))];

      content.innerHTML = `
        <div class="card">
          <h2 style="font-size:1.05rem;">Neue Übung anlegen</h2>
          <form id="new-exercise-form">
            <div class="field"><label>Name</label><input type="text" id="ex-name" required /></div>
            <div class="field"><label>Beschreibung</label><input type="text" id="ex-desc" /></div>
            <div class="field"><label>Beanspruchte Muskulatur</label><input type="text" id="ex-muscle" placeholder="z.B. Beine, Gesäß" /></div>
            <div class="field"><label>Kategorie</label>
              <select id="ex-category">
                <option value="Mobilisation">Mobilisation</option>

              </select>

            <button class="btn" type="submit">Übung speichern</button>
          </form>
        </div>
        <div class="card mt-24">
          <h2 style="font-size:1.05rem;">Vorhandene Übungen (${(exercises || []).length})</h2>
          ${order.filter((cat) => groups[cat] && groups[cat].length).map((cat) => `
            <h3 style="font-size:0.9rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--color-gold); margin:16px 0 6px;">${escapeHtml(cat)}</h3>
            ${groups[cat].map((ex) => `
              <div class="exercise-row">
                ${ex.image_url ? `<img class="thumb" src="${escapeHtml(ex.image_url)}" alt="${escapeHtml(ex.name)}" onerror="this.style.display='none'" onclick="openLightbox('${escapeHtml(ex.image_url)}', '${escapeHtml(ex.name)}')" />` : ''}
                <div class="exercise-meta">
                  <h4>${escapeHtml(ex.name)}</h4>
                  ${ex.muscle_group ? `<div class="muscle">Beanspruchte Muskulatur: ${escapeHtml(ex.muscle_group)}</div>` : ''}
                  ${ex.description ? `<p style="margin:4px 0 0; font-size:0.85rem; color:var(--color-text-muted);">${escapeHtml(ex.description)}</p>` : ''}
                </div>
                <button class="btn secondary small-btn" data-delete-id="${ex.id}" type="button">Löschen</button>
              </div>
            `).join('')}
          `).join('') || '<p style="color:var(--color-text-muted);">Noch keine Übungen angelegt.</p>'}
        </div>
      `;

      document.getElementById('new-exercise-form').addEventListener('submit', async (e) => {

        const { error } = await createExercise({
          name: document.getElementById('ex-name').value.trim(),
          description: document.getElementById('ex-desc').value.trim(),
          muscleGroup: document.getElementById('ex-muscle').value.trim(),
          category: document.getElementById('ex-category').value,
          imageUrl: document.getElementById('ex-image').value.trim(),
        });
        if (error) { alert('Fehler: ' + error.message); return; }
        renderLibraryTab(content);
      });

      content.querySelectorAll('[data-delete-id]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Diese Übung wirklich löschen?')) return;
          const { error } = await deleteExercise(btn.dataset.deleteId);
          if (error) { alert('Fehler: ' + error.message); return; }
          renderLibraryTab(content);
        });
      });

    // --- Wiederverwendbarer Tage-Builder (für Vorlagen & Einzelpläne) -------

    function buildExercisePreview(exercisesById) {
      return function attachPreview(row) {
        const select = row.querySelector('.row-exercise');
        const preview = row.querySelector('.row-preview');
        function update() {
          const ex = exercisesById[select.value];
          if (ex && ex.image_url) {
            preview.src = ex.image_url;
            preview.style.visibility = 'visible';
            preview.onclick = () => window.openLightbox(ex.image_url, ex.name);
          } else {
            preview.style.visibility = 'hidden';
          }
        }
        select.addEventListener('change', update);
        update();
      };
    }

    function createDayBuilder(rowsContainer, exerciseOptions, dayLabel, exercisesById) {
      const dayEl = document.createElement('div');
      dayEl.className = 'day-builder';
      dayEl.innerHTML = `
        <div class="day-builder-header">
          <input class="day-label" type="text" placeholder="Bezeichnung des Trainingstags (z.B. Tag 1 – Oberkörper)" value="${escapeHtml(dayLabel || '')}" required />
          <button class="btn secondary small-btn remove-day" type="button">Tag entfernen</button>
        </div>
        <div class="day-exercise-rows"></div>
        <button class="btn secondary small-btn add-exercise-to-day" type="button">+ Übung zu diesem Tag hinzufügen</button>
      `;
      dayEl.querySelector('.remove-day').addEventListener('click', () => dayEl.remove());
      const exRows = dayEl.querySelector('.day-exercise-rows');
      const attachPreview = buildExercisePreview(exercisesById);

      function addExerciseRow() {
        const row = document.createElement('div');
        row.className = 'exercise-builder-row';
        row.innerHTML = `
          <img class="row-preview thumb-sm" src="" alt="" style="visibility:hidden;" />
          <select class="row-exercise">${exerciseOptions}</select>
          <input class="row-sets" type="number" min="1" placeholder="Sätze" />
          <input class="row-reps" type="text" placeholder="Wdh. (z.B. 8-12)" />
          <input class="row-weight" type="text" placeholder="Gewicht/Hinweis" />
          <input class="row-duration" type="number" min="0" placeholder="Dauer (Sek.)" />
          <button class="btn secondary small-btn" type="button">✕</button>
        `;
        row.querySelector('button').addEventListener('click', () => row.remove());
        exRows.appendChild(row);
        attachPreview(row);
      }
      dayEl.querySelector('.add-exercise-to-day').addEventListener('click', addExerciseRow);
      addExerciseRow();

      rowsContainer.appendChild(dayEl);
      return dayEl;
    }

    function readDayBuilder(dayEl) {
      const label = dayEl.querySelector('.day-label').value.trim();
      const exercises = Array.from(dayEl.querySelectorAll('.exercise-builder-row')).map((row) => ({
        exerciseId: row.querySelector('.row-exercise').value,
        targetSets: row.querySelector('.row-sets').value,
        targetReps: row.querySelector('.row-reps').value,
        targetWeightHint: row.querySelector('.row-weight').value,
        targetDurationSeconds: row.querySelector('.row-duration').value ? parseInt(row.querySelector('.row-duration').value, 10) : null,
      }));
      return { label, exercises };
    }

    // --- Vorlagen bauen -------------------------------------------------------

    async function renderTemplatesTab(content) {
      const [{ data: exercises, error: exercisesError }, { data: templates, error: templatesError }] = await Promise.all([
        listExercises(), listTemplates(),
      ]);
      if (exercisesError || templatesError) {
        content.innerHTML = `<div class="msg error">${escapeHtml((exercisesError || templatesError).message)}</div>`;
        return;
      }
      if (!exercises || exercises.length === 0) {
        content.innerHTML = `<div class="card"><p>Lege zuerst mindestens eine Übung in der Übungsbibliothek an, bevor du eine Vorlage baust.</p></div>`;
        return;
      }

      const exercisesById = Object.fromEntries(exercises.map((ex) => [ex.id, ex]));
      const exerciseOptions = exerciseOptionsHtml(exercises);

      content.innerHTML = `
        <div class="card">
          <h2 style="font-size:1.05rem;">Neue Trainingsplan-Vorlage bauen</h2>
          <p style="color:var(--color-text-muted); font-size:0.85rem;">Eine Vorlage ist ein wiederverwendbarer Bauplan aus einem oder mehreren Trainingstagen. Sie wird später einem oder mehreren Kunden zugewiesen (als eigenständige Kopie im Reiter „Vorlage zuweisen“).</p>
          <form id="template-form">
            <div class="field"><label>Titel der Vorlage</label><input type="text" id="tpl-title" required placeholder="z.B. Ganzkörper-Grundprogramm 3er-Split" /></div>
            <div class="field"><label>Beschreibung (optional)</label><input type="text" id="tpl-desc" /></div>
            <label style="display:block; font-size:0.82rem; color:var(--color-text-muted); margin-bottom:6px;">Trainingstage</label>
            <div id="tpl-days"></div>
            <button class="btn secondary small-btn mt-16" type="button" id="add-day-btn">+ Trainingstag hinzufügen</button>
            <button class="btn mt-24" type="submit">Vorlage speichern</button>
          </form>
        </div>
        <div class="card mt-24">
          <h2 style="font-size:1.05rem;">Vorhandene Vorlagen (${(templates || []).length})</h2>
          ${(templates || []).length === 0 ? '<p style="color:var(--color-text-muted);">Noch keine Vorlagen erstellt.</p>' : (templates || []).map((tpl) => `
            <div class="template-card">
              <h3>${escapeHtml(tpl.title)}</h3>
              ${tpl.description ? `<p style="color:var(--color-text-muted); font-size:0.85rem; margin-top:0;">${escapeHtml(tpl.description)}</p>` : ''}
              ${(tpl.plan_template_days || []).sort((a,b) => a.sort_order - b.sort_order).map((day) => `
                <div style="margin:10px 0;">
                  <strong style="font-size:0.85rem;">${escapeHtml(day.label)}</strong>
                  <div style="margin-top:4px;">
                    ${(day.plan_template_exercises || []).sort((a,b) => a.sort_order - b.sort_order).map((ex) => `
                      <span class="template-exercise-chip">
                        ${ex.exercises && ex.exercises.image_url ? `<img src="${escapeHtml(ex.exercises.image_url)}" alt="" onclick="openLightbox('${escapeHtml(ex.exercises.image_url)}','${escapeHtml(ex.exercises.name)}')" />` : ''}
                        ${escapeHtml(ex.exercises ? ex.exercises.name : '?')}
                      </span>
                    `).join('') || '<span style="font-size:0.8rem; color:var(--color-text-muted);">– keine Übungen –</span>'}
                  </div>
                </div>
              `).join('')}
              <button class="btn secondary small-btn" data-delete-template="${tpl.id}" type="button">Vorlage löschen</button>
            </div>
          `).join('')}
        </div>
      `;

      const daysContainer = document.getElementById('tpl-days');
      document.getElementById('add-day-btn').addEventListener('click', () => createDayBuilder(daysContainer, exerciseOptions, `Tag ${daysContainer.children.length + 1}`, exercisesById));
      createDayBuilder(daysContainer, exerciseOptions, 'Tag 1', exercisesById);

      document.getElementById('template-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const days = Array.from(daysContainer.querySelectorAll('.day-builder')).map(readDayBuilder);
        if (days.length === 0) { alert('Bitte mindestens einen Trainingstag hinzufügen.'); return; }
        if (days.some((d) => d.exercises.length === 0)) { alert('Jeder Trainingstag braucht mindestens eine Übung.'); return; }

        const { error } = await createTemplate({
          title: document.getElementById('tpl-title').value.trim(),
          description: document.getElementById('tpl-desc').value.trim(),
          days,
        });
        if (error) { alert('Fehler: ' + error.message); return; }
        alert('Vorlage gespeichert.');
        renderTemplatesTab(content);
      });

      content.querySelectorAll('[data-delete-template]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Diese Vorlage wirklich löschen? Bereits zugewiesene Kundenpläne bleiben davon unberührt.')) return;
          const { error } = await deleteTemplate(btn.dataset.deleteTemplate);
          if (error) { alert('Fehler: ' + error.message); return; }
          renderTemplatesTab(content);
        });
      });
    }

    // --- Vorlage zuweisen -------------------------------------------------------

    async function renderAssignTab(content) {
      const [{ data: clients, error: clientsError }, { data: templates, error: templatesError }] = await Promise.all([
        listClients(), listTemplates(),
      ]);
      if (clientsError || templatesError) {
        content.innerHTML = `<div class="msg error">${escapeHtml((clientsError || templatesError).message)}</div>`;
        return;
      }
      if (!templates || templates.length === 0) {
        content.innerHTML = `<div class="card"><p>Baue zuerst eine Vorlage im Reiter „Vorlagen bauen“, bevor du sie zuweist.</p></div>`;
        return;
      }
      if (!clients || clients.length === 0) {
        content.innerHTML = `<div class="card"><p>Noch keine Kunden-Accounts vorhanden.</p></div>`;
        return;
      }

      const templateOptions = templates.map((t) => `<option value="${t.id}">${escapeHtml(t.title)}</option>`).join('');
      const clientOptions = clients.map((c) => `<option value="${c.id}">${escapeHtml(c.full_name || c.email)}${c.access_locked ? ' (gesperrt)' : ''}</option>`).join('');

      content.innerHTML = `
        <div class="card">
          <h2 style="font-size:1.05rem;">Vorlage einem Kunden zuweisen</h2>
          <p style="color:var(--color-text-muted); font-size:0.85rem;">Die Vorlage wird als eigenständige Kopie in den Trainingsplan des Kunden übernommen. Spätere Änderungen an der Vorlage wirken sich nicht rückwirkend auf bereits zugewiesene Pläne aus.</p>
          <form id="assign-form">
            <div class="field"><label>Vorlage</label><select id="assign-template" required>${templateOptions}</select></div>
            <div class="field"><label>Kunde</label><select id="assign-client" required>${clientOptions}</select></div>
            <div class="field"><label>Titel im Kundenplan (optional, überschreibt Vorlagentitel)</label><input type="text" id="assign-title" /></div>
            <button class="btn mt-16" type="submit">Vorlage zuweisen</button>
          </form>
        </div>
      `;

      document.getElementById('assign-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const { error } = await assignTemplateToClient({
          templateId: document.getElementById('assign-template').value,
          clientId: document.getElementById('assign-client').value,
          title: document.getElementById('assign-title').value.trim(),

    // =========================================================================
    // AUSWERTUNG / ANALYTICS (gemeinsam für Kunde & Trainer)
    // =========================================================================

    function logMetric(log) {
      if (log.weight_kg != null && log.reps != null) return { type: 'volume', value: log.weight_kg * log.reps, unit: 'kg' };
      if (log.duration_seconds != null) return { type: 'duration', value: log.duration_seconds / 60, unit: 'Min.' };
      if (log.distance_meters != null) return { type: 'distance', value: log.distance_meters, unit: 'm' };
      if (log.reps != null) return { type: 'reps', value: log.reps, unit: 'Wdh.' };
      return null;
    }

    function presetRange(preset) {
      const now = new Date();
      let from = null;
      const to = now.toISOString();
      if (preset === '4w') { from = new Date(now.getTime() - 28 * 86400000).toISOString(); }
      else if (preset === 'year') { from = new Date(now.getFullYear(), 0, 1).toISOString(); }
      else if (preset === 'all') { from = null; }
      return { from, to: null };
    }

    async function renderAnalyticsView(el, clientId, { isAdminView }) {
      el.innerHTML = '<p class="center-text">Lade Auswertung …</p>';
      if (!clientId) { el.innerHTML = ''; return; }

      let currentFrom = null;
      let currentTo = null;
      let currentExerciseId = null;

      async function load() {
        const { data: logs, error } = await listLogsForAnalytics(clientId, { from: currentFrom, to: currentTo });
        if (error) { el.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`; return; }
        renderContent(logs || []);
      }

      function renderContent(logs) {
        const exerciseMap = {};
        for (const log of logs) {
          if (!log.exercises) continue;
          exerciseMap[log.exercise_id] = log.exercises;
        }
        const exerciseChoices = Object.values(exerciseMap).sort((a, b) => a.name.localeCompare(b.name, 'de'));

        if (!currentExerciseId && exerciseChoices.length > 0) currentExerciseId = exerciseChoices[0].id;

        const sessionIds = new Set(logs.map((l) => l.session_id).filter(Boolean));
        const dates = logs.map((l) => l.performed_at).sort();
        const firstDate = dates[0] ? formatDateOnly(dates[0]) : '–';
        const lastDate = dates[dates.length - 1] ? formatDateOnly(dates[dates.length - 1]) : '–';

        const totalVolumeKg = logs.reduce((sum, l) => {
          const m = logMetric(l);
          return sum + (m && m.type === 'volume' ? m.value : 0);
        }, 0);
        const totalVolumeDisplay = totalVolumeKg >= 1000 ? (totalVolumeKg / 1000).toFixed(2) + ' t' : Math.round(totalVolumeKg) + ' kg';

        el.innerHTML = `
          <div class="card">
            <div class="analytics-filters">
              <div class="field">
                <label>Von</label>
                <input type="date" id="af-from" />
              </div>
              <div class="field">
                <label>Bis</label>
                <input type="date" id="af-to" />
              </div>
              <div class="field" style="min-width:220px;">
                <label>Übung für Verlauf</label>
                <select id="af-exercise">${exerciseChoices.map((ex) => `<option value="${ex.id}" ${ex.id === currentExerciseId ? 'selected' : ''}>${escapeHtml(ex.name)}</option>`).join('') || '<option value="">– keine Daten –</option>'}</select>
              </div>
              <button class="btn small-btn" id="af-apply" type="button">Filtern</button>
            </div>
            <div class="filter-presets">
              <button type="button" data-preset="all">Gesamter Zeitraum</button>
              <button type="button" data-preset="4w">Letzte 4 Wochen</button>
              <button type="button" data-preset="year">Dieses Jahr</button>
            </div>

            <div class="stat-tiles">
              <div class="stat-tile"><div class="value">${sessionIds.size}</div><div class="label">Trainingseinheiten</div></div>
              <div class="stat-tile"><div class="value">${firstDate} – ${lastDate}</div><div class="label">Zeitraum der Daten</div></div>
              <div class="stat-tile"><div class="value">${totalVolumeDisplay}</div><div class="label">Insgesamt bewegte Kilos (Zeitraum)</div></div>
            </div>

            <h3 style="font-size:0.95rem; margin-bottom:4px;">Verlauf je Trainingseinheit</h3>
            <div id="progress-chart" style="position:relative;"></div>
            <div id="progress-table" class="mt-16"></div>
          </div>

          <div class="card mt-24">
            <h2 style="font-size:1.05rem;">Belastungsverteilung (Dysbalance-Hinweis)</h2>
            <p style="color:var(--color-text-muted); font-size:0.82rem;">Groborientierung auf Basis der insgesamt bewegten Kilos je Bewegungsmuster im gewählten Zeitraum – ersetzt keine individuelle fachliche Einschätzung. Übungen ohne eindeutiges Bewegungsmuster (z.B. gemischtes Cardio) fließen nicht ein.</p>
            <div id="dysbalance-section"></div>
          </div>
        `;

        document.getElementById('af-apply').addEventListener('click', () => {
          const fromVal = document.getElementById('af-from').value;
          const toVal = document.getElementById('af-to').value;
          currentFrom = fromVal ? new Date(fromVal).toISOString() : null;
          currentTo = toVal ? new Date(toVal + 'T23:59:59').toISOString() : null;
          currentExerciseId = document.getElementById('af-exercise').value || null;
          el.querySelectorAll('.filter-presets button').forEach((b) => b.classList.remove('active'));
          load();
        });
        document.getElementById('af-exercise').addEventListener('change', (e) => {
          currentExerciseId = e.target.value || null;
          renderProgressChart(logs);
        });
        el.querySelectorAll('.filter-presets button').forEach((btn) => {
          btn.addEventListener('click', () => {
            el.querySelectorAll('.filter-presets button').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            const { from, to } = presetRange(btn.dataset.preset);
            currentFrom = from; currentTo = to;
            load();
          });
        });

        renderProgressChart(logs);
        renderDysbalanceSection(logs);
      }

      function renderProgressChart(logs) {
        const chartEl = document.getElementById('progress-chart');
        const tableEl = document.getElementById('progress-table');
        if (!chartEl) return;
        if (!currentExerciseId) { chartEl.innerHTML = '<p style="color:var(--color-text-muted); font-size:0.85rem;">Keine Übungsdaten im gewählten Zeitraum.</p>'; tableEl.innerHTML = ''; return; }

        const exLogs = logs.filter((l) => l.exercise_id === currentExerciseId);
        const bySession = {};
        for (const log of exLogs) {
          const key = log.session_id || ('day:' + log.performed_at.slice(0, 10));
          const m = logMetric(log);
          if (!m) continue;
          if (!bySession[key]) bySession[key] = { date: log.performed_at, type: m.type, unit: m.unit, value: 0 };
          bySession[key].value += m.value;
          if (log.performed_at < bySession[key].date) bySession[key].date = log.performed_at;
        }
        const points = Object.values(bySession).sort((a, b) => new Date(a.date) - new Date(b.date));

        if (points.length === 0) {
          chartEl.innerHTML = '<p style="color:var(--color-text-muted); font-size:0.85rem;">Für diese Übung liegen im gewählten Zeitraum noch keine Einträge vor.</p>';
          tableEl.innerHTML = '';
          return;
        }
        if (points.length < 2) {
          chartEl.innerHTML = `<p style="color:var(--color-text-muted); font-size:0.85rem;">Erst ein Datenpunkt (${formatDateOnly(points[0].date)}: ${points[0].value.toFixed(1)} ${points[0].unit}) – für einen Verlauf braucht es mindestens zwei Trainingseinheiten mit dieser Übung.</p>`;
          tableEl.innerHTML = '';
          return;
        }

        const unit = points[0].unit;
        const width = 640, height = 220, padding = 36;
        const values = points.map((p) => p.value);
        const minV = Math.min(0, ...values), maxV = Math.max(...values);
        const range = (maxV - minV) || 1;
        const coords = points.map((p, i) => ({
          x: padding + (i / (points.length - 1 || 1)) * (width - padding * 2),
          y: height - padding - ((p.value - minV) / range) * (height - padding * 2),
          date: p.date, value: p.value,
        }));
        const pathD = coords.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');

        chartEl.innerHTML = `
          <svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; overflow:visible;">
            <line x1="${padding}" y1="${height - padding}" x2="${width - padding}" y2="${height - padding}" stroke="var(--color-border)" stroke-width="1" />
            <path d="${pathD}" fill="none" stroke="var(--color-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            ${coords.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--color-gold)" class="chart-point" data-date="${p.date}" data-value="${p.value.toFixed(1)}" style="cursor:pointer;" />`).join('')}
          </svg>
          <div class="chart-tooltip" id="progress-tooltip"></div>
        `;
        const tooltip = document.getElementById('progress-tooltip');
        chartEl.querySelectorAll('.chart-point').forEach((pt) => {
          pt.addEventListener('mouseenter', (e) => {
            const rect = chartEl.getBoundingClientRect();
            tooltip.textContent = `${formatDateOnly(pt.dataset.date)}: ${pt.dataset.value} ${unit}`;
            tooltip.style.left = (e.clientX - rect.left) + 'px';
            tooltip.style.top = (e.clientY - rect.top) + 'px';
            tooltip.style.opacity = '1';
          });
          pt.addEventListener('mouseleave', () => { tooltip.style.opacity = '0'; });
        });

        tableEl.innerHTML = `<table class="log-table"><thead><tr><th>Datum</th><th>Wert (${escapeHtml(unit)})</th></tr></thead><tbody>
          ${points.map((p) => `<tr><td>${formatDateOnly(p.date)}</td><td>${p.value.toFixed(1)}</td></tr>`).join('')}
        </tbody></table>`;
      }

      function renderDysbalanceSection(logs) {
        const dysEl = document.getElementById('dysbalance-section');
        if (!dysEl) return;

        const totals = {};
        for (const log of logs) {
          const m = logMetric(log);
          if (!m || m.type !== 'volume') continue;
          const pattern = log.exercises && log.exercises.movement_pattern;
          if (!pattern || pattern === 'sonstige') continue;
          totals[pattern] = (totals[pattern] || 0) + m.value;
        }

        const pairs = [
          { title: 'Push / Pull (Oberkörper)', aKey: 'push_oberkoerper', bKey: 'pull_oberkoerper' },
          { title: 'Vordere / Hintere Beinkette', aKey: 'vordere_beinkette', bKey: 'hintere_beinkette' },
          { title: 'Rumpf vorne / hinten', aKey: 'rumpf_vorne', bKey: 'rumpf_hinten' },
        ];

        const hasAnyData = pairs.some((p) => (totals[p.aKey] || 0) > 0 || (totals[p.bKey] || 0) > 0);
        if (!hasAnyData) {
          dysEl.innerHTML = '<p style="color:var(--color-text-muted); font-size:0.85rem;">Noch keine mit Gewicht geloggten Sätze im gewählten Zeitraum, aus denen sich eine Belastungsverteilung berechnen ließe.</p>';
          return;
        }

        dysEl.innerHTML = `
          <div class="dysbalance-legend">
            <span><i style="background:var(--color-gold);"></i> Vorderseite / Push</span>
            <span><i style="background:var(--chart-teal);"></i> Rückseite / Pull</span>
          </div>
          ${pairs.map((p) => {
            const a = totals[p.aKey] || 0;
            const b = totals[p.bKey] || 0;
            if (a === 0 && b === 0) return '';
            const max = Math.max(a, b, 1);
            const ratio = a === 0 || b === 0 ? Infinity : Math.max(a, b) / Math.min(a, b);
            let verdict, cls;
            if (a === 0 || b === 0) { verdict = 'Eine Seite ist im Zeitraum noch komplett unbelastet.'; cls = 'alert'; }
            else if (ratio <= 1.2) { verdict = 'Ausgewogen.'; cls = 'ok'; }
            else if (ratio <= 1.5) { verdict = 'Leichtes Ungleichgewicht.'; cls = 'warn'; }
            else { verdict = 'Deutliches Ungleichgewicht – ggf. gezielt gegensteuern.'; cls = 'alert'; }
            return `<div class="dysbalance-pair">
              <div class="pair-title">${escapeHtml(p.title)}</div>
              <div class="dysbalance-bar-row">
                <div class="side-label">${escapeHtml(MOVEMENT_PATTERN_LABELS[p.aKey])}</div>
                <div class="dysbalance-bar-track"><div class="dysbalance-bar-fill" style="width:${(a / max * 100).toFixed(1)}%; background:var(--color-gold);"></div></div>
                <div class="dysbalance-bar-value">${Math.round(a)} kg</div>
              </div>
              <div class="dysbalance-bar-row">
                <div class="side-label">${escapeHtml(MOVEMENT_PATTERN_LABELS[p.bKey])}</div>
                <div class="dysbalance-bar-track"><div class="dysbalance-bar-fill" style="width:${(b / max * 100).toFixed(1)}%; background:var(--chart-teal);"></div></div>
                <div class="dysbalance-bar-value">${Math.round(b)} kg</div>
              </div>
              <div class="dysbalance-verdict ${cls}">${verdict}</div>
            </div>`;
          }).join('')}
        `;
      }

      await load();
    }

    init();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>

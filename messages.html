<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nachrichten – Dream And Do It</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#053446" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    .msg-layout { display: grid; grid-template-columns: 240px 1fr; gap: 16px; align-items: start; }
    @media (max-width: 680px) { .msg-layout { grid-template-columns: 1fr; } }
    .client-list-item {
      display: block; width: 100%; text-align: left; background: var(--color-surface);
      border: 1px solid var(--color-border); border-radius: 10px; padding: 10px 12px;
      margin-bottom: 8px; cursor: pointer; color: inherit; font: inherit;
    }
    .client-list-item.active { border-color: var(--color-gold); }
    .client-list-item .cl-name { font-weight: 600; font-size: 0.88rem; }
    .client-list-item .cl-meta { font-size: 0.72rem; color: var(--color-text-muted); margin-top: 2px; }
    .unread-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--color-gold); margin-left: 6px;
    }
    .thread { max-height: 55vh; overflow-y: auto; padding: 4px 2px; }
    .bubble { max-width: 78%; padding: 8px 12px; border-radius: 12px; margin-bottom: 10px; font-size: 0.88rem; }
    .bubble.mine { background: var(--color-navy); color: #fff; margin-left: auto; border-bottom-right-radius: 2px; }
    .bubble.theirs { background: var(--color-surface); border: 1px solid var(--color-border); margin-right: auto; border-bottom-left-radius: 2px; }
    .bubble .b-context { display: block; font-size: 0.7rem; opacity: 0.75; margin-bottom: 3px; }
    .bubble .b-time { display: block; font-size: 0.68rem; opacity: 0.65; margin-top: 4px; text-align: right; }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <img src="icons/logo-mark.png" alt="Dream And Do It Logo" onerror="this.style.display='none'" />
        DREAM AND DO IT
      </div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" id="theme-toggle" type="button">Hell/Dunkel</button>
      </div>
    </div>
    <div id="nav-tabs-slot"></div>

    <div class="container wide" id="app-container">
      <p class="center-text">Lade …</p>
    </div>
  </div>

  <script type="module">
    import { supabaseClient } from './js/supabase-client.js';
    import { getCurrentSession, initTheme, toggleTheme } from './js/auth.js';
    import { getAdminId, listConversation, sendMessage, markConversationRead, listClientsWithMessageInfo, getUnreadCount } from './js/messages.js';
    import { getNewSignupCount } from './js/betrieb.js';
    import { navTabsHtml } from './js/nav.js';

    initTheme();
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

    const container = document.getElementById('app-container');
    let currentProfile = null;
    let selectedClientId = null;

    const SERVICE_CONTEXTS = ['Training', 'Ernährung', 'Coaching', 'Sonstiges'];

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    function fmtDateTime(d) {
      return new Date(d).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    async function init() {
      const session = await getCurrentSession();
      if (!session) { window.location.href = 'index.html'; return; }

      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('id, full_name, role, access_locked, training_enabled, nutrition_enabled, coaching_enabled')
        .eq('id', session.user.id)
        .maybeSingle();

      if (error || !profile) {
        container.innerHTML = `<div class="card lock-screen"><div class="icon">⚠️</div><h2>Profil konnte nicht geladen werden</h2><p style="color:var(--color-text-muted);">${escapeHtml(error ? error.message : 'Unbekannter Fehler')}</p></div>`;
        return;
      }
      if (profile.access_locked) {
        container.innerHTML = `<div class="card lock-screen"><div class="icon">🔒</div><h2>Zugang derzeit gesperrt</h2><p style="color:var(--color-text-muted);">Bitte wende dich an uns, um deinen Zugang zu klären.</p></div>`;
        return;
      }

      currentProfile = profile;
      mountNavTabs(profile);

      if (profile.role === 'admin') {
        renderAdminView();
      } else {
        renderClientView();
      }
    }

    async function mountNavTabs(profile) {
      const slot = document.getElementById('nav-tabs-slot');
      if (!slot) return;
      const [unreadMessages, signupResult] = await Promise.all([
        getUnreadCount(profile.id),
        profile.role === 'admin' ? getNewSignupCount() : Promise.resolve({ count: 0 }),
      ]);
      slot.innerHTML = navTabsHtml(profile, {
        currentPage: 'messages',
        unreadMessages,
        newSignups: signupResult.count || 0,
      });
    }

    // =========================================================================
    // KUNDEN-ANSICHT: Ein Chat mit dem Coach
    // =========================================================================

    async function renderClientView() {
      container.innerHTML = '<p class="center-text">Lade …</p>';
      const { data: adminId, error: adminError } = await getAdminId();
      if (adminError || !adminId) {
        container.innerHTML = `<div class="msg error">Coach-Konto konnte nicht gefunden werden.</div>`;
        return;
      }

      container.innerHTML = `
        <div class="card">
          <h2 style="font-size:1.05rem;">Nachrichten mit deinem Coach</h2>
          <div class="thread mt-16" id="thread"></div>
          <form id="msg-form" class="mt-16">
            <div class="field"><label>Betrifft (optional)</label>
              <select id="msg-context">
                <option value="">– kein Bezug –</option>
                ${SERVICE_CONTEXTS.map((s) => `<option value="${s}">${s}</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>Nachricht</label><textarea id="msg-body" rows="2" required></textarea></div>
            <button class="btn" type="submit">Senden</button>
          </form>
        </div>
      `;

      await loadAndRenderThread(currentProfile.id, adminId);
      await markConversationRead(adminId, currentProfile.id);

      document.getElementById('msg-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = document.getElementById('msg-body').value.trim();
        if (!body) return;
        const { error } = await sendMessage({
          senderId: currentProfile.id,
          recipientId: adminId,
          body,
          serviceContext: document.getElementById('msg-context').value || null,
        });
        if (error) { alert('Fehler: ' + error.message); return; }
        document.getElementById('msg-body').value = '';
        document.getElementById('msg-context').value = '';
        await loadAndRenderThread(currentProfile.id, adminId);
      });
    }

    async function loadAndRenderThread(myId, otherId) {
      const threadEl = document.getElementById('thread');
      const { data: msgs, error } = await listConversation(myId, otherId);
      if (error) { threadEl.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`; return; }
      renderThread(threadEl, msgs || [], myId);
    }

    function renderThread(el, msgs, myId) {
      if (msgs.length === 0) {
        el.innerHTML = '<p style="color:var(--color-text-muted); font-size:0.85rem;">Noch keine Nachrichten – schreib einfach los.</p>';
        return;
      }
      el.innerHTML = msgs.map((m) => `
        <div class="bubble ${m.sender_id === myId ? 'mine' : 'theirs'}">
          ${m.service_context ? `<span class="b-context">${escapeHtml(m.service_context)}</span>` : ''}
          ${escapeHtml(m.body)}
          <span class="b-time">${fmtDateTime(m.created_at)}</span>
        </div>
      `).join('');
      el.scrollTop = el.scrollHeight;
    }

    // =========================================================================
    // ADMIN-ANSICHT: Kundenliste + Chat mit ausgewähltem Kunden
    // =========================================================================

    async function renderAdminView() {
      container.innerHTML = `
        <div class="msg-layout">
          <div id="client-list"><p class="center-text">Lade …</p></div>
          <div class="card" id="admin-thread-card" style="display:none;">
            <h2 id="admin-thread-title" style="font-size:1.05rem;"></h2>
            <div class="thread mt-16" id="admin-thread"></div>
            <form id="admin-msg-form" class="mt-16">
              <div class="field"><label>Betrifft (optional)</label>
                <select id="admin-msg-context">
                  <option value="">– kein Bezug –</option>
                  ${SERVICE_CONTEXTS.map((s) => `<option value="${s}">${s}</option>`).join('')}
                </select>
              </div>
              <div class="field"><label>Nachricht</label><textarea id="admin-msg-body" rows="2" required></textarea></div>
              <button class="btn" type="submit">Senden</button>
            </form>
          </div>
        </div>
      `;
      await renderClientList();
    }

    async function renderClientList() {
      const listEl = document.getElementById('client-list');
      const { data: clients, error } = await listClientsWithMessageInfo(currentProfile.id);
      if (error) { listEl.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`; return; }

      if (!clients || clients.length === 0) {
        listEl.innerHTML = '<p style="color:var(--color-text-muted); font-size:0.85rem;">Noch keine Kunden angelegt.</p>';
        return;
      }

      listEl.innerHTML = clients.map((c) => `
        <button class="client-list-item ${selectedClientId === c.id ? 'active' : ''}" data-open-client="${c.id}" data-name="${escapeHtml(c.full_name || c.email)}">
          <div class="cl-name">${escapeHtml(c.full_name || c.email)}${c.unread > 0 ? '<span class="unread-dot"></span>' : ''}</div>
          <div class="cl-meta">${c.lastMessageAt ? fmtDateTime(c.lastMessageAt) : 'noch keine Nachricht'}</div>
        </button>
      `).join('');

      listEl.querySelectorAll('[data-open-client]').forEach((btn) => {
        btn.addEventListener('click', () => openAdminThread(btn.dataset.openClient, btn.dataset.name));
      });
    }

    async function openAdminThread(clientId, clientName) {
      selectedClientId = clientId;
      document.querySelectorAll('.client-list-item').forEach((el) => el.classList.remove('active'));
      const activeBtn = document.querySelector(`[data-open-client="${clientId}"]`);
      if (activeBtn) activeBtn.classList.add('active');

      const card = document.getElementById('admin-thread-card');
      card.style.display = 'block';
      document.getElementById('admin-thread-title').textContent = 'Chat mit ' + clientName;

      const threadEl = document.getElementById('admin-thread');
      threadEl.innerHTML = '<p class="center-text">Lade …</p>';
      const { data: msgs, error } = await listConversation(currentProfile.id, clientId);
      if (error) { threadEl.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`; return; }
      renderThread(threadEl, msgs || [], currentProfile.id);

      await markConversationRead(clientId, currentProfile.id);
      renderClientList();

      const form = document.getElementById('admin-msg-form');
      form.onsubmit = async (e) => {
        e.preventDefault();
        const body = document.getElementById('admin-msg-body').value.trim();
        if (!body) return;
        const { error: sendError } = await sendMessage({
          senderId: currentProfile.id,
          recipientId: clientId,
          body,
          serviceContext: document.getElementById('admin-msg-context').value || null,
        });
        if (sendError) { alert('Fehler: ' + sendError.message); return; }
        document.getElementById('admin-msg-body').value = '';
        document.getElementById('admin-msg-context').value = '';
        openAdminThread(clientId, clientName);
      };
    }

    init();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
